 tr:"Bir zamanlar, büyük bir ormanın yanındaki bir köyde, büyükannesinin ona kapüşonlu kırmızı bir pelerin hediye ettiği bir kız varmış. Pelerin ona o kadar yakışıyormuş ki hiç çıkarmıyormuş, bu yüzden herkes ona Kırmızı Başlıklı Kız demeye başlamış. Bir sabah annesi taze ekmek, bal ve bir şişe sütle bir sepet hazırlamış ve hasta olan büyükannesine götürmesini istemiş.",
 de:"Es war einmal in einem Dorf an einem großen Wald ein Mädchen, dem seine Großmutter einen roten Umhang mit Kapuze geschenkt hatte. Er stand ihm so gut, dass es ihn nie auszog, und deshalb nannten es bald alle Rotkäppchen. Eines Morgens packte seine Mutter einen Korb mit frisch gebackenem Brot, Honig und einer Flasche Milch und bat es, ihn der Großmutter zu bringen, die krank war."},
{es:"«Ve directamente a casa de la abuela y no te salgas del camino», le advirtió su madre. Pero en el bosque había tantas flores que Caperucita se detuvo a recoger algunas. Entonces apareció un lobo muy educado que le preguntó adónde iba. Ella, que no sabía lo peligroso que era, le explicó dónde vivía su abuela. El lobo le propuso una carrera: él iría por un camino y ella por otro.",
 en:"“Go straight to your grandmother's house and don't leave the path,” her mother warned her. But there were so many flowers in the forest that Little Red Riding Hood stopped to pick some. Then a very polite wolf appeared and asked her where she was going. Not knowing how dangerous he was, she explained where her grandmother lived. The wolf suggested a race: he would take one path and she would take another.",
 tr:"«Doğruca büyükannenin evine git ve yoldan ayrılma» diye uyarmış annesi. Ama ormanda o kadar çok çiçek varmış ki Kırmızı Başlıklı Kız birkaç tane toplamak için durmuş. O sırada çok kibar bir kurt ortaya çıkmış ve ona nereye gittiğini sormuş. Kurdun ne kadar tehlikeli olduğunu bilmeyen kız, büyükannesinin nerede oturduğunu anlatmış. Kurt ona bir yarış önermiş: kendisi bir yoldan, kız başka bir yoldan gidecekmiş.",
 de:"„Geh direkt zum Haus der Großmutter und komm nicht vom Weg ab“, warnte es seine Mutter. Doch im Wald gab es so viele Blumen, dass Rotkäppchen stehen blieb, um einige zu pflücken. Da erschien ein sehr höflicher Wolf und fragte, wohin es gehe. Weil es nicht wusste, wie gefährlich er war, erklärte es ihm, wo seine Großmutter wohnte. Der Wolf schlug ein Wettrennen vor: Er würde den einen Weg nehmen und es den anderen."},
{es:"Por supuesto, el lobo eligió el camino más corto. Llegó primero, se comió a la abuela y se metió en su cama. Cuando entró Caperucita, notó que algo no iba bien: «Abuela, ¡qué ojos tan grandes tienes!». «Son para verte mejor». «¡Y qué dientes tan grandes!». «¡Son para comerte mejor!». Por suerte, un cazador que pasaba por allí oyó el ruido, entró en la casa y rescató a la niña y a su abuela.",
 en:"Of course, the wolf chose the shortest path. He arrived first, ate the grandmother and got into her bed. When Little Red Riding Hood came in, she noticed that something wasn't right: “Grandmother, what big eyes you have!” “All the better to see you with.” “And what big teeth!” “All the better to eat you with!” Luckily, a hunter who was passing by heard the noise, went into the house and rescued the girl and her grandmother.",
 tr:"Elbette kurt en kısa yolu seçmiş. Önce o varmış, büyükanneyi yutmuş ve onun yatağına girmiş. Kırmızı Başlıklı Kız içeri girince bir şeylerin yolunda gitmediğini fark etmiş: «Büyükanne, gözlerin ne kadar büyük!» «Seni daha iyi görmek için.» «Dişlerin de ne kadar büyük!» «Seni daha iyi yemek için!» Neyse ki oradan geçen bir avcı gürültüyü duymuş, eve girmiş ve kızla büyükannesini kurtarmış.",
 de:"Natürlich wählte der Wolf den kürzesten Weg. Er kam als Erster an, fraß die Großmutter und legte sich in ihr Bett. Als Rotkäppchen hereinkam, merkte es, dass etwas nicht stimmte: „Großmutter, was hast du für große Augen!“ „Damit ich dich besser sehen kann.“ „Und was für große Zähne!“ „Damit ich dich besser fressen kann!“ Zum Glück hörte ein Jäger, der vorbeikam, den Lärm, ging ins Haus und rettete das Mädchen und seine Großmutter."}],
vocab:[["la capucha","hood","kapüşon","die Kapuze"],["advertir","to warn","uyarmak","warnen"],["detenerse","to stop","durmak","stehen bleiben"],["rescatar","to rescue","kurtarmak","retten"]],
quiz:[
{q:"¿Por qué se detuvo Caperucita en el bosque?",en:"Why did Little Red Riding Hood stop in the forest?",tr:"Kırmızı Başlıklı Kız ormanda neden durdu?",de:"Warum blieb Rotkäppchen im Wald stehen?",opts:["Para recoger flores","Porque estaba cansada","Para comer pan"],ex:"«…había tantas flores que Caperucita se detuvo a recoger algunas.»"},
{q:"¿Qué le propuso el lobo?",en:"What did the wolf suggest to her?",tr:"Kurt ona ne önerdi?",de:"Was schlug ihr der Wolf vor?",opts:["Una carrera","Un regalo","Ir juntos"],ex:"«El lobo le propuso una carrera.»"},
{q:"¿Cómo supo el cazador que pasaba algo?",en:"How did the hunter know something was happening?",tr:"Avcı bir şey olduğunu nasıl anladı?",de:"Woher wusste der Jäger, dass etwas los war?",opts:["Oyó el ruido","Vio al lobo en el camino","La madre lo llamó"],ex:"«…un cazador que pasaba por allí oyó el ruido.»"}]},
B2:{paras:[
{es:"Érase una vez una niña tan querida en su aldea que bastaba verla pasar para que los vecinos sonrieran. Su abuela, que la adoraba, le había cosido una caperuza de terciopelo rojo, y la pequeña se encariñó tanto con ella que acabó convirtiéndose en su nombre. Una mañana de otoño, su madre llenó una cesta con pan, mantequilla y un tarro de miel, y le encargó que se la llevara a la abuela, que llevaba varios días en cama, sin entretenerse por el camino.",
 en:"Once upon a time there was a girl so loved in her village that the neighbours only had to see her pass by to smile. Her grandmother, who adored her, had sewn her a red velvet hood, and the little girl grew so fond of it that it ended up becoming her name. One autumn morning, her mother filled a basket with bread, butter and a jar of honey, and asked her to take it to her grandmother, who had been in bed for several days, without dawdling on the way.",
 tr:"Bir varmış bir yokmuş, köyünde öyle sevilen bir kız varmış ki komşuların gülümsemesi için onu geçerken görmeleri yetermiş. Onu çok seven büyükannesi ona kırmızı kadifeden bir başlık dikmiş, küçük kız da bu başlığa öyle bağlanmış ki başlık sonunda adı olup çıkmış. Bir sonbahar sabahı annesi bir sepete ekmek, tereyağı ve bir kavanoz bal koymuş ve birkaç gündür yatakta olan büyükannesine, yolda oyalanmadan götürmesini tembihlemiş.",
 de:"Es war einmal ein Mädchen, das in seinem Dorf so beliebt war, dass die Nachbarn es nur vorbeigehen sehen mussten, um zu lächeln. Seine Großmutter, die es über alles liebte, hatte ihm eine Kappe aus rotem Samt genäht, und die Kleine hing so sehr daran, dass sie schließlich zu seinem Namen wurde. An einem Herbstmorgen füllte die Mutter einen Korb mit Brot, Butter und einem Glas Honig und trug ihm auf, ihn der Großmutter zu bringen, die seit mehreren Tagen im Bett lag – ohne unterwegs zu trödeln."},
{es:"Sin embargo, el bosque estaba precioso aquella mañana, y Caperucita no pudo resistirse a las flores que crecían junto al sendero. Fue entonces cuando se le acercó un lobo de modales impecables, que la saludó como si fueran viejos conocidos. La niña, que nunca había oído hablar de lo astutos que pueden ser los lobos, le contó sin desconfiar adónde iba y le describió con todo detalle la casa de su abuela, bajo los tres grandes robles.",
 en:"However, the forest was beautiful that morning, and Little Red Riding Hood couldn't resist the flowers growing beside the path. It was then that a wolf with impeccable manners approached her and greeted her as if they were old acquaintances. The girl, who had never heard how cunning wolves can be, told him without suspicion where she was going and described her grandmother's house in great detail, under the three big oak trees.",
 tr:"Ne var ki orman o sabah çok güzelmiş ve Kırmızı Başlıklı Kız patikanın kenarında açan çiçeklere karşı koyamamış. İşte tam o sırada kusursuz tavırlı bir kurt yanına gelmiş ve onu sanki eski tanıdıklarmış gibi selamlamış. Kurtların ne kadar kurnaz olabileceğini hiç duymamış olan kız, hiç şüphelenmeden nereye gittiğini anlatmış ve büyükannesinin üç büyük meşenin altındaki evini en ince ayrıntısına kadar tarif etmiş.",
 de:"Doch der Wald war an diesem Morgen wunderschön, und Rotkäppchen konnte den Blumen am Wegesrand nicht widerstehen. Genau da näherte sich ihm ein Wolf mit tadellosen Manieren und begrüßte es, als wären sie alte Bekannte. Das Mädchen, das noch nie gehört hatte, wie listig Wölfe sein können, erzählte ihm ohne Misstrauen, wohin es ging, und beschrieb ihm das Haus der Großmutter unter den drei großen Eichen bis ins kleinste Detail."},
{es:"Mientras la niña se entretenía haciendo un ramo, el lobo se adelantó, llamó a la puerta imitando su voz y, en cuanto la anciana le abrió, se la tragó de un bocado. Después se puso su gorro de dormir y se metió en la cama. Cuando por fin llegó Caperucita, le extrañó encontrar la puerta abierta. «Abuela, ¡qué orejas tan grandes tienes!», dijo, cada vez más inquieta. «Son para oírte mejor», respondió una voz ronca desde la penumbra.",
 en:"While the girl was busy making a bouquet, the wolf went ahead, knocked on the door imitating her voice and, as soon as the old woman opened it, swallowed her in one bite. Then he put on her nightcap and got into bed. When Little Red Riding Hood finally arrived, she was surprised to find the door open. “Grandmother, what big ears you have!” she said, more and more uneasy. “All the better to hear you with,” answered a hoarse voice from the half-darkness.",
 tr:"Kız buket yapmakla oyalanırken kurt öne geçmiş, kızın sesini taklit ederek kapıyı çalmış ve yaşlı kadın kapıyı açar açmaz onu tek lokmada yutmuş. Sonra onun gece başlığını takıp yatağa girmiş. Kırmızı Başlıklı Kız sonunda vardığında kapıyı açık bulunca şaşırmış. Gittikçe huzursuzlanarak «Büyükanne, kulakların ne kadar büyük!» demiş. Loşluğun içinden boğuk bir ses «Seni daha iyi duymak için» diye cevap vermiş.",
 de:"Während das Mädchen damit beschäftigt war, einen Strauß zu binden, lief der Wolf voraus, klopfte mit verstellter Stimme an die Tür und verschlang die alte Frau, sobald sie öffnete, mit einem Bissen. Dann setzte er ihre Nachtmütze auf und legte sich ins Bett. Als Rotkäppchen endlich ankam, wunderte es sich, dass die Tür offen stand. „Großmutter, was hast du für große Ohren!“, sagte es, immer unruhiger. „Damit ich dich besser hören kann“, antwortete eine heisere Stimme aus dem Halbdunkel."},
{es:"«¿Y por qué tienes unos dientes tan grandes?». Antes de que la niña pudiera reaccionar, el lobo saltó de la cama y se la tragó también. Satisfecho, se quedó dormido y empezó a roncar tan fuerte que un cazador que pasaba cerca sospechó que algo raro ocurría. Al ver al lobo con la barriga hinchada, comprendió lo que había pasado, y con unas tijeras sacó sanas y salvas a la niña y a su abuela. Desde aquel día, Caperucita nunca volvió a salirse del camino.",
 en:"“And why do you have such big teeth?” Before the girl could react, the wolf jumped out of bed and swallowed her too. Satisfied, he fell asleep and began to snore so loudly that a hunter passing nearby suspected that something strange was going on. When he saw the wolf with its swollen belly, he understood what had happened, and with a pair of scissors he got the girl and her grandmother out safe and sound. From that day on, Little Red Riding Hood never strayed from the path again.",
 tr:"«Peki dişlerin neden bu kadar büyük?» Kız tepki veremeden kurt yataktan fırlamış ve onu da yutmuş. Karnı doymuş halde uykuya dalmış ve öyle yüksek sesle horlamaya başlamış ki yakından geçen bir avcı tuhaf bir şeyler olduğundan şüphelenmiş. Kurdu şişmiş karnıyla görünce olanları anlamış ve bir makasla kızı ve büyükannesini sapasağlam çıkarmış. O günden sonra Kırmızı Başlıklı Kız bir daha asla yoldan ayrılmamış.",
 de:"„Und warum hast du so große Zähne?“ Bevor das Mädchen reagieren konnte, sprang der Wolf aus dem Bett und verschlang es ebenfalls. Satt schlief er ein und schnarchte so laut, dass ein Jäger, der in der Nähe vorbeikam, vermutete, dass etwas Seltsames vor sich ging. Als er den Wolf mit dem dicken Bauch sah, verstand er, was geschehen war, und holte das Mädchen und seine Großmutter mit einer Schere gesund und munter heraus. Von diesem Tag an kam Rotkäppchen nie wieder vom Weg ab."}],

{q:"¿Cómo consiguió el lobo entrar en casa de la abuela?",en:"How did the wolf manage to get into the grandmother's house?",tr:"Kurt büyükannenin evine nasıl girmeyi başardı?",de:"Wie gelang es dem Wolf, ins Haus der Großmutter zu kommen?",opts:["Imitó la voz de la niña","Rompió la ventana","Encontró la llave debajo de la puerta"],ex:"«…llamó a la puerta imitando su voz.»"},
{q:"¿Qué hizo sospechar al cazador?",en:"What made the hunter suspicious?",tr:"Avcıyı ne şüphelendirdi?",de:"Was machte den Jäger misstrauisch?",opts:["Los ronquidos tan fuertes del lobo","Los gritos de la niña","La puerta abierta"],ex:"«…empezó a roncar tan fuerte que un cazador… sospechó que algo raro ocurría.»"}]}

{id:"cerditos",icon:"🐷",title:"Los tres cerditos",tt:B("The Three Little Pigs","Üç Küçük Domuz","Die drei kleinen Schweinchen"),src:"Cuento popular inglés",lv:{
A1:{paras:[
{es:"Hay tres cerditos hermanos. El primero hace una casa de paja. El segundo hace una casa de madera. El tercero trabaja mucho y hace una casa de ladrillos. Un lobo sopla y destruye la casa de paja y la casa de madera. Pero no puede destruir la casa de ladrillos. Los tres cerditos están seguros allí.",
 en:"There are three little pig brothers. The first one makes a house of straw. The second one makes a house of wood. The third one works hard and makes a house of bricks. A wolf blows and destroys the straw house and the wooden house. But he can't destroy the brick house. The three little pigs are safe there.",
 tr:"Üç kardeş küçük domuz var. Birincisi samandan bir ev yapıyor. İkincisi tahtadan bir ev yapıyor. Üçüncüsü çok çalışıyor ve tuğladan bir ev yapıyor. Bir kurt üflüyor ve saman evi ve tahta evi yıkıyor. Ama tuğla evi yıkamıyor. Üç küçük domuz orada güvende.",
 de:"Es gibt drei kleine Schweinchen, die Brüder sind. Das erste baut ein Haus aus Stroh. Das zweite baut ein Haus aus Holz. Das dritte arbeitet viel und baut ein Haus aus Ziegeln. Ein Wolf pustet und zerstört das Strohhaus und das Holzhaus. Aber das Ziegelhaus kann er nicht zerstören. Die drei Schweinchen sind dort sicher."}],
vocab:[["la paja","straw","saman","das Stroh"],["la madera","wood","tahta","das Holz"],["el ladrillo","brick","tuğla","der Ziegel"],["soplar","to blow","üflemek","pusten"]],
quiz:[
{q:"¿De qué es la casa del tercer cerdito?",en:"What is the third little pig's house made of?",tr:"Üçüncü domuzun evi neden yapılmış?",de:"Woraus ist das Haus des dritten Schweinchens?",opts:["De ladrillos","De paja","De madera"],ex:"«El tercero trabaja mucho y hace una casa de ladrillos.»"},
{q:"¿Qué casa no puede destruir el lobo?",en:"Which house can't the wolf destroy?",tr:"Kurt hangi evi yıkamıyor?",de:"Welches Haus kann der Wolf nicht zerstören?",opts:["La casa de ladrillos","La casa de paja","La casa de madera"],ex:"«Pero no puede destruir la casa de ladrillos.»"}]},
A2:{paras:[
{es:"Había una vez tres cerditos que decidieron vivir solos. El primero era muy perezoso y construyó una casa de paja en una hora. El segundo hizo una casa de madera, porque quería terminar pronto y jugar. El tercero, en cambio, trabajó durante días y construyó una casa fuerte de ladrillos. Sus hermanos se reían de él.",
 en:"Once upon a time there were three little pigs who decided to live on their own. The first was very lazy and built a house of straw in one hour. The second made a house of wood, because he wanted to finish quickly and play. The third, on the other hand, worked for days and built a strong house of bricks. His brothers laughed at him.",
 tr:"Bir zamanlar tek başlarına yaşamaya karar veren üç küçük domuz varmış. Birincisi çok tembelmiş ve bir saatte samandan bir ev yapmış. İkincisi, işi çabucak bitirip oynamak istediği için tahtadan bir ev yapmış. Üçüncüsü ise günlerce çalışmış ve tuğladan sağlam bir ev yapmış. Kardeşleri ona gülüyormuş.",
 de:"Es waren einmal drei kleine Schweinchen, die beschlossen, allein zu leben. Das erste war sehr faul und baute in einer Stunde ein Haus aus Stroh. Das zweite baute ein Haus aus Holz, weil es schnell fertig sein und spielen wollte. Das dritte dagegen arbeitete tagelang und baute ein starkes Haus aus Ziegeln. Seine Brüder lachten es aus."},
{es:"Un día llegó un lobo hambriento. Sopló y sopló, y la casa de paja se cayó. El primer cerdito corrió a la casa de madera, pero el lobo también la derribó. Los dos hermanos llegaron asustados a la casa de ladrillos. El lobo sopló con todas sus fuerzas, pero la casa no se movió. Al final, el lobo intentó entrar por la chimenea y se quemó con el agua caliente.",
 en:"One day a hungry wolf arrived. He huffed and puffed, and the straw house fell down. The first little pig ran to the wooden house, but the wolf knocked that one down too. The two brothers arrived, frightened, at the brick house. The wolf blew with all his strength, but the house didn't move. In the end, the wolf tried to get in through the chimney and got burned by the hot water.",
 tr:"Bir gün aç bir kurt gelmiş. Üflemiş de üflemiş, saman ev yıkılmış. Birinci domuz tahta eve koşmuş ama kurt onu da yıkmış. İki kardeş korku içinde tuğla eve varmışlar. Kurt bütün gücüyle üflemiş ama ev kıpırdamamış bile. Sonunda kurt bacadan girmeye çalışmış ve sıcak suyla haşlanmış.",
 de:"Eines Tages kam ein hungriger Wolf. Er pustete und pustete, und das Strohhaus fiel um. Das erste Schweinchen rannte zum Holzhaus, aber der Wolf riss auch dieses um. Die beiden Brüder kamen voller Angst beim Ziegelhaus an. Der Wolf pustete mit aller Kraft, aber das Haus bewegte sich nicht. Am Ende versuchte der Wolf, durch den Schornstein hineinzukommen, und verbrühte sich im heißen Wasser."}],
vocab:[["perezoso","lazy","tembel","faul"],["construir","to build","inşa etmek, yapmak","bauen"],["derribar","to knock down","yıkmak","umreißen"],["la chimenea","chimney","baca","der Schornstein"]],
quiz:[
{q:"¿Por qué el segundo cerdito hizo una casa de madera?",en:"Why did the second little pig make a wooden house?",tr:"İkinci domuz neden tahtadan ev yaptı?",de:"Warum baute das zweite Schweinchen ein Holzhaus?",opts:["Quería terminar pronto y jugar","No tenía ladrillos","Le gustaba mucho la madera"],ex:"«…porque quería terminar pronto y jugar.»"},
{q:"¿Por dónde intentó entrar el lobo al final?",en:"Where did the wolf try to get in at the end?",tr:"Kurt sonunda nereden girmeye çalıştı?",de:"Wo versuchte der Wolf am Ende hineinzukommen?",opts:["Por la chimenea","Por la ventana","Por la puerta"],ex:"«…el lobo intentó entrar por la chimenea.»"}]},
B1:{paras:[
{es:"Cuando los tres cerditos crecieron, su madre les dijo que había llegado el momento de que cada uno construyera su propia casa. El primero, que solo pensaba en descansar, compró un poco de paja y en una hora ya tenía su casita. El segundo encontró unas tablas de madera y, aunque la casa no era muy sólida, la terminó antes de comer. «¡Ya está! Ahora podemos jugar todo el día», cantaban los dos.",
 en:"When the three little pigs grew up, their mother told them that the time had come for each of them to build his own house. The first, who only thought about resting, bought some straw and in an hour he already had his little house. The second found some wooden planks and, although the house wasn't very solid, he finished it before lunch. “Done! Now we can play all day,” the two of them sang.",
 tr:"Üç küçük domuz büyüyünce anneleri, her birinin kendi evini yapma zamanının geldiğini söylemiş. Sadece dinlenmeyi düşünen birincisi biraz saman almış ve bir saat içinde küçük evi hazırmış. İkincisi birkaç tahta bulmuş ve ev pek sağlam olmasa da öğle yemeğinden önce bitirmiş. «Tamam! Artık bütün gün oynayabiliriz» diye şarkı söylüyormuş ikisi.",
 de:"Als die drei kleinen Schweinchen groß waren, sagte ihre Mutter, es sei Zeit, dass jedes sein eigenes Haus baue. Das erste, das nur ans Ausruhen dachte, kaufte etwas Stroh und hatte nach einer Stunde schon sein Häuschen. Das zweite fand ein paar Holzbretter und wurde vor dem Mittagessen fertig, obwohl das Haus nicht sehr stabil war. „Fertig! Jetzt können wir den ganzen Tag spielen“, sangen die beiden."},
{es:"El tercer cerdito, en cambio, pasó semanas cargando ladrillos y cemento. Sus hermanos se burlaban de él, pero él les contestaba: «Si viene el lobo, ya veremos quién se ríe». Una noche, efectivamente, apareció un lobo hambriento. «¡Cerdito, déjame entrar!», gritó delante de la casa de paja. Como el cerdito no le abrió, el lobo sopló tan fuerte que la casa salió volando.",
 en:"The third little pig, on the other hand, spent weeks carrying bricks and cement. His brothers made fun of him, but he answered: “If the wolf comes, we'll see who laughs.” One night, sure enough, a hungry wolf appeared. “Little pig, let me in!” he shouted in front of the straw house. As the little pig didn't open the door, the wolf blew so hard that the house flew away.",
 tr:"Üçüncü domuz ise haftalarca tuğla ve çimento taşımış. Kardeşleri onunla dalga geçiyormuş ama o şöyle cevap veriyormuş: «Kurt gelirse kimin güleceğini görürüz.» Bir gece gerçekten de aç bir kurt çıkagelmiş. Saman evin önünde «Küçük domuz, beni içeri al!» diye bağırmış. Domuz kapıyı açmayınca kurt öyle güçlü üflemiş ki ev uçup gitmiş.",
 de:"Das dritte Schweinchen dagegen schleppte wochenlang Ziegel und Zement. Seine Brüder machten sich über es lustig, aber es antwortete: „Wenn der Wolf kommt, werden wir sehen, wer lacht.“ Eines Nachts erschien tatsächlich ein hungriger Wolf. „Schweinchen, lass mich rein!“, rief er vor dem Strohhaus. Weil das Schweinchen nicht öffnete, pustete der Wolf so stark, dass das Haus davonflog."},
{es:"Lo mismo ocurrió con la casa de madera, y los dos hermanos tuvieron que huir a toda prisa a casa del tercero. Allí el lobo sopló hasta quedarse sin aire, pero los ladrillos no se movieron ni un centímetro. Furioso, decidió bajar por la chimenea. Sin embargo, el cerdito listo había puesto al fuego una gran olla de agua hirviendo. El lobo cayó dentro, salió aullando y nunca más volvió a molestarlos.",
 en:"The same thing happened with the wooden house, and the two brothers had to flee in a hurry to the third one's house. There the wolf blew until he ran out of breath, but the bricks didn't move a centimetre. Furious, he decided to come down the chimney. However, the clever little pig had put a big pot of boiling water on the fire. The wolf fell into it, ran out howling and never bothered them again.",
 tr:"Aynı şey tahta evde de olmuş ve iki kardeş alelacele üçüncünün evine kaçmak zorunda kalmış. Orada kurt nefesi kesilene kadar üflemiş ama tuğlalar bir santim bile kıpırdamamış. Öfkelenen kurt bacadan inmeye karar vermiş. Ama akıllı domuz ateşin üstüne kocaman bir kazan kaynar su koymuş. Kurt kazanın içine düşmüş, uluyarak kaçmış ve onları bir daha hiç rahatsız etmemiş.",
 de:"Dasselbe geschah mit dem Holzhaus, und die beiden Brüder mussten in aller Eile zum Haus des dritten fliehen. Dort pustete der Wolf, bis ihm die Luft ausging, aber die Ziegel bewegten sich keinen Zentimeter. Wütend beschloss er, durch den Schornstein herunterzuklettern. Doch das kluge Schweinchen hatte einen großen Topf mit kochendem Wasser aufs Feuer gestellt. Der Wolf fiel hinein, rannte heulend davon und störte sie nie wieder."}],
vocab:[["la tabla","plank, board","tahta, kalas","das Brett"],["burlarse de","to make fun of","dalga geçmek","sich lustig machen über"],["huir","to flee","kaçmak","fliehen"],["hirviendo","boiling","kaynar","kochend"]],
quiz:[
{q:"¿Qué les contestaba el tercer cerdito a sus hermanos?",en:"What did the third little pig answer his brothers?",tr:"Üçüncü domuz kardeşlerine ne cevap veriyordu?",de:"Was antwortete das dritte Schweinchen seinen Brüdern?",opts:["Que ya verían quién se reía si venía el lobo","Que su casa era la más bonita","Que no quería jugar con ellos"],ex:"«Si viene el lobo, ya veremos quién se ríe.»"},
{q:"¿Qué pasó con la casa de paja?",en:"What happened to the straw house?",tr:"Saman eve ne oldu?",de:"Was geschah mit dem Strohhaus?",opts:["Salió volando","Se quemó","Se quedó en pie"],ex:"«…el lobo sopló tan fuerte que la casa salió volando.»"},
{q:"¿Qué había preparado el cerdito listo?",en:"What had the clever little pig prepared?",tr:"Akıllı domuz ne hazırlamıştı?",de:"Was hatte das kluge Schweinchen vorbereitet?",opts:["Una olla de agua hirviendo","Una trampa en la puerta","Una cena para el lobo"],ex:"«…había puesto al fuego una gran olla de agua hirviendo.»"}]},
B2:{paras:[
{es:"Llegó un día en que la vieja cerda, cansada de alimentar a tres hijos ya creciditos, los reunió y les dijo que había llegado la hora de que se ganaran la vida por su cuenta. «Haced lo que queráis», les aconsejó, «pero no olvidéis que en el bosque vive un lobo que no perdona». Los tres se despidieron con entusiasmo, aunque cada uno interpretó aquel consejo a su manera.",
 en:"There came a day when the old sow, tired of feeding three sons who were already quite grown, gathered them together and told them the time had come for them to make their own way in the world. “Do as you wish,” she advised them, “but don't forget that a merciless wolf lives in the forest.” The three said goodbye enthusiastically, although each of them interpreted that advice in his own way.",
 tr:"Bir gün gelmiş, epeyce büyümüş üç oğlunu doyurmaktan yorulan yaşlı domuz onları toplamış ve artık kendi başlarının çaresine bakma vaktinin geldiğini söylemiş. «Ne isterseniz yapın» diye öğüt vermiş, «ama ormanda acımasız bir kurdun yaşadığını unutmayın.» Üçü de hevesle vedalaşmış, ama her biri bu öğüdü kendi bildiği gibi yorumlamış.",
 de:"Eines Tages war die alte Sau es leid, drei schon recht große Söhne zu ernähren. Sie rief sie zusammen und sagte ihnen, es sei an der Zeit, dass sie selbst für sich sorgten. „Macht, was ihr wollt“, riet sie ihnen, „aber vergesst nicht, dass im Wald ein Wolf lebt, der keine Gnade kennt.“ Die drei verabschiedeten sich voller Begeisterung, obwohl jeder diesen Rat auf seine Weise verstand."},
{es:"El primero, convencido de que el lobo era una exageración de su madre, se conformó con levantar una choza de paja y dedicó el resto de la tarde a dormir la siesta. El segundo fue algo más precavido: clavó unas cuantas tablas, aunque sin preocuparse demasiado de que encajaran bien. El tercero, en cambio, dedicó semanas a mezclar cemento y apilar ladrillos, sin hacer caso de las burlas de sus hermanos, que no entendían para qué tanto esfuerzo.",
 en:"The first, convinced that the wolf was an exaggeration of his mother's, settled for putting up a straw hut and spent the rest of the afternoon taking a nap. The second was somewhat more cautious: he nailed together a few boards, though without worrying too much about whether they fitted well. The third, on the other hand, spent weeks mixing cement and stacking bricks, ignoring the jokes of his brothers, who didn't understand why he was making so much effort.",
 tr:"Kurdun annesinin bir abartısı olduğuna inanan birincisi samandan bir kulübe yapmakla yetinmiş ve öğleden sonranın geri kalanını öğle uykusuyla geçirmiş. İkincisi biraz daha tedbirliymiş: birkaç tahtayı çivilemiş, ama birbirine iyi oturup oturmadıklarını pek dert etmemiş. Üçüncüsü ise haftalarca çimento karıp tuğla dizmiş ve bu kadar emeğin neden gerektiğini anlamayan kardeşlerinin alaylarına hiç kulak asmamış.",
 de:"Der erste, überzeugt, dass der Wolf eine Übertreibung seiner Mutter war, begnügte sich damit, eine Strohhütte aufzustellen, und verbrachte den Rest des Nachmittags mit einem Mittagsschlaf. Der zweite war etwas vorsichtiger: Er nagelte ein paar Bretter zusammen, ohne sich allzu sehr darum zu kümmern, ob sie gut passten. Der dritte dagegen verbrachte Wochen damit, Zement anzurühren und Ziegel aufzuschichten, ohne auf den Spott seiner Brüder zu achten, die nicht verstanden, wozu so viel Mühe gut sein sollte."},
{es:"No tuvieron que esperar mucho para comprobarlo. Una noche de luna llena, el lobo se plantó ante la choza de paja y, con un par de soplidos, la deshizo como si fuera un castillo de naipes. El cerdito escapó por los pelos y se refugió en casa de su hermano, pero las tablas mal clavadas tampoco resistieron. Jadeando de miedo, los dos llamaron a la puerta del tercero, que les abrió sin reprocharles nada.",
 en:"They didn't have to wait long to find out. One night under a full moon, the wolf planted himself in front of the straw hut and, with a couple of puffs, took it apart as if it were a house of cards. The little pig escaped by the skin of his teeth and took refuge in his brother's house, but the badly nailed boards didn't hold out either. Panting with fear, the two knocked on the third one's door, and he let them in without reproaching them for anything.",
 tr:"Bunu görmek için uzun süre beklemeleri gerekmemiş. Dolunaylı bir gece kurt saman kulübenin önüne dikilmiş ve birkaç üflemeyle onu iskambil kâğıdından bir şatoymuş gibi dağıtmış. Domuz kıl payı kurtulmuş ve kardeşinin evine sığınmış, ama kötü çivilenmiş tahtalar da dayanamamış. Korkudan soluk soluğa kalan ikisi üçüncünün kapısını çalmış, o da hiç sitem etmeden kapıyı açmış.",
 de:"Sie mussten nicht lange warten, um es herauszufinden. In einer Vollmondnacht baute sich der Wolf vor der Strohhütte auf und blies sie mit ein paar Pustern um wie ein Kartenhaus. Das Schweinchen entkam um Haaresbreite und flüchtete ins Haus seines Bruders, aber auch die schlecht genagelten Bretter hielten nicht stand. Keuchend vor Angst klopften die beiden beim dritten an, der ihnen öffnete, ohne ihnen Vorwürfe zu machen."},
{es:"El lobo sopló y resopló hasta ponerse morado, pero aquellas paredes ni siquiera temblaron. Entonces, creyéndose más listo que nadie, trepó al tejado para colarse por la chimenea. No contaba con que el tercer cerdito, que lo había previsto todo, tuviera ya hirviendo una enorme olla. El lobo cayó de lleno en ella, salió despavorido y jamás volvió a acercarse. Aquella noche, los dos hermanos comprendieron por fin que el esfuerzo de hoy es la tranquilidad de mañana.",
 en:"The wolf huffed and puffed until he turned purple, but those walls didn't even tremble. Then, thinking himself cleverer than anyone, he climbed onto the roof to sneak in through the chimney. He hadn't counted on the third little pig, who had foreseen everything, already having an enormous pot boiling. The wolf fell straight into it, fled in terror and never came near again. That night, the two brothers finally understood that today's effort is tomorrow's peace of mind.",
 tr:"Kurt mosmor olana kadar üflemiş de püflemiş, ama o duvarlar titrememiş bile. Bunun üzerine kendini herkesten akıllı sanarak bacadan içeri süzülmek için çatıya tırmanmış. Her şeyi önceden düşünmüş olan üçüncü domuzun kocaman bir kazanı çoktan kaynatmış olabileceğini hesaba katmamış. Kurt dosdoğru kazanın içine düşmüş, dehşet içinde kaçmış ve bir daha asla yaklaşmamış. O gece iki kardeş sonunda bugünkü emeğin yarının huzuru olduğunu anlamış.",
 de:"Der Wolf pustete und prustete, bis er ganz lila wurde, doch diese Wände zitterten nicht einmal. Da kletterte er, weil er sich für schlauer als alle anderen hielt, aufs Dach, um sich durch den Schornstein hineinzuschleichen. Er hatte nicht damit gerechnet, dass das dritte Schweinchen, das alles vorausgesehen hatte, schon einen riesigen Topf zum Kochen gebracht hatte. Der Wolf fiel mitten hinein, floh entsetzt und kam nie wieder in die Nähe. In jener Nacht verstanden die beiden Brüder endlich, dass die Mühe von heute die Ruhe von morgen ist."}],
vocab:[["conformarse con","to settle for","yetinmek","sich begnügen mit"],["precavido","cautious","tedbirli","vorsichtig"],["por los pelos","by the skin of one's teeth","kıl payı","um Haaresbreite"],["colarse","to sneak in","gizlice girmek, süzülmek","sich hineinschleichen"]],
quiz:[
{q:"¿Por qué el primer cerdito hizo una choza de paja?",en:"Why did the first little pig make a straw hut?",tr:"Birinci domuz neden samandan kulübe yaptı?",de:"Warum baute das erste Schweinchen eine Strohhütte?",opts:["Creía que el lobo era una exageración de su madre","No tenía dinero para ladrillos","Quería ayudar a sus hermanos"],ex:"«…convencido de que el lobo era una exageración de su madre…»"},
{q:"¿Cómo reaccionó el tercer cerdito cuando llegaron sus hermanos?",en:"How did the third little pig react when his brothers arrived?",tr:"Kardeşleri gelince üçüncü domuz nasıl davrandı?",de:"Wie reagierte das dritte Schweinchen, als seine Brüder kamen?",opts:["Les abrió sin reprocharles nada","Se rió de ellos","No quiso abrirles la puerta"],ex:"«…les abrió sin reprocharles nada.»"},
{q:"¿Qué aprendieron los dos hermanos?",en:"What did the two brothers learn?",tr:"İki kardeş ne öğrendi?",de:"Was lernten die beiden Brüder?",opts:["Que el esfuerzo de hoy es la tranquilidad de mañana","Que los lobos no saben subir a los tejados","Que la paja es mejor que la madera"],ex:"«…el esfuerzo de hoy es la tranquilidad de mañana.»"}]}

{id:"liebre",icon:"🐢",title:"La liebre y la tortuga",tt:B("The Tortoise and the Hare","Tavşan ile Kaplumbağa","Der Hase und die Schildkröte"),src:"Esopo",lv:{
A1:{paras:[
{es:"Una liebre corre muy rápido. Una tortuga camina muy despacio. La liebre se ríe de la tortuga. La tortuga dice: «¿Hacemos una carrera?». La liebre corre y luego duerme debajo de un árbol. La tortuga no para. Camina y camina. Al final, la tortuga gana la carrera.",
 en:"A hare runs very fast. A tortoise walks very slowly. The hare laughs at the tortoise. The tortoise says: “Shall we have a race?” The hare runs and then sleeps under a tree. The tortoise doesn't stop. She walks and walks. In the end, the tortoise wins the race.",
 tr:"Bir tavşan çok hızlı koşuyor. Bir kaplumbağa çok yavaş yürüyor. Tavşan kaplumbağaya gülüyor. Kaplumbağa «Yarışalım mı?» diyor. Tavşan koşuyor ve sonra bir ağacın altında uyuyor. Kaplumbağa durmuyor. Yürüyor da yürüyor. Sonunda yarışı kaplumbağa kazanıyor.",
 de:"Ein Hase läuft sehr schnell. Eine Schildkröte geht sehr langsam. Der Hase lacht über die Schildkröte. Die Schildkröte sagt: „Machen wir ein Wettrennen?“ Der Hase läuft und schläft dann unter einem Baum. Die Schildkröte hält nicht an. Sie geht und geht. Am Ende gewinnt die Schildkröte das Rennen."}],
vocab:[["la liebre","hare","tavşan","der Hase"],["la tortuga","tortoise","kaplumbağa","die Schildkröte"],["despacio","slowly","yavaş","langsam"],["ganar","to win","kazanmak","gewinnen"]],
quiz:[
{q:"¿Qué hace la liebre durante la carrera?",en:"What does the hare do during the race?",tr:"Tavşan yarış sırasında ne yapıyor?",de:"Was macht der Hase während des Rennens?",opts:["Duerme debajo de un árbol","Ayuda a la tortuga","Come zanahorias"],ex:"«La liebre corre y luego duerme debajo de un árbol.»"},
{q:"¿Quién gana la carrera?",en:"Who wins the race?",tr:"Yarışı kim kazanıyor?",de:"Wer gewinnt das Rennen?",opts:["La tortuga","La liebre","Nadie"],ex:"«Al final, la tortuga gana la carrera.»"}]},
A2:{paras:[
{es:"Había una vez una liebre muy orgullosa que siempre decía que era el animal más rápido del bosque. Un día se rió de una tortuga porque caminaba muy despacio. La tortuga, tranquila, le respondió: «Te propongo una carrera. Seguro que llego antes que tú». Todos los animales se rieron, pero aceptaron ser los jueces.",
 en:"Once upon a time there was a very proud hare who always said she was the fastest animal in the forest. One day she laughed at a tortoise because she walked very slowly. The tortoise calmly answered: “I challenge you to a race. I'm sure I'll get there before you.” All the animals laughed, but they agreed to be the judges.",
 tr:"Bir zamanlar her zaman ormanın en hızlı hayvanı olduğunu söyleyen çok kibirli bir tavşan varmış. Bir gün çok yavaş yürüdüğü için bir kaplumbağaya gülmüş. Kaplumbağa sakin bir şekilde cevap vermiş: «Sana bir yarış öneriyorum. Senden önce varacağımdan eminim.» Bütün hayvanlar gülmüş ama hakem olmayı kabul etmişler.",
 de:"Es war einmal ein sehr stolzer Hase, der immer sagte, er sei das schnellste Tier im Wald. Eines Tages lachte er über eine Schildkröte, weil sie so langsam ging. Die Schildkröte antwortete ruhig: „Ich schlage dir ein Wettrennen vor. Ich bin sicher, dass ich vor dir ankomme.“ Alle Tiere lachten, aber sie erklärten sich bereit, die Schiedsrichter zu sein."},
{es:"La carrera empezó y la liebre salió corriendo. Pronto estaba tan lejos que decidió descansar un poco debajo de un árbol. Se durmió profundamente. Mientras tanto, la tortuga seguía caminando, paso a paso, sin parar. Cuando la liebre se despertó, corrió como el viento, pero ya era tarde: la tortuga estaba cruzando la meta.",
 en:"The race began and the hare dashed off. Soon she was so far ahead that she decided to rest a little under a tree. She fell fast asleep. Meanwhile, the tortoise kept walking, step by step, without stopping. When the hare woke up, she ran like the wind, but it was too late: the tortoise was crossing the finish line.",
 tr:"Yarış başlamış ve tavşan koşarak fırlamış. Kısa sürede o kadar öne geçmiş ki bir ağacın altında biraz dinlenmeye karar vermiş. Derin bir uykuya dalmış. Bu arada kaplumbağa adım adım, hiç durmadan yürümeye devam ediyormuş. Tavşan uyandığında rüzgâr gibi koşmuş ama artık çok geçmiş: kaplumbağa bitiş çizgisini geçiyormuş.",
 de:"Das Rennen begann, und der Hase sauste los. Bald war er so weit vorn, dass er beschloss, sich unter einem Baum ein wenig auszuruhen. Er schlief tief ein. Unterdessen ging die Schildkröte weiter, Schritt für Schritt, ohne anzuhalten. Als der Hase aufwachte, rannte er wie der Wind, aber es war schon zu spät: Die Schildkröte überquerte gerade die Ziellinie."}],
vocab:[["orgulloso","proud","kibirli, gururlu","stolz"],["el juez","judge","hakem","der Schiedsrichter"],["mientras tanto","meanwhile","bu arada","unterdessen"],["la meta","finish line","bitiş çizgisi","das Ziel"]],
quiz:[
{q:"¿Por qué se rió la liebre de la tortuga?",en:"Why did the hare laugh at the tortoise?",tr:"Tavşan kaplumbağaya neden güldü?",de:"Warum lachte der Hase über die Schildkröte?",opts:["Porque caminaba muy despacio","Porque era pequeña","Porque no sabía nadar"],ex:"«…se rió de una tortuga porque caminaba muy despacio.»"},
{q:"¿Qué estaba haciendo la tortuga cuando la liebre se despertó?",en:"What was the tortoise doing when the hare woke up?",tr:"Tavşan uyandığında kaplumbağa ne yapıyordu?",de:"Was machte die Schildkröte, als der Hase aufwachte?",opts:["Estaba cruzando la meta","Estaba durmiendo","Estaba comiendo"],ex:"«…la tortuga estaba cruzando la meta.»"}]},
B1:{paras:[
{es:"En un prado vivía una liebre que presumía constantemente de su velocidad. «Nadie puede ganarme», repetía a todo el que quisiera escucharla. Le encantaba burlarse especialmente de la tortuga: «¿Llegarás a tu casa antes del invierno?», le preguntaba entre carcajadas. Un día, la tortuga, cansada de tantas bromas, la miró con calma y le propuso una carrera hasta el viejo molino.",
 en:"In a meadow lived a hare who constantly boasted about her speed. “Nobody can beat me,” she repeated to anyone who would listen. She especially loved making fun of the tortoise: “Will you get home before winter?” she would ask her, laughing her head off. One day, the tortoise, tired of so many jokes, looked at her calmly and proposed a race to the old mill.",
 tr:"Bir çayırda sürekli hızıyla övünen bir tavşan yaşıyormuş. «Kimse beni yenemez» diye dinlemek isteyen herkese tekrarlıyormuş. Özellikle kaplumbağayla dalga geçmeye bayılıyormuş: «Kıştan önce evine varabilecek misin?» diye kahkahalar arasında soruyormuş. Bir gün bu kadar şakadan bıkan kaplumbağa ona sakin sakin bakmış ve eski değirmene kadar bir yarış önermiş.",
 de:"Auf einer Wiese lebte ein Hase, der ständig mit seiner Schnelligkeit prahlte. „Niemand kann mich schlagen“, wiederholte er jedem, der ihm zuhören wollte. Besonders gern machte er sich über die Schildkröte lustig: „Kommst du noch vor dem Winter nach Hause?“, fragte er sie lachend. Eines Tages sah ihn die Schildkröte, müde von so vielen Witzen, ruhig an und schlug ein Wettrennen bis zur alten Mühle vor."},
{es:"Los animales del prado no se lo podían creer, pero se reunieron para ver aquel espectáculo. El zorro dio la salida y la liebre desapareció en un instante entre una nube de polvo. A mitad de camino, miró hacia atrás y no vio a nadie. «Me sobra tiempo», pensó, y se tumbó a la sombra de un árbol. Hacía calor, la hierba era suave, y en pocos minutos se quedó dormida.",
 en:"The animals of the meadow couldn't believe it, but they gathered to watch the spectacle. The fox gave the starting signal and the hare disappeared in an instant in a cloud of dust. Halfway along, she looked back and saw nobody. “I've got plenty of time,” she thought, and lay down in the shade of a tree. It was hot, the grass was soft, and within a few minutes she was asleep.",
 tr:"Çayırdaki hayvanlar inanamamış ama bu gösteriyi izlemek için toplanmışlar. Tilki başlama işaretini vermiş ve tavşan bir toz bulutunun içinde bir anda gözden kaybolmuş. Yolun yarısında arkasına bakmış ve kimseyi görmemiş. «Bol bol vaktim var» diye düşünmüş ve bir ağacın gölgesine uzanmış. Hava sıcakmış, çimen yumuşakmış ve birkaç dakika içinde uyuyakalmış.",
 de:"Die Tiere auf der Wiese konnten es nicht glauben, aber sie versammelten sich, um sich dieses Schauspiel anzusehen. Der Fuchs gab das Startzeichen, und der Hase verschwand im Nu in einer Staubwolke. Auf halbem Weg sah er sich um und konnte niemanden sehen. „Ich habe Zeit genug“, dachte er und legte sich in den Schatten eines Baumes. Es war warm, das Gras war weich, und nach wenigen Minuten war er eingeschlafen."},
{es:"Mientras tanto, la tortuga avanzaba sin prisa pero sin pausa. Pasó junto al árbol donde roncaba la liebre y siguió adelante sin hacer ruido. Cuando el sol ya se estaba poniendo, la liebre se despertó sobresaltada y echó a correr con todas sus fuerzas. Pero al llegar al molino, encontró a la tortuga descansando tranquilamente, rodeada de los aplausos de todos. Aquel día la liebre aprendió que la constancia vale más que la velocidad.",
 en:"Meanwhile, the tortoise moved forward slowly but steadily. She passed the tree where the hare was snoring and carried on without making a sound. When the sun was already setting, the hare woke up with a start and began to run with all her might. But when she reached the mill, she found the tortoise resting calmly, surrounded by everyone's applause. That day the hare learned that perseverance is worth more than speed.",
 tr:"Bu arada kaplumbağa acele etmeden ama hiç durmadan ilerliyormuş. Tavşanın horladığı ağacın yanından geçmiş ve ses çıkarmadan yoluna devam etmiş. Güneş batmak üzereyken tavşan irkilerek uyanmış ve var gücüyle koşmaya başlamış. Ama değirmene vardığında kaplumbağayı herkesin alkışları arasında rahat rahat dinlenirken bulmuş. O gün tavşan, azmin hızdan daha değerli olduğunu öğrenmiş.",
 de:"Unterdessen kam die Schildkröte langsam, aber stetig voran. Sie ging an dem Baum vorbei, unter dem der Hase schnarchte, und lief lautlos weiter. Als die Sonne schon unterging, wachte der Hase erschrocken auf und rannte los, so schnell er konnte. Doch als er an der Mühle ankam, fand er die Schildkröte, die sich in aller Ruhe ausruhte, umgeben vom Applaus aller. An diesem Tag lernte der Hase, dass Beharrlichkeit mehr wert ist als Schnelligkeit."}],
vocab:[["presumir de","to boast about","övünmek","prahlen mit"],["la carcajada","loud laugh","kahkaha","das schallende Lachen"],["sin prisa pero sin pausa","slowly but steadily","acele etmeden ama durmadan","langsam, aber stetig"],["la constancia","perseverance","azim, sebat","die Beharrlichkeit"]],
quiz:[
{q:"¿Hasta dónde era la carrera?",en:"Where did the race go to?",tr:"Yarış nereye kadardı?",de:"Bis wohin ging das Rennen?",opts:["Hasta el viejo molino","Hasta el río","Hasta el bosque"],ex:"«…le propuso una carrera hasta el viejo molino.»"},
{q:"¿Por qué se tumbó la liebre a la sombra?",en:"Why did the hare lie down in the shade?",tr:"Tavşan neden gölgeye uzandı?",de:"Warum legte sich der Hase in den Schatten?",opts:["Pensó que le sobraba tiempo","Se había hecho daño","Estaba esperando a la tortuga para ayudarla"],ex:"«Me sobra tiempo», pensó, y se tumbó a la sombra de un árbol."},
{q:"¿Qué aprendió la liebre?",en:"What did the hare learn?",tr:"Tavşan ne öğrendi?",de:"Was lernte der Hase?",opts:["Que la constancia vale más que la velocidad","Que las tortugas son muy rápidas","Que no hay que dormir en el campo"],ex:"«…la constancia vale más que la velocidad.»"}]},
B2:{paras:[
{es:"Cuenta Esopo que había una vez una liebre tan convencida de su propia superioridad que no perdía ocasión de recordársela a los demás. Lo que más le divertía era meterse con la tortuga, a quien llamaba «la eterna rezagada». La tortuga solía aguantar las burlas en silencio, hasta que una mañana, ante la mirada atónita de todo el bosque, le lanzó un desafío: una carrera desde el roble del claro hasta el puente del río.",
 en:"Aesop tells that there was once a hare so convinced of her own superiority that she never missed a chance to remind others of it. What amused her most was picking on the tortoise, whom she called “the eternal straggler.” The tortoise usually put up with the jokes in silence, until one morning, before the astonished eyes of the whole forest, she threw down a challenge: a race from the oak in the clearing to the bridge over the river.",
 tr:"Ezop'un anlattığına göre bir zamanlar kendi üstünlüğüne o kadar inanmış bir tavşan varmış ki bunu başkalarına hatırlatma fırsatını hiç kaçırmazmış. En çok da «ebedi geride kalan» dediği kaplumbağaya sataşmak hoşuna gidermiş. Kaplumbağa alayları genellikle sessizce sineye çekermiş, ta ki bir sabah bütün ormanın şaşkın bakışları önünde ona meydan okuyana kadar: açıklıktaki meşeden nehrin üstündeki köprüye kadar bir yarış.",
 de:"Äsop erzählt, dass es einmal einen Hasen gab, der so von seiner eigenen Überlegenheit überzeugt war, dass er keine Gelegenheit ausließ, die anderen daran zu erinnern. Am meisten Spaß machte es ihm, die Schildkröte zu ärgern, die er „die ewige Nachzüglerin“ nannte. Die Schildkröte ertrug den Spott meist schweigend, bis sie eines Morgens vor den verblüfften Augen des ganzen Waldes eine Herausforderung aussprach: ein Wettrennen von der Eiche auf der Lichtung bis zur Brücke über den Fluss."},
{es:"La liebre se rió tanto que tuvo que sentarse, pero aceptó encantada, convencida de que sería la humillación definitiva para su rival. Al darse la salida, salió disparada y en pocos segundos dejó atrás a la tortuga, que apenas había recorrido unos metros. Al ver que su ventaja era abrumadora, decidió que no tenía sentido cansarse: se tumbaría un rato, comería unos tréboles y aun así llegaría con tiempo de sobra para recibir a la tortuga en la meta.",
 en:"The hare laughed so much that she had to sit down, but she accepted delightedly, convinced that it would be the final humiliation for her rival. When the race started, she shot off and in a few seconds left behind the tortoise, who had barely covered a few metres. Seeing that her lead was overwhelming, she decided there was no point in tiring herself out: she would lie down for a while, eat some clover and still arrive with plenty of time to welcome the tortoise at the finish.",
 tr:"Tavşan o kadar gülmüş ki oturmak zorunda kalmış, ama bunun rakibi için son ve kesin bir rezillik olacağına inanarak teklifi seve seve kabul etmiş. Yarış başlayınca ok gibi fırlamış ve birkaç saniyede daha ancak birkaç metre gidebilmiş olan kaplumbağayı geride bırakmış. Farkın ezici olduğunu görünce yorulmanın anlamı olmadığına karar vermiş: biraz uzanacak, birkaç yonca yiyecek ve yine de kaplumbağayı bitiş çizgisinde karşılamaya fazlasıyla vakti olacakmış.",
 de:"Der Hase lachte so sehr, dass er sich setzen musste, nahm aber begeistert an, überzeugt, dass es die endgültige Demütigung seiner Rivalin sein würde. Beim Startsignal schoss er davon und ließ innerhalb von Sekunden die Schildkröte hinter sich, die kaum ein paar Meter zurückgelegt hatte. Als er sah, wie überwältigend sein Vorsprung war, beschloss er, dass es keinen Sinn hatte, sich zu verausgaben: Er würde sich eine Weile hinlegen, etwas Klee fressen und trotzdem noch mit reichlich Zeit ankommen, um die Schildkröte am Ziel zu empfangen."},
{es:"Lo que no previó fue que el sol de mediodía y la barriga llena la sumirían en un sueño profundísimo. Mientras roncaba a pierna suelta, la tortuga seguía avanzando con su paso lento pero inquebrantable, sin distraerse con las mariposas ni con los comentarios de los curiosos. Pasó a escasos metros de su rival dormida y, aunque podría haberla despertado para presumir, prefirió no perder ni un segundo.",
 en:"What she didn't foresee was that the midday sun and a full belly would plunge her into the deepest sleep. While she was snoring away, the tortoise kept moving forward at her slow but unshakeable pace, without getting distracted by butterflies or by the comments of onlookers. She passed just a few metres from her sleeping rival and, although she could have woken her up to show off, she preferred not to waste a single second.",
 tr:"Öngöremediği şey, öğle güneşinin ve tok karnının onu derin mi derin bir uykuya daldıracağıymış. O mışıl mışıl horlarken kaplumbağa ne kelebeklerle ne de meraklıların yorumlarıyla oyalanmadan, yavaş ama sarsılmaz adımlarıyla ilerlemeye devam etmiş. Uyuyan rakibinin birkaç metre yanından geçmiş ve hava atmak için onu uyandırabilecek olsa da tek bir saniye bile kaybetmemeyi tercih etmiş.",
 de:"Was er nicht vorhergesehen hatte, war, dass ihn die Mittagssonne und der volle Bauch in einen tiefen Schlaf versinken lassen würden. Während er seelenruhig schnarchte, kam die Schildkröte mit ihrem langsamen, aber unerschütterlichen Schritt weiter voran, ohne sich von Schmetterlingen oder den Kommentaren der Schaulustigen ablenken zu lassen. Sie ging nur wenige Meter an ihrem schlafenden Rivalen vorbei, und obwohl sie ihn hätte wecken können, um anzugeben, wollte sie keine Sekunde verlieren."},
{es:"Cuando la liebre abrió los ojos, la luz ya era anaranjada. Se levantó de un salto y corrió como nunca había corrido, con el corazón desbocado, pero al divisar el puente comprendió que era demasiado tarde: la tortuga lo cruzaba en ese preciso instante entre los vítores del bosque entero. Avergonzada, la liebre tuvo que reconocer su derrota. Desde entonces, cuando alguien presume más de la cuenta, los animales del bosque le recuerdan aquella carrera y la lección que dejó: el talento sin constancia no sirve de nada.",
 en:"When the hare opened her eyes, the light was already orange. She leapt up and ran as she had never run before, her heart racing, but when she caught sight of the bridge she realised it was too late: the tortoise was crossing it at that very moment amid the cheers of the whole forest. Ashamed, the hare had to admit defeat. Since then, whenever someone boasts too much, the animals of the forest remind them of that race and the lesson it left: talent without perseverance is worth nothing.",
 tr:"Tavşan gözlerini açtığında ışık çoktan turuncuya dönmüş. Bir sıçrayışta ayağa kalkmış ve yüreği deli gibi çarparak hayatında hiç koşmadığı kadar hızlı koşmuş, ama köprüyü görünce çok geç kaldığını anlamış: kaplumbağa tam o anda bütün ormanın tezahüratları arasında köprüden geçiyormuş. Utanan tavşan yenilgiyi kabul etmek zorunda kalmış. O günden beri biri gereğinden fazla övündüğünde ormanın hayvanları ona o yarışı ve bıraktığı dersi hatırlatırlar: azim olmadan yetenek hiçbir işe yaramaz.",
 de:"Als der Hase die Augen öffnete, war das Licht schon orange. Er sprang auf und rannte, wie er noch nie gerannt war, mit rasendem Herzen, doch als er die Brücke erblickte, begriff er, dass es zu spät war: Die Schildkröte überquerte sie genau in diesem Moment unter dem Jubel des ganzen Waldes. Beschämt musste der Hase seine Niederlage eingestehen. Seitdem erinnern die Tiere des Waldes jeden, der zu sehr prahlt, an jenes Rennen und seine Lehre: Talent ohne Beharrlichkeit ist nichts wert."}],

{q:"¿Cómo llamaba la liebre a la tortuga?",en:"What did the hare call the tortoise?",tr:"Tavşan kaplumbağaya ne diyordu?",de:"Wie nannte der Hase die Schildkröte?",opts:["La eterna rezagada","La reina del bosque","La campeona"],ex:"«…la tortuga, a quien llamaba la eterna rezagada.»"},
{q:"¿Por qué decidió descansar la liebre?",en:"Why did the hare decide to rest?",tr:"Tavşan neden dinlenmeye karar verdi?",de:"Warum beschloss der Hase, sich auszuruhen?",opts:["Porque su ventaja era abrumadora","Porque estaba enferma","Porque la tortuga se lo pidió"],ex:"«Al ver que su ventaja era abrumadora, decidió que no tenía sentido cansarse.»"},
{q:"¿Qué hizo la tortuga al pasar junto a la liebre dormida?",en:"What did the tortoise do when she passed the sleeping hare?",tr:"Kaplumbağa uyuyan tavşanın yanından geçerken ne yaptı?",de:"Was tat die Schildkröte, als sie am schlafenden Hasen vorbeikam?",opts:["Siguió sin perder ni un segundo","La despertó para presumir","Se paró a descansar con ella"],ex:"«…prefirió no perder ni un segundo.»"}]}

{id:"cigarra",icon:"🐜",title:"La cigarra y la hormiga",tt:B("The Ant and the Grasshopper","Ağustos Böceği ile Karınca","Die Grille und die Ameise"),src:"Esopo / La Fontaine",lv:{
A1:{paras:[
{es:"Es verano. Hace sol y calor. La cigarra canta todo el día. La hormiga trabaja mucho y guarda comida en su casa. La cigarra dice: «¡Ven a cantar conmigo!». La hormiga dice: «No, tengo trabajo». Llega el invierno. Hace frío y la cigarra no tiene comida. La hormiga tiene comida para todo el invierno.",
 en:"It's summer. It's sunny and hot. The cicada sings all day. The ant works hard and stores food in her house. The cicada says: “Come and sing with me!” The ant says: “No, I have work to do.” Winter arrives. It's cold and the cicada has no food. The ant has food for the whole winter.",
 tr:"Yaz mevsimi. Hava güneşli ve sıcak. Ağustos böceği bütün gün şarkı söylüyor. Karınca çok çalışıyor ve evinde yiyecek biriktiriyor. Ağustos böceği «Gel, benimle şarkı söyle!» diyor. Karınca «Hayır, işim var» diyor. Kış geliyor. Hava soğuk ve ağustos böceğinin yiyeceği yok. Karıncanın bütün kış yetecek yiyeceği var.",
 de:"Es ist Sommer. Die Sonne scheint und es ist heiß. Die Grille singt den ganzen Tag. Die Ameise arbeitet viel und lagert Essen in ihrem Haus. Die Grille sagt: „Komm, sing mit mir!“ Die Ameise sagt: „Nein, ich habe Arbeit.“ Der Winter kommt. Es ist kalt und die Grille hat nichts zu essen. Die Ameise hat Essen für den ganzen Winter."}],
vocab:[["la cigarra","cicada","ağustos böceği","die Grille"],["la hormiga","ant","karınca","die Ameise"],["guardar","to keep, to store","saklamak, biriktirmek","aufbewahren"],["el invierno","winter","kış","der Winter"]],
quiz:[
{q:"¿Qué hace la cigarra en verano?",en:"What does the cicada do in summer?",tr:"Ağustos böceği yazın ne yapıyor?",de:"Was macht die Grille im Sommer?",opts:["Canta todo el día","Trabaja mucho","Duerme"],ex:"«La cigarra canta todo el día.»"},
{q:"¿Quién tiene comida en invierno?",en:"Who has food in winter?",tr:"Kışın kimin yiyeceği var?",de:"Wer hat im Winter Essen?",opts:["La hormiga","La cigarra","Las dos"],ex:"«La hormiga tiene comida para todo el invierno.»"}]},
A2:{paras:[
{es:"Durante todo el verano, la cigarra se pasó los días cantando al sol. Mientras tanto, la hormiga trabajaba sin descanso: llevaba granos de trigo a su casa, uno a uno, para el invierno. «¿Por qué trabajas tanto? ¡Hace un día precioso!», le decía la cigarra. «Porque el invierno siempre llega», contestaba la hormiga.",
 en:"All summer long, the cicada spent her days singing in the sun. Meanwhile, the ant worked without rest: she carried grains of wheat to her house, one by one, for the winter. “Why do you work so much? It's a beautiful day!” the cicada used to tell her. “Because winter always comes,” the ant would answer.",
 tr:"Bütün yaz boyunca ağustos böceği günlerini güneşte şarkı söyleyerek geçirmiş. Bu arada karınca hiç dinlenmeden çalışıyormuş: kış için buğday tanelerini tek tek evine taşıyormuş. «Neden bu kadar çok çalışıyorsun? Hava çok güzel!» diyormuş ağustos böceği. «Çünkü kış her zaman gelir» diye cevap veriyormuş karınca.",
 de:"Den ganzen Sommer über verbrachte die Grille ihre Tage singend in der Sonne. Unterdessen arbeitete die Ameise ohne Pause: Sie trug Weizenkörner einzeln in ihr Haus, für den Winter. „Warum arbeitest du so viel? Es ist ein wunderschöner Tag!“, sagte die Grille zu ihr. „Weil der Winter immer kommt“, antwortete die Ameise."},
{es:"Llegó el otoño y después el invierno. Empezó a nevar y la cigarra no encontraba nada para comer. Muerta de frío y de hambre, fue a casa de la hormiga y le pidió un poco de comida. La hormiga le preguntó: «¿Qué hiciste tú en verano?». «Cantar», respondió la cigarra. «Pues ahora, baila», dijo la hormiga, y cerró la puerta.",
 en:"Autumn came and then winter. It began to snow and the cicada couldn't find anything to eat. Freezing and starving, she went to the ant's house and asked her for a little food. The ant asked her: “What did you do in the summer?” “I sang,” answered the cicada. “Well, now dance,” said the ant, and closed the door.",
 tr:"Sonbahar, ardından da kış gelmiş. Kar yağmaya başlamış ve ağustos böceği yiyecek hiçbir şey bulamıyormuş. Soğuktan ve açlıktan ölmek üzereyken karıncanın evine gitmiş ve ondan biraz yiyecek istemiş. Karınca ona sormuş: «Sen yazın ne yaptın?» «Şarkı söyledim» diye cevap vermiş ağustos böceği. «O zaman şimdi de dans et» demiş karınca ve kapıyı kapatmış.",
 de:"Der Herbst kam und danach der Winter. Es begann zu schneien, und die Grille fand nichts mehr zu essen. Halb erfroren und halb verhungert ging sie zum Haus der Ameise und bat sie um ein wenig Essen. Die Ameise fragte sie: „Was hast du im Sommer gemacht?“ „Gesungen“, antwortete die Grille. „Dann tanz jetzt“, sagte die Ameise und schloss die Tür."}],
vocab:[["el grano de trigo","grain of wheat","buğday tanesi","das Weizenkorn"],["sin descanso","without rest","hiç dinlenmeden","ohne Pause"],["nevar","to snow","kar yağmak","schneien"],["muerto de hambre","starving","açlıktan ölmek üzere","halb verhungert"]],
quiz:[
{q:"¿Por qué trabajaba tanto la hormiga?",en:"Why did the ant work so much?",tr:"Karınca neden bu kadar çok çalışıyordu?",de:"Warum arbeitete die Ameise so viel?",opts:["Porque el invierno siempre llega","Porque le gustaba el sol","Porque la cigarra se lo pidió"],ex:"«Porque el invierno siempre llega», contestaba la hormiga."},
{q:"¿Qué le dijo la hormiga al final?",en:"What did the ant tell her at the end?",tr:"Karınca sonunda ona ne dedi?",de:"Was sagte die Ameise am Ende?",opts:["Pues ahora, baila","Pasa, hay comida para las dos","Vuelve en primavera"],ex:"«Pues ahora, baila», dijo la hormiga, y cerró la puerta."}]},
B1:{paras:[
{es:"Aquel verano hacía tanto calor que casi todos los insectos del campo preferían descansar a la sombra. Todos menos la hormiga, que desde el amanecer recorría una y otra vez el mismo camino cargando semillas, migas y granos de trigo. La cigarra, subida a una rama, la observaba sin entender nada. «Deberías disfrutar un poco», le aconsejaba entre canción y canción. «La vida es corta y el verano, también».",
 en:"That summer it was so hot that almost all the insects in the countryside preferred to rest in the shade. All except the ant, who from dawn walked the same path again and again carrying seeds, crumbs and grains of wheat. The cicada, perched on a branch, watched her without understanding anything. “You should enjoy yourself a little,” she advised her between songs. “Life is short, and so is summer.”",
 tr:"O yaz hava o kadar sıcakmış ki tarladaki böceklerin neredeyse hepsi gölgede dinlenmeyi tercih ediyormuş. Karınca hariç; o, şafaktan itibaren tohum, kırıntı ve buğday taneleri taşıyarak aynı yolu tekrar tekrar gidip geliyormuş. Bir dala tünemiş olan ağustos böceği hiçbir şey anlamadan onu izliyormuş. «Biraz keyfini çıkarmalısın» diye öğüt veriyormuş şarkılarının arasında. «Hayat kısa, yaz da öyle.»",
 de:"In jenem Sommer war es so heiß, dass fast alle Insekten auf dem Land lieber im Schatten ruhten. Alle außer der Ameise, die seit dem Morgengrauen immer wieder denselben Weg lief und Samen, Krümel und Weizenkörner schleppte. Die Grille saß auf einem Ast und beobachtete sie, ohne etwas zu verstehen. „Du solltest das Leben ein bisschen genießen“, riet sie ihr zwischen zwei Liedern. „Das Leben ist kurz, und der Sommer auch.“"},
{es:"La hormiga le respondía sin detenerse: «Precisamente porque el verano es corto, tengo que aprovecharlo. Tú también deberías guardar algo para el invierno». Pero la cigarra se reía y volvía a cantar. Los días pasaron, las hojas de los árboles se volvieron amarillas y un viento helado empezó a soplar desde las montañas. Una mañana, el campo amaneció cubierto de nieve y la cigarra se dio cuenta de que no tenía nada que comer.",
 en:"The ant answered her without stopping: “Precisely because summer is short, I have to make the most of it. You should also save something for the winter.” But the cicada laughed and started singing again. The days went by, the leaves on the trees turned yellow and an icy wind began to blow from the mountains. One morning, the countryside woke up covered in snow and the cicada realised she had nothing to eat.",
 tr:"Karınca durmadan ona cevap veriyormuş: «Yaz kısa olduğu için tam da bundan yararlanmam gerekiyor. Sen de kış için bir şeyler biriktirmelisin.» Ama ağustos böceği gülüp yeniden şarkı söylemeye başlıyormuş. Günler geçmiş, ağaçların yaprakları sararmış ve dağlardan buz gibi bir rüzgâr esmeye başlamış. Bir sabah tarla karla kaplı uyanmış ve ağustos böceği yiyecek hiçbir şeyi olmadığını fark etmiş.",
 de:"Die Ameise antwortete, ohne stehen zu bleiben: „Gerade weil der Sommer kurz ist, muss ich ihn nutzen. Du solltest auch etwas für den Winter aufheben.“ Doch die Grille lachte und sang weiter. Die Tage vergingen, die Blätter der Bäume wurden gelb, und von den Bergen her begann ein eisiger Wind zu wehen. Eines Morgens war das Land mit Schnee bedeckt, und die Grille merkte, dass sie nichts zu essen hatte."},
{es:"Temblando, llamó a la puerta del hormiguero. «Querida vecina, ¿podrías prestarme unos granos? Te los devolveré en primavera». La hormiga, que no era muy generosa con quien no había querido escucharla, le preguntó qué había hecho durante todo el verano. «Cantaba para alegraros a todos», contestó la cigarra. «¿Cantabas? Me parece muy bien», respondió la hormiga. «Entonces, ahora baila». Y le cerró la puerta.",
 en:"Shivering, she knocked on the door of the anthill. “Dear neighbour, could you lend me a few grains? I'll pay you back in spring.” The ant, who wasn't very generous with those who hadn't wanted to listen to her, asked what she had done all summer. “I sang to cheer you all up,” replied the cicada. “You sang? Very well,” answered the ant. “Then now, dance.” And she shut the door on her.",
 tr:"Titreyerek karınca yuvasının kapısını çalmış. «Sevgili komşum, bana birkaç tane ödünç verebilir misin? İlkbaharda geri veririm.» Kendisini dinlemek istemeyenlere karşı pek cömert olmayan karınca, ona bütün yaz ne yaptığını sormuş. «Hepinizi neşelendirmek için şarkı söylüyordum» diye cevap vermiş ağustos böceği. «Şarkı mı söylüyordun? Çok güzel» demiş karınca. «O zaman şimdi de dans et.» Ve kapıyı yüzüne kapatmış.",
 de:"Zitternd klopfte sie an die Tür des Ameisenhaufens. „Liebe Nachbarin, könntest du mir ein paar Körner leihen? Ich gebe sie dir im Frühling zurück.“ Die Ameise, die nicht sehr großzügig mit denen war, die nicht auf sie hatten hören wollen, fragte sie, was sie den ganzen Sommer über gemacht habe. „Ich habe gesungen, um euch alle zu erfreuen“, antwortete die Grille. „Du hast gesungen? Sehr schön“, erwiderte die Ameise. „Dann tanz jetzt.“ Und sie schlug ihr die Tür vor der Nase zu."}],
vocab:[["el amanecer","dawn","şafak","das Morgengrauen"],["la miga","crumb","kırıntı","der Krümel"],["helado","icy, freezing","buz gibi","eisig"],["prestar","to lend","ödünç vermek","leihen"]],
quiz:[
{q:"¿Qué le aconsejaba la cigarra a la hormiga?",en:"What did the cicada advise the ant?",tr:"Ağustos böceği karıncaya ne öğüt veriyordu?",de:"Was riet die Grille der Ameise?",opts:["Que disfrutara un poco","Que trabajara más","Que se fuera a la montaña"],ex:"«Deberías disfrutar un poco», le aconsejaba…"},
{q:"¿Qué le pidió la cigarra a la hormiga?",en:"What did the cicada ask the ant for?",tr:"Ağustos böceği karıncadan ne istedi?",de:"Worum bat die Grille die Ameise?",opts:["Que le prestara unos granos","Que cantara con ella","Que le dejara dormir en su casa"],ex:"«¿Podrías prestarme unos granos? Te los devolveré en primavera.»"},
{q:"¿Cómo se dio cuenta la cigarra de que tenía un problema?",en:"How did the cicada realise she had a problem?",tr:"Ağustos böceği bir sorunu olduğunu nasıl fark etti?",de:"Wie merkte die Grille, dass sie ein Problem hatte?",opts:["El campo amaneció cubierto de nieve","La hormiga se lo dijo","Perdió la voz"],ex:"«…el campo amaneció cubierto de nieve y la cigarra se dio cuenta de que no tenía nada que comer.»"}]},
B2:{paras:[
{es:"Dicen las fábulas que, en un verano especialmente caluroso, una cigarra se había instalado en lo alto de un olivo y no paraba de cantar desde que salía el sol hasta que se ponía. Para ella, cada día era una fiesta, y no concebía que nadie pudiera desperdiciar aquel tiempo maravilloso haciendo algo tan aburrido como trabajar. A sus pies, sin embargo, una hilera interminable de hormigas iba y venía, cargando provisiones con una disciplina casi militar.",
 en:"The fables say that, in an especially hot summer, a cicada had settled at the top of an olive tree and didn't stop singing from sunrise to sunset. For her, every day was a party, and she couldn't conceive that anyone could waste that wonderful time doing something as boring as working. At her feet, however, an endless line of ants came and went, carrying provisions with almost military discipline.",
 tr:"Fabllar anlatır ki özellikle sıcak geçen bir yaz bir ağustos böceği bir zeytin ağacının tepesine yerleşmiş ve güneş doğduğundan batana kadar durmadan şarkı söylüyormuş. Onun için her gün bir bayrammış ve birinin o harika zamanı çalışmak gibi sıkıcı bir şeyle harcayabileceğini aklı almıyormuş. Ne var ki ayaklarının dibinde bitmek bilmeyen bir karınca dizisi neredeyse askerî bir disiplinle erzak taşıyarak gidip geliyormuş.",
 de:"Die Fabeln erzählen, dass sich in einem besonders heißen Sommer eine Grille ganz oben auf einem Olivenbaum niedergelassen hatte und von Sonnenaufgang bis Sonnenuntergang ununterbrochen sang. Für sie war jeder Tag ein Fest, und sie konnte sich nicht vorstellen, dass jemand diese wunderbare Zeit mit etwas so Langweiligem wie Arbeit vergeuden könnte. Zu ihren Füßen jedoch kam und ging eine endlose Reihe von Ameisen, die mit fast militärischer Disziplin Vorräte schleppten."},
{es:"Una de ellas, más charlatana que las demás, se detuvo un instante a recuperar el aliento. La cigarra aprovechó para burlarse: «¿No os cansáis de vivir como esclavas? El invierno queda muy lejos». La hormiga, sin perder la compostura, le contestó que precisamente por eso era el momento de prepararse, y le sugirió que guardara al menos unas cuantas semillas. La cigarra soltó una carcajada y siguió con su concierto, convencida de que siempre habría algo que llevarse a la boca.",
 en:"One of them, more talkative than the others, stopped for a moment to catch her breath. The cicada took the opportunity to mock her: “Don't you get tired of living like slaves? Winter is a long way off.” The ant, without losing her composure, replied that this was exactly why it was the time to prepare, and suggested she save at least a few seeds. The cicada burst out laughing and carried on with her concert, convinced that there would always be something to eat.",
 tr:"İçlerinden diğerlerinden daha geveze olan biri soluklanmak için bir an durmuş. Ağustos böceği bunu fırsat bilip alay etmiş: «Köle gibi yaşamaktan yorulmuyor musunuz? Kış daha çok uzak.» Karınca soğukkanlılığını hiç bozmadan, tam da bu yüzden hazırlanma zamanının şimdi olduğunu söylemiş ve hiç değilse birkaç tohum saklamasını önermiş. Ağustos böceği kahkahayı basmış ve ağzına koyacak bir şeyin her zaman olacağından emin, konserine devam etmiş.",
 de:"Eine von ihnen, gesprächiger als die anderen, blieb einen Moment stehen, um Luft zu holen. Die Grille nutzte die Gelegenheit, um zu spotten: „Werdet ihr es nicht leid, wie Sklavinnen zu leben? Der Winter ist noch weit weg.“ Die Ameise antwortete, ohne die Fassung zu verlieren, dass gerade deshalb jetzt die Zeit sei, sich vorzubereiten, und schlug ihr vor, wenigstens ein paar Samen aufzuheben. Die Grille lachte laut auf und setzte ihr Konzert fort, überzeugt, dass es immer etwas zu essen geben würde."},
{es:"Pero el verano, como todo, llegó a su fin. Los días se acortaron, las lluvias de otoño arrasaron con las últimas flores y, cuando quiso darse cuenta, la cigarra se encontró sola, entumecida de frío y con el estómago vacío. Recorrió el campo helado en busca de algo que comer, sin éxito, hasta que recordó a la hormiga habladora. Se tragó el orgullo y llamó a su puerta, decidida a pedirle ayuda aunque tuviera que suplicar.",
 en:"But summer, like everything else, came to an end. The days grew shorter, the autumn rains swept away the last flowers and, before she knew it, the cicada found herself alone, numb with cold and with an empty stomach. She roamed the frozen countryside looking for something to eat, without success, until she remembered the talkative ant. She swallowed her pride and knocked on her door, determined to ask for help even if she had to beg.",
 tr:"Ama yaz da her şey gibi sona ermiş. Günler kısalmış, sonbahar yağmurları son çiçekleri de silip süpürmüş ve ağustos böceği daha ne olduğunu anlamadan kendini yalnız, soğuktan kaskatı kesilmiş ve aç karnına bulmuş. Donmuş tarlada yiyecek bir şey bulmak için dolaşmış ama bulamamış, ta ki o geveze karıncayı hatırlayana kadar. Gururunu bir kenara bırakmış ve yalvarması gerekse bile yardım istemeye kararlı bir şekilde onun kapısını çalmış.",
 de:"Doch der Sommer ging, wie alles, zu Ende. Die Tage wurden kürzer, die Herbstregen spülten die letzten Blumen fort, und ehe sie sich's versah, fand sich die Grille allein, steif vor Kälte und mit leerem Magen wieder. Sie streifte erfolglos über die gefrorenen Felder auf der Suche nach etwas Essbarem, bis sie sich an die gesprächige Ameise erinnerte. Sie schluckte ihren Stolz hinunter und klopfte an deren Tür, fest entschlossen, um Hilfe zu bitten, auch wenn sie betteln müsste."},
{es:"La hormiga la escuchó en silencio y luego le preguntó qué había hecho mientras los demás trabajaban. «Cantaba noche y día, para alegrar el campo», respondió la cigarra con un hilo de voz. «Pues ya que cantabas en verano, baila ahora en invierno», sentenció la hormiga antes de cerrar la puerta. Hay quien considera cruel este final; otros creen que la lección es justa. Sea como sea, la fábula nos recuerda que la previsión de hoy evita muchas lágrimas mañana.",
 en:"The ant listened to her in silence and then asked her what she had done while the others were working. “I sang night and day, to cheer up the countryside,” the cicada answered in a faint voice. “Well, since you sang in summer, dance now in winter,” the ant declared before closing the door. Some consider this ending cruel; others think the lesson is fair. Either way, the fable reminds us that foresight today saves many tears tomorrow.",
 tr:"Karınca onu sessizce dinlemiş, sonra başkaları çalışırken onun ne yaptığını sormuş. «Tarlayı neşelendirmek için gece gündüz şarkı söylüyordum» diye cılız bir sesle cevap vermiş ağustos böceği. «Madem yazın şarkı söyledin, şimdi kışın da dans et» diye hükmünü vermiş karınca ve kapıyı kapatmış. Bu sonu acımasız bulanlar var; dersin yerinde olduğunu düşünenler de. Her halükârda fabl bize bugünkü öngörünün yarın birçok gözyaşını önlediğini hatırlatır.",
 de:"Die Ameise hörte ihr schweigend zu und fragte sie dann, was sie getan habe, während die anderen arbeiteten. „Ich habe Tag und Nacht gesungen, um das Land zu erfreuen“, antwortete die Grille mit dünner Stimme. „Nun, da du im Sommer gesungen hast, tanz jetzt im Winter“, urteilte die Ameise und schloss die Tür. Manche halten dieses Ende für grausam, andere finden die Lehre gerecht. Wie dem auch sei, die Fabel erinnert uns daran, dass Vorsorge heute viele Tränen morgen erspart."}],

{q:"¿Qué le sugirió la hormiga a la cigarra?",en:"What did the ant suggest to the cicada?",tr:"Karınca ağustos böceğine ne önerdi?",de:"Was schlug die Ameise der Grille vor?",opts:["Que guardara al menos unas semillas","Que cantara más bajo","Que se mudara a otro árbol"],ex:"«…le sugirió que guardara al menos unas cuantas semillas.»"},
{q:"¿Qué dice el texto sobre el final de la fábula?",en:"What does the text say about the ending of the fable?",tr:"Metin fablın sonu hakkında ne diyor?",de:"Was sagt der Text über das Ende der Fabel?",opts:["Unos lo consideran cruel y otros, justo","Todos piensan que es justo","Que la hormiga se arrepintió"],ex:"«Hay quien considera cruel este final; otros creen que la lección es justa.»"}]}
