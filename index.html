<!DOCTYPE html>
<html lang="en">

<meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
<style>
#installHint{max-width:980px;margin:12px auto 0;padding:0 18px}
#installHint .card{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:14px;background:var(--gold-soft)}
#installHint .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--muted);padding:4px 8px}
#installHint svg{flex:none;vertical-align:-3px}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1b16; --muted:#6b645a; --line:#e8e1d6;
  --accent:#c8102e; --accent-soft:#fbe9ec; --gold:#e0a400; --gold-soft:#fdf4d8;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c0392b; --bad-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(60,40,20,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15120f; --card:#201b16; --ink:#f3ede4; --muted:#a59c8f; --line:#3a322a;
    --accent:#ff5a6e; --accent-soft:#3a1b20; --gold:#f2c14e; --gold-soft:#3a3018;
    --ok:#4fd18a; --ok-soft:#173326; --bad:#ff7a6b; --bad-soft:#3b1d19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 80px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink)}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent) 0 50%,var(--gold) 50% 100%)}
.langsel{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
nav.tabs a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:#fff}
.hero{padding:34px 0 18px}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tcard{padding:18px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;text-decoration:none;color:inherit}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:19px}
.tcard .ex{font-family:Fraunces,serif;color:var(--accent);font-size:15px}
.tcard .sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.back{background:none;border:none;color:var(--muted);font-weight:600;padding:18px 0 6px;display:inline-flex;gap:6px}
.lhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between;padding-bottom:14px}
.lhead h1{font-size:32px}
.lhead .short{font-family:Fraunces,serif;color:var(--accent);font-size:18px}
.analog{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.sec{margin:22px 0}
.sec>h2{font-size:22px;margin-bottom:10px}
.intro{font-size:17px;padding:18px 20px}
table.conj{border-collapse:collapse;width:100%;font-size:15px}
table.conj th,table.conj td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.conj th{font-size:13px;color:var(--muted);font-weight:600}
table.conj td:first-child{color:var(--muted);font-size:14px;width:150px}
table.conj b{color:var(--accent)}
.tblwrap{overflow-x:auto;padding:6px 14px}
.irr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.irr .card{padding:14px 16px}
.irr h4{margin:0 0 4px;font-size:14px;color:var(--accent)}
.irr p{margin:0;font-size:15px}
.use{padding:16px 18px;margin-bottom:10px}
.use h3{font-size:17px;font-family:Inter,sans-serif;font-weight:700}
.use .d{color:var(--muted);margin:2px 0 8px;font-size:15px}
.exrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.exrow .es{font-weight:600;font-size:16px}
.exrow .tr,.tl{color:var(--muted);font-size:14px}
.qtrans .tl{font-size:15px}
.face .small{color:var(--muted)}
.fixlang{font-size:13px;font-weight:700;color:var(--muted);margin-left:auto}
.spk{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:14px}
.spk:hover{border-color:var(--accent)}
.tip{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r);padding:14px 18px;margin-bottom:10px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.quiz{padding:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
.qprompt{font-size:22px;font-weight:600;margin:16px 0 4px;font-family:Fraunces,serif}
.qprompt .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.qhint{color:var(--accent);font-weight:700}
.qtrans{color:var(--muted);font-size:15px;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.tin{flex:1;min-width:200px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px}
.tin:focus{outline:none;border-color:var(--accent)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)}
.tin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:34px;font-weight:600}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .full{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600}
.qfoot{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center;padding:30px 22px}
.result .big{font-family:Fraunces,serif;font-size:56px;font-weight:700;color:var(--accent)}
.revlist{text-align:left;margin:18px 0}
.revlist div{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-width:220px}
.plist .prow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:none}
.prow .es{font-weight:600;font-size:17px}
.prow .m{color:var(--muted);font-size:14px}
.prow .cat{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.flash{perspective:1200px;max-width:560px;margin:0 auto}
.fcard{position:relative;height:240px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.face.b{transform:rotateY(180deg);background:var(--gold-soft)}
.face .big{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.fmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:10px 4px}
.drill{padding:26px;text-align:center}
.drill .verb{font-family:Fraunces,serif;font-size:42px;font-weight:700}
.drill .mean{color:var(--muted)}
.drill .tags{display:flex;gap:8px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.drill .tags .pill{font-size:14px;padding:6px 12px}
.drill .inrow{max-width:520px;margin:0 auto}
.drill .keys{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px 16px}
.stat .n{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.settings{padding:16px 18px;margin-bottom:14px}
.settings .lab{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.settings label.ck{display:flex;gap:8px;align-items:center;font-size:15px}
.prog .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.prog .row:first-child{border-top:none}
.prog .row .nm{flex:1;font-weight:600;color:inherit;text-decoration:none}
.prog .row .bar{width:120px;margin:0}
.prog .row .pc{width:46px;text-align:right;font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{padding:22px;max-width:380px}
.muted{color:var(--muted)}
.mt{margin-top:14px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:19px}
.pcard p{margin:0;color:var(--muted);font-size:15px}
.pcard .chips{margin:0}
.pcard .btn{align-self:flex-start}
.ai{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.field select,.field input{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:15px;color:var(--ink)}
.frow{display:flex;gap:10px;flex-wrap:wrap}.frow .field{flex:1;min-width:110px}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.story{overflow:hidden}
.rpara{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px 20px;border-top:1px solid var(--line)}
.rpara:first-child{border-top:none}
.rpara:hover{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.rpara .es{font-size:17px;line-height:1.75;display:flex;gap:10px;align-items:flex-start}
.rpara .tl2{color:var(--muted);font-size:16px;line-height:1.75}
.rpara.single{grid-template-columns:1fr;cursor:pointer}
.rpara.hide .tl2{display:none}
.rpara.hide.open .tl2{display:block;padding-left:42px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpgrid .story.other{opacity:.85}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;bottom:24px;transform:translateY(160%);max-width:560px;box-sizing:border-box;background:#1f1b16;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s ease;z-index:200}
.toast.show{transform:translateY(0)}
.toast span{flex:1}
.toast button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:0 2px}
@media (max-width:720px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.vbox{padding:16px 18px}
.deep{padding:0;margin-bottom:12px;overflow:hidden}
.deep summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.deep summary::-webkit-details-marker{display:none}
.deep summary::after{content:"+";color:var(--muted);font-weight:400;font-size:22px;line-height:1}
.deep[open] summary::after{content:"−"}
.deep .dbody{padding:0 18px 16px}
.dtext{overflow-x:auto}
.dtext p{margin:0 0 10px}
.dtext ul,.dtext ol{margin:0 0 10px;padding-left:22px}
.dtext li{margin:5px 0}
.dt{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0 12px}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.dt th{font-size:13px;color:var(--muted);font-weight:600}
.hi-i{background:rgba(59,130,246,.17);border-radius:5px;padding:0 3px}
.hi-d{background:rgba(234,88,12,.2);border-radius:5px;padding:0 3px}
.hi-p{background:rgba(22,163,74,.2);border-radius:5px;padding:0 3px}
.hi-s{background:rgba(147,51,234,.17);border-radius:5px;padding:0 4px;font-weight:700}
.hi-e{background:rgba(13,148,136,.2);border-radius:5px;padding:0 4px;font-weight:700}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sighead{display:inline-block;font-weight:700;margin-bottom:6px;padding:1px 8px}
.sigw{font-size:14.5px;line-height:1.75}
.pair{border-top:1px dashed var(--line);padding:6px 0 10px}
.pair:first-child{border-top:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pgrid .exrow{border-top:0}
.why{color:var(--muted);font-size:14px;margin-top:2px}
.ghead{font-weight:600;margin:12px 0 2px}
.mist{border-top:1px dashed var(--line);padding:10px 0}
.mist:first-child{border-top:0}
.mist .bad{color:var(--muted)}
.mist .bad s{text-decoration-color:#c8102e}
.mist .lab{font-size:12px;font-weight:700;margin-right:4px}
.mist .bad .lab{color:#c8102e}
.mist .good{font-weight:600;margin-top:2px}
.mist .good .lab{color:#15803d}
.mist .good .spk{vertical-align:middle;margin-left:4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px}
.legend span{padding:2px 8px}
.story-es{font-size:17px;line-height:1.8;margin-bottom:4px}
#deep{scroll-margin-top:90px}
.deepjump{margin-top:10px;font-size:15px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.pill.deepb{background:color-mix(in srgb,var(--gold) 22%,transparent)}
@media (max-width:640px){.sigs,.pgrid{grid-template-columns:1fr;gap:0}.sigcol{margin-bottom:10px}}
.vbox select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#ddd);font:inherit;background:var(--card,#fff);color:inherit;margin:6px 0 10px}
.vbox .vcur{font-weight:600}
.lvlab{padding:12px 20px 0;display:flex;gap:8px;align-items:center}
@media (max-width:760px){.cmpgrid{grid-template-columns:1fr}}
.lvchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lvchip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg)}
.lvchip:hover{border-color:var(--accent)}
.lvchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ccard{cursor:default}
.ccard:hover{transform:none}
.tw{cursor:pointer;border-radius:4px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.tw:hover{background:var(--gold-soft)}
.tw.saved{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.tw.sel{background:var(--accent);color:#fff;text-decoration:none}
.pbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(560px,calc(100% - 24px));z-index:40;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.shead{display:flex;align-items:flex-start;gap:10px}
.shead .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
.sword{font-family:Fraunces,serif;font-size:24px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sprev{font-weight:600;min-height:1em}
.sctx{color:var(--muted);font-size:14px;font-style:italic}
.btn.sm{padding:8px 12px;font-size:14px}
.sheet .btns{align-items:center}
@media (max-width:760px){.sheet{bottom:calc(76px + env(safe-area-inset-bottom))}}
.wrow{color:inherit;text-decoration:none}
.wrow:hover{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.wdots{margin-left:auto;color:var(--accent);font-size:12px;letter-spacing:1px;white-space:nowrap}
.wdots.big{font-size:15px}
.wcard{padding:20px 22px}
.whead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.wword{font-size:32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;word-break:break-word}
.wsec{margin-top:18px;display:flex;flex-direction:column;gap:6px}

.wsec p{margin:0}
.wmean{font-size:17px;font-weight:600}
textarea.note{width:100%;min-height:70px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:var(--ink);resize:vertical}
.exportbox{padding:14px 18px;display:flex;flex-direction:column;gap:10px}

.exportbox p{margin:6px 0}
.linkish{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
table.vocab td:first-child{width:auto;color:var(--ink)}
@media (max-width:700px){.rpara{grid-template-columns:1fr;gap:6px}.rpara .tl2{padding-left:42px}}
nav.tabs a .ti{display:none}
.topin{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border:none;border-top:1px solid var(--line);border-radius:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:visible}

  nav.tabs a .tlab{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim();
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const pct=n=>n===null?"—":t("pct",n);
const PERS=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ustedes"];
let voices=[];
const canSpeak="speechSynthesis" in window;
/* iOS Safari ignores utterance.lang unless a voice is set explicitly, and getVoices() is often empty at page load.
   So: refresh the voice list on every call, pick a Spanish voice, and always set utterance.voice. */
const vlang=v=>(v.lang||"").replace("_","-");
const NOVELTY_V=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
const GOOD_ES_V=/(M[oó]nica|Marisol|Jorge|Paulina|Juan|Google español|Elvira|[AÁ]lvaro|Helena|Laura|Pablo|Luc[ií]a|Dalia|Jimena)/i;
function loadVoices(){if(!canSpeak)return voices;try{const v=speechSynthesis.getVoices();if(v&&v.length)voices=v;}catch(e){}return voices;}
const esVoices=()=>loadVoices().filter(v=>/^es\b/i.test(vlang(v)));
function rankV(v){const l=vlang(v).toLowerCase();let r=l==="es-es"?100:50;if(GOOD_ES_V.test(v.name))r+=20;if(NOVELTY_V.test(v.name))r-=60;if(v.localService)r+=5;return r;}
const vkey=v=>v.voiceURI||v.name;
const badV=new Set(); /* voices that never started speaking in this session */
function esCandidates(){const list=esVoices().slice().sort((a,b)=>rankV(b)-rankV(a));const want=store.settings&&store.settings.voice;if(want){const i=list.findIndex(v=>vkey(v)===want||v.name===want);if(i>0)list.unshift(list.splice(i,1)[0]);}return list.filter(v=>!badV.has(vkey(v)));}
/* if every Spanish voice has failed this session (e.g. phone was on silent), forget the failures and start over rather than use a non-Spanish voice */
function esCands(){let c=esCandidates();if(!c.length&&esVoices().length){badV.clear();c=esCandidates();}return c;}
function pickEs(){return esCands()[0]||null;}
/* iOS: let page audio play like media (not tied to the ring/silent switch) where Safari supports the AudioSession API */
function audioPlayback(){try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback";}catch(e){}}
if(canSpeak){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices);}catch(e){try{speechSynthesis.onvoiceschanged=loadVoices;}catch(_){}}[300,1000,3000].forEach(ms=>setTimeout(loadVoices,ms));}
let voiceWarned=false;
const T0=Date.now();
function warnNoVoice(){if(voiceWarned||(!voices.length&&Date.now()-T0<2500))return;voiceWarned=true;toast(`${t("noEsVoice")} <a href="#progress" onclick="setTimeout(()=>{const b=document.getElementById('vbox');b&&b.scrollIntoView({block:'center'});},300)" style="color:#ffd27a">${t("voiceFix")}</a>`,12000);}
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent||"")||(/Macintosh/.test(navigator.userAgent||"")&&navigator.maxTouchPoints>1);
function platformHelp(){
  const ua=navigator.userAgent||"";
  const ios=isIOS();
  let h=ios?t("voiceHelpIOS"):/Android/.test(ua)?t("voiceHelpAndroid"):/Windows/.test(ua)?t("voiceHelpWin"):/Macintosh/.test(ua)?t("voiceHelpMac"):t("voiceHelpOther");
  if(!ios&&/Firefox\//.test(ua))h+=" "+t("voiceHelpFF");
  if(/Electron\//.test(ua))h+=" "+t("voiceHelpApp");
  return h;
}
function mkUtt(s,rate){
  const u=new SpeechSynthesisUtterance(s.replace(/_+/g," "));
  const v=pickEs();
  if(v){u.voice=v;u.lang=vlang(v);}else{u.lang="es-ES";warnNoVoice();}
  u.rate=rate||.92;return u;
}
let speakSeq=0;
/* Speak with the best Spanish voice. If a voice never starts (error, or silence after 2.5 s), try the next Spanish voice.
   Never fall back to a non-Spanish voice once Spanish voices exist. onStatus(state, voice, info) reports progress. */
function speak(s,onStatus){
  if(!canSpeak)return;
  audioPlayback();
  const seq=++speakSeq,st=(...a)=>{if(seq===speakSeq&&onStatus)try{onStatus(...a);}catch(e){}};
  const text=s.replace(/_+/g," ");
  const go=(cands,first)=>{
    const v=cands[0]||null;
    if(!v&&!first){st("fail");toast(t("voiceFail"),9000);return;}
    const u=new SpeechSynthesisUtterance(text);u.rate=.92;
    if(v){u.voice=v;u.lang=vlang(v);}else{u.lang="es-ES";warnNoVoice();}
    let started=false,moved=false;
    const next=why=>{if(moved||seq!==speakSeq)return;moved=true;badV.add(vkey(v));st("retry",v,why);try{speechSynthesis.cancel();}catch(e){}go(cands.slice(1),false);};
    u.onstart=()=>{started=true;st("start",v);};
    u.onend=()=>st("end",v);
    u.onerror=e=>{const code=e&&e.error;if(code==="interrupted"||code==="canceled")return;if(v&&!started)next(code||"error");else st("error",v,code);};
    try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){st("error",v,String(e));}
    if(v)setTimeout(()=>{if(seq!==speakSeq||started||moved)return;if(speechSynthesis.speaking){started=true;return;}next("timeout");},2500);
  };
  go(esCands(),true);
}
function toast(msg,ms){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el);}el.innerHTML=`<span>${msg}</span><button aria-label="close">✕</button>`;el.classList.add("show");el.querySelector("button").onclick=()=>el.classList.remove("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),ms||5000);}
const spk=s=>canSpeak?`<button class="spk" title="▶" data-say="${esc(s)}">🔊</button>`:"";
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();e.stopPropagation();speak(b.dataset.say);}});

function endTable(sets){
  const head=`<tr><th></th>${sets.map(s=>`<th>${s[0]}</th>`).join("")}</tr>`;
  const rows=PERS.map((p,i)=>`<tr><td>${p}</td>${sets.map(s=>`<td>${s[1]}<b>${s[2][i]}</b></td>`).join("")}</tr>`).join("");
  return `<div class="card tblwrap"><table class="conj">${head}${rows}</table></div>`;
}
function fullTable(sets){
  const head=`<tr><th></th>${sets.map(s=>`<th>${s[0]}</th>`).join("")}</tr>`;
  const rows=PERS.map((p,i)=>`<tr><td>${p}</td>${sets.map(s=>`<td>${s[1][i]}</td>`).join("")}</tr>`).join("");
  return `<div class="card tblwrap"><table class="conj">${head}${rows}</table></div>`;
}

{id:"imperfecto",title:"Pretérito imperfecto",short:"hablaba",lvl:"A2",sub:B("Habits, descriptions, background","Alışkanlık, betimleme, arka plan"),analog:B("used to / would / was -ing","-ırdı / -ıyordu"),
intro:B("Used for past situations that were <b>habitual</b>, <b>ongoing</b> or that <b>describe the background</b>. When it started or ended doesn't matter. In English it usually maps to <b>used to / would</b> (habits) or <b>was/were + -ing</b> (ongoing actions).",
"Geçmişte <b>alışkanlık haline gelmiş</b>, <b>devam eden</b> ya da <b>arka planı betimleyen</b> durumlar için kullanılır. Ne zaman başlayıp bittiği önemli değildir. Türkçedeki <b>-ırdı / -ıyordu</b> ekine, İngilizcedeki <b>used to / was -ing</b> yapısına çok benzer."),
forms:[
 [B("Conjugation","Çekim"), endTable([["-AR · hablar","habl",["aba","abas","aba","ábamos","abais","aban"]],["-ER · comer","com",["ía","ías","ía","íamos","íais","ían"]],["-IR · vivir","viv",["ía","ías","ía","íamos","íais","ían"]]])],
 [B("Only 3 irregular verbs","Sadece 3 düzensiz fiil"), irr([["ser","era, eras, era, éramos, erais, eran"],["ir","iba, ibas, iba, íbamos, ibais, iban"],["ver","veía, veías, veía, veíamos, veíais, veían"]])]
],
uses:[
 {t:B("Past habits","Geçmişteki alışkanlıklar"),d:"siempre, todos los días, a menudo, antes, de niño…",ex:[["De niño, jugaba al fútbol todos los días.","As a kid, I used to play football every day.","Çocukken her gün futbol oynardım."],["Antes vivía en Ankara.","I used to live in Ankara.","Eskiden Ankara'da yaşardım."]]},
 {t:B("Descriptions","Betimleme"),d:B("People, places, weather, feelings.","İnsanlar, yerler, hava, duygular."),ex:[["La casa era grande y tenía un jardín.","The house was big and had a garden.","Ev büyüktü ve bahçesi vardı."],["Hacía frío y estaba cansado.","It was cold and I was tired.","Hava soğuktu ve yorgundum."]]},
 {t:B("Time and age","Saat ve yaş"),d:B("In the past, the time of day and someone's age as background take the imperfecto. (A birthday is an event: <i>Ayer cumplí 30 años</i>.)","Geçmişte arka plan olarak saat ve yaş imperfecto ile söylenir. (Yaş günü ise bir olaydır: <i>Ayer cumplí 30 años</i>, Dün 30 yaşıma girdim.)"),ex:[["Eran las ocho.","It was eight o'clock.","Saat sekizdi."],["Cuando tenía diez años…","When I was ten…","On yaşındayken…"]]},
 {t:B("Ongoing action (background)","Devam eden eylem (arka plan)"),d:B("An action in progress while something else happens.","Başka bir şey olurken süren eylem."),ex:[["Mientras yo cocinaba, ella veía la tele.","While I was cooking, she was watching TV.","Ben yemek yaparken o televizyon izliyordu."]]},
 {t:B("Polite requests","Kibar rica"),d:B("Softer than quiero.","Quiero'dan daha yumuşak bir ifade."),ex:[["Quería un café, por favor.","I'd like a coffee, please.","Bir kahve rica edecektim."]]}
],
tips:[B("If English says <b>used to / would / was -ing</b>, it's usually imperfecto. If it's a finished one-off event in the <b>simple past</b>, it's usually indefinido.","Türkçede <b>-ırdı / -ıyordu</b> diyorsan genelde imperfecto, <b>-dı</b> diyorsan ve eylem tek bir bitmiş olaysa genelde indefinido gerekir."),
B("yo and él share the same form (hablaba), so say the subject when needed.","yo ve él aynı çekimi alır (hablaba), bu yüzden gerekirse özneyi söyle.")],
quiz:[
 {q:"De niño, ___ mucho chocolate.",h:"comer, yo",en:"As a kid I used to eat a lot of chocolate.",tr:"Çocukken çok çikolata yerdim.",a:["comía"],ex:B("A habit, so imperfecto: comía.","Alışkanlık, o yüzden imperfecto: comía.")},
 {q:"Cuando ___ en Ankara, trabajaba mucho.",h:"vivir, yo",en:"When I lived in Ankara, I worked a lot.",tr:"Ankara'da yaşarken çok çalışırdım.",a:["vivía"],ex:B("An ongoing situation in the past: vivía.","Geçmişteki süregelen durum: vivía.")},
 {q:"___ las diez de la noche.",h:"ser",en:"It was ten at night.",tr:"Saat gece onu.",opts:["Eran","Fueron","Son"],ex:B("Telling the time in the past uses the imperfecto: Eran.","Geçmişte saat söylerken imperfecto kullanılır: Eran.")},
 {q:"Nosotros ___ a la playa cada verano.",h:"ir",en:"We used to go to the beach every summer.",tr:"Her yaz plaja giderdik.",a:["íbamos"],ex:B("ir is irregular: íbamos.","ir düzensizdir: íbamos.")},
 {q:"Mi abuela ___ muy simpática.",h:"ser",en:"My grandmother was very nice.",tr:"Babaannem çok sevimliydi.",opts:["era","fue","es"],ex:B("Describing character, so imperfecto.","Karakter betimlemesi, o yüzden imperfecto.")},
 {q:"Antes no ___ la tele.",h:"ver, yo",en:"I didn't use to watch TV.",tr:"Eskiden televizyon izlemezdim.",a:["veía"],ex:B("ver is irregular: veía.","ver düzensizdir: veía.")},
 {q:"Mientras tú ___, yo limpiaba.",h:"dormir",en:"While you were sleeping, I was cleaning.",tr:"Sen uyurken ben temizlik yapıyordum.",opts:["dormías","dormiste","durmiste"],ex:B("“mientras” shows two actions going on at the same time, so both are imperfecto.","“mientras” aynı anda devam eden iki eylemi gösterir, o yüzden ikisi de imperfecto.")}
]},

{id:"contraste",title:B("Indefinido or imperfecto?","Indefinido mu, imperfecto mu?"),short:"dormía cuando sonó",lvl:"A2",sub:B("Scene and event","Sahne ve olay"),analog:B("was -ing ↔ simple past","-ıyordu ↔ -dı"),
intro:B("Think of a scene: the <b>imperfecto</b> is the <b>set and background</b> (what was going on, what it was like). The <b>indefinido</b> is the <b>event</b> that happened (what happened, what finished). The two often appear together in the same sentence.",
"Bir sahne gibi düşün: <b>imperfecto</b> sahnedeki <b>dekor ve arka plandır</b> (ne oluyordu, ortam nasıldı). <b>Indefinido</b> ise o arada <b>olan olaydır</b> (ne oldu, ne bitti). İki zaman çoğu zaman aynı cümlede birlikte kullanılır."),
forms:[
 [B("Comparison","Karşılaştırma"), B(
  cmpTable([["Role","Background, description, habit","Event, change, finished action"],["Question","What was it like? What was going on?","What happened?"],["Key words","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["English","used to / would / was -ing","simple past"]]),
  cmpTable([["Rol","Arka plan, betimleme, alışkanlık","Olay, değişim, bitmiş eylem"],["Soru","Nasıldı? Ne oluyordu?","Ne oldu?"],["Kelimeler","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["İngilizce","used to / would / was -ing","simple past"],["Türkçe","-ırdı / -ıyordu","-dı"]]),
  cmpTable([["Funktion","Hintergrund, Beschreibung, Gewohnheit","Ereignis, Veränderung, abgeschlossene Handlung"],["Frage","Wie war es? Was war gerade los?","Was ist passiert?"],["Signalwörter","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["Englisch","used to / would / was -ing","simple past"]]))],
 [B("Verbs that change meaning","Anlam değiştiren fiiller"), irr([
  ["conocer",B("conocía a Ana = I knew Ana<br>conocí a Ana = I met Ana","conocía a Ana = Ana'yı tanıyordum<br>conocí a Ana = Ana'yla tanıştım")],
  ["saber",B("sabía = I knew<br>supe = I found out","sabía = biliyordum<br>supe = öğrendim, haberim oldu")],
  ["querer / poder",B("no quería = I didn't want to<br>no quise = I refused · no pude = I couldn't (I tried)","no quería = istemiyordum<br>no quise = reddettim · no pude = yapamadım (denedim)")]
 ])]
],
uses:[
 {t:B("Background + interrupting event","Arka plan + araya giren olay"),d:B("The ongoing action is imperfecto, the interrupting one is indefinido.","Devam eden şey imperfecto, araya giren şey indefinido."),ex:[["Dormía cuando sonó el teléfono.","I was sleeping when the phone rang.","Telefon çaldığında uyuyordum."],["Llovía mucho, así que decidimos quedarnos en casa.","It was raining a lot, so we decided to stay home.","Çok yağmur yağıyordu, evde kalmaya karar verdik."]]},
 {t:B("Habit vs. one time","Alışkanlık vs. tek sefer"),d:B("Same verb, different meaning.","Aynı fiil, farklı anlam."),ex:[["Antes iba al gimnasio.","I used to go to the gym.","Eskiden spora giderdim."],["Ayer fui al gimnasio.","Yesterday I went to the gym.","Dün spora gittim."]]}
],
tips:[B("English <b>“was”</b> on its own can match either tense (<i>the house was big</i> → era). Then ask: is it a description or an event?","İngilizce tek başına <b>“was”</b> iki zamana da karşılık gelebilir (<i>the house was big</i> → era). O zaman “bu bir betimleme mi, yoksa olay mı?” diye sor."),
B("If <b>“would”</b> describes a habit (<i>we would go to the beach</i>) it's imperfecto. If it's conditional (<i>I would like</i>) it's the condicional.","<b>“would”</b> alışkanlık anlatıyorsa (<i>we would go to the beach</i>) imperfecto olur. Koşul anlatıyorsa (<i>I would like</i>) condicional olur.")],
quiz:[
 {q:"De niño, ___ al parque todos los días.",h:"ir",en:"As a kid, I used to go to the park every day.",tr:"Çocukken her gün parka giderdim.",opts:["iba","fui"],ex:B("Habit → imperfecto.","Alışkanlık → imperfecto.")},
 {q:"Ayer ___ al gimnasio a las siete.",h:"ir, yo",en:"Yesterday I went to the gym at seven.",tr:"Dün saat yedide spora gittim.",opts:["fui","iba"],ex:B("One-off, finished event → indefinido.","Tek seferlik, bitmiş olay → indefinido.")},
 {q:"Yo ___ cuando sonó el teléfono.",h:"dormir",en:"I was sleeping when the phone rang.",tr:"Telefon çaldığında uyuyordum.",opts:["dormía","dormí"],ex:B("Background → imperfecto. The phone ringing is the event → indefinido.","Arka plan → imperfecto. Telefonun çalması olay → indefinido.")},
 {q:"La casa de mis abuelos ___ muy grande.",h:"ser",en:"My grandparents' house was very big.",tr:"Dedemlerin evi çok büyüktü.",opts:["era","fue"],ex:B("Description → imperfecto.","Betimleme → imperfecto.")},
 {q:"Cuando ___ diez años, me mudé a Ankara.",h:"tener",en:"When I was ten, I moved to Ankara.",tr:"On yaşındayken Ankara'ya taşındım.",opts:["tenía","tuve"],ex:B("Age → imperfecto. Moving is a single event → indefinido.","Yaş → imperfecto. Taşınma tek bir olay → indefinido.")},
 {q:"Mientras yo cocinaba, mi compañero ___ la tele.",h:"ver",en:"While I was cooking, my flatmate was watching TV.",tr:"Ben yemek yaparken ev arkadaşım televizyon izliyordu.",opts:["veía","vio"],ex:B("mientras → two ongoing actions.","mientras → iki devam eden eylem.")},
 {q:"Anoche ___ una película muy buena.",h:"ver, yo",en:"Last night I watched a really good film.",tr:"Dün gece çok güzel bir film izledim.",opts:["vi","veía"],ex:B("A finished single event → indefinido.","Bitmiş tek olay → indefinido.")},
 {q:"En la fiesta ___ a Laura. ¡Es muy maja!",h:"conocer, yo",en:"I met Laura at the party. She's really nice!",tr:"Partide Laura'yla tanıştım. Çok tatlı biri!",opts:["conocí","conocía"],ex:B("In the indefinido, conocer means “met”.","conocer indefinido'da “tanıştım” anlamına gelir.")},
 {q:"___ sol y la gente paseaba por el Retiro.",h:"hacer",en:"It was sunny and people were strolling in the Retiro.",tr:"Hava güneşliydi ve insanlar Retiro'da yürüyordu.",opts:["Hacía","Hizo"],ex:B("Describing the weather → imperfecto.","Hava durumu betimlemesi → imperfecto.")}
]},

{id:"futuro",title:"Futuro simple",short:"hablaré",lvl:"A2",sub:B("Future and guesses","Gelecek ve tahmin"),analog:B("will / going to","-acak / -ecek"),
intro:B("Used for things that will happen, predictions and promises. In everyday speech, near plans usually use <b>ir a + infinitive</b> (<i>voy a cenar</i>), like English “going to”. The futuro can also <b>guess about the present</b>: <i>Estará en casa</i> → “He's probably at home”.",
"Gelecekte olacak şeyler, tahminler ve sözler için kullanılır. Konuşma dilinde yakın planlar için çoğu zaman <b>ir a + infinitivo</b> tercih edilir (<i>voy a cenar</i>). Futuro ayrıca <b>şimdiki zamanla ilgili tahmin</b> de yapar: <i>Estará en casa</i> → “Herhalde evdedir”."),
forms:[
 [B("Conjugation: infinitive + ending","Çekim: infinitivo + ek"), endTable([["hablar","hablar",["é","ás","á","emos","éis","án"]],["comer","comer",["é","ás","á","emos","éis","án"]],["vivir","vivir",["é","ás","á","emos","éis","án"]]])],
 [B("Irregular stems (same endings)","Düzensiz kökler (ekler aynı)"), irr([
  [B("The e drops","e düşer"),"poder → <b>podr</b>- · querer → <b>querr</b>- · saber → <b>sabr</b>- · haber → <b>habr</b>-"],
  [B("A d is added","d eklenir"),"tener → <b>tendr</b>- · poner → <b>pondr</b>- · salir → <b>saldr</b>- · venir → <b>vendr</b>-"],
  [B("Completely different","Tamamen farklı"),"hacer → <b>har</b>- · decir → <b>dir</b>-"],
  ["ir a + infinitivo","voy a, vas a, va a, vamos a, vais a, van a + infinitivo<br><i>Voy a llamar a mi madre.</i>"]
 ])]
],
uses:[
 {t:B("Future and predictions","Gelecek ve tahmin"),d:"",ex:[["Mañana lloverá en Madrid.","It will rain in Madrid tomorrow.","Yarın Madrid'de yağmur yağacak."],["El año que viene hablaré mejor español.","Next year I'll speak better Spanish.","Seneye daha iyi İspanyolca konuşacağım."]]},
 {t:B("Plans (spoken Spanish)","Plan (konuşma dili)"),d:"ir a + infinitivo",ex:[["Este finde vamos a ir a Toledo.","This weekend we're going to go to Toledo.","Bu hafta sonu Toledo'ya gideceğiz."]]},
 {t:B("Guessing about the present","Şimdiki zaman hakkında tahmin"),d:B("Means “probably…”.","“Herhalde…, -dır” anlamı."),ex:[["¿Dónde está Ana? — Estará en el trabajo.","Where's Ana? — She's probably at work.","Ana nerede? — Herhalde iştedir."]]}
],
tips:[B("All futuro endings have an accent except nosotros (-emos).","Futuro'da bütün ekler aksanlıdır, sadece nosotros (-emos) aksansızdır."),
B("Futuro and condicional share the same irregular stems. Learn one and you know both.","Futuro ve condicional aynı düzensiz kökleri kullanır. Birini öğrenen ikisini de öğrenmiş olur.")],
quiz:[
 {q:"Mañana ___.",h:"llover",en:"It will rain tomorrow.",tr:"Yarın yağmur yağacak.",a:["lloverá"],ex:"llover + á."},
 {q:"El año que viene ___ en Barcelona.",h:"vivir, yo",en:"Next year I'll live in Barcelona.",tr:"Seneye Barselona'da yaşayacağım.",a:["viviré"],ex:"vivir + é."},
 {q:"¿___ tiempo mañana?",h:"tener, tú",en:"Will you have time tomorrow?",tr:"Yarın vaktin olacak mı?",a:["tendrás"],ex:"tener → tendr- + ás."},
 {q:"Nosotros ___ la cena.",h:"hacer",en:"We'll make dinner.",tr:"Akşam yemeğini biz yapacağız.",opts:["haremos","haceremos","haciremos"],ex:"hacer → har-."},
 {q:B("Which structure is most common for near plans in spoken Spanish?","Konuşma dilinde yakın planlar için en yaygın yapı hangisi?"),h:"",opts:["ir a + infinitivo","futuro simple","imperfecto"],ex:"Voy a cenar con Ana, vamos a ver una peli…"},
 {q:"No sé dónde está Luis. ___ en el trabajo.",h:"estar",en:"I don't know where Luis is. He's probably at work.",tr:"Luis nerede bilmiyorum. Herhalde iştedir.",a:["estará"],ex:B("The futuro can also guess about the present.","Futuro, şimdiki zaman hakkında tahmin de yapar.")},
 {q:"Ellos no ___ venir.",h:"poder",en:"They won't be able to come.",tr:"Gelemeyecekler.",opts:["podrán","poderán","puedrán"],ex:"poder → podr-."}
]},

{id:"condicional",title:"Condicional",short:"hablaría",lvl:"A2–B1",sub:B("Politeness, wishes, advice","Kibarlık, dilek, tavsiye"),analog:B("would","-ırdı (koşul) / -mek isterdim"),
intro:B("The equivalent of English <b>would</b>. Used in polite requests, wishes, advice and hypotheses. Easy to form: the futuro stem + the -er/-ir endings of the imperfecto.",
"İngilizcedeki <b>would</b>'un karşılığıdır. Kibar ricalarda, dileklerde, tavsiyelerde ve varsayımlarda kullanılır. Çekimi kolaydır: futuro'nun kökü + imperfecto'nun -er/-ir ekleri."),
forms:[
 [B("Conjugation: infinitive + ending","Çekim: infinitivo + ek"), endTable([["hablar","hablar",["ía","ías","ía","íamos","íais","ían"]],["comer","comer",["ía","ías","ía","íamos","íais","ían"]],["vivir","vivir",["ía","ías","ía","íamos","íais","ían"]]])],
 [B("Irregular stems = same as futuro","Düzensiz kökler = futuro ile aynı"), irr([["","tendr-ía · podr-ía · har-ía · dir-ía · querr-ía · sabr-ía · pondr-ía · saldr-ía · vendr-ía"]])]
],
uses:[
 {t:B("Polite requests","Kibar rica"),d:"",ex:[["¿Podría ayudarme, por favor?","Could you help me, please?","Bana yardım edebilir misiniz lütfen?"]]},
 {t:B("Wishes","Dilek"),d:"me gustaría…",ex:[["Me gustaría vivir en el centro.","I'd like to live in the centre.","Merkezde yaşamak isterdim."]]},
 {t:B("Advice","Tavsiye"),d:"Yo que tú… / Deberías…",ex:[["Yo que tú, hablaría con el casero.","If I were you, I'd talk to the landlord.","Senin yerinde olsam ev sahibiyle konuşurdum."]]},
 {t:B("Hypotheses","Varsayım"),d:"",ex:[["Con más dinero, compraría un piso.","With more money, I'd buy a flat.","Daha çok param olsa bir daire alırdım."]]}
],
tips:[B("In “Si tuviera dinero, compraría…”, <b>tuviera</b> is the imperfect subjunctive (B1+). For now, learning the condicional part is enough.","“Si tuviera dinero, compraría…” cümlesindeki <b>tuviera</b> subjuntivo imperfecto'dur (B1+). Şimdilik condicional kısmını öğrenmen yeterli.")],
quiz:[
 {q:"Me ___ un café con leche, por favor.",h:"gustar",en:"I'd like a coffee with milk, please.",tr:"Bir sütlü kahve istiyorum lütfen.",a:["gustaría"],ex:"gustar + ía."},
 {q:"¿___ abrir la ventana?",h:"poder, usted",en:"Could you open the window?",tr:"Pencereyi açabilir misiniz?",a:["podría"],ex:"poder → podr- + ía."},
 {q:"Yo que tú, no lo ___.",h:"hacer",en:"If I were you, I wouldn't do it.",tr:"Senin yerinde olsam yapmazdım.",a:["haría"],ex:"hacer → har- + ía."},
 {q:"Nosotros ___ más, pero no tenemos tiempo.",h:"viajar",en:"We'd travel more, but we don't have time.",tr:"Daha çok seyahat ederdik ama vaktimiz yok.",opts:["viajaríamos","viajábamos","viajaremos"],ex:B("Hypothesis → condicional.","Varsayım → condicional.")},
 {q:"Él ___ que venir mañana.",h:"tener",en:"He would have to come tomorrow.",tr:"Yarın gelmesi gerekirdi.",opts:["tendría","tenería","tenía"],ex:"tener → tendr-."},
 {q:"¿Qué ___ tú en mi lugar?",h:"decir",en:"What would you say in my place?",tr:"Benim yerimde olsan ne derdin?",a:["dirías"],ex:"decir → dir-."}
]},

{id:"imperativo",title:"Imperativo",short:"¡habla!",lvl:"A2",sub:B("Commands and instructions","Emir ve talimat"),analog:B("imperative (speak! / don't speak!)","emir kipi (konuş! / konuşun!)"),
intro:B("Used for commands, instructions, advice and invitations. The affirmative <b>tú</b> form is the easiest. The <b>usted</b> form and all <b>negative</b> commands come from the subjunctive.",
"Emir, talimat, tavsiye ve davet için kullanılır. Olumlu <b>tú</b> emri en kolay olanıdır. <b>Usted</b> emri ve <b>olumsuz</b> emirler ise subjuntivo'dan gelir."),
forms:[
 [B("Affirmative commands","Olumlu emir"), fullTable([["hablar",["—","habla","hable","hablemos","hablad","hablen"]],["comer",["—","come","coma","comamos","comed","coman"]],["escribir",["—","escribe","escriba","escribamos","escribid","escriban"]]])],
 [B("Rules","Kurallar"), irr([
  [B("tú affirmative","tú olumlu"),B("= the él form of the presente: habla, come, cierra, vuelve","= presente'nin él hali: habla, come, cierra, vuelve")],
  [B("tú irregular (8 verbs)","tú düzensiz (8 tane)"),"tener → <b>ten</b> · hacer → <b>haz</b> · poner → <b>pon</b> · salir → <b>sal</b> · venir → <b>ven</b> · decir → <b>di</b> · ir → <b>ve</b> · ser → <b>sé</b>"],
  [B("Negative = no + subjunctive","Olumsuz = no + subjuntivo"),"no hables · no comas · no hagas · no vayas"],
  [B("Pronouns","Zamirler"),B("Attached to the end in the affirmative: <b>dímelo</b>, <b>siéntate</b>. In front in the negative: <b>no me lo digas</b>.","Olumluda sona eklenir: <b>dímelo</b>, <b>siéntate</b>. Olumsuzda önde kalır: <b>no me lo digas</b>.")]
 ])]
],
uses:[
 {t:B("Instructions","Talimat"),d:"",ex:[["Siga recto y gire a la derecha.","Go straight on and turn right.","Düz gidin ve sağa dönün."],["Rellene este formulario, por favor.","Fill in this form, please.","Bu formu doldurun lütfen."]]},
 {t:B("Requests and advice","Rica ve tavsiye"),d:"",ex:[["Habla más despacio, por favor.","Speak more slowly, please.","Daha yavaş konuş lütfen."],["No te preocupes.","Don't worry.","Merak etme."]]}
],
tips:[B("Spaniards use the imperative a lot and it isn't rude. <i>Ponme una caña</i> (Give me a small beer) is completely normal in a bar.","İspanyollar emir kipini çok kullanır ve bu kaba sayılmaz. <i>Ponme una caña</i> (Bana bir bira ver) barda tamamen normaldir.")],
quiz:[
 {q:"¡___ más despacio, por favor!",h:"hablar, tú",en:"Speak more slowly, please!",tr:"Daha yavaş konuş lütfen!",a:["habla"],ex:B("tú affirmative = presente él: habla.","tú olumlu = presente él: habla.")},
 {q:"¡___ la puerta!",h:"cerrar, tú",en:"Close the door!",tr:"Kapıyı kapat!",opts:["cierra","cerra","cierre"],ex:B("cerrar: e → ie, él cierra, so the command is cierra.","cerrar: e → ie, él cierra, o yüzden emir cierra.")},
 {q:"¡___ aquí!",h:"venir, tú",en:"Come here!",tr:"Buraya gel!",a:["ven"],ex:B("venir → ven (irregular).","venir → ven (düzensiz).")},

const TENSES={pres:"Presente",perf:"Pretérito perfecto",indef:"Indefinido",imp:"Imperfecto",fut:"Futuro",cond:"Condicional",subj:"Subjuntivo presente"};
function conj(inf,tn,plain){
  const d=plain?{}:(V[inf]||{});
  if(Array.isArray(d[tn]))return d[tn];
  if(d.base){                                   // compound verbs: mantener ← tener, proponer ← poner, satisfacer ← hacer
    const pre=d.pre!=null?d.pre:inf.slice(0,inf.length-d.base.length),cut=d.cut||0;
    return conj(d.base,tn).map(f=>f.includes(" ")?f.replace(/ (\S+)$/,(m,x)=>" "+pre+x.slice(cut)):pre+f.slice(cut));
  }
  const typ=inf.slice(-2).replace("í","i");const st=inf.slice(0,-2);
  const sc=d.sc||"";
  const repLast=(s,a,b)=>{const i=s.lastIndexOf(a);return i<0?s:s.slice(0,i)+b+s.slice(i+a.length);};
  const ACC={i:"í",u:"ú"};
  const uy=!plain&&/[^g]uir$/.test(inf);                // construir, huir, incluir… (not seguir)
  const vowelStem=!plain&&/[aeo]$/.test(st)&&typ!=="ar"; // leer, creer, caer, oír → leyó, creyó, cayó, oyó
  const zc=!plain&&!d.yo&&/[aeiou]c(er|ir)$/.test(inf)&&!/^(hacer|decir|cocer|mecer)$/.test(inf);
  const duc=!plain&&/ducir$/.test(inf);
  const strongStem=()=>{
    if(sc==="ie"||sc==="ie-i")return repLast(st,"e","ie");
    if(sc==="i")return repLast(st,"e","i");
    if(sc==="ue"||sc==="ue-u")return st.lastIndexOf("o")>=0?repLast(st,"o","ue"):repLast(st,"u","ue");
    if(d.acc){const m=st.match(/[iu](?=[^iu]*$)/);return m?st.slice(0,m.index)+ACC[m[0]]+st.slice(m.index+1):st;}
    if(uy)return st+"y";
    return st;
  };
  const E={
    pres:{ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]},
    indef:{ar:["é","aste","ó","amos","asteis","aron"],er:["í","iste","ió","imos","isteis","ieron"],ir:["í","iste","ió","imos","isteis","ieron"]},
    imp:{ar:["aba","abas","aba","ábamos","abais","aban"],er:["ía","ías","ía","íamos","íais","ían"],ir:["ía","ías","ía","íamos","íais","ían"]}
  };
  if(tn==="pres"){
    const ss=strongStem();
    const r=E.pres[typ].map((e,p)=>([0,1,2,5].includes(p)?ss:st)+e);
    if(d.yo)r[0]=d.yo;
    else if(typ!=="ar"){
      if(/g(er|ir)$/.test(inf))r[0]=r[0].replace(/go$/,"jo");          // escoger → escojo, elegir → elijo
      else if(/guir$/.test(inf))r[0]=r[0].replace(/guo$/,"go");        // seguir → sigo
      else if(/[^aeiou]c(er|ir)$/.test(inf))r[0]=r[0].replace(/co$/,"zo"); // vencer → venzo, torcer → tuerzo
      else if(zc)r[0]=r[0].replace(/co$/,"zco");                        // conocer → conozco, conducir → conduzco
    }
    return r;
  }
  if(tn==="imp")return E.imp[typ].map(e=>st+e);
  if(tn==="indef"){
    if(duc){const s=st.slice(0,-1)+"j";return ["e","iste","o","imos","isteis","eron"].map(e=>s+e);}  // conduje, tradujo
    const r=E.indef[typ].map(e=>st+e);
    if(typ==="ar"){
      if(st.endsWith("gu"))r[0]=st.slice(0,-1)+"üé";                  // averiguar → averigüé
      else if(st.endsWith("c"))r[0]=st.slice(0,-1)+"qué";
      else if(st.endsWith("g"))r[0]=st+"ué";
      else if(st.endsWith("z"))r[0]=st.slice(0,-1)+"cé";
      return r;
    }
    if(vowelStem){r[1]=st+"íste";r[2]=st+"yó";r[3]=st+"ímos";r[4]=st+"ísteis";r[5]=st+"yeron";}
    else if(uy){r[2]=st+"yó";r[5]=st+"yeron";}
    if(typ==="ir"&&(sc==="ie-i"||sc==="i")){const s=repLast(st,"e","i");r[2]=s+"ió";r[5]=s+"ieron";}
    if(typ==="ir"&&sc==="ue-u"){const s=repLast(st,"o","u");r[2]=s+"ió";r[5]=s+"ieron";}
    return r;
  }
  if(tn==="fut"){const s=d.fst||inf.replace("í","i");return ["é","ás","á","emos","éis","án"].map(e=>s+e);}
  if(tn==="cond"){const s=d.fst||inf.replace("í","i");return ["ía","ías","ía","íamos","íais","ían"].map(e=>s+e);}
  if(tn==="perf"){const p=d.part||(typ==="ar"?st+"ado":vowelStem?st+"ído":st+"ido");return ["he","has","ha","hemos","habéis","han"].map(h=>h+" "+p);}
  if(tn==="subj"){
    const yo=conj(inf,"pres",plain)[0];
    const orthoAr=s=>s.endsWith("gu")?s.slice(0,-1)+"ü":s.endsWith("c")?s.slice(0,-1)+"qu":s.endsWith("g")?s+"u":s.endsWith("z")?s.slice(0,-1)+"c":s;
    let strong=yo.replace(/o$/,"");
    let weak=strong;
    if(typ==="ar"){strong=orthoAr(strong);weak=(sc||d.acc)?orthoAr(st):strong;}
    else if(sc==="ie"||sc==="ue")weak=/[^aeiou]c$/.test(st)?st.slice(0,-1)+"z":st;            // volvamos, torzamos
    else if(sc==="ie-i")weak=repLast(st,"e","i");                                            // sintamos
    else if(sc==="ue-u")weak=repLast(st,"o","u");                                            // durmamos
    else if(d.acc)weak=st;                                                                   // prohibamos
    const en=typ==="ar"?["e","es","e","emos","éis","en"]:["a","as","a","amos","áis","an"];
    return en.map((e,p)=>(p===3||p===4?weak:strong)+e);
  }
}
/* A verb counts as irregular if any tense differs from the regular pattern (spelling-only changes such as busqué, escojo, sigo don't count) */
const isIrr=inf=>{const d=V[inf]||{};if(d.irr!=null)return !!d.irr;
  if(d.irrC==null)d.irrC=Object.keys(TENSES).some(tn=>conj(inf,tn).join()!==conj(inf,tn,true).join());return d.irrC;};

function route(){
  const h=(location.hash||"#tenses").slice(1);
  if(h!=="feedback")fbFrom=h;
  let tab=h.startsWith("l-")?"tenses":h.startsWith("practice")?"practice":(h.startsWith("r-")||h.startsWith("c-"))?"reading":h.startsWith("w-")?"words":h;
  if(h==="feedback")tab="feedback";else if(!TABS.some(x=>x[0]===tab))tab="tenses";
  $("#fbBtn").classList.toggle("on",tab==="feedback");

  if(tab==="practice"){renderPractice(h.slice(9));return;}

  if(h.startsWith("r-")){const S=findStory(h.slice(2));if(S){renderStory(S);return;}}
  if(h.startsWith("c-")){const S=findClassic(h);if(S){renderStory(S);return;}}
  if(!h.startsWith("w-"))wordEdit=false;
  if(h.startsWith("w-")){const W=findWord(h.slice(2));if(W){renderWord(W);return;}}
  ({tenses:renderTenses,phrases:renderPhrases,reading:renderReading,words:renderWords,drill:renderDrill,progress:renderProgress,feedback:renderFeedback})[tab]();
}

/* ================= Quiz engine ================= */
function startQuiz(L,qs){
  quiz={L,qs:shuffle(qs).map(q=>q.opts?Object.assign({},q,{shuffled:shuffle(q.opts),correct:q.opts[0]}):q),i:0,score:0,wrong:[],full:qs.length===L.quiz.length};
  renderQ();
}
const qText=q=>tx(q.q);
function fillSentence(q,ans){const s=qText(q);return s.includes("___")?s.replace("___",ans):ans;}
function renderQ(){
  const box=$("#quiz");if(!box)return;
  const q=quiz.qs[quiz.i];
  const p=Math.round(quiz.i/quiz.qs.length*100);
  const prompt=esc(qText(q)).replace("___",'<span class="blank">&nbsp;?&nbsp;</span>');
  const m=transLines(q);
  box.innerHTML=`<div class="qtop"><span>${t("qCount",quiz.i+1,quiz.qs.length)}</span><span>✔ ${quiz.score}</span></div>
  <div class="bar"><i style="width:${p}%;background:var(--accent)"></i></div>
  <div class="qprompt">${prompt} ${q.h?`<span class="qhint">(${esc(q.h)})</span>`:""}</div>
  ${m?`<div class="qtrans">${m}</div>`:'<div style="height:14px"></div>'}
  ${q.opts?`<div class="opts">${q.shuffled.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`
   :`<div class="inrow"><input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("typeAnswer")}"><button class="btn dark" id="chk">${t("check")}</button></div>
     <div class="keys">${["á","é","í","ó","ú","ñ","ü"].map(c=>`<button data-ch="${c}">${c}</button>`).join("")}</div>`}
  <div id="fb"></div><div class="qfoot" id="qfoot"></div>`;
  quiz.answered=false;
  if(q.opts){box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerMC(+b.dataset.k));}
  else{
    const inp=$("#tin");inp.focus();
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(quiz.answered)next();else answerType();}};
    $("#chk").onclick=answerType;
    bindKeys(box,inp);
  }
}
function bindKeys(box,inp){box.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,s)+b.dataset.ch+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1);});}
function checkAnswer(val,answers){
  const v=norm(val);if(!v)return null;
  if(answers.some(a=>norm(a)===v))return "ok";
  if(answers.some(a=>deacc(norm(a))===deacc(v)))return store.settings.strict?"accent-bad":"accent";
  return "bad";
}
function answerType(){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i];const inp=$("#tin");const r=checkAnswer(inp.value,q.a);
  if(r===null){inp.focus();return;}
  const ok=r==="ok"||r==="accent";
  inp.classList.add(ok?"right":"wrong");inp.readOnly=true;$("#chk").disabled=true;
  finishQ(ok,q,q.a[0],r==="accent"||r==="accent-bad",inp.value);
}
function answerMC(k){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i];const pick=q.shuffled[k];const ok=pick===q.correct;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.shuffled[j]===q.correct)b.classList.add("right");else if(j===k)b.classList.add("wrong");});
  finishQ(ok,q,q.correct,false,pick);
}
function finishQ(ok,q,correct,accentNote,given){
  quiz.answered=true;
  if(ok)quiz.score++;else quiz.wrong.push({q,given});
  if(quiz.L.onAnswer)try{quiz.L.onAnswer(q,ok);}catch(e){}
  const full=fillSentence(q,correct);
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok?(accentNote?t("okAccent"):"¡Correcto!"):t("rightAnswer")+esc(correct)}</div>
   ${accentNote?`<div>${t("rightSpelling")} <b>${esc(correct)}</b></div>`:""}<div>${tx(q.ex)}</div>
   ${qText(q).includes("___")?`<div class="full">${spk(full)}<span>${esc(full)}</span></div>`:""}</div>`;
  $("#qfoot").innerHTML=`<button class="btn" id="nx">${quiz.i+1<quiz.qs.length?t("next"):t("seeResult")}</button>`;
  $("#nx").onclick=next;$("#nx").focus();
}
function next(){quiz.i++;if(quiz.i>=quiz.qs.length)showResult();else renderQ();}
function showResult(){
  const {L,score,qs,wrong}=quiz;const r=score/qs.length;
  if(quiz.full&&!L.noSave){const prev=store.lessons[L.id]||{best:0,attempts:0};store.lessons[L.id]={best:Math.max(prev.best,r),attempts:prev.attempts+1,last:r};save();}
  try{gc("quiz-done",true);}catch(e){}
  const msg=r===1?t("res100"):r>=.8?t("res80"):r>=.5?t("res50"):t("res0");
  $("#quiz").innerHTML=`<div class="result"><div class="big">${score}/${qs.length}</div><p style="font-size:18px">${msg}</p>
  ${wrong.length?`<div class="revlist"><b>${t("yourMistakes")}</b>${wrong.map(w=>{const c=w.q.opts?w.q.correct:w.q.a[0];const qq=qText(w.q);return `<div>${esc(qq.includes("___")?fillSentence(w.q,c):qq+" → "+c)}<br><span class="muted">${esc(t("yourAnswer",w.given))}</span></div>`;}).join("")}</div>`:""}
  <div class="btns" style="justify-content:center">${wrong.length?`<button class="btn" id="rw">${t("retryWrong")}</button>`:""}<button class="btn ghost" id="ra">${L.regen?t("newQs"):t("restart")}</button>${!L.noSave&&GENMAP[L.id]?`<button class="btn ghost" id="rg">${t("unlimited")}</button>`:""}<button class="btn ghost" id="rb">${L.backLabel?t(L.backLabel):t("backToTenses")}</button></div></div>`;
  if(wrong.length)$("#rw").onclick=()=>startQuiz(L,wrong.map(w=>L.quiz.find(x=>x.q===w.q.q)));
  $("#ra").onclick=()=>L.regen?L.regen():startQuiz(L,L.quiz);
  if($("#rg"))$("#rg").onclick=()=>location.hash="#practice-"+L.id;
  const back=L.back||"#tenses";
  $("#rb").onclick=()=>{if(location.hash===back)route();else location.hash=back;};
}

/* ================= Phrases ================= */
function phrList(){
  let l=phrState.cat==="all"?allPhr():allPhr().filter(p=>p.cat===phrState.cat);
  if(phrState.q){const s=deacc(phrState.q.toLowerCase());l=l.filter(p=>deacc((p.es+" "+meanText(p)).toLowerCase()).includes(s));}
  return l;
}
function renderPhrases(){
  if(phrState.cat!=="all"&&!PHR[phrState.cat])phrState.cat="all";
  const app=$("#app");const cats=["all",...Object.keys(PHR)];const L2=LANG.toUpperCase();
  app.innerHTML=`<section class="hero"><h1>${t("phrTitle")}</h1><p>${t("phrDesc")}</p></section>
  <div class="chips">${cats.map(c=>`<button class="chip ${c===phrState.cat?"on":""}" data-c="${c}">${catName(c)}</button>`).join("")}</div>
  <div class="toolbar"><div class="seg">${[["list","list"],["cards","cards"],["test","test"]].map(([m,l])=>`<button class="${phrState.mode===m?"on":""}" data-m="${m}">${t(l)}</button>`).join("")}</div>
  ${phrState.mode==="list"?`<input class="search" id="ps" placeholder="${t("search")}" value="${esc(phrState.q)}">`:""}
  ${phrState.mode==="cards"?`<div class="seg"><button class="${phrState.dir==="es"?"on":""}" data-d="es">ES → ${L2}</button><button class="${phrState.dir==="m"?"on":""}" data-d="m">${L2} → ES</button></div>`:""}</div>
  <div id="pbody"></div>`;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{phrState.cat=b.dataset.c;phrState.deck=null;phrState.pq=null;renderPhrases();});
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{phrState.mode=b.dataset.m;phrState.deck=null;phrState.pq=null;renderPhrases();});
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{phrState.dir=b.dataset.d;phrState.flip=false;renderPhrases();});
  const ps=$("#ps");if(ps)ps.oninput=()=>{phrState.q=ps.value;drawList();};
  if(phrState.mode==="list")drawList();else if(phrState.mode==="cards")drawCards();else drawPTest();

function drawList(){
  const l=phrList();
  $("#pbody").innerHTML=l.length?`<div class="card plist">${l.map(p=>`<div class="prow">${spk(p.es)}<div><div class="es">${esc(p.es)}</div><div class="m">${transInline(p)}</div></div>${phrState.cat==="all"?`<span class="cat">${catName(p.cat)}</span>`:""}</div>`).join("")}</div>`:`<p class="muted">${t("noResults")}</p>`;
}
function drawCards(){
  if(!phrState.deck){phrState.deck=shuffle(phrState.custom||phrList()).map(p=>Object.assign({},p));phrState.idx=0;phrState.flip=false;phrState.known=0;}
  const d=phrState.deck;
  if(phrState.idx>=d.length){
    $("#pbody").innerHTML=`<div class="card result"><div class="big">🎉</div><p style="font-size:18px">${t("deckDone",phrState.known)}</p><button class="btn" id="again">${t("reshuffle")}</button></div>`;
    $("#again").onclick=()=>{phrState.deck=null;drawCards();};return;
  }
  const p=d[phrState.idx];const fr=phrState.dir==="es";
  $("#pbody").innerHTML=`<div class="flash"><div class="fmeta"><span>${phrState.idx+1} / ${d.length}</span><span>${t("cardHint")}</span></div>
  <div class="fcard ${phrState.flip?"flip":""}" id="fc">
    <div class="face">${fr?`<div class="big">${esc(p.es)}</div>${spk(p.es)}`:`<div class="big">${esc(prim(p))}</div>${SEC()?`<div class="small">🇬🇧 ${esc(p.en)}</div>`:""}`}</div>
    <div class="face b">${fr?`<div class="big">${esc(prim(p))}</div>${SEC()?`<div class="small">🇬🇧 ${esc(p.en)}</div>`:""}`:`<div class="big">${esc(p.es)}</div>${spk(p.es)}`}</div>
  </div>
  <div class="btns mt" style="justify-content:center"><button class="btn ghost" id="again2">${t("again")}</button><button class="btn" id="knew">${t("knew")}</button></div></div>`;
  $("#fc").onclick=()=>{phrState.flip=!phrState.flip;$("#fc").classList.toggle("flip");if(phrState.flip&&!fr)speak(p.es);};
  $("#knew").onclick=()=>{if(!p._seen)phrState.known++;phrState.idx++;phrState.flip=false;drawCards();};
  $("#again2").onclick=()=>{p._seen=true;d.push(p);phrState.idx++;phrState.flip=false;drawCards();};
}
function drawPTest(){
  const pool=phrState.cat==="all"?allPhr():allPhr().filter(p=>p.cat===phrState.cat);
  if(!phrState.pq){
    const every=allPhr();
    const qs=shuffle(pool).slice(0,10).map(p=>{const dir=Math.random()<.5?"es":"m";
      const others=shuffle(every.filter(x=>x.es!==p.es&&(phrState.cat==="all"||x.cat===p.cat||Math.random()<.2))).slice(0,3);
      return {p,dir,opts:shuffle([p,...others])};});
    phrState.pq={qs,i:0,score:0};
  }
  const Q=phrState.pq;
  if(Q.i>=Q.qs.length){
    const r=Q.score/Q.qs.length;const k=phrState.cat;const prev=store.phrases[k]||{best:0};store.phrases[k]={best:Math.max(prev.best,r)};save();
    $("#pbody").innerHTML=`<div class="card result"><div class="big">${Q.score}/${Q.qs.length}</div><p>${r>=.8?"¡Genial!":t("phrMore")}</p><button class="btn" id="pa">${t("newTest")}</button></div>`;
    $("#pa").onclick=()=>{phrState.pq=null;drawPTest();};return;
  }
  const q=Q.qs[Q.i];
  $("#pbody").innerHTML=`<div class="card quiz"><div class="qtop"><span>${t("qCount",Q.i+1,Q.qs.length)}</span><span>✔ ${Q.score}</span></div>
  <div class="bar"><i style="width:${Q.i/Q.qs.length*100}%;background:var(--accent)"></i></div>
  <div class="muted mt">${q.dir==="es"?t("whatMeans"):t("whichSpanish")}</div>
  <div class="qprompt" style="display:flex;gap:10px;align-items:center">${q.dir==="es"?spk(q.p.es):""}${esc(q.dir==="es"?q.p.es:prim(q.p))}</div>
  ${q.dir!=="es"&&SEC()?`<div class="qtrans">🇬🇧 ${esc(q.p.en)}</div>`:'<div style="height:12px"></div>'}
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(q.dir==="es"?meanText(o):o.es)}</button>`).join("")}</div>
  <div class="qfoot" id="pf"></div></div>`;
  document.querySelectorAll("#pbody .opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;const ok=q.opts[k]===q.p;if(ok)Q.score++;
    document.querySelectorAll("#pbody .opt").forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.p)x.classList.add("right");else if(j===k)x.classList.add("wrong");});
    speak(q.p.es);
    $("#pf").innerHTML=`<button class="btn" id="pn">${t("next")}</button>`;$("#pn").onclick=()=>{Q.i++;drawPTest();};$("#pn").focus();
  });
}

/* ================= Drill ================= */
const DLV=["A1","A2","B1","B2"];
function drillCfg(){if(!store.drillCfg)store.drillCfg={tenses:["pres","indef","imp"],set:"all"};if(!DLV.includes(store.drillCfg.lv))store.drillCfg.lv="A2";return store.drillCfg;}
const verbsUpTo=lv=>Object.keys(V).filter(v=>DLV.indexOf(V[v].lv)<=DLV.indexOf(lv));
function newDrill(force){
  const c=drillCfg();
  let verbs=verbsUpTo(c.lv).filter(v=>c.set==="all"||(c.set==="irr"?isIrr(v):!isIrr(v)));
  if(force)verbs=[force];
  const errs=store.drill.verbErr||{};
  const w=verbs.flatMap(v=>Array(1+Math.min(3,errs[v]||0)).fill(v));
  const verb=w[Math.floor(Math.random()*w.length)];
  const tense=c.tenses[Math.floor(Math.random()*c.tenses.length)];
  const p=Math.floor(Math.random()*6);
  drillState={verb,tense,p,answer:conj(verb,tense)[p],done:false};
}
function renderDrill(){
  const c=drillCfg();if(!c.tenses.length)c.tenses=["pres"];
  if(!drillState)newDrill();
  const d=store.drill;const acc=d.total?Math.round(d.correct/d.total*100):0;
  const s=drillState;const v=V[s.verb];
  const pool=verbsUpTo(c.lv);
  const vrow=x=>`<button class="vrow" data-v="${x}"><b>${x}</b>${isIrr(x)?`<i class="irrdot" title="${t("irregular")}">•</i>`:""} <span>${esc(prim(V[x]))}</span></button>`;

    <div class="seg lvseg">${DLV.map(l=>`<button class="${c.lv===l?"on":""}" data-lv="${l}"><b>${l}</b><small>${t("nVerbs",verbsUpTo(l).length)}</small></button>`).join("")}</div>
    <p class="muted lvnote">${t("drillLvNote",pool.length,pool.filter(isIrr).length)}</p>
    <details class="vlist" id="vlist"><summary>${t("drillList")} (${pool.length})</summary><p class="muted lvnote">${t("drillListHint")}</p>
      ${DLV.slice(0,DLV.indexOf(c.lv)+1).map(l=>{const g=pool.filter(x=>V[x].lv===l).sort((a,b)=>a.localeCompare(b,"es"));return `<div class="vgrp"><div class="vgh">${l} · ${t("nVerbs",g.length)}</div><div class="vgrid">${g.map(vrow).join("")}</div></div>`;}).join("")}
    </details></div>
  <div class="stats"><div class="card stat"><div class="n">${d.streak}</div><div class="l">${t("streak")}</div></div><div class="card stat"><div class="n">${d.best}</div><div class="l">${t("bestStreak")}</div></div><div class="card stat"><div class="n">${pct(acc)}</div><div class="l">${t("accuracy")}</div></div><div class="card stat"><div class="n">${d.total}</div><div class="l">${t("totalQ")}</div></div></div>
  <div class="card drill" id="dcard">
    <div class="verb">${s.verb} ${spk(s.verb)}</div><div class="mean">${transInline(v)}${isIrr(s.verb)?` · <b style="color:var(--accent)">${t("irregular")}</b>`:""}</div>
    <div class="tags"><span class="pill lvl">${TENSES[s.tense]}</span><span class="pill">${PERS[s.p]}</span></div>
    <div class="inrow"><input class="tin" id="din" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${s.tense==="perf"?t("egPerf"):t("typeConj")}"><button class="btn dark" id="dchk">${t("check")}</button></div>
    <div class="keys">${["á","é","í","ó","ú","ñ","ü"].map(ch=>`<button data-ch="${ch}">${ch}</button>`).join("")}</div>
    <div id="dfb"></div>
    <div class="btns mt" style="justify-content:center" id="dbtns"><button class="btn ghost" id="dskip">${t("dontKnow")}</button></div>
  </div>
  <div class="card settings mt"><div class="lab">${t("tensesCap")}</div>
    <div class="chips">${Object.entries(TENSES).map(([k,l])=>`<button class="chip ${c.tenses.includes(k)?"on":""}" data-tn="${k}">${l}</button>`).join("")}</div>
    <div class="lab">${t("verbsCap")}</div>
    <div class="chips">${[["all","allV"],["reg","regV"],["irr","irrV"]].map(([k,l])=>`<button class="chip ${c.set===k?"on":""}" data-vs="${k}">${t(l)}</button>`).join("")}</div>
    <label class="ck"><input type="checkbox" id="strict" ${store.settings.strict?"checked":""}> ${t("strict")}</label>
  </div>`;
  const inp=$("#din");inp.focus();bindKeys($("#dcard"),inp);

function drillCheck(){
  const s=drillState;if(s.done)return;const inp=$("#din");
  let val=inp.value;
  if(s.tense!=="perf"){val=val.replace(/^(yo|tú|tu|él|el|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes)\s+/i,"");}
  const r=checkAnswer(val,[s.answer]);if(r===null){inp.focus();return;}
  drillReveal(r==="ok"||r==="accent",r==="accent"||r==="accent-bad"?"accent":"");
}
function drillReveal(ok,note){
  const s=drillState;s.done=true;const d=store.drill;
  d.total++;if(ok){d.correct++;d.streak++;d.best=Math.max(d.best,d.streak);if(d.verbErr[s.verb])d.verbErr[s.verb]=Math.max(0,d.verbErr[s.verb]-1);}
  else{d.streak=0;d.verbErr[s.verb]=(d.verbErr[s.verb]||0)+1;}
  save();
  const inp=$("#din");inp.readOnly=true;inp.classList.add(ok?"right":"wrong");$("#dchk").disabled=true;
  const tbl=conj(s.verb,s.tense);
  $("#dfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}" style="text-align:left"><div class="h">${ok?(note?t("okAccentX",esc(s.answer)):"¡Correcto!"):t("rightAnswer")+esc(s.answer)}</div>
  <div class="tblwrap" style="padding:6px 0"><table class="conj">${PERS.map((p,i)=>`<tr><td>${p}</td><td>${i===s.p?`<b>${tbl[i]}</b>`:tbl[i]}</td></tr>`).join("")}</table></div></div>`;
  $("#dbtns").innerHTML=`${spk((s.p===2?"":PERS[s.p].split(" ")[0]+" ")+s.answer)}<button class="btn" id="dnext">${t("next")}</button>`;
  $("#dnext").onclick=()=>{newDrill();renderDrill();};$("#dnext").focus();
  const st=document.querySelectorAll(".stat .n");st[0].textContent=d.streak;st[1].textContent=d.best;st[2].textContent=pct(Math.round(d.correct/d.total*100));st[3].textContent=d.total;
}

const GENMAP={presente:"pres",perfecto:"perf",indefinido:"indef",imperfecto:"imp",futuro:"fut",condicional:"cond",subjuntivo:"subj",contraste:"ii"};
const COMP={

recibir:["un paquete","muchos emails"],estar:["en casa","en la oficina"],ir:["al gimnasio","al cine","a la playa"],
tener:["una reunión","mucho trabajo"],hacer:["deporte","la compra","la cena"],poder:["salir temprano","venir a la fiesta"],
querer:["un café","viajar a Toledo"],decir:["la verdad"],venir:["a la fiesta","a Madrid"],poner:["la mesa","la lavadora"],
salir:["con los amigos","de casa temprano"],ver:["una película","la tele","a los amigos"],dar:["un paseo por el Retiro"],
dormir:["ocho horas","muy bien"],pedir:["una pizza","ayuda al vecino"],empezar:["un curso de español","a trabajar a las nueve"],
volver:["a casa tarde","de Turquía"],jugar:["al fútbol","al pádel"],leer:["un libro","el periódico"],traer:["vino a la cena","el portátil"]
};
const NOBG=["llegar","abrir","empezar","recibir","poder","querer","decir","dar","venir","volver","traer","pagar"];
const SUBJ=["yo","tú","Ana","nosotros","vosotros","mis padres"];
const MARK={
pres:[["Normalmente","usually","genelde"],["Todos los días","every day","her gün"],["Los lunes","on Mondays","pazartesileri"],["A menudo","often","sık sık"]],
perf:[["Hoy","today","bugün"],["Esta mañana","this morning","bu sabah"],["Esta semana","this week","bu hafta"],["Este mes","this month","bu ay"]],
indef:[["Ayer","yesterday","dün"],["Anoche","last night","dün gece"],["La semana pasada","last week","geçen hafta"],["El año pasado","last year","geçen yıl"],["Hace dos días","two days ago","iki gün önce"]],
imp:[["Antes siempre","before, always","eskiden hep"],["En aquella época, a menudo","back then, often","o zamanlar sık sık"],["De pequeños, todos los veranos","as kids, every summer","çocukken her yaz"],["Por aquel entonces, cada día","at that time, every day","o dönem her gün"]],
fut:[["Mañana","tomorrow","yarın"],["La semana que viene","next week","haftaya"],["El año que viene","next year","seneye"],["Dentro de unos días","in a few days","birkaç gün içinde"]],
cond:[["Con más tiempo,","with more time","daha çok vakit olsa"],["Con más dinero,","with more money","daha çok para olsa"],["En otra situación,","in another situation","başka bir durumda"]],
subj:[["Espero que","I hope that","umarım"],["Quiero que","I want (someone) to","istiyorum ki"],["Ojalá","hopefully","keşke / inşallah"],["Es importante que","it's important that","önemli olan"]]
};
const WHY={
pres:B("Routine, now or a general fact → presente.","Rutin, şimdi ya da genel durum → presente."),
perf:B("A period that isn't over yet → pretérito perfecto (haber + participle).","Henüz bitmemiş zaman dilimi → pretérito perfecto (haber + participio)."),
indef:B("A finished, specific time → indefinido.","Bitmiş, belirli bir zaman → indefinido."),
imp:B("A past habit → imperfecto.","Geçmişteki alışkanlık → imperfecto."),
fut:B("Future → futuro.","Gelecek → futuro."),
cond:B("Hypothesis / “would” → condicional.","Varsayım / “-ırdı” → condicional."),
subj:B("Wish, want, evaluation → subjuntivo.","İstek, dilek, değerlendirme → subjuntivo.")};
const CWHY={
indef:B("points to a specific, finished time, so indefinido","belirli ve bitmiş bir zamanı gösteriyor, o yüzden indefinido"),
imp:B("describes a past habit, so imperfecto","geçmişteki bir alışkanlığı anlatıyor, o yüzden imperfecto"),
perf:B("is a period that isn't over yet, so in Spain it's perfecto","henüz bitmemiş bir zaman dilimi, o yüzden İspanya'da perfecto")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mo=m=>({es:m[0],en:m[1],tr:m[2]});
const perLang=f=>Object.fromEntries(Object.keys(LANGS).map(k=>[k,f(k)]));
const gloss=(m,v)=>perLang(k=>`${m[0]} = ${inLang(mo(m),k)} · ${v} = ${inLang(V[v],k)}`);
function genFill(tenses,n){
  const verbs=Object.keys(COMP).filter(v=>V[v]);const out=[];const seen=new Set();let guard=0;
  while(out.length<n&&guard++<n*20){
    const tn=rnd(tenses),v=rnd(verbs);if(tn==="perf"&&v==="estar"&&Math.random()<.5)continue;
    const p=tn==="subj"?1+Math.floor(Math.random()*5):Math.floor(Math.random()*6);
    const comp=rnd(COMP[v]),m=rnd(MARK[tn]),ans=conj(v,tn)[p];
    const q=`${m[0]} ${SUBJ[p]} ___ ${comp}.`;if(seen.has(q))continue;seen.add(q);
    const base=`<b>${v}</b> · ${TENSES[tn]} · ${PERS[p]} → <b>${ans}</b>`;
    out.push(Object.assign({q,h:`${v} · ${TENSES[tn]}`,a:[ans],
      ex:perLang(k=>`${base}${isIrr(v)?" ("+((T[k]||T.en).irregularVerb)+")":""}. ${inLang(WHY[tn],k)}`)},gloss(m,v)));
  }
  return out;
}
function genContrast(kind,n){
  const verbs=Object.keys(COMP).filter(v=>V[v]&&!["estar","tener","querer","poder","vivir"].includes(v));const out=[];const seen=new Set();let guard=0;
  const [tA,tB]=kind==="ii"?["indef","imp"]:["perf","indef"];
  while(out.length<n&&guard++<n*20){
    const v=rnd(verbs),p=Math.floor(Math.random()*6),comp=rnd(COMP[v]);
    const fA=conj(v,tA)[p],fB=conj(v,tB)[p];if(fA===fB)continue;
    let q,correct,wrongF,ex,gl;
    const pat=kind==="ii"&&!NOBG.includes(v)&&Math.random()<.25?"bg":Math.random()<.5?"A":"B";
    if(pat==="bg"){
      q=`${cap(SUBJ[p])} ___ ${comp} cuando sonó el teléfono.`;correct=fB;wrongF=fA;
      ex=B("The action in progress when the phone rang is the background, so imperfecto. “sonó” is the interrupting event (indefinido).","Telefon çaldığı anda devam eden eylem arka plandır, o yüzden imperfecto. “sonó” ise araya giren olaydır (indefinido).");
      gl=gloss(["cuando sonó el teléfono","when the phone rang","telefon çaldığında"],v);
    }else{
      const tn=pat==="A"?tA:tB,m=rnd(MARK[tn]);
      q=`${m[0]} ${SUBJ[p]} ___ ${comp}.`;correct=pat==="A"?fA:fB;wrongF=pat==="A"?fB:fA;
      ex=perLang(k=>`“${m[0]}” ${inLang(CWHY[tn],k)}: <b>${correct}</b>.`);
      gl=gloss(m,v);
    }
    if(seen.has(q))continue;seen.add(q);
    out.push(Object.assign({q,h:v,opts:[correct,wrongF],ex},gl));
  }
  return out;
}

  const fill=ts=>startGen(genLesson(()=>genFill(ts,10)));

}

}

  const vocab=(s.vocab||[]).map(exo);
  $("#app").innerHTML=`<button class="back" onclick="location.hash='#reading'">${t("backStories")}</button>
  <div class="lhead"><div><span class="pill lvl">${esc(s.lvl||"")}</span>${isTmp?` <span class="pill">${t("unsaved")}</span>`:""}
    <h1 style="margin-top:8px">${esc(s.title)}</h1><div class="tl" style="margin-top:4px">${transInline(s.tt||{})}</div>
    ${s.classic?`<div class="tl" style="margin-top:2px;font-size:13px">${t("basedOn",esc(s.classic.src))}</div><div class="seg lvseg mt">${LV.map(l=>`<button class="${l===s.lvl?"on":""}" data-lv="${l}">${l}</button>`).join("")}</div>`:""}
    ${s.focus?`<a class="linkish" href="#l-${s.focus}">${t("grammarLink",esc(lessonTitle(s.focus)))}</a>`:""}</div>
    <div class="btns">${canSpeak?`<button class="btn ghost" id="rAll">${t("readAll")}</button>`:""}</div></div>
  <div class="toolbar"><div class="seg">${pairs.map(([k,l])=>`<button class="${pair===k?"on":""}" data-pair="${k}">${l}</button>`).join("")}</div>
    ${pair==="es"?`<span class="muted" style="font-size:14px">${t("tapReveal")}</span>`:""}</div>
  ${body}
  ${vocab.length?`<div class="sec"><h2>${t("vocab")}</h2><div class="card tblwrap"><table class="conj vocab">${vocab.map(v=>`<tr><td><b>${esc(v.es)}</b></td><td>🇬🇧 ${esc(v.en||"")}</td>${secOf(v)?`<td>${LANGS[LANG].flag} ${esc(secOf(v))}</td>`:""}</tr>`).join("")}</table></div></div>`:""}
  ${s.quiz&&s.quiz.length?`<div class="sec"><h2>${t("compTest")}</h2><div class="card quiz" id="quiz"><button class="btn" id="stTest">${t("startTest",s.quiz.length)}</button></div></div>`:""}
  ${isTmp?`<div class="btns mt"><button class="btn" id="stSave">${t("saveStory")}</button></div>`:""}
  ${isMine?`<div class="btns mt"><button class="btn ghost" id="stDel">${t("deleteStory")}</button></div>`:""}`;
  document.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{store.settings.rpair=b.dataset.pair;save();if(canSpeak)try{speechSynthesis.cancel();}catch(e){}renderStory(s);});
  document.querySelectorAll(".rpara.hide .tgl").forEach(b=>b.onclick=()=>b.closest(".rpara").classList.toggle("open"));
  document.querySelectorAll(".story").forEach(el=>el.addEventListener("click",e=>{const sp=e.target.closest(".tw");if(sp)openSheet(s,+sp.dataset.p,+sp.dataset.i);}));
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{location.hash=`#c-${s.classic.id}-${b.dataset.lv.toLowerCase()}`;});
  const ra=$("#rAll");
  if(ra){readingAloud=false;ra.onclick=()=>{
    if(readingAloud){try{speechSynthesis.cancel();}catch(e){}readingAloud=false;ra.textContent=t("readAll");return;}
    readingAloud=true;ra.textContent=t("stopRead");
    readAloud(s.paras.map(p=>p.es),()=>{readingAloud=false;const b=$("#rAll");if(b)b.textContent=t("readAll");});
  };}
  const st=$("#stTest");
  if(st)st.onclick=()=>{
    const L={id:"story-"+s.id,noSave:isTmp,back:"#reading",backLabel:"backToStories",quiz:s.quiz};
    startQuiz(L,s.quiz);
  };
  const sv=$("#stSave");
  if(sv)sv.onclick=()=>{
    const ns=Object.assign({},tempStory,{id:"my-"+Date.now()});
    store.myStories=[...myStories(),ns].slice(-30);save();tempStory=null;
    location.hash="#r-"+ns.id;
  };
  const del=$("#stDel");
  if(del)del.onclick=()=>{
    if(!del.dataset.sure){del.dataset.sure="1";del.textContent=t("sureDelete");return;}
    store.myStories=myStories().filter(x=>x.id!==s.id);delete store.lessons["story-"+s.id];save();location.hash="#reading";
  };
}
