{id:"ricitos",icon:"🐻",title:"Ricitos de Oro",tt:B("Goldilocks and the Three Bears","Altın Saçlı Kız ve Üç Ayı","Goldlöckchen und die drei Bären"),src:"Robert Southey / cuento popular inglés",lv:{
A1:{paras:[
{es:"Ricitos de Oro es una niña con el pelo rubio. Un día entra en una casa en el bosque. Es la casa de tres osos: papá oso, mamá osa y el osito. En la mesa hay tres platos de sopa. Ella come la sopa del osito. Luego rompe su silla y duerme en su cama. Los osos vuelven a casa. La niña se despierta y sale corriendo.",
 en:"Goldilocks is a girl with blonde hair. One day she goes into a house in the forest. It's the house of three bears: daddy bear, mummy bear and the little bear. On the table there are three bowls of soup. She eats the little bear's soup. Then she breaks his chair and sleeps in his bed. The bears come back home. The girl wakes up and runs away.",
 tr:"Altın Saçlı Kız sarı saçlı bir kız. Bir gün ormandaki bir eve giriyor. Bu ev üç ayının evi: baba ayı, anne ayı ve yavru ayı. Masada üç tabak çorba var. Kız yavru ayının çorbasını yiyor. Sonra onun sandalyesini kırıyor ve yatağında uyuyor. Ayılar eve dönüyor. Kız uyanıyor ve koşarak kaçıyor.",
 de:"Goldlöckchen ist ein Mädchen mit blonden Haaren. Eines Tages geht es in ein Haus im Wald. Es ist das Haus von drei Bären: Papa Bär, Mama Bär und dem kleinen Bären. Auf dem Tisch stehen drei Teller Suppe. Es isst die Suppe des kleinen Bären. Dann macht es seinen Stuhl kaputt und schläft in seinem Bett. Die Bären kommen nach Hause. Das Mädchen wacht auf und läuft weg."}],
vocab:[["el pelo rubio","blonde hair","sarı saç","blonde Haare"],["el oso","bear","ayı","der Bär"],["la silla","chair","sandalye","der Stuhl"],["despertarse","to wake up","uyanmak","aufwachen"]],
quiz:[
{q:"¿De quién es la casa?",en:"Whose house is it?",tr:"Ev kimin?",de:"Wem gehört das Haus?",opts:["De tres osos","De su abuela","De un lobo"],ex:"«Es la casa de tres osos.»"},
{q:"¿Qué rompe la niña?",en:"What does the girl break?",tr:"Kız neyi kırıyor?",de:"Was macht das Mädchen kaputt?",opts:["La silla del osito","La mesa","Un plato"],ex:"«Luego rompe su silla y duerme en su cama.»"}]},
A2:{paras:[
{es:"Había una vez una niña que tenía el pelo rubio y rizado, y por eso la llamaban Ricitos de Oro. Un día, paseando por el bosque, encontró una casita. La puerta estaba abierta y no había nadie. En la mesa había tres platos de sopa: uno grande, uno mediano y uno pequeño. La sopa grande estaba muy caliente, la mediana muy fría y la pequeña, perfecta. Se la comió toda.",
 en:"Once upon a time there was a girl who had blonde, curly hair, and that's why they called her Goldilocks. One day, walking in the forest, she found a little house. The door was open and nobody was there. On the table there were three bowls of soup: a big one, a medium one and a small one. The big soup was very hot, the medium one very cold and the small one just right. She ate it all up.",
 tr:"Bir zamanlar sarı ve kıvırcık saçlı bir kız varmış, bu yüzden ona Altın Saçlı Kız derlermiş. Bir gün ormanda gezerken küçük bir ev bulmuş. Kapı açıkmış ve içeride kimse yokmuş. Masada üç tabak çorba varmış: bir büyük, bir orta ve bir küçük. Büyük çorba çok sıcakmış, orta boy çok soğukmuş, küçük olan ise tam kıvamındaymış. Hepsini yemiş.",
 de:"Es war einmal ein Mädchen mit blonden Locken, deshalb nannte man es Goldlöckchen. Eines Tages fand es bei einem Spaziergang im Wald ein kleines Haus. Die Tür war offen und niemand war da. Auf dem Tisch standen drei Teller Suppe: ein großer, ein mittlerer und ein kleiner. Die große Suppe war sehr heiß, die mittlere sehr kalt und die kleine genau richtig. Es aß sie ganz auf."},
{es:"Después quiso sentarse. La silla grande era muy dura, la mediana muy blanda, y la pequeña era perfecta… pero se rompió. Cansada, subió al dormitorio y se durmió en la cama más pequeña. Poco después volvieron los dueños de la casa: tres osos. «¡Alguien se ha comido mi sopa!», lloró el osito. Ricitos de Oro se despertó, vio a los osos y salió corriendo por la ventana.",
 en:"Then she wanted to sit down. The big chair was very hard, the medium one very soft, and the small one was perfect… but it broke. Tired, she went up to the bedroom and fell asleep in the smallest bed. Soon after, the owners of the house came back: three bears. “Someone has eaten my soup!” cried the little bear. Goldilocks woke up, saw the bears and ran out through the window.",
 tr:"Sonra oturmak istemiş. Büyük sandalye çok sertmiş, orta boy çok yumuşakmış, küçük olan ise tam yerindeymiş… ama kırılmış. Yorulan kız yatak odasına çıkmış ve en küçük yatakta uyuyakalmış. Biraz sonra evin sahipleri dönmüş: üç ayı. «Biri çorbamı yemiş!» diye ağlamış yavru ayı. Altın Saçlı Kız uyanmış, ayıları görmüş ve pencereden koşarak kaçmış.",
 de:"Danach wollte es sich setzen. Der große Stuhl war sehr hart, der mittlere sehr weich, und der kleine war perfekt … aber er ging kaputt. Müde ging es ins Schlafzimmer hinauf und schlief im kleinsten Bett ein. Kurz darauf kamen die Besitzer des Hauses zurück: drei Bären. „Jemand hat meine Suppe gegessen!“, weinte der kleine Bär. Goldlöckchen wachte auf, sah die Bären und rannte durchs Fenster davon."}],
vocab:[["rizado","curly","kıvırcık","lockig"],["mediano","medium","orta boy","mittelgroß"],["duro","hard","sert","hart"],["blando","soft","yumuşak","weich"]],
quiz:[
{q:"¿Cómo estaba la sopa pequeña?",en:"What was the small soup like?",tr:"Küçük çorba nasıldı?",de:"Wie war die kleine Suppe?",opts:["Perfecta","Muy caliente","Muy fría"],ex:"«…la mediana muy fría y la pequeña, perfecta.»"},
{q:"¿Por dónde salió Ricitos de Oro?",en:"How did Goldilocks get out?",tr:"Altın Saçlı Kız nereden çıktı?",de:"Wo ging Goldlöckchen hinaus?",opts:["Por la ventana","Por la puerta","Por la chimenea"],ex:"«…vio a los osos y salió corriendo por la ventana.»"}]},
B1:{paras:[
{es:"En una casita escondida en el bosque vivía una familia de osos: un papá oso enorme, una mamá osa de tamaño mediano y un osito pequeño. Una mañana, mientras la sopa del desayuno se enfriaba, decidieron dar un paseo. Justo entonces pasó por allí una niña de rizos dorados a la que todos llamaban Ricitos de Oro. Al ver la puerta entreabierta, no pudo resistir la curiosidad y entró sin llamar.",
 en:"In a little house hidden in the forest lived a family of bears: an enormous daddy bear, a medium-sized mummy bear and a small little bear. One morning, while their breakfast soup was cooling down, they decided to go for a walk. Just then a girl with golden curls, whom everyone called Goldilocks, passed by. When she saw the door ajar, she couldn't resist her curiosity and went in without knocking.",
 tr:"Ormanda saklı küçük bir evde bir ayı ailesi yaşıyormuş: kocaman bir baba ayı, orta boy bir anne ayı ve küçük bir yavru ayı. Bir sabah kahvaltı çorbaları soğurken yürüyüşe çıkmaya karar vermişler. Tam o sırada herkesin Altın Saçlı Kız dediği, altın rengi bukleli bir kız oradan geçiyormuş. Kapıyı aralık görünce merakına karşı koyamamış ve kapıyı çalmadan içeri girmiş.",
 de:"In einem versteckten Häuschen im Wald lebte eine Bärenfamilie: ein riesiger Papa Bär, eine mittelgroße Mama Bär und ein kleiner Bär. Eines Morgens, während ihre Frühstückssuppe abkühlte, beschlossen sie, spazieren zu gehen. Genau in diesem Moment kam ein Mädchen mit goldenen Locken vorbei, das alle Goldlöckchen nannten. Als es die halb offene Tür sah, konnte es seiner Neugier nicht widerstehen und ging hinein, ohne anzuklopfen."},
{es:"Tenía hambre, así que probó la sopa del plato grande, pero quemaba. La del mediano estaba helada. La del pequeño estaba en su punto, y se la terminó en un momento. Luego quiso descansar: el sillón grande era demasiado duro, el mediano demasiado blando y el pequeño parecía perfecto, hasta que crujió y se rompió en pedazos. Finalmente subió al piso de arriba y se quedó dormida en la camita del osito.",
 en:"She was hungry, so she tried the soup in the big bowl, but it was scalding. The one in the medium bowl was ice-cold. The one in the small bowl was just right, and she finished it in no time. Then she wanted to rest: the big armchair was too hard, the medium one too soft and the small one seemed perfect, until it creaked and broke into pieces. Finally she went upstairs and fell asleep in the little bear's bed.",
 tr:"Karnı açmış, bu yüzden büyük tabaktaki çorbayı tatmış ama çorba yakıyormuş. Ortadakininki buz gibiymiş. Küçük tabaktaki ise tam kıvamındaymış ve bir anda bitirmiş. Sonra dinlenmek istemiş: büyük koltuk fazla sertmiş, ortadaki fazla yumuşakmış, küçük olan ise mükemmel görünüyormuş, ta ki gıcırdayıp paramparça olana kadar. Sonunda üst kata çıkmış ve yavru ayının küçük yatağında uyuyakalmış.",
 de:"Es hatte Hunger, also probierte es die Suppe aus dem großen Teller, aber sie war glühend heiß. Die aus dem mittleren war eiskalt. Die aus dem kleinen war genau richtig, und es aß sie im Nu auf. Dann wollte es sich ausruhen: Der große Sessel war zu hart, der mittlere zu weich, und der kleine schien perfekt, bis er knarrte und in Stücke brach. Schließlich ging es nach oben und schlief im Bettchen des kleinen Bären ein."},
{es:"Cuando los osos volvieron, notaron enseguida que algo había pasado. «¡Alguien ha probado mi sopa!», gruñó papá oso. «¡Y alguien se ha comido la mía!», gritó el osito. Subieron al dormitorio y encontraron a la niña durmiendo tranquilamente. En ese momento, Ricitos de Oro abrió los ojos, vio tres caras peludas mirándola y, del susto, saltó por la ventana y no paró de correr hasta llegar a su casa.",
 en:"When the bears came back, they noticed straight away that something had happened. “Someone has tasted my soup!” growled daddy bear. “And someone has eaten mine!” shouted the little bear. They went up to the bedroom and found the girl sleeping peacefully. At that moment, Goldilocks opened her eyes, saw three furry faces looking at her and, in fright, jumped out of the window and didn't stop running until she got home.",
 tr:"Ayılar döndüğünde bir şey olduğunu hemen fark etmişler. «Biri çorbamın tadına bakmış!» diye homurdanmış baba ayı. «Biri de benimkini yemiş!» diye bağırmış yavru ayı. Yatak odasına çıkmışlar ve kızı mışıl mışıl uyurken bulmuşlar. Tam o anda Altın Saçlı Kız gözlerini açmış, kendisine bakan üç tüylü surat görmüş ve korkuyla pencereden atlayıp evine varana kadar durmadan koşmuş.",
 de:"Als die Bären zurückkamen, merkten sie sofort, dass etwas passiert war. „Jemand hat von meiner Suppe probiert!“, brummte Papa Bär. „Und jemand hat meine aufgegessen!“, rief der kleine Bär. Sie gingen ins Schlafzimmer und fanden das Mädchen, das friedlich schlief. In diesem Moment öffnete Goldlöckchen die Augen, sah drei pelzige Gesichter, die es anstarrten, sprang vor Schreck aus dem Fenster und hörte nicht auf zu rennen, bis es zu Hause war."}],
vocab:[["entreabierto","ajar, half-open","aralık","halb offen"],["en su punto","just right","tam kıvamında","genau richtig"],["crujir","to creak","gıcırdamak","knarren"],["el susto","fright","korku, ürküntü","der Schreck"]],
quiz:[
{q:"¿Qué hicieron los osos mientras se enfriaba la sopa?",en:"What did the bears do while the soup was cooling?",tr:"Çorba soğurken ayılar ne yaptı?",de:"Was machten die Bären, während die Suppe abkühlte?",opts:["Dieron un paseo","Durmieron la siesta","Prepararon pan"],ex:"«…mientras la sopa del desayuno se enfriaba, decidieron dar un paseo.»"},
{q:"¿Qué pasó con el sillón pequeño?",en:"What happened to the small armchair?",tr:"Küçük koltuğa ne oldu?",de:"Was geschah mit dem kleinen Sessel?",opts:["Crujió y se rompió en pedazos","Era demasiado duro","Se lo llevó papá oso"],ex:"«…hasta que crujió y se rompió en pedazos.»"},
{q:"¿Por qué saltó la niña por la ventana?",en:"Why did the girl jump out of the window?",tr:"Kız neden pencereden atladı?",de:"Warum sprang das Mädchen aus dem Fenster?",opts:["Del susto al ver a los osos","Porque la puerta estaba cerrada","Porque los osos se lo pidieron"],ex:"«…vio tres caras peludas mirándola y, del susto, saltó por la ventana…»"}]},
B2:{paras:[
{es:"Hubo una vez, en lo más profundo del bosque, una casita de madera donde vivían tres osos que lo tenían todo a su medida: papá oso tenía el plato, la silla y la cama más grandes; mamá osa, los medianos; y el osito, los más pequeños. Cada mañana preparaban unas gachas de avena y, como siempre estaban demasiado calientes, salían a dar un paseo mientras se templaban.",
 en:"There was once, deep in the forest, a little wooden house where three bears lived who had everything made to their size: daddy bear had the biggest bowl, chair and bed; mummy bear, the medium ones; and the little bear, the smallest. Every morning they made oat porridge and, as it was always too hot, they went out for a walk while it cooled down.",
 tr:"Bir zamanlar ormanın en derinlerinde, her şeyi kendi boylarına göre olan üç ayının yaşadığı tahtadan küçük bir ev varmış: en büyük tabak, sandalye ve yatak baba ayınınmış; ortancalar anne ayının; en küçükler de yavru ayının. Her sabah yulaf lapası yaparlar ve lapa hep çok sıcak olduğu için ılınana kadar yürüyüşe çıkarlarmış.",
 de:"Es gab einmal tief im Wald ein kleines Holzhaus, in dem drei Bären lebten, bei denen alles nach ihrer Größe gemacht war: Papa Bär hatte den größten Teller, den größten Stuhl und das größte Bett; Mama Bär die mittleren; und der kleine Bär die kleinsten. Jeden Morgen kochten sie Haferbrei, und weil er immer zu heiß war, gingen sie spazieren, während er abkühlte."},
{es:"Aquella mañana, una niña llamada Ricitos de Oro, famosa en su pueblo tanto por sus rizos como por su curiosidad, se alejó del sendero persiguiendo una mariposa. Al toparse con la casita y ver que la puerta no estaba cerrada con llave, llamó un par de veces y, como nadie respondió, se coló dentro sin pensárselo dos veces. El olor de las gachas recién hechas le despertó un hambre feroz.",
 en:"That morning, a girl called Goldilocks, famous in her village as much for her curls as for her curiosity, wandered off the path chasing a butterfly. When she came across the little house and saw that the door wasn't locked, she knocked a couple of times and, as nobody answered, she slipped inside without thinking twice. The smell of freshly made porridge awoke a ferocious hunger in her.",
 tr:"O sabah köyünde bukleleri kadar merakıyla da ünlü olan Altın Saçlı Kız adında bir kız, bir kelebeği kovalarken patikadan uzaklaşmış. Küçük eve rastlayıp kapının kilitli olmadığını görünce birkaç kez kapıyı çalmış ve kimse cevap vermeyince hiç düşünmeden içeri süzülmüş. Taze yapılmış lapanın kokusu onda müthiş bir açlık uyandırmış.",
 de:"An jenem Morgen entfernte sich ein Mädchen namens Goldlöckchen, das in seinem Dorf ebenso für seine Locken wie für seine Neugier bekannt war, vom Weg, weil es einem Schmetterling nachjagte. Als es auf das Häuschen stieß und sah, dass die Tür nicht abgeschlossen war, klopfte es ein paarmal, und da niemand antwortete, schlüpfte es ohne lange zu überlegen hinein. Der Duft des frisch gekochten Breis weckte in ihm einen gewaltigen Hunger."},
{es:"Probó el plato grande y se quemó la lengua; el mediano, en cambio, estaba frío como el hielo. El pequeño, sin embargo, estaba tan rico que no dejó ni una cucharada. Satisfecha, buscó dónde sentarse, pero la silla del osito, que no estaba hecha para alguien de su tamaño, se hizo añicos bajo su peso. Ya algo arrepentida, subió las escaleras y, tras probar las tres camas, se acurrucó en la más pequeña y se quedó profundamente dormida.",
 en:"She tried the big bowl and burned her tongue; the medium one, on the other hand, was as cold as ice. The small one, however, was so tasty that she didn't leave a single spoonful. Satisfied, she looked for somewhere to sit, but the little bear's chair, which wasn't made for someone her size, smashed to pieces under her weight. Already somewhat sorry, she went upstairs and, after trying the three beds, curled up in the smallest one and fell fast asleep.",
 tr:"Büyük tabağı tatmış ve dilini yakmış; ortadaki ise buz gibi soğukmuş. Küçük tabaktaki ise o kadar lezzetliymiş ki tek bir kaşık bile bırakmamış. Karnı doyunca oturacak bir yer aramış, ama onun boyundaki biri için yapılmamış olan yavru ayının sandalyesi ağırlığı altında paramparça olmuş. Biraz pişmanlık duyarak merdivenleri çıkmış ve üç yatağı da denedikten sonra en küçüğüne kıvrılıp derin bir uykuya dalmış.",
 de:"Es probierte vom großen Teller und verbrannte sich die Zunge; der mittlere dagegen war eiskalt. Der kleine jedoch schmeckte so gut, dass es keinen einzigen Löffel übrig ließ. Satt suchte es sich einen Platz zum Sitzen, aber der Stuhl des kleinen Bären, der nicht für jemanden seiner Größe gemacht war, zerbrach unter seinem Gewicht in tausend Stücke. Schon etwas reumütig ging es die Treppe hinauf, probierte die drei Betten aus, kuschelte sich in das kleinste und schlief tief ein."},
{es:"No tardaron en volver los osos. Al ver las cucharas dentro de los platos, papá oso frunció el ceño; al descubrir la silla destrozada, el osito rompió a llorar. Siguiendo el rastro, subieron al dormitorio y allí estaba la intrusa, durmiendo como si estuviera en su propia casa. Cuando Ricitos de Oro abrió los ojos y se encontró con tres hocicos a un palmo de su cara, saltó por la ventana y echó a correr. Dicen que nunca más volvió a entrar en una casa ajena sin permiso.",
 en:"The bears soon came back. Seeing the spoons in the bowls, daddy bear frowned; discovering the smashed chair, the little bear burst into tears. Following the trail, they went up to the bedroom and there was the intruder, sleeping as if she were in her own home. When Goldilocks opened her eyes and found three snouts a hand's breadth from her face, she jumped out of the window and ran off. They say she never again went into someone else's house without permission.",
 tr:"Ayılar çok geçmeden dönmüş. Tabakların içindeki kaşıkları görünce baba ayı kaşlarını çatmış; parçalanmış sandalyeyi görünce yavru ayı ağlamaya başlamış. İzleri takip ederek yatak odasına çıkmışlar ve davetsiz misafir oradaymış, sanki kendi evindeymiş gibi uyuyormuş. Altın Saçlı Kız gözlerini açıp yüzünün bir karış ötesinde üç burun görünce pencereden atlamış ve kaçmaya başlamış. Derler ki bir daha asla izinsiz başkasının evine girmemiş.",
 de:"Die Bären kamen bald zurück. Als Papa Bär die Löffel in den Tellern sah, runzelte er die Stirn; als der kleine Bär den zerbrochenen Stuhl entdeckte, brach er in Tränen aus. Sie folgten der Spur ins Schlafzimmer, und dort lag die Eindringlingin und schlief, als wäre sie bei sich zu Hause. Als Goldlöckchen die Augen öffnete und drei Schnauzen eine Handbreit vor seinem Gesicht sah, sprang es aus dem Fenster und rannte davon. Man sagt, es sei nie wieder ohne Erlaubnis in ein fremdes Haus gegangen."}],
vocab:[["a su medida","made to measure, to one's size","kendi boyuna göre","nach Maß"],["toparse con","to come across","rastlamak","stoßen auf"],["hacerse añicos","to smash to pieces","paramparça olmak","in tausend Stücke zerbrechen"],["fruncir el ceño","to frown","kaşlarını çatmak","die Stirn runzeln"]],
quiz:[
{q:"¿Por qué salían los osos a pasear cada mañana?",en:"Why did the bears go for a walk every morning?",tr:"Ayılar neden her sabah yürüyüşe çıkıyordu?",de:"Warum gingen die Bären jeden Morgen spazieren?",opts:["Porque las gachas estaban demasiado calientes","Para buscar miel","Para visitar a sus vecinos"],ex:"«…como siempre estaban demasiado calientes, salían a dar un paseo mientras se templaban.»"},
{q:"¿Por qué se alejó la niña del sendero?",en:"Why did the girl wander off the path?",tr:"Kız neden patikadan uzaklaştı?",de:"Warum entfernte sich das Mädchen vom Weg?",opts:["Perseguía una mariposa","Buscaba a los osos","Tenía frío"],ex:"«…se alejó del sendero persiguiendo una mariposa.»"},
{q:"Según dicen, ¿qué aprendió Ricitos de Oro?",en:"According to what they say, what did Goldilocks learn?",tr:"Söylendiğine göre Altın Saçlı Kız ne öğrendi?",de:"Was hat Goldlöckchen angeblich gelernt?",opts:["A no entrar en una casa ajena sin permiso","A cocinar gachas","A no tener miedo de los osos"],ex:"«Dicen que nunca más volvió a entrar en una casa ajena sin permiso.»"}]}
}},

{id:"cenicienta",icon:"👠",title:"Cenicienta",tt:B("Cinderella","Külkedisi","Aschenputtel"),src:"Charles Perrault",lv:{
A1:{paras:[
{es:"Cenicienta es una chica buena. Vive con su madrastra y sus dos hermanastras. Ellas son malas con ella. Cenicienta limpia la casa todo el día. Un día hay un baile en el palacio. Un hada ayuda a Cenicienta: le da un vestido bonito y zapatos de cristal. Cenicienta baila con el príncipe. A las doce, sale corriendo y pierde un zapato. El príncipe la busca y la encuentra.",
 en:"Cinderella is a good girl. She lives with her stepmother and her two stepsisters. They are mean to her. Cinderella cleans the house all day. One day there is a ball at the palace. A fairy helps Cinderella: she gives her a beautiful dress and glass shoes. Cinderella dances with the prince. At twelve o'clock, she runs away and loses a shoe. The prince looks for her and finds her.",
 tr:"Külkedisi iyi bir kız. Üvey annesi ve iki üvey kız kardeşiyle yaşıyor. Onlar ona kötü davranıyor. Külkedisi bütün gün evi temizliyor. Bir gün sarayda bir balo var. Bir peri Külkedisi'ne yardım ediyor: ona güzel bir elbise ve cam ayakkabılar veriyor. Külkedisi prensle dans ediyor. Saat on ikide koşarak çıkıyor ve bir ayakkabısını kaybediyor. Prens onu arıyor ve buluyor.",
 de:"Aschenputtel ist ein gutes Mädchen. Es wohnt bei seiner Stiefmutter und seinen zwei Stiefschwestern. Sie sind gemein zu ihm. Aschenputtel putzt den ganzen Tag das Haus. Eines Tages gibt es einen Ball im Palast. Eine Fee hilft Aschenputtel: Sie gibt ihm ein schönes Kleid und gläserne Schuhe. Aschenputtel tanzt mit dem Prinzen. Um zwölf Uhr läuft es weg und verliert einen Schuh. Der Prinz sucht es und findet es."}],
vocab:[["la madrastra","stepmother","üvey anne","die Stiefmutter"],["el hada","fairy","peri","die Fee"],["el baile","ball, dance","balo","der Ball"],["el príncipe","prince","prens","der Prinz"]],
quiz:[
{q:"¿Quién ayuda a Cenicienta?",en:"Who helps Cinderella?",tr:"Külkedisi'ne kim yardım ediyor?",de:"Wer hilft Aschenputtel?",opts:["Un hada","Su madrastra","El príncipe"],ex:"«Un hada ayuda a Cenicienta.»"},
{q:"¿Qué pierde Cenicienta?",en:"What does Cinderella lose?",tr:"Külkedisi ne kaybediyor?",de:"Was verliert Aschenputtel?",opts:["Un zapato","Un vestido","Una flor"],ex:"«A las doce, sale corriendo y pierde un zapato.»"}]},
A2:{paras:[
{es:"Había una vez una joven muy amable que vivía con su madrastra y sus dos hermanastras. Ellas la trataban muy mal: la obligaban a limpiar, cocinar y lavar la ropa de todas. Como siempre estaba sucia de ceniza, la llamaban Cenicienta. Un día, el rey organizó un gran baile en el palacio para su hijo. Las hermanastras fueron, pero Cenicienta tuvo que quedarse en casa, llorando.",
 en:"Once upon a time there was a very kind young woman who lived with her stepmother and her two stepsisters. They treated her very badly: they made her clean, cook and wash everyone's clothes. As she was always dirty with ashes, they called her Cinderella. One day, the king organised a great ball at the palace for his son. The stepsisters went, but Cinderella had to stay at home, crying.",
 tr:"Bir zamanlar üvey annesi ve iki üvey kız kardeşiyle yaşayan çok nazik bir genç kız varmış. Onlar ona çok kötü davranırmış: onu temizlik yapmaya, yemek pişirmeye ve herkesin çamaşırını yıkamaya zorlarlarmış. Hep küle bulanmış olduğu için ona Külkedisi derlermiş. Bir gün kral, oğlu için sarayda büyük bir balo düzenlemiş. Üvey kız kardeşler gitmiş ama Külkedisi ağlayarak evde kalmak zorunda kalmış.",
 de:"Es war einmal eine sehr freundliche junge Frau, die bei ihrer Stiefmutter und ihren zwei Stiefschwestern lebte. Sie behandelten sie sehr schlecht: Sie zwangen sie, zu putzen, zu kochen und die Wäsche aller zu waschen. Weil sie immer voller Asche war, nannten sie sie Aschenputtel. Eines Tages veranstaltete der König im Palast einen großen Ball für seinen Sohn. Die Stiefschwestern gingen hin, aber Aschenputtel musste weinend zu Hause bleiben."},
{es:"De repente apareció su hada madrina. Con su varita convirtió una calabaza en un carruaje y unos ratones en caballos, y le dio a Cenicienta un vestido precioso y unos zapatitos de cristal. «Pero vuelve antes de medianoche», le dijo. En el baile, el príncipe solo quiso bailar con ella. A las doce, Cenicienta salió corriendo y perdió un zapato en la escalera. El príncipe buscó por todo el reino a la dueña del zapato, y cuando a Cenicienta le quedó perfecto, se casaron.",
 en:"Suddenly her fairy godmother appeared. With her wand she turned a pumpkin into a carriage and some mice into horses, and she gave Cinderella a beautiful dress and little glass slippers. “But come back before midnight,” she told her. At the ball, the prince only wanted to dance with her. At twelve, Cinderella ran out and lost a slipper on the stairs. The prince searched the whole kingdom for the owner of the slipper, and when it fitted Cinderella perfectly, they got married.",
 tr:"Birden peri annesi ortaya çıkmış. Sihirli değneğiyle bir balkabağını arabaya, birkaç fareyi de ata çevirmiş ve Külkedisi'ne çok güzel bir elbise ve küçük cam ayakkabılar vermiş. «Ama gece yarısından önce dön» demiş. Baloda prens yalnızca onunla dans etmek istemiş. Saat on ikide Külkedisi koşarak çıkmış ve merdivende bir ayakkabısını kaybetmiş. Prens ayakkabının sahibini bütün krallıkta aramış ve ayakkabı Külkedisi'nin ayağına tam olunca evlenmişler.",
 de:"Plötzlich erschien ihre Patentante, eine Fee. Mit ihrem Zauberstab verwandelte sie einen Kürbis in eine Kutsche und ein paar Mäuse in Pferde und gab Aschenputtel ein wunderschönes Kleid und gläserne Schühchen. „Aber komm vor Mitternacht zurück“, sagte sie. Auf dem Ball wollte der Prinz nur mit ihr tanzen. Um zwölf lief Aschenputtel davon und verlor auf der Treppe einen Schuh. Der Prinz suchte im ganzen Reich nach der Besitzerin des Schuhs, und als er Aschenputtel perfekt passte, heirateten sie."}],
vocab:[["la ceniza","ash","kül","die Asche"],["la varita","(magic) wand","sihirli değnek","der Zauberstab"],["la calabaza","pumpkin","balkabağı","der Kürbis"],["la medianoche","midnight","gece yarısı","die Mitternacht"]],
quiz:[
{q:"¿Por qué la llamaban Cenicienta?",en:"Why did they call her Cinderella?",tr:"Ona neden Külkedisi diyorlardı?",de:"Warum nannten sie sie Aschenputtel?",opts:["Porque siempre estaba sucia de ceniza","Porque le gustaba el fuego","Porque era su nombre de nacimiento"],ex:"«Como siempre estaba sucia de ceniza, la llamaban Cenicienta.»"},
{q:"¿En qué convirtió el hada la calabaza?",en:"What did the fairy turn the pumpkin into?",tr:"Peri balkabağını neye çevirdi?",de:"Worin verwandelte die Fee den Kürbis?",opts:["En un carruaje","En un vestido","En un caballo"],ex:"«Con su varita convirtió una calabaza en un carruaje…»"}]},
B1:{paras:[
{es:"Hace mucho tiempo, un hombre viudo se casó con una mujer orgullosa que tenía dos hijas igual de arrogantes que ella. Desde el primer día, la madrastra y sus hijas le hicieron la vida imposible a la hija del hombre, una joven dulce y paciente. Le daban las tareas más duras de la casa y la obligaban a dormir en el desván. Cuando terminaba de trabajar, se sentaba junto a la chimenea, entre las cenizas, y por eso empezaron a llamarla Cenicienta.",
 en:"A long time ago, a widower married a proud woman who had two daughters just as arrogant as she was. From the first day, the stepmother and her daughters made life impossible for the man's daughter, a sweet and patient young woman. They gave her the hardest chores in the house and made her sleep in the attic. When she finished working, she sat by the fireplace, among the ashes, and that's why they began to call her Cinderella.",
 tr:"Uzun zaman önce dul bir adam, kendisi kadar kibirli iki kızı olan mağrur bir kadınla evlenmiş. İlk günden itibaren üvey anne ve kızları, adamın tatlı ve sabırlı kızına hayatı zindan etmişler. Ona evin en ağır işlerini verir ve tavan arasında uyumaya zorlarlarmış. İşini bitirince ocağın yanına, küllerin arasına otururmuş; bu yüzden ona Külkedisi demeye başlamışlar.",
 de:"Vor langer Zeit heiratete ein Witwer eine stolze Frau, die zwei Töchter hatte, die genauso hochmütig waren wie sie. Vom ersten Tag an machten die Stiefmutter und ihre Töchter der Tochter des Mannes, einer sanften und geduldigen jungen Frau, das Leben zur Hölle. Sie gaben ihr die schwersten Arbeiten im Haus und zwangen sie, auf dem Dachboden zu schlafen. Wenn sie mit der Arbeit fertig war, setzte sie sich an den Kamin, mitten in die Asche, und deshalb begann man, sie Aschenputtel zu nennen."},
{es:"Un día llegó una invitación del palacio: el hijo del rey daba un baile. Las hermanastras pasaron días eligiendo vestidos y peinados, y Cenicienta las ayudó a arreglarse sin una sola queja. Cuando se marcharon, se echó a llorar. Entonces apareció su hada madrina, que le pidió una calabaza del huerto, seis ratones y unas lagartijas. Con un toque de varita, todo se transformó en un carruaje dorado con caballos, cochero y lacayos.",
 en:"One day an invitation arrived from the palace: the king's son was giving a ball. The stepsisters spent days choosing dresses and hairstyles, and Cinderella helped them get ready without a single complaint. When they left, she burst into tears. Then her fairy godmother appeared and asked her for a pumpkin from the vegetable garden, six mice and some lizards. With a touch of her wand, everything was transformed into a golden carriage with horses, a coachman and footmen.",
 tr:"Bir gün saraydan bir davetiye gelmiş: kralın oğlu bir balo veriyormuş. Üvey kız kardeşler günlerce elbise ve saç modeli seçmiş, Külkedisi de tek bir şikâyette bulunmadan hazırlanmalarına yardım etmiş. Onlar gidince ağlamaya başlamış. O sırada peri annesi ortaya çıkmış ve ondan bostandan bir balkabağı, altı fare ve birkaç kertenkele istemiş. Değneğinin bir dokunuşuyla hepsi atlı, arabacılı ve uşaklı altın bir arabaya dönüşmüş.",
 de:"Eines Tages kam eine Einladung aus dem Palast: Der Königssohn gab einen Ball. Die Stiefschwestern verbrachten Tage damit, Kleider und Frisuren auszusuchen, und Aschenputtel half ihnen ohne eine einzige Klage beim Zurechtmachen. Als sie gegangen waren, brach sie in Tränen aus. Da erschien ihre Patentante, eine Fee, und bat sie um einen Kürbis aus dem Gemüsegarten, sechs Mäuse und ein paar Eidechsen. Mit einer Berührung des Zauberstabs verwandelte sich alles in eine goldene Kutsche mit Pferden, Kutscher und Dienern."},
{es:"Además, el hada vistió a Cenicienta con un traje de oro y plata y unos zapatitos de cristal, pero le advirtió que el hechizo terminaría a medianoche. En el palacio nadie la reconoció, y el príncipe no se separó de ella en toda la noche. Al oír la primera campanada de las doce, Cenicienta huyó tan deprisa que perdió uno de sus zapatitos. El príncipe ordenó probárselo a todas las jóvenes del reino, y solo entró en el pie de Cenicienta.",
 en:"The fairy also dressed Cinderella in a gown of gold and silver and little glass slippers, but she warned her that the spell would end at midnight. At the palace nobody recognised her, and the prince didn't leave her side all night. On hearing the first stroke of twelve, Cinderella fled so quickly that she lost one of her slippers. The prince ordered it to be tried on every young woman in the kingdom, and it only fitted Cinderella's foot.",
 tr:"Peri ayrıca Külkedisi'ne altın ve gümüşten bir elbise ve küçük cam ayakkabılar giydirmiş, ama büyünün gece yarısı sona ereceği konusunda onu uyarmış. Sarayda kimse onu tanımamış ve prens bütün gece yanından ayrılmamış. Saatin on ikiyi vuran ilk çanını duyunca Külkedisi öyle hızlı kaçmış ki ayakkabılarından birini kaybetmiş. Prens ayakkabının krallıktaki bütün genç kızlara denenmesini emretmiş ve ayakkabı yalnızca Külkedisi'nin ayağına olmuş.",
 de:"Außerdem kleidete die Fee Aschenputtel in ein Gewand aus Gold und Silber und gab ihr gläserne Schühchen, warnte sie aber, dass der Zauber um Mitternacht enden würde. Im Palast erkannte sie niemand, und der Prinz wich die ganze Nacht nicht von ihrer Seite. Als sie den ersten Glockenschlag um zwölf hörte, floh Aschenputtel so schnell, dass sie einen ihrer Schuhe verlor. Der Prinz ließ ihn alle jungen Frauen des Reiches anprobieren, und er passte nur an Aschenputtels Fuß."}],
vocab:[["el desván","attic","tavan arası","der Dachboden"],["arreglarse","to get ready, to dress up","hazırlanmak","sich zurechtmachen"],["la lagartija","small lizard","kertenkele","die Eidechse"],["la campanada","stroke (of a bell)","çan sesi","der Glockenschlag"]],
quiz:[
{q:"¿Dónde dormía Cenicienta?",en:"Where did Cinderella sleep?",tr:"Külkedisi nerede uyuyordu?",de:"Wo schlief Aschenputtel?",opts:["En el desván","En el palacio","En la cocina"],ex:"«…la obligaban a dormir en el desván.»"},
{q:"¿Qué le pidió el hada a Cenicienta?",en:"What did the fairy ask Cinderella for?",tr:"Peri Külkedisi'nden ne istedi?",de:"Worum bat die Fee Aschenputtel?",opts:["Una calabaza, seis ratones y unas lagartijas","Una manzana y un pájaro","Un vestido de su madre"],ex:"«…le pidió una calabaza del huerto, seis ratones y unas lagartijas.»"},
{q:"¿Cuándo huyó Cenicienta del baile?",en:"When did Cinderella flee from the ball?",tr:"Külkedisi balodan ne zaman kaçtı?",de:"Wann floh Aschenputtel vom Ball?",opts:["Al oír la primera campanada de las doce","Al amanecer","Cuando llegaron sus hermanastras"],ex:"«Al oír la primera campanada de las doce, Cenicienta huyó…»"}]},
B2:{paras:[
{es:"Érase una vez un caballero que, tras quedarse viudo, volvió a casarse con la mujer más altiva y engreída que jamás se hubiera visto. Ella aportó al matrimonio dos hijas que se le parecían en todo, mientras que la hija del caballero había heredado la bondad y la dulzura de su difunta madre. No había pasado ni una semana desde la boda cuando la madrastra, incapaz de soportar unas virtudes que hacían parecer aún más odiosas a sus propias hijas, la relegó a las tareas más humildes de la casa.",
 en:"Once upon a time there was a gentleman who, after being widowed, remarried the haughtiest and most conceited woman ever seen. She brought to the marriage two daughters who resembled her in everything, while the gentleman's daughter had inherited the kindness and sweetness of her late mother. Not even a week had passed since the wedding when the stepmother, unable to bear virtues that made her own daughters seem even more hateful, relegated her to the lowliest chores in the house.",
 tr:"Bir zamanlar dul kaldıktan sonra görülmüş en mağrur ve kendini beğenmiş kadınla yeniden evlenen bir soylu varmış. Kadın evliliğe her şeyiyle kendisine benzeyen iki kız getirmiş; soylunun kızı ise rahmetli annesinin iyiliğini ve tatlılığını miras almış. Düğünün üzerinden bir hafta bile geçmemişken, kendi kızlarını daha da çekilmez gösteren bu erdemlere katlanamayan üvey anne, kızı evin en aşağılık işlerine mahkûm etmiş.",
 de:"Es war einmal ein Edelmann, der nach dem Tod seiner Frau die hochmütigste und eingebildetste Frau heiratete, die man je gesehen hatte. Sie brachte zwei Töchter mit in die Ehe, die ihr in allem glichen, während die Tochter des Edelmanns die Güte und Sanftheit ihrer verstorbenen Mutter geerbt hatte. Die Hochzeit lag noch keine Woche zurück, da verbannte die Stiefmutter, die Tugenden nicht ertragen konnte, neben denen ihre eigenen Töchter noch abscheulicher wirkten, das Mädchen zu den niedrigsten Arbeiten im Haus."},
{es:"La joven fregaba suelos, cargaba leña y dormía sobre un jergón de paja en el desván, mientras sus hermanastras descansaban en habitaciones con espejos de cuerpo entero. Al acabar la jornada, solía acurrucarse junto al fuego, entre las cenizas, de ahí que la más cruel de las dos la apodara Cenicienta. Cuando el hijo del rey anunció un baile, las hermanastras no hablaron de otra cosa durante semanas, y fue Cenicienta, con su buen gusto, quien las peinó para la ocasión.",
 en:"The young woman scrubbed floors, carried firewood and slept on a straw mattress in the attic, while her stepsisters rested in rooms with full-length mirrors. At the end of the day, she would curl up by the fire, among the ashes, which is why the crueller of the two nicknamed her Cinderella. When the king's son announced a ball, the stepsisters talked of nothing else for weeks, and it was Cinderella, with her good taste, who did their hair for the occasion.",
 tr:"Genç kız yerleri siler, odun taşır ve tavan arasında samandan bir şiltenin üstünde uyurmuş; üvey kız kardeşleri ise boy aynalı odalarda dinlenirmiş. Gün bitince ateşin yanına, küllerin arasına kıvrılırmış; ikisinden daha acımasız olanı ona bu yüzden Külkedisi lakabını takmış. Kralın oğlu bir balo düzenleyeceğini duyurunca üvey kız kardeşler haftalarca başka bir şeyden söz etmemiş ve bu özel gün için saçlarını yapan da zevkli Külkedisi olmuş.",
 de:"Die junge Frau schrubbte Böden, schleppte Feuerholz und schlief auf einem Strohsack auf dem Dachboden, während sich ihre Stiefschwestern in Zimmern mit großen Standspiegeln ausruhten. Am Ende des Tages kauerte sie sich gewöhnlich ans Feuer, mitten in die Asche, weshalb die grausamere der beiden ihr den Spitznamen Aschenputtel gab. Als der Königssohn einen Ball ankündigte, sprachen die Stiefschwestern wochenlang von nichts anderem, und es war Aschenputtel mit ihrem guten Geschmack, die ihnen für diesen Anlass die Haare frisierte."},
{es:"En cuanto la carroza de su familia se perdió de vista, la muchacha rompió a llorar. Fue entonces cuando se le apareció su madrina, que era hada. Sin dar explicaciones, le pidió que trajera una calabaza, la vació y, con un golpe de varita, la convirtió en una carroza dorada; seis ratones se transformaron en caballos, una rata bigotuda en cochero y seis lagartijas en lacayos. Por último, le regaló un vestido deslumbrante y unos zapatitos de cristal, con una única condición: que regresara antes de que dieran las doce.",
 en:"As soon as her family's coach was out of sight, the girl burst into tears. It was then that her godmother, who was a fairy, appeared to her. Without any explanation, she asked her to bring a pumpkin, hollowed it out and, with a tap of her wand, turned it into a golden coach; six mice became horses, a whiskery rat a coachman and six lizards footmen. Finally, she gave her a dazzling dress and little glass slippers, on one single condition: that she come back before the clock struck twelve.",
 tr:"Ailesinin arabası gözden kaybolur kaybolmaz genç kız ağlamaya başlamış. İşte o zaman peri olan vaftiz annesi karşısına çıkmış. Hiçbir açıklama yapmadan ondan bir balkabağı getirmesini istemiş, içini oymuş ve değneğinin bir darbesiyle onu altın bir arabaya çevirmiş; altı fare ata, bıyıklı bir sıçan arabacıya, altı kertenkele de uşağa dönüşmüş. Son olarak ona göz kamaştırıcı bir elbise ve küçük cam ayakkabılar armağan etmiş, tek bir şartla: saat on ikiyi vurmadan geri dönmesi.",
 de:"Kaum war die Kutsche ihrer Familie außer Sichtweite, brach das Mädchen in Tränen aus. Da erschien ihr ihre Patentante, die eine Fee war. Ohne Erklärungen bat sie sie, einen Kürbis zu holen, höhlte ihn aus und verwandelte ihn mit einem Schlag ihres Zauberstabs in eine goldene Kutsche; sechs Mäuse wurden zu Pferden, eine schnurrbärtige Ratte zum Kutscher und sechs Eidechsen zu Dienern. Zuletzt schenkte sie ihr ein strahlendes Kleid und gläserne Schühchen, unter einer einzigen Bedingung: dass sie zurückkehre, bevor es zwölf schlug."},
{es:"Su llegada al palacio causó tal revuelo que hasta los músicos dejaron de tocar. El príncipe, fascinado, no bailó con nadie más. Tanto se divertía Cenicienta que, cuando quiso darse cuenta, el reloj ya estaba dando las doce. Salió corriendo y, en su huida, dejó caer uno de sus zapatitos en la escalinata. El príncipe juró casarse con la dueña de aquel zapato y lo hizo probar a todas las damas del reino. Las hermanastras forzaron sus pies en vano; a Cenicienta, en cambio, le entró como un guante. Y, fiel a su bondad, perdonó a sus hermanastras.",
 en:"Her arrival at the palace caused such a stir that even the musicians stopped playing. The prince, fascinated, danced with no one else. Cinderella was enjoying herself so much that, before she knew it, the clock was already striking twelve. She ran out and, in her flight, dropped one of her slippers on the grand staircase. The prince swore to marry the owner of that slipper and had every lady in the kingdom try it on. The stepsisters forced their feet in vain; on Cinderella, however, it fitted like a glove. And, true to her kindness, she forgave her stepsisters.",
 tr:"Saraya gelişi öyle bir heyecan yaratmış ki müzisyenler bile çalmayı bırakmış. Büyülenen prens başka kimseyle dans etmemiş. Külkedisi o kadar eğleniyormuş ki daha ne olduğunu anlamadan saat on ikiyi vurmaya başlamış. Koşarak çıkmış ve kaçarken ayakkabılarından birini büyük merdivende düşürmüş. Prens o ayakkabının sahibiyle evleneceğine yemin etmiş ve ayakkabıyı krallıktaki bütün hanımlara denetmiş. Üvey kız kardeşler ayaklarını boşuna zorlamış; Külkedisi'ne ise eldiven gibi oturmuş. Ve iyi kalpliliğine sadık kalarak üvey kız kardeşlerini affetmiş.",
 de:"Ihre Ankunft im Palast sorgte für solches Aufsehen, dass sogar die Musiker aufhörten zu spielen. Der Prinz war fasziniert und tanzte mit niemand anderem. Aschenputtel amüsierte sich so sehr, dass die Uhr schon zwölf schlug, ehe sie sich's versah. Sie lief davon und verlor auf der Flucht einen ihrer Schuhe auf der großen Freitreppe. Der Prinz schwor, die Besitzerin dieses Schuhs zu heiraten, und ließ ihn alle Damen des Reiches anprobieren. Die Stiefschwestern zwängten vergeblich ihre Füße hinein; Aschenputtel dagegen passte er wie angegossen. Und ihrer Güte treu verzieh sie ihren Stiefschwestern."}],

{id:"blancanieves",icon:"🍎",title:"Blancanieves",tt:B("Snow White","Pamuk Prenses","Schneewittchen"),src:"Hermanos Grimm",lv:{
A1:{paras:[
{es:"Blancanieves es una princesa muy guapa. Su madrastra, la reina, tiene un espejo mágico. Un día el espejo dice: «Blancanieves es la más bella». La reina está furiosa. Blancanieves escapa al bosque y vive con siete enanitos. Un día, la reina le da una manzana envenenada. Blancanieves come y se duerme. Un príncipe la encuentra y ella se despierta.",
 en:"Snow White is a very beautiful princess. Her stepmother, the queen, has a magic mirror. One day the mirror says: “Snow White is the fairest.” The queen is furious. Snow White escapes to the forest and lives with seven dwarfs. One day, the queen gives her a poisoned apple. Snow White eats and falls asleep. A prince finds her and she wakes up.",
 tr:"Pamuk Prenses çok güzel bir prenses. Üvey annesi olan kraliçenin sihirli bir aynası var. Bir gün ayna «En güzel Pamuk Prenses» diyor. Kraliçe çok öfkeli. Pamuk Prenses ormana kaçıyor ve yedi cüceyle yaşıyor. Bir gün kraliçe ona zehirli bir elma veriyor. Pamuk Prenses yiyor ve uykuya dalıyor. Bir prens onu buluyor ve o uyanıyor.",
 de:"Schneewittchen ist eine sehr schöne Prinzessin. Ihre Stiefmutter, die Königin, hat einen Zauberspiegel. Eines Tages sagt der Spiegel: „Schneewittchen ist die Schönste.“ Die Königin ist wütend. Schneewittchen flieht in den Wald und lebt bei sieben Zwergen. Eines Tages gibt ihr die Königin einen vergifteten Apfel. Schneewittchen isst und schläft ein. Ein Prinz findet sie und sie wacht auf."}],
vocab:[["el espejo","mirror","ayna","der Spiegel"],["la reina","queen","kraliçe","die Königin"],["el enanito","dwarf","cüce","der Zwerg"],["envenenado","poisoned","zehirli","vergiftet"]],
quiz:[
{q:"¿Con quién vive Blancanieves en el bosque?",en:"Who does Snow White live with in the forest?",tr:"Pamuk Prenses ormanda kiminle yaşıyor?",de:"Bei wem lebt Schneewittchen im Wald?",opts:["Con siete enanitos","Con un cazador","Con su abuela"],ex:"«Blancanieves escapa al bosque y vive con siete enanitos.»"},
{q:"¿Qué le da la reina?",en:"What does the queen give her?",tr:"Kraliçe ona ne veriyor?",de:"Was gibt ihr die Königin?",opts:["Una manzana envenenada","Un espejo","Un vestido"],ex:"«Un día, la reina le da una manzana envenenada.»"}]},
A2:{paras:[
{es:"Había una vez una princesa que tenía la piel blanca como la nieve, por eso se llamaba Blancanieves. Su madrastra, la reina, era muy guapa pero muy vanidosa. Cada día le preguntaba a su espejo mágico: «Espejito, espejito, ¿quién es la más bella del reino?». Un día, el espejo respondió: «Blancanieves». La reina se puso furiosa y ordenó a un cazador llevar a la princesa al bosque y matarla.",
 en:"Once upon a time there was a princess whose skin was as white as snow, so she was called Snow White. Her stepmother, the queen, was very beautiful but very vain. Every day she asked her magic mirror: “Mirror, mirror, who is the fairest in the kingdom?” One day, the mirror answered: “Snow White.” The queen became furious and ordered a huntsman to take the princess to the forest and kill her.",
 tr:"Bir zamanlar teni kar gibi beyaz olan bir prenses varmış, bu yüzden adı Pamuk Prenses'miş. Üvey annesi olan kraliçe çok güzel ama çok kibirliymiş. Her gün sihirli aynasına sorarmış: «Ayna ayna, söyle bana, krallığın en güzeli kim?» Bir gün ayna «Pamuk Prenses» diye cevap vermiş. Kraliçe öfkeden deliye dönmüş ve bir avcıya prensesi ormana götürüp öldürmesini emretmiş.",
 de:"Es war einmal eine Prinzessin, deren Haut so weiß wie Schnee war, deshalb hieß sie Schneewittchen. Ihre Stiefmutter, die Königin, war sehr schön, aber sehr eitel. Jeden Tag fragte sie ihren Zauberspiegel: „Spieglein, Spieglein, wer ist die Schönste im ganzen Reich?“ Eines Tages antwortete der Spiegel: „Schneewittchen.“ Die Königin wurde wütend und befahl einem Jäger, die Prinzessin in den Wald zu bringen und zu töten."},
{es:"Pero el cazador sintió pena y la dejó escapar. Blancanieves encontró una casita donde vivían siete enanitos, que la cuidaron como a una hermana. Cuando la reina descubrió que estaba viva, se disfrazó de anciana y le llevó una manzana envenenada. Blancanieves la mordió y cayó al suelo. Los enanitos, muy tristes, la pusieron en una caja de cristal. Un día pasó un príncipe; al mover la caja, el trozo de manzana salió de su boca y Blancanieves despertó.",
 en:"But the huntsman felt sorry for her and let her escape. Snow White found a little house where seven dwarfs lived, who looked after her like a sister. When the queen found out she was alive, she disguised herself as an old woman and brought her a poisoned apple. Snow White bit it and fell to the ground. The dwarfs, very sad, put her in a glass case. One day a prince passed by; when the case was moved, the piece of apple came out of her mouth and Snow White woke up.",
 tr:"Ama avcı ona acımış ve kaçmasına izin vermiş. Pamuk Prenses, yedi cücenin yaşadığı küçük bir ev bulmuş; cüceler ona kız kardeşleri gibi bakmışlar. Kraliçe onun yaşadığını öğrenince yaşlı bir kadın kılığına girmiş ve ona zehirli bir elma götürmüş. Pamuk Prenses elmayı ısırmış ve yere yığılmış. Çok üzülen cüceler onu camdan bir sandığa koymuşlar. Bir gün oradan bir prens geçmiş; sandık kımıldayınca elma parçası ağzından çıkmış ve Pamuk Prenses uyanmış.",
 de:"Aber der Jäger hatte Mitleid und ließ sie entkommen. Schneewittchen fand ein kleines Haus, in dem sieben Zwerge lebten, die sich um sie kümmerten wie um eine Schwester. Als die Königin herausfand, dass sie noch lebte, verkleidete sie sich als alte Frau und brachte ihr einen vergifteten Apfel. Schneewittchen biss hinein und fiel zu Boden. Die Zwerge legten sie sehr traurig in einen gläsernen Sarg. Eines Tages kam ein Prinz vorbei; als der Sarg bewegt wurde, fiel das Apfelstück aus ihrem Mund und Schneewittchen erwachte."}],

quiz:[
{q:"¿Qué le ordenó la reina al cazador?",en:"What did the queen order the huntsman to do?",tr:"Kraliçe avcıya ne emretti?",de:"Was befahl die Königin dem Jäger?",opts:["Llevar a la princesa al bosque y matarla","Traer a la princesa al palacio","Buscar una manzana"],ex:"«…ordenó a un cazador llevar a la princesa al bosque y matarla.»"},
{q:"¿Cómo despertó Blancanieves?",en:"How did Snow White wake up?",tr:"Pamuk Prenses nasıl uyandı?",de:"Wie erwachte Schneewittchen?",opts:["El trozo de manzana salió de su boca","Los enanitos la llamaron","Bebió agua mágica"],ex:"«…al mover la caja, el trozo de manzana salió de su boca y Blancanieves despertó.»"}]},
B1:{paras:[
{es:"Un día de invierno, una reina cosía junto a una ventana con marco de ébano cuando se pinchó un dedo. Al ver tres gotas de sangre sobre la nieve, deseó tener una hija blanca como la nieve, roja como la sangre y con el pelo negro como el ébano. Poco después nació Blancanieves, pero la reina murió. El rey se casó con otra mujer, bellísima pero tan orgullosa que no soportaba que nadie fuera más guapa que ella.",
 en:"One winter's day, a queen was sewing by a window with an ebony frame when she pricked her finger. Seeing three drops of blood on the snow, she wished for a daughter as white as snow, as red as blood and with hair as black as ebony. Soon afterwards Snow White was born, but the queen died. The king married another woman, extremely beautiful but so proud that she couldn't bear anyone being prettier than her.",
 tr:"Bir kış günü bir kraliçe, abanoz çerçeveli bir pencerenin yanında dikiş dikerken parmağını iğneyle batırmış. Karın üstündeki üç damla kanı görünce kar gibi beyaz, kan gibi kırmızı ve saçları abanoz gibi siyah bir kızı olmasını dilemiş. Kısa süre sonra Pamuk Prenses doğmuş, ama kraliçe ölmüş. Kral, çok güzel ama kimsenin kendisinden güzel olmasına katlanamayacak kadar kibirli başka bir kadınla evlenmiş.",
 de:"An einem Wintertag nähte eine Königin an einem Fenster mit einem Rahmen aus Ebenholz, als sie sich in den Finger stach. Als sie drei Blutstropfen auf dem Schnee sah, wünschte sie sich eine Tochter, so weiß wie Schnee, so rot wie Blut und mit Haaren so schwarz wie Ebenholz. Bald darauf wurde Schneewittchen geboren, aber die Königin starb. Der König heiratete eine andere Frau, wunderschön, aber so stolz, dass sie es nicht ertrug, wenn jemand schöner war als sie."},
{es:"La nueva reina tenía un espejo mágico que siempre decía la verdad. Durante años le aseguró que ella era la más hermosa, hasta que un día le contestó que Blancanieves la superaba. Llena de envidia, la reina mandó a un cazador que se la llevara al bosque y acabara con ella. Sin embargo, el cazador no se atrevió y le dijo que huyera. Tras vagar por el bosque, la niña llegó a la casa de siete enanitos que trabajaban en las minas, y se quedó a vivir con ellos.",
 en:"The new queen had a magic mirror that always told the truth. For years it assured her that she was the most beautiful, until one day it answered that Snow White surpassed her. Full of envy, the queen sent a huntsman to take her into the forest and do away with her. However, the huntsman didn't dare and told her to run away. After wandering through the forest, the girl reached the house of seven dwarfs who worked in the mines, and she stayed to live with them.",
 tr:"Yeni kraliçenin her zaman doğruyu söyleyen sihirli bir aynası varmış. Ayna yıllarca ona en güzelin kendisi olduğunu söylemiş, ta ki bir gün Pamuk Prenses'in ondan daha güzel olduğunu söyleyene kadar. Kıskançlıktan çılgına dönen kraliçe, bir avcıya kızı ormana götürüp öldürmesini emretmiş. Ama avcı buna cesaret edememiş ve kıza kaçmasını söylemiş. Ormanda bir süre dolaştıktan sonra kız, madenlerde çalışan yedi cücenin evine varmış ve onlarla yaşamaya başlamış.",
 de:"Die neue Königin hatte einen Zauberspiegel, der immer die Wahrheit sagte. Jahrelang versicherte er ihr, sie sei die Schönste, bis er eines Tages antwortete, Schneewittchen sei schöner als sie. Voller Neid schickte die Königin einen Jäger, der das Mädchen in den Wald bringen und es umbringen sollte. Doch der Jäger wagte es nicht und sagte ihr, sie solle fliehen. Nachdem das Mädchen durch den Wald geirrt war, kam es zum Haus von sieben Zwergen, die in den Bergwerken arbeiteten, und blieb bei ihnen wohnen."},
{es:"El espejo, por supuesto, le contó a la reina que Blancanieves seguía viva. Disfrazada de vendedora, la reina fue a la casita con una manzana preciosa: la mitad roja estaba envenenada. Blancanieves dio un mordisco y cayó como muerta. Los enanitos no quisieron enterrarla y la colocaron en un ataúd de cristal. Tiempo después, un príncipe pidió llevársela; sus criados tropezaron al cargar el ataúd, el trozo de manzana salió de su garganta y Blancanieves abrió los ojos.",
 en:"The mirror, of course, told the queen that Snow White was still alive. Disguised as a pedlar, the queen went to the little house with a beautiful apple: the red half was poisoned. Snow White took a bite and fell down as if dead. The dwarfs didn't want to bury her and placed her in a glass coffin. Some time later, a prince asked to take her with him; his servants stumbled while carrying the coffin, the piece of apple came out of her throat and Snow White opened her eyes.",
 tr:"Ayna elbette kraliçeye Pamuk Prenses'in hâlâ yaşadığını söylemiş. Satıcı kılığına giren kraliçe, harika görünen bir elmayla küçük eve gitmiş: elmanın kırmızı yarısı zehirliymiş. Pamuk Prenses bir ısırık almış ve ölü gibi yere düşmüş. Cüceler onu gömmek istememiş ve camdan bir tabuta koymuşlar. Bir süre sonra bir prens onu götürmek için izin istemiş; uşakları tabutu taşırken tökezlemiş, elma parçası boğazından çıkmış ve Pamuk Prenses gözlerini açmış.",
 de:"Der Spiegel verriet der Königin natürlich, dass Schneewittchen noch lebte. Als Händlerin verkleidet ging die Königin mit einem wunderschönen Apfel zum Häuschen: Die rote Hälfte war vergiftet. Schneewittchen biss hinein und fiel wie tot um. Die Zwerge wollten sie nicht begraben und legten sie in einen gläsernen Sarg. Einige Zeit später bat ein Prinz darum, sie mitnehmen zu dürfen; seine Diener stolperten beim Tragen des Sarges, das Apfelstück löste sich aus ihrem Hals, und Schneewittchen öffnete die Augen."}],

{q:"¿Qué deseó la primera reina?",en:"What did the first queen wish for?",tr:"İlk kraliçe ne diledi?",de:"Was wünschte sich die erste Königin?",opts:["Una hija blanca como la nieve, roja como la sangre y de pelo negro","Un espejo mágico","Que llegara la primavera"],ex:"«…deseó tener una hija blanca como la nieve, roja como la sangre y con el pelo negro como el ébano.»"},
{q:"¿Dónde trabajaban los enanitos?",en:"Where did the dwarfs work?",tr:"Cüceler nerede çalışıyordu?",de:"Wo arbeiteten die Zwerge?",opts:["En las minas","En el palacio","En el campo"],ex:"«…siete enanitos que trabajaban en las minas…»"},
{q:"¿Qué parte de la manzana estaba envenenada?",en:"Which part of the apple was poisoned?",tr:"Elmanın hangi kısmı zehirliydi?",de:"Welcher Teil des Apfels war vergiftet?",opts:["La mitad roja","La mitad blanca","Solo la piel"],ex:"«…la mitad roja estaba envenenada.»"}]},
B2:{paras:[
{es:"Cuentan los hermanos Grimm que, en pleno invierno, mientras los copos caían como plumas, una reina bordaba junto a una ventana con marco de ébano. Distraída, se pinchó un dedo y tres gotas de sangre cayeron sobre la nieve del alféizar. Aquel contraste le pareció tan hermoso que pidió en silencio una hija blanca como la nieve, roja como la sangre y negra como el ébano. Su deseo se cumplió, pero la reina no llegó a ver crecer a Blancanieves: murió poco después del parto.",
 en:"The Brothers Grimm tell that, in the depths of winter, while the snowflakes fell like feathers, a queen was embroidering by a window with an ebony frame. Distracted, she pricked her finger and three drops of blood fell onto the snow on the windowsill. That contrast seemed so beautiful to her that she silently wished for a daughter as white as snow, as red as blood and as black as ebony. Her wish came true, but the queen never saw Snow White grow up: she died shortly after giving birth.",
 tr:"Grimm kardeşlerin anlattığına göre karlar tüy gibi yağarken, karakışın ortasında bir kraliçe abanoz çerçeveli bir pencerenin yanında nakış işliyormuş. Dalgınlıkla parmağına iğne batırmış ve pencere pervazındaki karın üstüne üç damla kan düşmüş. Bu tezat ona öyle güzel gelmiş ki içinden kar gibi beyaz, kan gibi kırmızı ve abanoz gibi siyah bir kızı olmasını dilemiş. Dileği gerçekleşmiş, ama kraliçe Pamuk Prenses'in büyüdüğünü göremeden doğumdan kısa süre sonra ölmüş.",
 de:"Die Brüder Grimm erzählen, dass mitten im Winter, als die Schneeflocken wie Federn vom Himmel fielen, eine Königin an einem Fenster mit einem Rahmen aus Ebenholz stickte. Unachtsam stach sie sich in den Finger, und drei Blutstropfen fielen auf den Schnee auf dem Fensterbrett. Dieser Kontrast erschien ihr so schön, dass sie sich still eine Tochter wünschte, so weiß wie Schnee, so rot wie Blut und so schwarz wie Ebenholz. Ihr Wunsch ging in Erfüllung, doch die Königin erlebte nicht, wie Schneewittchen heranwuchs: Sie starb kurz nach der Geburt."},
{es:"Al cabo de un año, el rey volvió a casarse con una mujer de una belleza deslumbrante, aunque soberbia y vanidosa. Poseía un espejo encantado al que interrogaba a diario, y mientras este le confirmara que era la más bella del reino, vivía en paz. Pero Blancanieves fue creciendo, y la mañana en que el espejo pronunció su nombre, a la reina se le revolvieron las entrañas. Desde entonces, la envidia y el orgullo crecieron en su corazón como la mala hierba, hasta no dejarla descansar ni de día ni de noche.",
 en:"After a year, the king remarried a woman of dazzling beauty, though arrogant and vain. She owned an enchanted mirror that she questioned every day, and as long as it confirmed that she was the fairest in the kingdom, she lived in peace. But Snow White kept growing, and on the morning the mirror spoke her name, the queen's insides churned. From then on, envy and pride grew in her heart like weeds, until they gave her no rest by day or by night.",
 tr:"Bir yıl sonra kral, göz kamaştırıcı güzellikte ama kibirli ve kendini beğenmiş bir kadınla yeniden evlenmiş. Kadının her gün sorguya çektiği büyülü bir aynası varmış ve ayna ona krallığın en güzelinin kendisi olduğunu onayladığı sürece huzur içinde yaşarmış. Ama Pamuk Prenses büyüdükçe büyümüş ve aynanın onun adını söylediği sabah kraliçenin içi altüst olmuş. O günden sonra kıskançlık ve gurur yüreğinde yabani ot gibi büyümüş, ta ki onu ne gece ne gündüz rahat bırakmayana kadar.",
 de:"Nach einem Jahr heiratete der König erneut, eine Frau von blendender Schönheit, aber hochmütig und eitel. Sie besaß einen verzauberten Spiegel, den sie täglich befragte, und solange er ihr bestätigte, dass sie die Schönste im Reich sei, lebte sie in Frieden. Doch Schneewittchen wuchs heran, und an dem Morgen, an dem der Spiegel ihren Namen nannte, drehte sich der Königin der Magen um. Von da an wucherten Neid und Hochmut in ihrem Herzen wie Unkraut, bis sie ihr weder bei Tag noch bei Nacht Ruhe ließen."},
{es:"Ordenó a un cazador que llevara a la muchacha al bosque y le trajera su corazón como prueba. El hombre, conmovido por sus súplicas, la dejó marchar y engañó a la reina con el corazón de un jabato. Blancanieves, tras vagar sin rumbo entre árboles y espinos, dio con una casita diminuta donde todo estaba impecable. Sus dueños, siete enanitos que excavaban en las montañas en busca de minerales, le permitieron quedarse a cambio de llevar la casa, aunque le advirtieron que no abriera la puerta a nadie.",
 en:"She ordered a huntsman to take the girl into the forest and bring back her heart as proof. The man, moved by her pleas, let her go and deceived the queen with the heart of a young boar. Snow White, after wandering aimlessly among trees and thorns, came across a tiny house where everything was spotless. Its owners, seven dwarfs who dug in the mountains in search of ore, let her stay in exchange for keeping house, although they warned her not to open the door to anyone.",
 tr:"Bir avcıya genç kızı ormana götürmesini ve kanıt olarak kalbini getirmesini emretmiş. Kızın yalvarışlarından etkilenen adam onu bırakmış ve kraliçeyi bir yaban domuzu yavrusunun kalbiyle kandırmış. Ağaçlar ve dikenler arasında amaçsızca dolaşan Pamuk Prenses, her şeyin tertemiz olduğu minicik bir eve rastlamış. Evin sahipleri, dağlarda maden arayan yedi cüce, ev işlerini görmesi karşılığında kalmasına izin vermiş, ama kapıyı kimseye açmaması konusunda onu uyarmışlar.",
 de:"Sie befahl einem Jäger, das Mädchen in den Wald zu bringen und ihr als Beweis sein Herz mitzubringen. Der Mann, gerührt von ihrem Flehen, ließ sie gehen und täuschte die Königin mit dem Herzen eines Frischlings. Schneewittchen irrte ziellos zwischen Bäumen und Dornen umher, bis es auf ein winziges Häuschen stieß, in dem alles blitzsauber war. Seine Besitzer, sieben Zwerge, die in den Bergen nach Erz gruben, ließen es bleiben, wenn es ihnen den Haushalt führte, warnten es aber, niemandem die Tür zu öffnen."},
{es:"Sin embargo, el espejo no tardó en delatarla. La reina, ducha en las artes oscuras, envenenó la mitad de una manzana y, disfrazada de campesina, convenció a la joven para que la probara. Bastó un bocado para que Blancanieves cayera inerte. Los enanitos, desconsolados, no se resignaron a enterrarla y la velaron en un ataúd de cristal. Un día, un príncipe que pasaba por allí quedó prendado de ella y rogó que se la dejaran llevar; al tropezar uno de sus criados, el trozo envenenado se desprendió de su garganta y ella volvió a la vida.",
 en:"However, the mirror soon gave her away. The queen, well versed in the dark arts, poisoned half of an apple and, disguised as a peasant woman, persuaded the girl to taste it. One bite was enough for Snow White to fall lifeless. The dwarfs, heartbroken, couldn't bring themselves to bury her and kept watch over her in a glass coffin. One day, a prince who was passing by fell in love with her and begged to be allowed to take her; when one of his servants stumbled, the poisoned piece came loose from her throat and she came back to life.",
 tr:"Ne var ki ayna çok geçmeden onu ele vermiş. Kara büyüde usta olan kraliçe bir elmanın yarısını zehirlemiş ve köylü kadın kılığına girerek genç kızı elmayı tatmaya ikna etmiş. Tek bir ısırık Pamuk Prenses'in cansız yere yığılmasına yetmiş. Kederli cüceler onu gömmeye razı olmamış ve camdan bir tabutta başında beklemişler. Bir gün oradan geçen bir prens ona vurulmuş ve onu götürmesine izin vermeleri için yalvarmış; uşaklarından biri tökezleyince zehirli parça boğazından çıkmış ve kız yeniden hayata dönmüş.",
 de:"Doch der Spiegel verriet sie bald. Die Königin, in den dunklen Künsten bewandert, vergiftete die Hälfte eines Apfels und überredete das Mädchen als Bäuerin verkleidet, ihn zu probieren. Ein Bissen genügte, und Schneewittchen sank leblos zu Boden. Die untröstlichen Zwerge brachten es nicht übers Herz, sie zu begraben, und hielten in einem gläsernen Sarg Wache bei ihr. Eines Tages verliebte sich ein vorbeikommender Prinz in sie und bat, sie mitnehmen zu dürfen; als einer seiner Diener stolperte, löste sich das giftige Stück aus ihrem Hals, und sie kehrte ins Leben zurück."}],
