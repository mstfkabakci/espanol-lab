{id:"hansel",icon:"🍬",title:"Hansel y Gretel",tt:B("Hansel and Gretel","Hansel ile Gretel","Hänsel und Gretel"),src:"Hermanos Grimm",lv:{
A1:{paras:[
{es:"Hansel y Gretel son hermanos. Su familia es muy pobre. Un día, los niños se pierden en el bosque. Encuentran una casa de pan y dulces. Tienen mucha hambre y comen. Pero en la casa vive una bruja mala. La bruja quiere comerse a Hansel. Gretel es muy lista: empuja a la bruja al horno. Los niños vuelven a casa con su padre.",
 en:"Hansel and Gretel are brother and sister. Their family is very poor. One day, the children get lost in the forest. They find a house made of bread and sweets. They are very hungry and they eat. But a wicked witch lives in the house. The witch wants to eat Hansel. Gretel is very clever: she pushes the witch into the oven. The children go back home to their father.",
 tr:"Hansel ile Gretel kardeş. Aileleri çok fakir. Bir gün çocuklar ormanda kayboluyor. Ekmekten ve şekerlemeden yapılmış bir ev buluyorlar. Çok açlar ve yiyorlar. Ama evde kötü bir cadı yaşıyor. Cadı Hansel'i yemek istiyor. Gretel çok akıllı: cadıyı fırına itiyor. Çocuklar evlerine, babalarının yanına dönüyor.",
 de:"Hänsel und Gretel sind Geschwister. Ihre Familie ist sehr arm. Eines Tages verlaufen sich die Kinder im Wald. Sie finden ein Haus aus Brot und Süßigkeiten. Sie haben großen Hunger und essen. Aber in dem Haus wohnt eine böse Hexe. Die Hexe will Hänsel fressen. Gretel ist sehr klug: Sie stößt die Hexe in den Ofen. Die Kinder kehren nach Hause zu ihrem Vater zurück."}],
vocab:[["la bruja","witch","cadı","die Hexe"],["el horno","oven","fırın","der Ofen"],["perderse","to get lost","kaybolmak","sich verlaufen"],["los dulces","sweets","şekerlemeler, tatlılar","die Süßigkeiten"]],
quiz:[
{q:"¿De qué es la casa del bosque?",en:"What is the house in the forest made of?",tr:"Ormandaki ev neden yapılmış?",de:"Woraus ist das Haus im Wald?",opts:["De pan y dulces","De piedra","De paja"],ex:"«Encuentran una casa de pan y dulces.»"},
{q:"¿Qué hace Gretel?",en:"What does Gretel do?",tr:"Gretel ne yapıyor?",de:"Was macht Gretel?",opts:["Empuja a la bruja al horno","Se come la casa","Llama a su padre"],ex:"«Gretel es muy lista: empuja a la bruja al horno.»"}]},
A2:{paras:[
{es:"Había una vez un leñador muy pobre que vivía con su mujer y sus dos hijos, Hansel y Gretel. Un año no había comida para todos, y la madrastra convenció al padre para dejar a los niños en el bosque. Pero Hansel lo oyó todo. Por el camino, tiró migas de pan para encontrar después el camino de vuelta. Por desgracia, los pájaros se las comieron, y los niños se perdieron.",
 en:"Once upon a time there was a very poor woodcutter who lived with his wife and his two children, Hansel and Gretel. One year there wasn't enough food for everyone, and the stepmother persuaded the father to leave the children in the forest. But Hansel heard everything. Along the way, he dropped breadcrumbs so they could find the way back later. Unfortunately, the birds ate them, and the children got lost.",
 tr:"Bir zamanlar karısı ve iki çocuğu Hansel ile Gretel'le yaşayan çok fakir bir oduncu varmış. Bir yıl herkese yetecek yiyecek yokmuş ve üvey anne, babayı çocukları ormanda bırakmaya ikna etmiş. Ama Hansel her şeyi duymuş. Yol boyunca, sonra dönüş yolunu bulabilmek için ekmek kırıntıları atmış. Ne yazık ki kuşlar kırıntıları yemiş ve çocuklar kaybolmuş.",
 de:"Es war einmal ein sehr armer Holzfäller, der mit seiner Frau und seinen zwei Kindern, Hänsel und Gretel, lebte. Eines Jahres gab es nicht genug zu essen für alle, und die Stiefmutter überredete den Vater, die Kinder im Wald zurückzulassen. Aber Hänsel hörte alles. Unterwegs streute er Brotkrumen, um später den Rückweg zu finden. Leider fraßen die Vögel sie auf, und die Kinder verliefen sich."},
{es:"Después de caminar mucho, encontraron una casita de pan con ventanas de azúcar. Mientras comían, salió una anciana que los invitó a entrar. Pero era una bruja: encerró a Hansel en una jaula para engordarlo y comérselo. Un día, le pidió a Gretel que mirara dentro del horno. Gretel dijo que no sabía cómo, y cuando la bruja se acercó a enseñarle, la empujó dentro y cerró la puerta. Los niños escaparon con las joyas de la bruja y volvieron con su padre.",
 en:"After walking for a long time, they found a little house made of bread with sugar windows. While they were eating, an old woman came out and invited them in. But she was a witch: she locked Hansel in a cage to fatten him up and eat him. One day, she asked Gretel to look inside the oven. Gretel said she didn't know how, and when the witch came over to show her, she pushed her inside and shut the door. The children escaped with the witch's jewels and went back to their father.",
 tr:"Uzun süre yürüdükten sonra şeker pencereli, ekmekten küçük bir ev bulmuşlar. Onlar yerken yaşlı bir kadın çıkmış ve onları içeri davet etmiş. Ama kadın bir cadıymış: Hansel'i şişmanlatıp yemek için bir kafese kapatmış. Bir gün Gretel'den fırının içine bakmasını istemiş. Gretel nasıl yapılacağını bilmediğini söylemiş ve cadı ona göstermek için yaklaşınca onu içeri itip kapıyı kapatmış. Çocuklar cadının mücevherleriyle kaçmış ve babalarına dönmüşler.",
 de:"Nachdem sie lange gegangen waren, fanden sie ein Häuschen aus Brot mit Fenstern aus Zucker. Während sie aßen, kam eine alte Frau heraus und bat sie herein. Aber sie war eine Hexe: Sie sperrte Hänsel in einen Käfig, um ihn zu mästen und zu fressen. Eines Tages bat sie Gretel, in den Ofen zu schauen. Gretel sagte, sie wisse nicht, wie das gehe, und als die Hexe näher kam, um es ihr zu zeigen, stieß sie sie hinein und schloss die Tür. Die Kinder flohen mit den Juwelen der Hexe und kehrten zu ihrem Vater zurück."}],
vocab:[["el leñador","woodcutter","oduncu","der Holzfäller"],["las migas de pan","breadcrumbs","ekmek kırıntıları","die Brotkrumen"],["la jaula","cage","kafes","der Käfig"],["engordar","to fatten (up)","şişmanlatmak","mästen"]],
quiz:[
{q:"¿Qué pasó con las migas de pan?",en:"What happened to the breadcrumbs?",tr:"Ekmek kırıntılarına ne oldu?",de:"Was geschah mit den Brotkrumen?",opts:["Los pájaros se las comieron","El viento se las llevó","Hansel se las comió"],ex:"«Por desgracia, los pájaros se las comieron…»"},
{q:"¿Para qué encerró la bruja a Hansel?",en:"Why did the witch lock Hansel up?",tr:"Cadı Hansel'i neden kafese kapattı?",de:"Warum sperrte die Hexe Hänsel ein?",opts:["Para engordarlo y comérselo","Para que no se perdiera","Para que trabajara"],ex:"«…encerró a Hansel en una jaula para engordarlo y comérselo.»"}]},
B1:{paras:[
{es:"A la orilla de un gran bosque vivía un leñador pobre con su segunda esposa y sus dos hijos, Hansel y Gretel. Un invierno, el hambre llegó a la región y ya no tenían ni pan. Una noche, los niños oyeron a la madrastra decir que debían abandonarlos en el bosque. Gretel lloró, pero Hansel la tranquilizó: salió a escondidas y se llenó los bolsillos de piedrecitas blancas que brillaban a la luz de la luna.",
 en:"On the edge of a great forest lived a poor woodcutter with his second wife and his two children, Hansel and Gretel. One winter, famine came to the region and they didn't even have bread any more. One night, the children heard the stepmother say that they should abandon them in the forest. Gretel cried, but Hansel calmed her down: he sneaked out and filled his pockets with little white pebbles that shone in the moonlight.",
 tr:"Büyük bir ormanın kıyısında fakir bir oduncu, ikinci karısı ve iki çocuğu Hansel ile Gretel'le yaşıyormuş. Bir kış bölgeye kıtlık gelmiş ve artık ekmekleri bile kalmamış. Bir gece çocuklar üvey annenin onları ormanda bırakmaları gerektiğini söylediğini duymuş. Gretel ağlamış ama Hansel onu sakinleştirmiş: gizlice dışarı çıkmış ve ay ışığında parıldayan beyaz çakıl taşlarıyla ceplerini doldurmuş.",
 de:"Am Rand eines großen Waldes lebte ein armer Holzfäller mit seiner zweiten Frau und seinen beiden Kindern, Hänsel und Gretel. Eines Winters kam eine Hungersnot in die Gegend, und sie hatten nicht einmal mehr Brot. Eines Nachts hörten die Kinder, wie die Stiefmutter sagte, man müsse sie im Wald aussetzen. Gretel weinte, aber Hänsel beruhigte sie: Er schlich sich hinaus und füllte seine Taschen mit kleinen weißen Kieselsteinen, die im Mondlicht glänzten."},
{es:"Al día siguiente, mientras caminaban, Hansel fue dejando caer las piedras una a una, y esa misma noche pudieron volver a casa siguiendo su brillo. La madrastra no se rindió. La segunda vez, la puerta estaba cerrada con llave y Hansel solo pudo llevar un trozo de pan, que fue desmigando por el camino. Pero los pájaros del bosque se comieron todas las migas, y los dos hermanos se perdieron sin remedio.",
 en:"The next day, as they walked, Hansel dropped the pebbles one by one, and that same night they were able to get back home by following their glow. The stepmother didn't give up. The second time, the door was locked and Hansel could only take a piece of bread, which he crumbled along the way. But the birds of the forest ate all the crumbs, and the brother and sister got hopelessly lost.",
 tr:"Ertesi gün yürürlerken Hansel taşları birer birer düşürmüş ve aynı gece onların parıltısını takip ederek eve dönebilmişler. Üvey anne pes etmemiş. İkinci seferde kapı kilitliymiş ve Hansel yalnızca bir parça ekmek alabilmiş; onu da yol boyunca ufalamış. Ama ormandaki kuşlar bütün kırıntıları yemiş ve iki kardeş çaresizce kaybolmuş.",
 de:"Am nächsten Tag ließ Hänsel unterwegs die Steine einen nach dem anderen fallen, und noch in derselben Nacht konnten sie ihrem Schimmer folgend nach Hause zurückkehren. Die Stiefmutter gab nicht auf. Beim zweiten Mal war die Tür abgeschlossen, und Hänsel konnte nur ein Stück Brot mitnehmen, das er unterwegs zerbröselte. Doch die Vögel des Waldes fraßen alle Krumen auf, und die beiden Geschwister verirrten sich hoffnungslos."},
{es:"Tres días después, hambrientos y agotados, encontraron una casita hecha de pan, con el tejado de bizcocho y las ventanas de azúcar. Una anciana los invitó a entrar y les dio de comer, pero en realidad era una bruja que se comía a los niños. Encerró a Hansel para engordarlo, y como veía muy mal, cada día le pedía que sacara un dedo; él, astuto, le mostraba un huesecillo. Cuando la bruja perdió la paciencia y encendió el horno, Gretel la engañó, la empujó dentro y liberó a su hermano.",
 en:"Three days later, starving and exhausted, they found a little house made of bread, with a cake roof and sugar windows. An old woman invited them in and gave them food, but she was really a witch who ate children. She locked Hansel up to fatten him, and as her eyesight was very poor, every day she asked him to stick out a finger; he cleverly showed her a little bone. When the witch lost patience and lit the oven, Gretel tricked her, pushed her inside and freed her brother.",
 tr:"Üç gün sonra, açlıktan ve yorgunluktan bitkin halde, ekmekten yapılmış, çatısı keklen, pencereleri şekerden küçük bir ev bulmuşlar. Yaşlı bir kadın onları içeri davet etmiş ve yemek vermiş, ama aslında çocukları yiyen bir cadıymış. Hansel'i şişmanlatmak için kapatmış ve gözleri çok kötü gördüğü için her gün ondan bir parmağını uzatmasını istermiş; kurnaz Hansel ise ona küçük bir kemik gösterirmiş. Cadı sabrını yitirip fırını yakınca Gretel onu kandırmış, içeri itmiş ve kardeşini kurtarmış.",
 de:"Drei Tage später fanden sie hungrig und erschöpft ein Häuschen aus Brot mit einem Dach aus Kuchen und Fenstern aus Zucker. Eine alte Frau bat sie herein und gab ihnen zu essen, aber in Wirklichkeit war sie eine Hexe, die Kinder fraß. Sie sperrte Hänsel ein, um ihn zu mästen, und weil sie sehr schlecht sah, bat sie ihn jeden Tag, einen Finger herauszustrecken; schlau zeigte er ihr ein Knöchelchen. Als die Hexe die Geduld verlor und den Ofen anheizte, überlistete Gretel sie, stieß sie hinein und befreite ihren Bruder."}],
vocab:[["abandonar","to abandon","terk etmek, bırakmak","aussetzen, verlassen"],["a escondidas","secretly, on the sly","gizlice","heimlich"],["rendirse","to give up","pes etmek","aufgeben"],["el bizcocho","sponge cake","kek","der Kuchen"]],
quiz:[
{q:"¿Cómo volvieron a casa la primera vez?",en:"How did they get home the first time?",tr:"İlk seferde eve nasıl döndüler?",de:"Wie kamen sie beim ersten Mal nach Hause?",opts:["Siguiendo el brillo de las piedras","Siguiendo a un pájaro","Su padre fue a buscarlos"],ex:"«…esa misma noche pudieron volver a casa siguiendo su brillo.»"},
{q:"¿Por qué Hansel no pudo coger piedras la segunda vez?",en:"Why couldn't Hansel collect pebbles the second time?",tr:"Hansel ikinci seferde neden taş toplayamadı?",de:"Warum konnte Hänsel beim zweiten Mal keine Steine sammeln?",opts:["La puerta estaba cerrada con llave","Llovía mucho","Ya no quedaban piedras"],ex:"«La segunda vez, la puerta estaba cerrada con llave…»"},
{q:"¿Qué le mostraba Hansel a la bruja en vez de un dedo?",en:"What did Hansel show the witch instead of a finger?",tr:"Hansel cadıya parmağı yerine ne gösteriyordu?",de:"Was zeigte Hänsel der Hexe statt eines Fingers?",opts:["Un huesecillo","Una piedra","Una miga de pan"],ex:"«…él, astuto, le mostraba un huesecillo.»"}]},
B2:{paras:[
{es:"A las afueras de un bosque inmenso vivía un leñador con sus dos hijos, Hansel y Gretel, y la mujer con la que se había casado al enviudar. Eran tan pobres que, cuando una terrible hambruna asoló la comarca, ni siquiera les alcanzaba para el pan de cada día. Una noche, desvelado por la preocupación, el leñador escuchó a su esposa proponerle algo impensable: llevar a los niños a lo más espeso del bosque y dejarlos allí a su suerte. Él se resistió, pero ella insistió hasta que acabó cediendo.",
 en:"On the outskirts of an immense forest lived a woodcutter with his two children, Hansel and Gretel, and the woman he had married after being widowed. They were so poor that, when a terrible famine ravaged the region, they couldn't even afford their daily bread. One night, kept awake by worry, the woodcutter heard his wife propose something unthinkable: to take the children into the thickest part of the forest and leave them there to their fate. He resisted, but she insisted until he finally gave in.",
 tr:"Uçsuz bucaksız bir ormanın kenarında bir oduncu, iki çocuğu Hansel ve Gretel ve dul kalınca evlendiği kadınla birlikte yaşıyormuş. O kadar fakirlermiş ki korkunç bir kıtlık bölgeyi kasıp kavurduğunda günlük ekmeklerine bile güçleri yetmez olmuş. Bir gece endişeden uyuyamayan oduncu, karısının ona akıl almaz bir şey önerdiğini duymuş: çocukları ormanın en sık yerine götürüp kaderlerine terk etmek. Adam direnmiş ama kadın o kadar ısrar etmiş ki sonunda boyun eğmiş.",
 de:"Am Rande eines riesigen Waldes lebte ein Holzfäller mit seinen beiden Kindern, Hänsel und Gretel, und der Frau, die er nach dem Tod seiner ersten Frau geheiratet hatte. Sie waren so arm, dass es, als eine schreckliche Hungersnot die Gegend heimsuchte, nicht einmal mehr für das tägliche Brot reichte. Eines Nachts, als ihn die Sorge nicht schlafen ließ, hörte der Holzfäller seine Frau etwas Unvorstellbares vorschlagen: die Kinder ins tiefste Dickicht des Waldes zu bringen und sie dort ihrem Schicksal zu überlassen. Er wehrte sich, doch sie drängte so lange, bis er schließlich nachgab."},
{es:"Los niños, a quienes el hambre tampoco dejaba dormir, lo habían oído todo. Mientras Gretel sollozaba, Hansel se escabulló al patio y recogió guijarros blancos, que relucían bajo la luna como monedas de plata. Al día siguiente los fue soltando a lo largo del camino y, gracias a ellos, regresaron a casa de madrugada. Sin embargo, la segunda vez la madrastra cerró la puerta con llave, y Hansel tuvo que conformarse con desmigar su único trozo de pan, sin imaginar que los pájaros darían buena cuenta de él.",
 en:"The children, whom hunger also kept awake, had heard everything. While Gretel sobbed, Hansel slipped out into the yard and gathered white pebbles, which gleamed under the moon like silver coins. The next day he dropped them along the path and, thanks to them, they got back home in the early hours. However, the second time the stepmother locked the door, and Hansel had to make do with crumbling his only piece of bread, never imagining that the birds would make short work of it.",
 tr:"Açlıktan onların da gözüne uyku girmeyen çocuklar her şeyi duymuş. Gretel hıçkırarak ağlarken Hansel avluya sıvışmış ve ay ışığı altında gümüş paralar gibi parıldayan beyaz çakıl taşları toplamış. Ertesi gün taşları yol boyunca bırakmış ve onlar sayesinde sabaha karşı eve dönmüşler. Ancak ikinci seferde üvey anne kapıyı kilitlemiş ve Hansel, kuşların hepsini silip süpüreceğini hiç düşünmeden tek parça ekmeğini ufalamakla yetinmek zorunda kalmış.",
 de:"Die Kinder, die vor Hunger ebenfalls nicht schlafen konnten, hatten alles gehört. Während Gretel schluchzte, schlich sich Hänsel in den Hof und sammelte weiße Kieselsteine, die im Mondschein wie Silbermünzen glänzten. Am nächsten Tag ließ er sie entlang des Weges fallen, und dank ihnen kehrten sie im Morgengrauen nach Hause zurück. Beim zweiten Mal jedoch schloss die Stiefmutter die Tür ab, und Hänsel musste sich damit begnügen, sein einziges Stück Brot zu zerbröseln, ohne zu ahnen, dass die Vögel kurzen Prozess damit machen würden."},
{es:"Perdidos y al borde del desfallecimiento, los hermanos siguieron a un pájaro blanco hasta un claro donde se alzaba una casita de pan, con tejado de bizcocho y ventanas de azúcar. Estaban mordisqueando las paredes cuando una voz quebrada preguntó quién roía su casa. La anciana que salió los colmó de atenciones, pero a la mañana siguiente mostró su verdadera cara: era una bruja que había levantado aquella casa como cebo para atraer a los niños. Encerró a Hansel en un establo con la intención de cebarlo y convirtió a Gretel en su criada.",
 en:"Lost and on the verge of collapse, the brother and sister followed a white bird to a clearing where a little house of bread stood, with a cake roof and sugar windows. They were nibbling at the walls when a cracked voice asked who was gnawing at her house. The old woman who came out showered them with attention, but the next morning she showed her true face: she was a witch who had built that house as bait to lure children. She locked Hansel in a shed intending to fatten him up and made Gretel her servant.",
 tr:"Kaybolmuş ve bayılmanın eşiğindeki kardeşler beyaz bir kuşu takip ederek, çatısı kekten, pencereleri şekerden yapılmış bir ekmek evin yükseldiği bir açıklığa varmışlar. Duvarları kemiriyorlarmış ki çatlak bir ses evini kimin kemirdiğini sormuş. Dışarı çıkan yaşlı kadın onlara türlü ilgi göstermiş, ama ertesi sabah gerçek yüzünü göstermiş: çocukları çekmek için o evi yem olarak kurmuş bir cadıymış. Hansel'i semirtmek niyetiyle bir ahıra kapatmış ve Gretel'i hizmetçisi yapmış.",
 de:"Verirrt und einer Ohnmacht nahe folgten die Geschwister einem weißen Vogel bis zu einer Lichtung, auf der ein Häuschen aus Brot stand, mit einem Dach aus Kuchen und Fenstern aus Zucker. Sie knabberten gerade an den Wänden, als eine brüchige Stimme fragte, wer an ihrem Häuschen knuspere. Die alte Frau, die herauskam, überhäufte sie mit Aufmerksamkeiten, doch am nächsten Morgen zeigte sie ihr wahres Gesicht: Sie war eine Hexe, die dieses Haus als Köder gebaut hatte, um Kinder anzulocken. Sie sperrte Hänsel in einen Stall, um ihn zu mästen, und machte Gretel zu ihrer Magd."},
{es:"Como tenía la vista cansada, la bruja le pedía a Hansel cada mañana que sacara un dedo para ver si había engordado, y él le tendía un huesecillo. Al cabo de cuatro semanas, harta de esperar, mandó a Gretel asomarse al horno para comprobar si estaba caliente. Adivinando sus intenciones, la niña fingió no saber cómo hacerlo, y cuando la bruja se asomó para enseñarle, la empujó dentro y echó el cerrojo. Con los bolsillos llenos de perlas, los hermanos volvieron a casa, donde su padre, que ya no tenía esposa, los recibió llorando de alegría.",
 en:"As her eyesight was weak, every morning the witch asked Hansel to stick out a finger to see if he had got fatter, and he held out a little bone. After four weeks, tired of waiting, she told Gretel to look into the oven to check whether it was hot. Guessing her intentions, the girl pretended not to know how to do it, and when the witch leaned in to show her, she pushed her inside and bolted the door. With their pockets full of pearls, the brother and sister went back home, where their father, who no longer had a wife, welcomed them weeping with joy.",
 tr:"Gözleri zayıf olduğu için cadı her sabah Hansel'den şişmanlayıp şişmanlamadığını görmek için parmağını uzatmasını istermiş, o da ona küçük bir kemik uzatırmış. Dört hafta sonra beklemekten bıkan cadı, Gretel'e fırının ısınıp ısınmadığını kontrol etmek için içine bakmasını söylemiş. Niyetini sezen kız nasıl yapılacağını bilmiyormuş gibi davranmış ve cadı ona göstermek için eğilince onu içeri itip sürgüyü çekmiş. Cepleri incilerle dolu kardeşler eve dönmüş; artık karısı olmayan babaları onları sevinç gözyaşlarıyla karşılamış.",
 de:"Weil ihre Augen schwach waren, bat die Hexe Hänsel jeden Morgen, einen Finger herauszustrecken, um zu sehen, ob er schon fett geworden sei, und er hielt ihr ein Knöchelchen hin. Nach vier Wochen hatte sie das Warten satt und befahl Gretel, in den Ofen zu schauen, ob er heiß sei. Gretel durchschaute ihre Absicht und tat so, als wüsste sie nicht, wie das geht, und als sich die Hexe hineinbeugte, um es ihr zu zeigen, stieß sie sie hinein und schob den Riegel vor. Mit Taschen voller Perlen kehrten die Geschwister nach Hause zurück, wo ihr Vater, der keine Frau mehr hatte, sie vor Freude weinend empfing."}],

{q:"¿Cómo reaccionó el leñador ante la propuesta de su esposa?",en:"How did the woodcutter react to his wife's proposal?",tr:"Oduncu karısının önerisine nasıl tepki verdi?",de:"Wie reagierte der Holzfäller auf den Vorschlag seiner Frau?",opts:["Se resistió, pero acabó cediendo","Aceptó enseguida","Se fue de casa"],ex:"«Él se resistió, pero ella insistió hasta que acabó cediendo.»"},
{q:"¿Para qué había construido la bruja la casita?",en:"Why had the witch built the little house?",tr:"Cadı küçük evi ne için yapmıştı?",de:"Wozu hatte die Hexe das Häuschen gebaut?",opts:["Como cebo para atraer a los niños","Para vivir cerca del pueblo","Para vender pan"],ex:"«…había levantado aquella casa como cebo para atraer a los niños.»"},

{id:"patito",icon:"🦢",title:"El patito feo",tt:B("The Ugly Duckling","Çirkin Ördek Yavrusu","Das hässliche Entlein"),src:"Hans Christian Andersen",lv:{
A1:{paras:[
{es:"Una pata tiene cinco huevos. Nacen los patitos. Pero un patito es grande, gris y diferente. Los otros animales dicen: «¡Qué feo es!». El patito feo está muy triste y se va. Pasa un invierno largo y frío, solo. En primavera, mira el agua y ve su imagen. ¡Ya no es un patito feo! Es un cisne precioso.",
 en:"A duck has five eggs. The ducklings are born. But one duckling is big, grey and different. The other animals say: “How ugly he is!” The ugly duckling is very sad and goes away. He spends a long, cold winter alone. In spring, he looks at the water and sees his reflection. He isn't an ugly duckling any more! He is a beautiful swan.",
 tr:"Bir anne ördeğin beş yumurtası var. Ördek yavruları doğuyor. Ama bir yavru büyük, gri ve farklı. Diğer hayvanlar «Ne kadar çirkin!» diyor. Çirkin ördek yavrusu çok üzgün ve gidiyor. Uzun ve soğuk bir kışı yalnız geçiriyor. İlkbaharda suya bakıyor ve görüntüsünü görüyor. Artık çirkin bir ördek yavrusu değil! Çok güzel bir kuğu.",
 de:"Eine Ente hat fünf Eier. Die Entenküken schlüpfen. Aber ein Küken ist groß, grau und anders. Die anderen Tiere sagen: „Wie hässlich es ist!“ Das hässliche Entlein ist sehr traurig und geht weg. Es verbringt einen langen, kalten Winter allein. Im Frühling schaut es ins Wasser und sieht sein Spiegelbild. Es ist kein hässliches Entlein mehr! Es ist ein wunderschöner Schwan."}],
vocab:[["el huevo","egg","yumurta","das Ei"],["el pato / la pata","duck","ördek","die Ente"],["feo","ugly","çirkin","hässlich"],["el cisne","swan","kuğu","der Schwan"]],
quiz:[
{q:"¿Cómo es el patito diferente?",en:"What is the different duckling like?",tr:"Farklı ördek yavrusu nasıl?",de:"Wie ist das andere Entlein?",opts:["Grande y gris","Pequeño y amarillo","Blanco y bonito"],ex:"«Pero un patito es grande, gris y diferente.»"},
{q:"¿Qué es el patito al final?",en:"What is the duckling at the end?",tr:"Ördek yavrusu sonunda ne oluyor?",de:"Was ist das Entlein am Ende?",opts:["Un cisne","Un pato","Una gallina"],ex:"«Es un cisne precioso.»"}]},
A2:{paras:[
{es:"Un verano, una pata estaba sentada sobre sus huevos. Uno a uno, nacieron unos patitos amarillos y preciosos. Pero el último huevo era más grande, y de él salió un patito gris, torpe y muy feo. Los otros patos y las gallinas se reían de él y lo picaban. Hasta sus hermanos le decían cosas crueles. El patito se sentía tan triste que un día decidió irse lejos.",
 en:"One summer, a duck was sitting on her eggs. One by one, some lovely yellow ducklings were born. But the last egg was bigger, and out of it came a grey, clumsy and very ugly duckling. The other ducks and the hens laughed at him and pecked him. Even his brothers and sisters said cruel things to him. The duckling felt so sad that one day he decided to go far away.",
 tr:"Bir yaz bir anne ördek yumurtalarının üstünde oturuyormuş. Birer birer sarı ve çok tatlı ördek yavruları çıkmış. Ama son yumurta daha büyükmüş ve içinden gri, sakar ve çok çirkin bir yavru çıkmış. Diğer ördekler ve tavuklar ona gülüyor ve onu gagalıyormuş. Kardeşleri bile ona acımasız sözler söylüyormuş. Yavru o kadar üzgünmüş ki bir gün uzaklara gitmeye karar vermiş.",
 de:"Eines Sommers saß eine Ente auf ihren Eiern. Eins nach dem anderen schlüpften hübsche gelbe Entenküken. Aber das letzte Ei war größer, und heraus kam ein graues, tollpatschiges und sehr hässliches Küken. Die anderen Enten und die Hühner lachten es aus und hackten nach ihm. Sogar seine Geschwister sagten gemeine Dinge zu ihm. Das Entlein war so traurig, dass es eines Tages beschloss, weit weg zu gehen."},
{es:"Pasó por muchos sitios, pero en todos lo trataban mal. Cuando llegó el invierno, tenía frío y hambre, y casi se congela en un lago. Por fin llegó la primavera. Un día vio unos pájaros blancos y elegantes nadando en el río y se acercó a ellos, aunque tenía miedo. Al mirar el agua, vio su reflejo: ya no era un patito gris y feo, sino un cisne hermoso. Los otros cisnes lo recibieron como a un hermano.",
 en:"He went to many places, but everywhere they treated him badly. When winter came, he was cold and hungry, and he almost froze in a lake. At last spring arrived. One day he saw some white, elegant birds swimming in the river and went up to them, although he was afraid. When he looked at the water, he saw his reflection: he was no longer a grey, ugly duckling, but a beautiful swan. The other swans welcomed him like a brother.",
 tr:"Pek çok yerden geçmiş, ama her yerde ona kötü davranmışlar. Kış gelince üşüyor ve açlık çekiyormuş; bir gölde neredeyse donuyormuş. Sonunda ilkbahar gelmiş. Bir gün nehirde yüzen beyaz ve zarif kuşlar görmüş ve korksa da onlara yaklaşmış. Suya bakınca yansımasını görmüş: artık gri ve çirkin bir ördek yavrusu değil, güzel bir kuğuymuş. Diğer kuğular onu bir kardeş gibi karşılamış.",
 de:"Es kam an viele Orte, aber überall wurde es schlecht behandelt. Als der Winter kam, fror es und hatte Hunger, und auf einem See wäre es fast erfroren. Endlich kam der Frühling. Eines Tages sah es weiße, elegante Vögel im Fluss schwimmen und näherte sich ihnen, obwohl es Angst hatte. Als es ins Wasser schaute, sah es sein Spiegelbild: Es war kein graues, hässliches Entlein mehr, sondern ein schöner Schwan. Die anderen Schwäne nahmen es auf wie einen Bruder."}],

quiz:[
{q:"¿Cómo era el último huevo?",en:"What was the last egg like?",tr:"Son yumurta nasıldı?",de:"Wie war das letzte Ei?",opts:["Más grande","Más pequeño","Azul"],ex:"«Pero el último huevo era más grande…»"},
{q:"¿Qué vio el patito en el agua?",en:"What did the duckling see in the water?",tr:"Ördek yavrusu suda ne gördü?",de:"Was sah das Entlein im Wasser?",opts:["Que era un cisne hermoso","Un pez","A su madre"],ex:"«…ya no era un patito gris y feo, sino un cisne hermoso.»"}]},
B1:{paras:[
{es:"En una granja junto a un estanque, una pata esperaba con impaciencia a que se abrieran sus huevos. Cuando por fin rompieron el cascarón, aparecieron unos patitos amarillos que enseguida empezaron a nadar detrás de ella. Solo quedaba un huevo, más grande que los demás. Una pata vieja le aconsejó que lo dejara, pero ella decidió esperar. De él salió un polluelo enorme, gris y tan desgarbado que todos se quedaron mirándolo.",
 en:"On a farm next to a pond, a duck was waiting impatiently for her eggs to hatch. When they finally broke their shells, some yellow ducklings appeared and immediately started swimming behind her. There was only one egg left, bigger than the others. An old duck advised her to leave it, but she decided to wait. Out of it came an enormous, grey chick, so gangly that everyone stared at it.",
 tr:"Bir göletin yanındaki bir çiftlikte anne ördek yumurtalarının çatlamasını sabırsızlıkla bekliyormuş. Sonunda kabuklar kırılınca hemen arkasından yüzmeye başlayan sarı yavrular ortaya çıkmış. Geriye diğerlerinden daha büyük tek bir yumurta kalmış. Yaşlı bir ördek ona yumurtayı bırakmasını öğütlemiş, ama o beklemeye karar vermiş. İçinden kocaman, gri ve öyle biçimsiz bir yavru çıkmış ki herkes ona bakakalmış.",
 de:"Auf einem Bauernhof an einem Teich wartete eine Ente ungeduldig darauf, dass ihre Eier aufbrachen. Als die Küken endlich die Schale durchbrachen, kamen gelbe Entlein zum Vorschein, die sofort hinter ihr herschwammen. Nur ein Ei war noch übrig, größer als die anderen. Eine alte Ente riet ihr, es liegen zu lassen, aber sie beschloss zu warten. Heraus kam ein riesiges, graues Küken, so unbeholfen, dass alle es anstarrten."},
{es:"Desde aquel día, la vida del patito fue muy dura. Los patos lo mordían, las gallinas lo empujaban y la muchacha que les daba de comer lo apartaba con el pie. Incluso sus hermanos deseaban que se lo llevara el gato. Un día, no pudo más y escapó por encima de la cerca. Vivió con unos patos salvajes y en la cabaña de una anciana con un gato y una gallina, pero en ningún lugar lo aceptaban tal como era.",
 en:"From that day on, the duckling's life was very hard. The ducks bit him, the hens pushed him and the girl who fed them shoved him away with her foot. Even his brothers and sisters wished the cat would take him. One day, he couldn't take any more and escaped over the fence. He lived with some wild ducks and in the cottage of an old woman with a cat and a hen, but nowhere did they accept him as he was.",
 tr:"O günden sonra yavrunun hayatı çok zor geçmiş. Ördekler onu ısırıyor, tavuklar itiyor, onlara yem veren kız da ayağıyla onu kenara itiyormuş. Kardeşleri bile kedinin onu kapıp götürmesini diliyormuş. Bir gün daha fazla dayanamamış ve çitin üstünden kaçmış. Bir süre yaban ördekleriyle, sonra kedisi ve tavuğu olan yaşlı bir kadının kulübesinde yaşamış, ama hiçbir yerde onu olduğu gibi kabul etmemişler.",
 de:"Von diesem Tag an war das Leben des Entleins sehr hart. Die Enten bissen es, die Hühner schubsten es, und das Mädchen, das sie fütterte, stieß es mit dem Fuß weg. Sogar seine Geschwister wünschten, die Katze möge es holen. Eines Tages hielt es es nicht mehr aus und flüchtete über den Zaun. Es lebte bei Wildenten und in der Hütte einer alten Frau mit einer Katze und einem Huhn, aber nirgends wurde es so akzeptiert, wie es war."},
{es:"El invierno fue terrible: una noche, el agua del lago se heló a su alrededor y un campesino tuvo que rescatarlo. Cuando volvió la primavera, sus alas se habían vuelto fuertes. Al ver tres cisnes blancos en un lago, voló hacia ellos pensando que lo atacarían por ser tan feo. Inclinó la cabeza, esperando lo peor, y entonces vio su reflejo en el agua: era un cisne, igual que ellos. Unos niños gritaron: «¡Hay un cisne nuevo, y es el más bonito de todos!».",
 en:"The winter was terrible: one night, the water of the lake froze around him and a farmer had to rescue him. When spring returned, his wings had grown strong. Seeing three white swans on a lake, he flew towards them, thinking they would attack him for being so ugly. He bowed his head, expecting the worst, and then he saw his reflection in the water: he was a swan, just like them. Some children shouted: “There's a new swan, and he's the most beautiful of all!”",
 tr:"Kış korkunç geçmiş: bir gece gölün suyu etrafında donmuş ve bir köylü onu kurtarmak zorunda kalmış. İlkbahar geri geldiğinde kanatları güçlenmiş. Bir gölde üç beyaz kuğu görünce, o kadar çirkin olduğu için ona saldıracaklarını düşünerek onlara doğru uçmuş. En kötüsünü bekleyerek başını eğmiş ve o anda sudaki yansımasını görmüş: o da tıpkı onlar gibi bir kuğuymuş. Birkaç çocuk bağırmış: «Yeni bir kuğu var, hem de hepsinin en güzeli!»",
 de:"Der Winter war schrecklich: Eines Nachts fror das Wasser des Sees um es herum zu, und ein Bauer musste es retten. Als der Frühling zurückkam, waren seine Flügel kräftig geworden. Als es drei weiße Schwäne auf einem See sah, flog es zu ihnen, weil es dachte, sie würden es angreifen, da es so hässlich war. Es neigte den Kopf und erwartete das Schlimmste, und da sah es sein Spiegelbild im Wasser: Es war ein Schwan, genau wie sie. Ein paar Kinder riefen: „Da ist ein neuer Schwan, und er ist der schönste von allen!“"}],

quiz:[
{q:"¿Qué le aconsejó la pata vieja?",en:"What did the old duck advise her?",tr:"Yaşlı ördek ona ne öğütledi?",de:"Was riet ihr die alte Ente?",opts:["Que dejara el último huevo","Que se fuera a otro estanque","Que llamara a la granjera"],ex:"«Una pata vieja le aconsejó que lo dejara, pero ella decidió esperar.»"},
{q:"¿Quién rescató al patito en invierno?",en:"Who rescued the duckling in winter?",tr:"Kışın ördek yavrusunu kim kurtardı?",de:"Wer rettete das Entlein im Winter?",opts:["Un campesino","Un cisne","Su madre"],ex:"«…el agua del lago se heló a su alrededor y un campesino tuvo que rescatarlo.»"},
{q:"¿Qué esperaba el patito al acercarse a los cisnes?",en:"What did the duckling expect when he approached the swans?",tr:"Ördek yavrusu kuğulara yaklaşırken ne bekliyordu?",de:"Was erwartete das Entlein, als es sich den Schwänen näherte?",opts:["Que lo atacarían por ser feo","Que le darían comida","Que no lo verían"],ex:"«…voló hacia ellos pensando que lo atacarían por ser tan feo.»"}]},
B2:{paras:[
{es:"Hacía un verano espléndido en el campo, y entre las cañas de un estanque una pata empollaba sus huevos con más aburrimiento que ilusión, pues tardaban más de la cuenta. Por fin, uno tras otro, fueron asomando patitos de plumón amarillo; todos menos el huevo más grande. Una pata vieja, que se las daba de experta, aseguró que seguramente sería de pava y le aconsejó abandonarlo. Pero la madre, por terquedad o por cariño, decidió seguir dándole calor unos días más.",
 en:"It was a glorious summer in the countryside, and among the reeds of a pond a duck was hatching her eggs with more boredom than excitement, for they were taking longer than they should. At last, one after another, ducklings with yellow down began to peep out; all except the biggest egg. An old duck, who fancied herself an expert, declared that it was surely a turkey's egg and advised her to abandon it. But the mother, out of stubbornness or affection, decided to keep it warm a few more days.",
 tr:"Kırlarda harika bir yaz yaşanıyormuş ve bir göletin sazlıkları arasında bir anne ördek, yumurtalar gereğinden uzun sürdüğü için heyecandan çok can sıkıntısıyla kuluçkaya yatıyormuş. Sonunda birbiri ardına sarı tüylü yavrular başlarını çıkarmaya başlamış; en büyük yumurta hariç. Kendini uzman sanan yaşlı bir ördek, bunun kesinlikle bir hindi yumurtası olduğunu söylemiş ve onu bırakmasını öğütlemiş. Ama anne, ister inatçılıktan ister sevgiden, onu birkaç gün daha ısıtmaya karar vermiş.",
 de:"Es war ein herrlicher Sommer auf dem Land, und im Schilf eines Teiches brütete eine Ente ihre Eier aus, mehr gelangweilt als voller Vorfreude, denn es dauerte länger als üblich. Endlich lugten nacheinander Küken mit gelbem Flaum hervor; alle außer dem größten Ei. Eine alte Ente, die sich für eine Expertin hielt, behauptete, es sei bestimmt ein Putenei, und riet ihr, es aufzugeben. Doch die Mutter beschloss, aus Sturheit oder aus Zuneigung, es noch ein paar Tage zu wärmen."},
{es:"Cuando el cascarón se rompió al fin, salió un polluelo grandullón, gris y desgarbado que no se parecía a ninguno de sus hermanos. En el corral, su aspecto despertó burlas inmediatas: los patos le daban picotazos, el pavo se hinchaba amenazador al verlo y hasta su madre llegó a desear que estuviera lejos. Herido por tanto desprecio, el patito huyó una madrugada saltando la cerca, convencido de que era tan feo que hasta los pájaros escapaban al verlo.",
 en:"When the shell finally broke, out came a big, grey, gangly chick that looked like none of its brothers and sisters. In the farmyard, its appearance provoked instant mockery: the ducks pecked at it, the turkey puffed himself up threateningly when he saw it and even its mother came to wish it were far away. Hurt by so much contempt, the duckling fled one dawn by jumping over the fence, convinced that he was so ugly that even the birds flew away at the sight of him.",
 tr:"Kabuk sonunda kırıldığında, kardeşlerinden hiçbirine benzemeyen iri yarı, gri ve biçimsiz bir yavru çıkmış. Kümeste görünüşü anında alay konusu olmuş: ördekler onu gagalıyor, hindi onu görünce tehditkâr bir şekilde kabarıyormuş ve annesi bile onun uzaklarda olmasını dilemeye başlamış. Bu kadar aşağılanmaktan yaralanan ördek yavrusu, öyle çirkin olduğuna inanmış ki kuşların bile onu görünce kaçtığını düşünerek bir sabah erkenden çitin üstünden atlayıp kaçmış.",
 de:"Als die Schale endlich zerbrach, kam ein großes, graues, unbeholfenes Küken heraus, das keinem seiner Geschwister ähnelte. Auf dem Hühnerhof erntete sein Aussehen sofort Spott: Die Enten hackten nach ihm, der Truthahn plusterte sich drohend auf, wenn er es sah, und sogar seine Mutter wünschte schließlich, es wäre weit weg. Verletzt von so viel Verachtung floh das Entlein eines Morgens im Morgengrauen über den Zaun, überzeugt, dass es so hässlich sei, dass selbst die Vögel bei seinem Anblick davonflogen."},
{es:"Su peregrinaje fue largo y amargo. Sobrevivió a una cacería entre los juncos, fue despreciado en la cabaña de una anciana por no saber poner huevos ni ronronear, y pasó el otoño solo en un lago. Allí vio por primera vez una bandada de aves blancas, de cuello largo y elegante, que emigraban hacia países cálidos, y sintió por ellas una emoción que no supo explicar. Llegó el invierno, y una noche el hielo lo atrapó; de no ser por un campesino que lo encontró al amanecer, habría muerto congelado.",
 en:"His wanderings were long and bitter. He survived a hunt among the rushes, was scorned in an old woman's cottage for not being able to lay eggs or purr, and spent the autumn alone on a lake. There he saw for the first time a flock of white birds with long, elegant necks migrating to warm countries, and he felt an emotion for them that he couldn't explain. Winter came, and one night the ice trapped him; had it not been for a farmer who found him at dawn, he would have frozen to death.",
 tr:"Gezintisi uzun ve acı olmuş. Sazlıklar arasındaki bir avdan sağ kurtulmuş, yumurta yumurtlayamadığı ve mırlayamadığı için yaşlı bir kadının kulübesinde hor görülmüş ve sonbaharı bir gölde yalnız geçirmiş. Orada ilk kez sıcak ülkelere göç eden, uzun ve zarif boyunlu beyaz kuşlardan oluşan bir sürü görmüş ve onlara karşı açıklayamadığı bir heyecan duymuş. Kış gelmiş ve bir gece buz onu kıskaca almış; şafakta onu bulan bir köylü olmasa donarak ölecekmiş.",
 de:"Seine Wanderschaft war lang und bitter. Es überlebte eine Jagd im Schilf, wurde in der Hütte einer alten Frau verachtet, weil es weder Eier legen noch schnurren konnte, und verbrachte den Herbst allein auf einem See. Dort sah es zum ersten Mal einen Schwarm weißer Vögel mit langen, eleganten Hälsen, die in warme Länder zogen, und empfand für sie ein Gefühl, das es sich nicht erklären konnte. Der Winter kam, und eines Nachts schloss das Eis es ein; wäre nicht ein Bauer gewesen, der es im Morgengrauen fand, wäre es erfroren."},
{es:"Cuando el sol de la primavera volvió a calentar, el patito descubrió que sus alas lo elevaban con una fuerza desconocida. En un jardín vio nadar a tres de aquellas aves majestuosas y decidió acercarse, aunque lo mataran a picotazos: prefería eso a seguir sufriendo. Pero al inclinar la cabeza vio en el agua su propia imagen: ya no era un pájaro torpe y gris, sino un cisne. Los demás lo acariciaron con el pico, y él comprendió que no importa haber nacido en un corral si se ha salido de un huevo de cisne.",
 en:"When the spring sun warmed the land again, the duckling discovered that his wings lifted him with a strength he had never known. In a garden he saw three of those majestic birds swimming and decided to approach them, even if they pecked him to death: he preferred that to going on suffering. But as he bowed his head he saw his own image in the water: he was no longer a clumsy grey bird, but a swan. The others stroked him with their beaks, and he understood that it doesn't matter being born in a farmyard if you have hatched from a swan's egg.",
 tr:"İlkbahar güneşi yeniden ısıtmaya başladığında ördek yavrusu kanatlarının onu bilmediği bir güçle yükselttiğini keşfetmiş. Bir bahçede o görkemli kuşlardan üçünün yüzdüğünü görmüş ve gagalanarak öldürülse bile onlara yaklaşmaya karar vermiş: bunu acı çekmeye devam etmeye tercih ediyormuş. Ama başını eğince sudaki kendi görüntüsünü görmüş: artık sakar ve gri bir kuş değil, bir kuğuymuş. Diğerleri onu gagalarıyla okşamış ve o da bir kuğu yumurtasından çıktıysan kümeste doğmuş olmanın hiç önemi olmadığını anlamış.",
 de:"Als die Frühlingssonne wieder wärmte, entdeckte das Entlein, dass seine Flügel es mit einer unbekannten Kraft emportrugen. In einem Garten sah es drei dieser majestätischen Vögel schwimmen und beschloss, sich ihnen zu nähern, auch wenn sie es totbeißen sollten: Das war ihm lieber, als weiter zu leiden. Doch als es den Kopf neigte, sah es im Wasser sein eigenes Bild: Es war kein tollpatschiger, grauer Vogel mehr, sondern ein Schwan. Die anderen streichelten es mit ihren Schnäbeln, und es begriff, dass es nichts ausmacht, auf einem Hühnerhof geboren zu sein, wenn man aus einem Schwanenei geschlüpft ist."}],
vocab:[["empollar","to hatch, to brood","kuluçkaya yatmak","ausbrüten"],["la terquedad","stubbornness","inatçılık","die Sturheit"],["el desprecio","contempt","hor görme, aşağılama","die Verachtung"],["la bandada","flock (of birds)","kuş sürüsü","der Schwarm"]],

/* classics batch 3 */
CLASSICS.push(
{id:"emperador",icon:"👑",title:"El traje nuevo del emperador",tt:B("The Emperor's New Clothes","Kralın Yeni Giysileri","Des Kaisers neue Kleider"),src:"Hans Christian Andersen",lv:{
A1:{paras:[
{es:"Hay un emperador. Le gusta mucho la ropa nueva. Dos hombres dicen: «Hacemos una tela mágica. Las personas tontas no la pueden ver». Es mentira. No hay tela. Pero nadie dice la verdad, porque nadie quiere parecer tonto. El emperador sale a la calle con su traje nuevo. Un niño grita: «¡El emperador va desnudo!». Y todos se ríen.",
 en:"There is an emperor. He really likes new clothes. Two men say: “We make a magic cloth. Stupid people can't see it.” It's a lie. There is no cloth. But nobody tells the truth, because nobody wants to look stupid. The emperor goes out into the street in his new suit. A child shouts: “The emperor is naked!” And everyone laughs.",
 tr:"Bir imparator var. Yeni kıyafetleri çok seviyor. İki adam diyor ki: «Sihirli bir kumaş yapıyoruz. Aptal insanlar onu göremez.» Bu bir yalan. Kumaş yok. Ama kimse doğruyu söylemiyor, çünkü kimse aptal görünmek istemiyor. İmparator yeni giysisiyle sokağa çıkıyor. Bir çocuk bağırıyor: «İmparator çıplak!» Ve herkes gülüyor.",
 de:"Es gibt einen Kaiser. Er mag neue Kleider sehr. Zwei Männer sagen: „Wir machen einen magischen Stoff. Dumme Menschen können ihn nicht sehen.“ Das ist eine Lüge. Es gibt keinen Stoff. Aber niemand sagt die Wahrheit, weil niemand dumm aussehen will. Der Kaiser geht in seinem neuen Anzug auf die Straße. Ein Kind ruft: „Der Kaiser ist nackt!“ Und alle lachen."}],
vocab:[["el emperador","emperor","imparator","der Kaiser"],["la tela","cloth, fabric","kumaş","der Stoff"],["tonto","stupid, silly","aptal","dumm"],["desnudo","naked","çıplak","nackt"]],
quiz:[
{q:"Según los dos hombres, ¿quién no puede ver la tela?",en:"According to the two men, who can't see the cloth?",tr:"İki adama göre kumaşı kim göremez?",de:"Wer kann den Stoff laut den zwei Männern nicht sehen?",opts:["Las personas tontas","Los niños","Los ancianos"],ex:"«Las personas tontas no la pueden ver.»"},
{q:"¿Quién dice la verdad?",en:"Who tells the truth?",tr:"Doğruyu kim söylüyor?",de:"Wer sagt die Wahrheit?",opts:["Un niño","El emperador","Los dos hombres"],ex:"«Un niño grita: ¡El emperador va desnudo!»"}]},
A2:{paras:[
{es:"Hace muchos años vivía un emperador al que solo le importaba la ropa. Tenía un traje para cada hora del día. Un día llegaron a la ciudad dos estafadores que decían ser tejedores. Le explicaron al emperador que hacían una tela maravillosa con un poder especial: era invisible para las personas tontas o que no merecían su trabajo. El emperador, encantado, les dio mucho oro.",
 en:"Many years ago there lived an emperor who only cared about clothes. He had a suit for every hour of the day. One day two swindlers who claimed to be weavers arrived in the city. They explained to the emperor that they made a wonderful cloth with a special power: it was invisible to people who were stupid or didn't deserve their job. The emperor, delighted, gave them a lot of gold.",
 tr:"Uzun yıllar önce yalnızca kıyafetleri önemseyen bir imparator yaşarmış. Günün her saati için ayrı bir giysisi varmış. Bir gün şehre dokumacı olduklarını söyleyen iki dolandırıcı gelmiş. İmparatora özel bir gücü olan harika bir kumaş yaptıklarını anlatmışlar: kumaş aptallara ya da işini hak etmeyenlere görünmüyormuş. Çok sevinen imparator onlara bir sürü altın vermiş.",
 de:"Vor vielen Jahren lebte ein Kaiser, dem nur Kleider wichtig waren. Er hatte für jede Stunde des Tages einen Anzug. Eines Tages kamen zwei Betrüger in die Stadt, die behaupteten, Weber zu sein. Sie erklärten dem Kaiser, dass sie einen wunderbaren Stoff mit einer besonderen Kraft herstellten: Er war unsichtbar für Menschen, die dumm waren oder ihr Amt nicht verdienten. Der Kaiser war begeistert und gab ihnen viel Gold."},
{es:"Los estafadores fingían trabajar en telares vacíos. El emperador envió a sus ministros a ver la tela. Ninguno vio nada, pero todos dijeron que era preciosa, porque tenían miedo de parecer tontos. El propio emperador tampoco vio nada, pero se calló. El día del desfile, salió a la calle con su traje y la gente aplaudía. Hasta que un niño gritó: «¡Pero si va desnudo!». Entonces todos empezaron a decirlo.",
 en:"The swindlers pretended to work at empty looms. The emperor sent his ministers to see the cloth. None of them saw anything, but they all said it was beautiful, because they were afraid of looking stupid. The emperor himself didn't see anything either, but he kept quiet. On the day of the parade, he went out into the street in his suit and the people applauded. Until a child shouted: “But he's naked!” Then everyone started saying it.",
 tr:"Dolandırıcılar boş tezgâhlarda çalışıyormuş gibi yapıyormuş. İmparator kumaşı görmeleri için bakanlarını göndermiş. Hiçbiri bir şey görmemiş ama aptal görünmekten korktukları için hepsi kumaşın çok güzel olduğunu söylemiş. İmparatorun kendisi de bir şey görmemiş ama sesini çıkarmamış. Geçit töreni günü giysisiyle sokağa çıkmış ve halk alkışlamış. Ta ki bir çocuk «Ama o çıplak!» diye bağırana kadar. O zaman herkes bunu söylemeye başlamış.",
 de:"Die Betrüger taten so, als würden sie an leeren Webstühlen arbeiten. Der Kaiser schickte seine Minister, um den Stoff anzusehen. Keiner sah etwas, aber alle sagten, er sei wunderschön, weil sie Angst hatten, dumm zu wirken. Der Kaiser selbst sah auch nichts, aber er schwieg. Am Tag des Umzugs ging er in seinem Anzug auf die Straße, und die Leute klatschten. Bis ein Kind rief: „Aber er hat ja nichts an!“ Da begannen alle, es zu sagen."}],
vocab:[["el estafador","swindler, con man","dolandırıcı","der Betrüger"],["el tejedor","weaver","dokumacı","der Weber"],["el telar","loom","dokuma tezgâhı","der Webstuhl"],["el desfile","parade","geçit töreni","der Umzug"]],
quiz:[
{q:"¿Qué poder tenía la tela, según los estafadores?",en:"What power did the cloth have, according to the swindlers?",tr:"Dolandırıcılara göre kumaşın ne gücü vardı?",de:"Welche Kraft hatte der Stoff laut den Betrügern?",opts:["Era invisible para los tontos","Cambiaba de color","Nunca se rompía"],ex:"«…era invisible para las personas tontas o que no merecían su trabajo.»"},
{q:"¿Por qué los ministros dijeron que la tela era preciosa?",en:"Why did the ministers say the cloth was beautiful?",tr:"Bakanlar neden kumaşın çok güzel olduğunu söyledi?",de:"Warum sagten die Minister, der Stoff sei wunderschön?",opts:["Tenían miedo de parecer tontos","Les gustaba mucho","El emperador se lo ordenó"],ex:"«…todos dijeron que era preciosa, porque tenían miedo de parecer tontos.»"}]},
B1:{paras:[
{es:"Hace muchos años había un emperador tan aficionado a la ropa elegante que gastaba todo su dinero en vestirse. No le interesaban sus soldados ni el teatro; solo quería pasear para lucir sus trajes nuevos. Un día llegaron a la capital dos pícaros que se presentaron como tejedores. Aseguraban que sabían fabricar la tela más bella del mundo, con una cualidad asombrosa: resultaba invisible para cualquiera que fuera tonto o no sirviera para su cargo.",
 en:"Many years ago there was an emperor so fond of elegant clothes that he spent all his money on dressing up. He wasn't interested in his soldiers or the theatre; he only wanted to go out to show off his new suits. One day two rogues arrived in the capital, introducing themselves as weavers. They claimed they knew how to make the most beautiful cloth in the world, with an astonishing quality: it was invisible to anyone who was stupid or unfit for their position.",
 tr:"Uzun yıllar önce şık giysilere o kadar düşkün bir imparator varmış ki bütün parasını giyinmeye harcarmış. Ne askerleri ne de tiyatro ilgisini çekermiş; tek istediği yeni giysilerini sergilemek için gezmekmiş. Bir gün başkente kendilerini dokumacı olarak tanıtan iki üçkâğıtçı gelmiş. Dünyanın en güzel kumaşını yapmayı bildiklerini iddia ediyorlarmış; kumaşın şaşırtıcı bir özelliği varmış: aptal olan ya da görevine layık olmayan herkese görünmüyormuş.",
 de:"Vor vielen Jahren gab es einen Kaiser, der so sehr an eleganter Kleidung hing, dass er sein ganzes Geld dafür ausgab, sich herauszuputzen. Seine Soldaten und das Theater interessierten ihn nicht; er wollte nur spazieren gehen, um seine neuen Anzüge vorzuführen. Eines Tages kamen zwei Gauner in die Hauptstadt, die sich als Weber ausgaben. Sie behaupteten, den schönsten Stoff der Welt herstellen zu können, mit einer erstaunlichen Eigenschaft: Er war für jeden unsichtbar, der dumm war oder nicht für sein Amt taugte."},
{es:"«Con un traje así podré descubrir quién no merece su puesto», pensó el emperador, y les pagó una fortuna por adelantado. Los pícaros montaron dos telares y fingieron trabajar día y noche, aunque no había ni un hilo. Cuando el viejo ministro fue a ver cómo avanzaba la obra, se quedó horrorizado: no veía nada. Pero, temiendo perder su puesto, alabó los colores y el dibujo. Lo mismo hicieron todos los que fueron después.",
 en:"“With a suit like that I'll be able to find out who doesn't deserve their post,” thought the emperor, and he paid them a fortune in advance. The rogues set up two looms and pretended to work day and night, although there wasn't a single thread. When the old minister went to see how the work was progressing, he was horrified: he couldn't see anything. But, fearing he would lose his post, he praised the colours and the pattern. Everyone who went afterwards did the same.",
 tr:"«Böyle bir giysiyle kimin görevini hak etmediğini anlayabilirim» diye düşünmüş imparator ve onlara peşin olarak bir servet ödemiş. Üçkâğıtçılar iki tezgâh kurmuş ve ortada tek bir iplik bile olmamasına rağmen gece gündüz çalışıyormuş gibi yapmışlar. Yaşlı bakan işin nasıl ilerlediğini görmeye gittiğinde dehşete düşmüş: hiçbir şey göremiyormuş. Ama görevini kaybetmekten korktuğu için renkleri ve deseni övmüş. Ondan sonra gidenlerin hepsi de aynısını yapmış.",
 de:"„Mit so einem Anzug kann ich herausfinden, wer sein Amt nicht verdient“, dachte der Kaiser und bezahlte ihnen im Voraus ein Vermögen. Die Gauner stellten zwei Webstühle auf und taten so, als würden sie Tag und Nacht arbeiten, obwohl kein einziger Faden da war. Als der alte Minister nachsehen ging, wie die Arbeit vorankam, war er entsetzt: Er sah nichts. Doch aus Angst, sein Amt zu verlieren, lobte er die Farben und das Muster. Alle, die danach hingingen, taten dasselbe."},
{es:"Al fin, el emperador fue en persona. Tampoco vio nada, pero no quiso reconocerlo, así que exclamó: «¡Es magnífica!». Los pícaros lo vistieron con mucho cuidado para la gran procesión, y el emperador desfiló bajo un palio mientras el pueblo entero elogiaba su traje. De repente, un niño dijo en voz alta: «¡Pero si no lleva nada!». La frase pasó de boca en boca, y el emperador comprendió que tenían razón, pero siguió desfilando con más orgullo que nunca.",
 en:"Finally, the emperor went in person. He didn't see anything either, but he didn't want to admit it, so he exclaimed: “It's magnificent!” The rogues dressed him very carefully for the great procession, and the emperor paraded under a canopy while the whole town praised his suit. Suddenly, a child said out loud: “But he hasn't got anything on!” The phrase passed from mouth to mouth, and the emperor realised they were right, but he carried on parading more proudly than ever.",
 tr:"Sonunda imparator bizzat gitmiş. O da hiçbir şey görmemiş ama bunu kabul etmek istememiş ve «Muhteşem!» diye haykırmış. Üçkâğıtçılar büyük tören alayı için onu büyük bir özenle giydirmiş ve imparator bütün halk giysisini överken bir gölgelik altında yürümüş. Birden bir çocuk yüksek sesle «Ama üstünde hiçbir şey yok ki!» demiş. Bu söz ağızdan ağıza yayılmış ve imparator haklı olduklarını anlamış, ama her zamankinden daha gururlu bir şekilde yürümeye devam etmiş.",
 de:"Schließlich ging der Kaiser selbst hin. Auch er sah nichts, wollte es aber nicht zugeben und rief: „Er ist prächtig!“ Die Gauner kleideten ihn sehr sorgfältig für die große Prozession an, und der Kaiser schritt unter einem Baldachin daher, während das ganze Volk seinen Anzug lobte. Plötzlich sagte ein Kind laut: „Aber er hat ja gar nichts an!“ Der Satz ging von Mund zu Mund, und der Kaiser begriff, dass sie recht hatten, doch er schritt stolzer als je zuvor weiter."}],
vocab:[["aficionado a","fond of","düşkün","begeistert von"],["lucir","to show off","sergilemek, gösteriş yapmak","vorführen"],["el cargo","position, post","görev, makam","das Amt"],["por adelantado","in advance","peşin","im Voraus"]],
quiz:[
{q:"¿Qué quería descubrir el emperador con el traje?",en:"What did the emperor want to find out with the suit?",tr:"İmparator giysiyle neyi anlamak istiyordu?",de:"Was wollte der Kaiser mit dem Anzug herausfinden?",opts:["Quién no merecía su puesto","Quién era más rico","Quién sabía coser"],ex:"«Con un traje así podré descubrir quién no merece su puesto.»"},
{q:"¿Por qué el viejo ministro alabó la tela?",en:"Why did the old minister praise the cloth?",tr:"Yaşlı bakan kumaşı neden övdü?",de:"Warum lobte der alte Minister den Stoff?",opts:["Temía perder su puesto","Le parecía preciosa","Los pícaros le pagaron"],ex:"«Pero, temiendo perder su puesto, alabó los colores y el dibujo.»"},
{q:"¿Qué hizo el emperador al final?",en:"What did the emperor do at the end?",tr:"İmparator sonunda ne yaptı?",de:"Was tat der Kaiser am Ende?",opts:["Siguió desfilando con más orgullo que nunca","Volvió corriendo al palacio","Castigó al niño"],ex:"«…siguió desfilando con más orgullo que nunca.»"}]},
B2:{paras:[
{es:"Hace muchísimos años vivía un emperador tan obsesionado con la indumentaria que dilapidaba el tesoro del reino en trajes nuevos. Mientras de otros monarcas se decía que estaban reunidos con su consejo, de él se decía siempre lo mismo: «El emperador está en el vestidor». Su capital era una ciudad alegre, por la que pasaban a diario forasteros de todas partes, y así fue como un buen día llegaron dos embaucadores dispuestos a aprovecharse de su vanidad.",
 en:"A great many years ago there lived an emperor so obsessed with clothing that he squandered the kingdom's treasury on new suits. While of other monarchs it was said that they were meeting with their council, of him the same thing was always said: “The emperor is in his dressing room.” His capital was a cheerful city, through which strangers from everywhere passed daily, and that is how one fine day two con men arrived, ready to take advantage of his vanity.",
 tr:"Çok uzun yıllar önce giyim kuşama öyle takıntılı bir imparator yaşarmış ki krallığın hazinesini yeni giysilere har vurup harman savururmuş. Başka hükümdarlar için danışma kuruluyla toplantıda oldukları söylenirken, onun için hep aynı şey söylenirmiş: «İmparator giyinme odasında.» Başkenti her gün her yerden yabancıların geçtiği neşeli bir şehirmiş ve bir gün onun kibrinden yararlanmaya hazır iki düzenbaz da böyle gelmiş.",
 de:"Vor sehr vielen Jahren lebte ein Kaiser, der so besessen von Kleidung war, dass er den Staatsschatz für neue Anzüge verschleuderte. Während man von anderen Herrschern sagte, sie säßen mit ihrem Rat zusammen, hieß es von ihm immer nur: „Der Kaiser ist in der Garderobe.“ Seine Hauptstadt war eine fröhliche Stadt, durch die täglich Fremde von überallher kamen, und so trafen eines schönen Tages zwei Schwindler ein, die bereit waren, seine Eitelkeit auszunutzen."},
{es:"Se hicieron pasar por tejedores y afirmaron ser capaces de tejer una tela de colores y dibujos incomparables, cuya particularidad era volverse invisible a los ojos de quien no estuviera a la altura de su cargo o fuera irremediablemente necio. Al emperador la idea le pareció irresistible: no solo luciría el traje más espléndido del mundo, sino que además podría distinguir a los sabios de los tontos. Les adelantó una suma considerable, y los embaucadores se pusieron manos a la obra… ante unos telares completamente vacíos.",
 en:"They passed themselves off as weavers and claimed they could weave a cloth of incomparable colours and patterns, whose peculiarity was that it became invisible to the eyes of anyone who wasn't up to their position or was hopelessly foolish. The emperor found the idea irresistible: not only would he wear the most splendid suit in the world, but he would also be able to tell the wise from the fools. He advanced them a considerable sum, and the con men got down to work… in front of completely empty looms.",
 tr:"Kendilerini dokumacı olarak tanıtmışlar ve eşsiz renk ve desenlerde bir kumaş dokuyabileceklerini iddia etmişler; kumaşın özelliği, görevinin hakkını veremeyen ya da iflah olmaz derecede ahmak olan herkesin gözünde görünmez olmasıymış. İmparator bu fikri karşı konulmaz bulmuş: hem dünyanın en görkemli giysisini giyecek, hem de bilgeleri aptallardan ayırt edebilecekmiş. Onlara kayda değer bir avans vermiş ve düzenbazlar işe koyulmuş… tamamen boş tezgâhların başında.",
 de:"Sie gaben sich als Weber aus und behaupteten, einen Stoff von unvergleichlichen Farben und Mustern weben zu können, dessen Besonderheit darin bestand, dass er für jeden unsichtbar wurde, der seinem Amt nicht gewachsen oder unverbesserlich dumm war. Der Kaiser fand die Idee unwiderstehlich: Nicht nur würde er den prächtigsten Anzug der Welt tragen, er könnte damit auch die Klugen von den Dummen unterscheiden. Er zahlte ihnen eine beträchtliche Summe im Voraus, und die Schwindler machten sich an die Arbeit … vor völlig leeren Webstühlen."},
{es:"Al cabo de unos días, el emperador mandó a su viejo y honrado ministro a supervisar la labor. El pobre hombre abrió los ojos de par en par sin ver un solo hilo, pero, aterrado ante la idea de que lo tomaran por incompetente, se deshizo en elogios. Otro alto funcionario corrió la misma suerte. Cuando finalmente el propio emperador acudió acompañado de su corte, se le heló la sangre: ¿sería él el necio? Como nadie se atrevía a romper el silencio, todos aplaudieron con entusiasmo una tela inexistente.",
 en:"After a few days, the emperor sent his old and honest minister to supervise the work. The poor man opened his eyes wide without seeing a single thread, but, terrified at the thought of being taken for incompetent, he gushed with praise. Another high official met the same fate. When at last the emperor himself came along with his court, his blood ran cold: could he be the fool? As nobody dared to break the silence, everyone enthusiastically applauded a non-existent cloth.",
 tr:"Birkaç gün sonra imparator yaşlı ve dürüst bakanını işi denetlemeye göndermiş. Zavallı adam tek bir iplik göremeden gözlerini kocaman açmış, ama beceriksiz sanılma düşüncesinden dehşete kapılarak övgüler yağdırmış. Başka bir yüksek memur da aynı akıbete uğramış. Sonunda imparatorun kendisi sarayın ileri gelenleriyle birlikte gelince kanı donmuş: yoksa ahmak olan kendisi miydi? Kimse sessizliği bozmaya cesaret edemediği için herkes var olmayan bir kumaşı coşkuyla alkışlamış.",
 de:"Nach ein paar Tagen schickte der Kaiser seinen alten, ehrlichen Minister, um die Arbeit zu begutachten. Der arme Mann riss die Augen weit auf, ohne einen einzigen Faden zu sehen, doch entsetzt bei dem Gedanken, man könnte ihn für unfähig halten, überschüttete er die Arbeit mit Lob. Einem anderen hohen Beamten erging es ebenso. Als schließlich der Kaiser selbst mit seinem Hofstaat kam, gefror ihm das Blut in den Adern: War etwa er der Dumme? Da niemand das Schweigen zu brechen wagte, klatschten alle begeistert Beifall für einen Stoff, den es gar nicht gab."},
{es:"Llegó el día de la gran procesión. Los embaucadores fingieron vestir al monarca prenda por prenda, y los chambelanes avanzaron sosteniendo una cola que no existía. Por las calles, la multitud prorrumpía en exclamaciones de admiración, pues nadie quería pasar por estúpido. Hasta que un niño, con la franqueza propia de su edad, señaló: «¡Pero si va desnudo!». El murmullo se extendió como la pólvora, y aunque el emperador sintió que el pueblo tenía razón, se irguió aún más y prosiguió su marcha.",
 en:"The day of the great procession arrived. The con men pretended to dress the monarch garment by garment, and the chamberlains walked forward holding up a train that didn't exist. In the streets, the crowd burst into exclamations of admiration, for nobody wanted to be taken for stupid. Until a child, with the frankness typical of his age, pointed out: “But he's naked!” The murmur spread like wildfire, and although the emperor felt that the people were right, he drew himself up even straighter and continued his march.",
 tr:"Büyük tören alayı günü gelmiş. Düzenbazlar hükümdarı parça parça giydiriyormuş gibi yapmış ve mabeyinciler var olmayan bir eteği tutarak ilerlemiş. Sokaklarda kalabalık hayranlık nidaları atıyormuş, çünkü kimse aptal yerine konmak istemiyormuş. Ta ki yaşına özgü bir açık sözlülükle bir çocuk «Ama o çıplak!» diyene kadar. Mırıltı ateş gibi yayılmış ve imparator halkın haklı olduğunu hissetse de daha da dikleşmiş ve yürüyüşünü sürdürmüş.",
 de:"Der Tag der großen Prozession kam. Die Schwindler taten so, als würden sie den Herrscher Stück für Stück ankleiden, und die Kammerherren schritten voran und hielten eine Schleppe, die es nicht gab. In den Straßen brach die Menge in Bewunderungsrufe aus, denn niemand wollte als dumm gelten. Bis ein Kind mit der Offenheit seines Alters sagte: „Aber er hat ja nichts an!“ Das Gemurmel verbreitete sich wie ein Lauffeuer, und obwohl der Kaiser spürte, dass das Volk recht hatte, richtete er sich noch gerader auf und setzte seinen Weg fort."}],
vocab:[["dilapidar","to squander","har vurup harman savurmak","verschleudern"],["el embaucador","con man, swindler","düzenbaz","der Schwindler"],["necio","foolish","ahmak","dumm, töricht"],["prorrumpir en","to burst into","(birden) başlamak, koyuvermek","ausbrechen in"]],

{q:"¿Qué se decía siempre del emperador?",en:"What was always said about the emperor?",tr:"İmparator için hep ne söylenirdi?",de:"Was sagte man immer vom Kaiser?",opts:["Que estaba en el vestidor","Que estaba reunido con su consejo","Que estaba de viaje"],ex:"«El emperador está en el vestidor.»"},
{q:"¿Por qué le pareció irresistible la idea al emperador?",en:"Why did the emperor find the idea irresistible?",tr:"İmparator fikri neden karşı konulmaz buldu?",de:"Warum fand der Kaiser die Idee unwiderstehlich?",opts:["Luciría el mejor traje y distinguiría a los sabios de los tontos","Era muy barata","Los tejedores eran famosos"],ex:"«…no solo luciría el traje más espléndido del mundo, sino que además podría distinguir a los sabios de los tontos.»"},
{q:"¿Qué sostenían los chambelanes?",en:"What were the chamberlains holding?",tr:"Mabeyinciler ne tutuyordu?",de:"Was hielten die Kammerherren?",opts:["Una cola que no existía","El palio del emperador","Unas banderas"],ex:"«…los chambelanes avanzaron sosteniendo una cola que no existía.»"}]}

{id:"habichuelas",icon:"🌱",title:"Juan y las habichuelas mágicas",tt:B("Jack and the Beanstalk","Jack ve Fasulye Sırığı","Hans und die Bohnenranke"),src:"Cuento popular inglés",lv:{
A1:{paras:[
{es:"Juan vive con su madre. Son pobres. Juan vende su vaca por unas habichuelas mágicas. Su madre está enfadada y tira las habichuelas por la ventana. Por la noche crece una planta enorme. Juan sube por la planta hasta las nubes. Allí hay un castillo con un gigante. Juan coge una gallina de huevos de oro y baja rápido. Corta la planta y el gigante cae.",
 en:"Juan lives with his mother. They are poor. Juan sells his cow for some magic beans. His mother is angry and throws the beans out of the window. During the night an enormous plant grows. Juan climbs up the plant to the clouds. There is a castle there with a giant. Juan takes a hen that lays golden eggs and climbs down fast. He cuts down the plant and the giant falls.",
 tr:"Juan annesiyle yaşıyor. Fakirler. Juan ineğini birkaç sihirli fasulyeye satıyor. Annesi kızgın ve fasulyeleri pencereden atıyor. Gece kocaman bir bitki büyüyor. Juan bitkiye tırmanıp bulutlara kadar çıkıyor. Orada bir dev ve bir şato var. Juan altın yumurtlayan bir tavuğu alıyor ve hızla iniyor. Bitkiyi kesiyor ve dev düşüyor.",
 de:"Juan wohnt bei seiner Mutter. Sie sind arm. Juan verkauft seine Kuh für ein paar Zauberbohnen. Seine Mutter ist wütend und wirft die Bohnen aus dem Fenster. In der Nacht wächst eine riesige Pflanze. Juan klettert an der Pflanze hinauf bis zu den Wolken. Dort gibt es ein Schloss mit einem Riesen. Juan nimmt ein Huhn, das goldene Eier legt, und klettert schnell hinunter. Er schneidet die Pflanze um und der Riese fällt."}],
vocab:[["la vaca","cow","inek","die Kuh"],["las habichuelas","beans","fasulyeler","die Bohnen"],["el gigante","giant","dev","der Riese"],["la nube","cloud","bulut","die Wolke"]],
quiz:[
{q:"¿Qué recibe Juan por su vaca?",en:"What does Juan get for his cow?",tr:"Juan ineği karşılığında ne alıyor?",de:"Was bekommt Juan für seine Kuh?",opts:["Unas habichuelas mágicas","Mucho dinero","Una gallina"],ex:"«Juan vende su vaca por unas habichuelas mágicas.»"},
{q:"¿Qué coge Juan en el castillo?",en:"What does Juan take in the castle?",tr:"Juan şatoda ne alıyor?",de:"Was nimmt Juan im Schloss?",opts:["Una gallina de huevos de oro","Una espada","Un libro"],ex:"«Juan coge una gallina de huevos de oro y baja rápido.»"}]},
A2:{paras:[
{es:"Había una vez un chico llamado Juan que vivía con su madre en el campo. Eran tan pobres que un día ella le pidió que llevara su vaca al mercado para venderla. Por el camino, un hombre le ofreció a Juan cinco habichuelas mágicas a cambio de la vaca, y él aceptó. Cuando volvió a casa, su madre se enfadó muchísimo, tiró las habichuelas por la ventana y lo mandó a la cama sin cenar.",
 en:"Once upon a time there was a boy called Juan who lived with his mother in the countryside. They were so poor that one day she asked him to take their cow to market to sell it. On the way, a man offered Juan five magic beans in exchange for the cow, and he accepted. When he got home, his mother got really angry, threw the beans out of the window and sent him to bed without supper.",
 tr:"Bir zamanlar kırsalda annesiyle yaşayan Juan adında bir oğlan varmış. O kadar fakirlermiş ki bir gün annesi ondan ineklerini satmak için pazara götürmesini istemiş. Yolda bir adam Juan'a ineğe karşılık beş sihirli fasulye önermiş, o da kabul etmiş. Eve dönünce annesi çok kızmış, fasulyeleri pencereden atmış ve onu akşam yemeği yedirmeden yatağa göndermiş.",
 de:"Es war einmal ein Junge namens Juan, der mit seiner Mutter auf dem Land lebte. Sie waren so arm, dass sie ihn eines Tages bat, die Kuh auf den Markt zu bringen und zu verkaufen. Unterwegs bot ein Mann Juan fünf Zauberbohnen für die Kuh an, und er nahm an. Als er nach Hause kam, wurde seine Mutter furchtbar wütend, warf die Bohnen aus dem Fenster und schickte ihn ohne Abendessen ins Bett."},
{es:"A la mañana siguiente, una planta gigante llegaba hasta el cielo. Juan subió por ella y encontró un castillo enorme en las nubes. Allí vivía un gigante que gritaba: «¡Huelo a carne humana!». Juan se escondió y, cuando el gigante se durmió, le robó una gallina que ponía huevos de oro. El gigante se despertó y lo persiguió, pero Juan bajó más rápido y cortó la planta con un hacha. El gigante cayó, y Juan y su madre nunca volvieron a ser pobres.",
 en:"The next morning, a giant plant reached up to the sky. Juan climbed up it and found an enormous castle in the clouds. There lived a giant who shouted: “I smell human flesh!” Juan hid and, when the giant fell asleep, he stole a hen that laid golden eggs. The giant woke up and chased him, but Juan climbed down faster and cut the plant with an axe. The giant fell, and Juan and his mother were never poor again.",
 tr:"Ertesi sabah dev bir bitki gökyüzüne kadar uzanıyormuş. Juan ona tırmanmış ve bulutların arasında kocaman bir şato bulmuş. Orada «İnsan kokusu alıyorum!» diye bağıran bir dev yaşıyormuş. Juan saklanmış ve dev uyuyunca ondan altın yumurtlayan bir tavuğu çalmış. Dev uyanmış ve onu kovalamış ama Juan daha hızlı inmiş ve bitkiyi bir baltayla kesmiş. Dev düşmüş ve Juan ile annesi bir daha hiç fakir olmamış.",
 de:"Am nächsten Morgen reichte eine riesige Pflanze bis in den Himmel. Juan kletterte hinauf und fand ein riesiges Schloss in den Wolken. Dort lebte ein Riese, der rief: „Ich rieche Menschenfleisch!“ Juan versteckte sich, und als der Riese einschlief, stahl er ihm ein Huhn, das goldene Eier legte. Der Riese wachte auf und verfolgte ihn, aber Juan kletterte schneller hinunter und fällte die Pflanze mit einer Axt. Der Riese stürzte, und Juan und seine Mutter waren nie wieder arm."}],
vocab:[["el mercado","market","pazar","der Markt"],["a cambio de","in exchange for","karşılığında","im Tausch gegen"],["esconderse","to hide","saklanmak","sich verstecken"],["el hacha","axe","balta","die Axt"]],
quiz:[
{q:"¿Qué hizo la madre con las habichuelas?",en:"What did the mother do with the beans?",tr:"Anne fasulyelerle ne yaptı?",de:"Was machte die Mutter mit den Bohnen?",opts:["Las tiró por la ventana","Las cocinó","Las vendió"],ex:"«…tiró las habichuelas por la ventana y lo mandó a la cama sin cenar.»"},
{q:"¿Con qué cortó Juan la planta?",en:"What did Juan cut the plant with?",tr:"Juan bitkiyi neyle kesti?",de:"Womit fällte Juan die Pflanze?",opts:["Con un hacha","Con un cuchillo","Con las manos"],ex:"«…Juan bajó más rápido y cortó la planta con un hacha.»"}]},
B1:{paras:[
{es:"Juan y su madre, una viuda muy pobre, solo tenían una vaca, y cuando esta dejó de dar leche, decidieron venderla. Camino del mercado, Juan se cruzó con un anciano que le ofreció un puñado de habichuelas a cambio del animal. «Son mágicas», le aseguró. «Si las plantas esta noche, mañana llegarán al cielo». Juan, entusiasmado, hizo el trato, pero su madre, al enterarse, lloró de rabia y tiró las habichuelas al jardín.",
 en:"Juan and his mother, a very poor widow, had only one cow, and when it stopped giving milk, they decided to sell it. On the way to market, Juan came across an old man who offered him a handful of beans in exchange for the animal. “They're magic,” he assured him. “If you plant them tonight, tomorrow they'll reach the sky.” Juan, delighted, made the deal, but when his mother found out, she cried with rage and threw the beans into the garden.",
 tr:"Juan ve çok fakir bir dul olan annesinin yalnızca bir ineği varmış; inek süt vermeyi bırakınca onu satmaya karar vermişler. Pazara giderken Juan'ın karşısına yaşlı bir adam çıkmış ve hayvana karşılık ona bir avuç fasulye önermiş. «Bunlar sihirli» diye temin etmiş. «Bu gece ekersen yarın gökyüzüne ulaşırlar.» Heyecanlanan Juan anlaşmayı yapmış, ama annesi bunu öğrenince öfkeden ağlamış ve fasulyeleri bahçeye atmış.",
 de:"Juan und seine Mutter, eine sehr arme Witwe, hatten nur eine Kuh, und als diese keine Milch mehr gab, beschlossen sie, sie zu verkaufen. Auf dem Weg zum Markt begegnete Juan einem alten Mann, der ihm eine Handvoll Bohnen für das Tier anbot. „Sie sind magisch“, versicherte er ihm. „Wenn du sie heute Nacht pflanzt, reichen sie morgen bis zum Himmel.“ Juan war begeistert und schlug ein, aber als seine Mutter davon erfuhr, weinte sie vor Wut und warf die Bohnen in den Garten."},
{es:"Al amanecer, Juan descubrió que de las habichuelas había crecido un tallo tan alto que se perdía entre las nubes. Sin pensarlo, empezó a trepar, y arriba encontró un camino que llevaba a un castillo. La mujer del gigante que vivía allí le dio de comer, pero le advirtió que su marido se comía a los niños. En ese momento se oyeron unos pasos que hacían temblar el suelo, y Juan apenas tuvo tiempo de esconderse en el horno.",
 en:"At dawn, Juan discovered that from the beans a stalk had grown so tall that it disappeared into the clouds. Without thinking, he began to climb, and at the top he found a path that led to a castle. The wife of the giant who lived there gave him something to eat, but warned him that her husband ate children. At that moment footsteps that made the ground shake were heard, and Juan barely had time to hide in the oven.",
 tr:"Şafakta Juan fasulyelerden bulutların arasında kaybolacak kadar yüksek bir sap büyüdüğünü görmüş. Hiç düşünmeden tırmanmaya başlamış ve yukarıda bir şatoya giden bir yol bulmuş. Orada yaşayan devin karısı ona yiyecek vermiş ama kocasının çocukları yediği konusunda onu uyarmış. Tam o sırada yeri titreten ayak sesleri duyulmuş ve Juan fırına saklanmaya ancak vakit bulmuş.",
 de:"Bei Sonnenaufgang entdeckte Juan, dass aus den Bohnen ein Stängel gewachsen war, so hoch, dass er sich in den Wolken verlor. Ohne nachzudenken begann er zu klettern, und oben fand er einen Weg, der zu einem Schloss führte. Die Frau des Riesen, der dort lebte, gab ihm zu essen, warnte ihn aber, dass ihr Mann Kinder fraß. In diesem Moment hörte man Schritte, die den Boden erzittern ließen, und Juan hatte kaum Zeit, sich im Ofen zu verstecken."},
{es:"El gigante olfateó el aire y gruñó que olía a carne humana, pero su mujer lo convenció de que se equivocaba. Después de cenar, mandó traer su gallina y le ordenó: «¡Pon!». Y la gallina puso un huevo de oro. Cuando el gigante se quedó dormido, Juan cogió la gallina y salió corriendo. El gigante se despertó y fue tras él, pero Juan llegó abajo primero, pidió un hacha a su madre y cortó el tallo. El gigante se estrelló contra el suelo, y Juan y su madre vivieron sin preocupaciones para siempre.",
 en:"The giant sniffed the air and growled that it smelled of human flesh, but his wife convinced him he was wrong. After supper, he had his hen brought and ordered it: “Lay!” And the hen laid a golden egg. When the giant fell asleep, Juan grabbed the hen and ran off. The giant woke up and went after him, but Juan reached the bottom first, asked his mother for an axe and cut the stalk. The giant crashed to the ground, and Juan and his mother lived without worries for ever after.",
 tr:"Dev havayı koklamış ve insan eti kokusu aldığını söyleyerek homurdanmış, ama karısı onu yanıldığına ikna etmiş. Akşam yemeğinden sonra tavuğunu getirtmiş ve ona «Yumurtla!» diye emretmiş. Tavuk da altın bir yumurta yumurtlamış. Dev uyuyakalınca Juan tavuğu kapıp koşarak kaçmış. Dev uyanmış ve peşine düşmüş ama Juan aşağıya önce varmış, annesinden bir balta istemiş ve sapı kesmiş. Dev yere çakılmış ve Juan ile annesi sonsuza dek kaygısız yaşamışlar.",
 de:"Der Riese schnupperte in der Luft und brummte, es rieche nach Menschenfleisch, doch seine Frau überzeugte ihn, dass er sich irre. Nach dem Abendessen ließ er sein Huhn bringen und befahl ihm: „Leg!“ Und das Huhn legte ein goldenes Ei. Als der Riese eingeschlafen war, schnappte sich Juan das Huhn und rannte davon. Der Riese wachte auf und jagte ihm nach, doch Juan war zuerst unten, bat seine Mutter um eine Axt und hackte den Stängel durch. Der Riese stürzte auf den Boden, und Juan und seine Mutter lebten fortan ohne Sorgen."}],
vocab:[["hacer un trato","to make a deal","anlaşma yapmak","ein Geschäft machen"],["el tallo","stalk, stem","sap","der Stängel"],["trepar","to climb","tırmanmak","klettern"],["olfatear","to sniff","koklamak","schnuppern"]],
