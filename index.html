<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="description" content="Learn Spanish: tenses, everyday phrases, short stories and unlimited practice. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
<style>
#installHint{max-width:980px;margin:12px auto 0;padding:0 18px}
#installHint .card{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:14px;background:var(--gold-soft)}
#installHint .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--muted);padding:4px 8px}
#installHint svg{flex:none;vertical-align:-3px}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1b16; --muted:#6b645a; --line:#e8e1d6;
  --accent:#c8102e; --accent-soft:#fbe9ec; --gold:#e0a400; --gold-soft:#fdf4d8;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c0392b; --bad-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(60,40,20,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15120f; --card:#201b16; --ink:#f3ede4; --muted:#a59c8f; --line:#3a322a;
    --accent:#ff5a6e; --accent-soft:#3a1b20; --gold:#f2c14e; --gold-soft:#3a3018;
    --ok:#4fd18a; --ok-soft:#173326; --bad:#ff7a6b; --bad-soft:#3b1d19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 80px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink)}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent) 0 50%,var(--gold) 50% 100%)}
.langsel{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
nav.tabs a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:#fff}
.hero{padding:34px 0 18px}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tcard{padding:18px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;text-decoration:none;color:inherit}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:19px}
.tcard .ex{font-family:Fraunces,serif;color:var(--accent);font-size:15px}
.tcard .sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.back{background:none;border:none;color:var(--muted);font-weight:600;padding:18px 0 6px;display:inline-flex;gap:6px}
.lhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between;padding-bottom:14px}
.lhead h1{font-size:32px}
.lhead .short{font-family:Fraunces,serif;color:var(--accent);font-size:18px}
.analog{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.sec{margin:22px 0}
.sec>h2{font-size:22px;margin-bottom:10px}
.intro{font-size:17px;padding:18px 20px}
table.conj{border-collapse:collapse;width:100%;font-size:15px}
table.conj th,table.conj td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.conj th{font-size:13px;color:var(--muted);font-weight:600}
table.conj td:first-child{color:var(--muted);font-size:14px;width:150px}
table.conj b{color:var(--accent)}
.tblwrap{overflow-x:auto;padding:6px 14px}
.irr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.irr .card{padding:14px 16px}
.irr h4{margin:0 0 4px;font-size:14px;color:var(--accent)}
.irr p{margin:0;font-size:15px}
.use{padding:16px 18px;margin-bottom:10px}
.use h3{font-size:17px;font-family:Inter,sans-serif;font-weight:700}
.use .d{color:var(--muted);margin:2px 0 8px;font-size:15px}
.exrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.exrow .es{font-weight:600;font-size:16px}
.exrow .tr,.tl{color:var(--muted);font-size:14px}
.qtrans .tl{font-size:15px}
.face .small{color:var(--muted)}
.fixlang{font-size:13px;font-weight:700;color:var(--muted);margin-left:auto}
.spk{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:14px}
.spk:hover{border-color:var(--accent)}
.tip{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r);padding:14px 18px;margin-bottom:10px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.quiz{padding:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
.qprompt{font-size:22px;font-weight:600;margin:16px 0 4px;font-family:Fraunces,serif}
.qprompt .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.qhint{color:var(--accent);font-weight:700}
.qtrans{color:var(--muted);font-size:15px;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.tin{flex:1;min-width:200px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px}
.tin:focus{outline:none;border-color:var(--accent)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)}
.tin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:34px;font-weight:600}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .full{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600}
.qfoot{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center;padding:30px 22px}
.result .big{font-family:Fraunces,serif;font-size:56px;font-weight:700;color:var(--accent)}
.revlist{text-align:left;margin:18px 0}
.revlist div{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-width:220px}
.plist .prow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:none}
.prow .es{font-weight:600;font-size:17px}
.prow .m{color:var(--muted);font-size:14px}
.prow .cat{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.flash{perspective:1200px;max-width:560px;margin:0 auto}
.fcard{position:relative;height:240px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.face.b{transform:rotateY(180deg);background:var(--gold-soft)}
.face .big{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.fmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:10px 4px}
.drill{padding:26px;text-align:center}
.drill .verb{font-family:Fraunces,serif;font-size:42px;font-weight:700}
.drill .mean{color:var(--muted)}
.drill .tags{display:flex;gap:8px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.drill .tags .pill{font-size:14px;padding:6px 12px}
.drill .inrow{max-width:520px;margin:0 auto}
.drill .keys{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px 16px}
.stat .n{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.settings{padding:16px 18px;margin-bottom:14px}
.settings .lab{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.settings label.ck{display:flex;gap:8px;align-items:center;font-size:15px}
.prog .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.prog .row:first-child{border-top:none}
.prog .row .nm{flex:1;font-weight:600;color:inherit;text-decoration:none}
.prog .row .bar{width:120px;margin:0}
.prog .row .pc{width:46px;text-align:right;font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{padding:22px;max-width:380px}
.muted{color:var(--muted)}
.mt{margin-top:14px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:19px}
.pcard p{margin:0;color:var(--muted);font-size:15px}
.pcard .chips{margin:0}
.pcard .btn{align-self:flex-start}
.ai{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.field select,.field input{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:15px;color:var(--ink)}
.frow{display:flex;gap:10px;flex-wrap:wrap}.frow .field{flex:1;min-width:110px}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.story{overflow:hidden}
.rpara{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px 20px;border-top:1px solid var(--line)}
.rpara:first-child{border-top:none}
.rpara:hover{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.rpara .es{font-size:17px;line-height:1.75;display:flex;gap:10px;align-items:flex-start}
.rpara .tl2{color:var(--muted);font-size:16px;line-height:1.75}
.rpara.single{grid-template-columns:1fr;cursor:pointer}
.rpara.hide .tl2{display:none}
.rpara.hide.open .tl2{display:block;padding-left:42px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpgrid .story.other{opacity:.85}
.lvlab{padding:12px 20px 0;display:flex;gap:8px;align-items:center}
@media (max-width:760px){.cmpgrid{grid-template-columns:1fr}}
.lvchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lvchip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg)}
.lvchip:hover{border-color:var(--accent)}
.lvchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ccard{cursor:default}
.ccard:hover{transform:none}
.tw{cursor:pointer;border-radius:4px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.tw:hover{background:var(--gold-soft)}
.tw.saved{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.tw.sel{background:var(--accent);color:#fff;text-decoration:none}
.pbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(560px,calc(100% - 24px));z-index:40;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.shead{display:flex;align-items:flex-start;gap:10px}
.shead .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
.sword{font-family:Fraunces,serif;font-size:24px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sprev{font-weight:600;min-height:1em}
.sctx{color:var(--muted);font-size:14px;font-style:italic}
.btn.sm{padding:8px 12px;font-size:14px}
.sheet .btns{align-items:center}
@media (max-width:760px){.sheet{bottom:calc(76px + env(safe-area-inset-bottom))}}
.wrow{color:inherit;text-decoration:none}
.wrow:hover{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.wdots{margin-left:auto;color:var(--accent);font-size:12px;letter-spacing:1px;white-space:nowrap}
.wdots.big{font-size:15px}
.wcard{padding:20px 22px}
.whead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.wword{font-size:32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;word-break:break-word}
.wsec{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.wsec h3{font-family:Inter,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wsec p{margin:0}
.wmean{font-size:17px;font-weight:600}
textarea.note{width:100%;min-height:70px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:var(--ink);resize:vertical}
.exportbox{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.exportbox summary{cursor:pointer;font-weight:700}
.exportbox p{margin:6px 0}
.linkish{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
table.vocab td:first-child{width:auto;color:var(--ink)}
@media (max-width:700px){.rpara{grid-template-columns:1fr;gap:6px}.rpara .tl2{padding-left:42px}}
nav.tabs a .ti{display:none}
.topin{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border:none;border-top:1px solid var(--line);border-radius:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:visible}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0;padding:4px 1px;font-size:10px;border-radius:10px}
  nav.tabs a .ti{display:block;font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
  nav.tabs a .tlab{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs a.on{background:none;color:var(--accent)}
  nav.tabs a.on .ti{filter:none;opacity:1}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .seg{max-width:100%;overflow-x:auto}
  .seg button{padding:8px 12px}
  .topin{padding-top:10px;padding-bottom:10px}
  .langsel{max-width:52vw;margin-left:auto !important}
  .logo{font-size:20px}
}
@media (max-width:640px){
  .hero h1{font-size:28px}.lhead h1{font-size:26px}.qprompt{font-size:19px}.drill .verb{font-size:34px}
  table.conj td:first-child{width:auto}
  .prow .cat{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <a class="logo" href="#tenses"><span class="dot"></span>Español Lab</a>
  <select class="langsel" id="langSel" style="margin-left:auto"></select>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>

<script>
/* ================= Storage ================= */
const KEY="espanol-lab-v1";
let store={lessons:{},phrases:{},drill:{total:0,correct:0,streak:0,best:0,verbErr:{}},settings:{strict:false}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)store=Object.assign(store,s);}catch(e){}
store.settings=store.settings||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

/* ================= Languages =================
   To add a language: add it to LANGS, add a UI dictionary in T,
   and add that key next to "en" in content objects. Anything missing falls back to English. */
const LANGS={
  en:{name:"English",ename:"English",flag:"🇬🇧"},
  tr:{name:"Türkçe",ename:"Turkish",flag:"🇹🇷"},
  de:{name:"Deutsch",ename:"German",flag:"🇩🇪"}
};
const TRANSL={}; // per-language map: English text -> translation (filled below)

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim();
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const pct=n=>n===null?"—":t("pct",n);
const PERS=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ustedes"];
let voices=[];
const canSpeak="speechSynthesis" in window;
if(canSpeak){try{voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{voices=speechSynthesis.getVoices();};}catch(e){}}
function speak(s){
  if(!canSpeak)return;
  try{
    const u=new SpeechSynthesisUtterance(s.replace(/_+/g," "));
    u.lang="es-ES";u.rate=.92;
    const v=voices.find(v=>v.lang==="es-ES")||voices.find(v=>v.lang&&v.lang.startsWith("es"));
    if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
const spk=s=>canSpeak?`<button class="spk" title="▶" data-say="${esc(s)}">🔊</button>`:"";
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();e.stopPropagation();speak(b.dataset.say);}});

  const head=`<tr><th></th>${sets.map(s=>`<th>${s[0]}</th>`).join("")}</tr>`;
  const rows=PERS.map((p,i)=>`<tr><td>${p}</td>${sets.map(s=>`<td>${s[1]}<b>${s[2][i]}</b></td>`).join("")}</tr>`).join("");
  return `<div class="card tblwrap"><table class="conj">${head}${rows}</table></div>`;
}
function fullTable(sets){
  const head=`<tr><th></th>${sets.map(s=>`<th>${s[0]}</th>`).join("")}</tr>`;
  const rows=PERS.map((p,i)=>`<tr><td>${p}</td>${sets.map(s=>`<td>${s[1][i]}</td>`).join("")}</tr>`).join("");
  return `<div class="card tblwrap"><table class="conj">${head}${rows}</table></div>`;
}

],

{id:"indefinido",title:"Pretérito indefinido",short:"hablé",lvl:"A2",sub:B("Finished, one-off events","Bitmiş, tek seferlik olaylar"),analog:B("simple past","-dı (bitmiş olay)"),
intro:B("Used for events that <b>started and finished at a specific time</b> in the past. The “events” of a story, what happened and what was done, are told in this tense. It's the closest match to the English simple past.",
"Geçmişte <b>belli bir zamanda başlayıp bitmiş</b> olaylar için kullanılır. Hikâyedeki “olaylar”, yani ne oldu, ne yapıldı, bu zamanla anlatılır. İngilizcedeki simple past'ın en yakın karşılığıdır."),
forms:[
 [B("Regular verbs","Düzenli fiiller"), endTable([["-AR · hablar","habl",["é","aste","ó","amos","asteis","aron"]],["-ER · comer","com",["í","iste","ió","imos","isteis","ieron"]],["-IR · vivir","viv",["í","iste","ió","imos","isteis","ieron"]]])],
 [B("Irregularities","Düzensizlikler"), irr([
  [B("Strong stems (no accents!)","Güçlü kökler (aksansız!)"),B("tener → <b>tuv</b>- · estar → <b>estuv</b>- · poder → <b>pud</b>- · poner → <b>pus</b>- · saber → <b>sup</b>- · querer → <b>quis</b>- · venir → <b>vin</b>- · hacer → <b>hic</b>- (él: <b>hizo</b>)<br>Endings: -e, -iste, -o, -imos, -isteis, -ieron","tener → <b>tuv</b>- · estar → <b>estuv</b>- · poder → <b>pud</b>- · poner → <b>pus</b>- · saber → <b>sup</b>- · querer → <b>quis</b>- · venir → <b>vin</b>- · hacer → <b>hic</b>- (él: <b>hizo</b>)<br>Ekler: -e, -iste, -o, -imos, -isteis, -ieron")],
  [B("-j stems","-j kökleri"),B("decir → <b>dije</b> · traer → <b>traje</b><br>ellos: dij<b>eron</b>, traj<b>eron</b> (no i)","decir → <b>dije</b> · traer → <b>traje</b><br>ellos: dij<b>eron</b>, traj<b>eron</b> (i yok)")],
  ["ser = ir",B("fui, fuiste, fue, fuimos, fuisteis, fueron. Context tells you which one it is.","fui, fuiste, fue, fuimos, fuisteis, fueron. Hangisi olduğu bağlamdan anlaşılır.")],
  ["dar / ver","di, diste, dio… · vi, viste, vio…"],
  [B("Stem change in the 3rd person (-ir)","3. şahısta kök değişimi (-ir)"),"dormir → <b>durmió</b>, durmieron · pedir → <b>pidió</b>, pidieron"],
  [B("Spelling change (yo)","Yazım değişimi (yo)"),"buscar → <b>busqué</b> · llegar → <b>llegué</b> · empezar → <b>empecé</b> · leer → <b>leyó</b>"]
 ])]
],
uses:[
 {t:B("A single event at a specific time","Belirli zamanda tek bir olay"),d:B("The time is known and it's over.","Ne zaman olduğu belli ve bitmiş."),ex:[["Ayer compré un móvil nuevo.","Yesterday I bought a new phone.","Dün yeni bir telefon aldım."]]},
 {t:B("A sequence of events","Art arda olaylar"),d:B("The steps that move a story forward.","Hikâyenin ilerleyen adımları."),ex:[["Llegué a casa, cené y me acosté.","I got home, had dinner and went to bed.","Eve geldim, yemek yedim ve yattım."]]},
 {t:B("A limited period","Sınırlı süre"),d:B("A period with a clear start and end.","Başı ve sonu belli bir dönem."),ex:[["Viví tres años en Ankara.","I lived in Ankara for three years.","Üç yıl Ankara'da yaşadım."]]}
],
tips:[B("Key words: <b>ayer, anoche, anteayer, la semana pasada, el año pasado, en 2023, hace dos años, de repente</b>.","Anahtar kelimeler: <b>ayer, anoche, anteayer, la semana pasada, el año pasado, en 2023, hace dos años, de repente</b>."),
B("The only difference between hablo (I speak) and habló (he spoke) is the accent. Getting the accent right changes the meaning here.","hablo (konuşurum) ile habló (konuştu) arasındaki tek fark aksandır. Aksanı doğru yazmak burada anlamı değiştirir.")],
quiz:[
 {q:"Ayer ___ con mi madre.",h:"hablar, yo",en:"Yesterday I talked to my mother.",tr:"Dün annemle konuştum.",a:["hablé"],ex:"-ar, yo → -é: hablé."},
 {q:"Anoche ellos ___ pizza.",h:"comer",en:"Last night they ate pizza.",tr:"Dün gece pizza yediler.",a:["comieron"],ex:"-er, ellos → -ieron."},
 {q:"El año pasado ___ a Sevilla.",h:"ir, nosotros",en:"Last year we went to Seville.",tr:"Geçen yıl Sevilla'ya gittik.",opts:["fuimos","íbamos","vamos"],ex:B("A finished, one-off event, so indefinido: fuimos.","Bitmiş, tek seferlik bir olay, o yüzden indefinido: fuimos.")},
 {q:"¿Qué ___ el fin de semana?",h:"hacer, tú",en:"What did you do at the weekend?",tr:"Hafta sonu ne yaptın?",a:["hiciste"],ex:"hacer → hic-: hice, hiciste, hizo…"},
 {q:"Ella me ___ la verdad.",h:"decir",en:"She told me the truth.",tr:"Bana gerçeği söyledi.",opts:["dijo","dijó","deció"],ex:B("Strong stems take no accent: dijo.","Güçlü kökler aksan almaz: dijo.")},
 {q:"Yo ___ tarde al trabajo.",h:"llegar",en:"I arrived late to work.",tr:"İşe geç kaldım.",a:["llegué"],ex:B("-gar → -gué in yo: llegué.","-gar → yo'da -gué: llegué.")},
 {q:"Él ___ diez horas.",h:"dormir",en:"He slept ten hours.",tr:"On saat uyudu.",opts:["durmió","dormió","duermió"],ex:B("-ir verbs change o → u in the 3rd person: durmió.","-ir fiillerinde 3. şahısta o → u: durmió.")},
 {q:"Nosotros no ___ venir.",h:"poder",en:"We couldn't come.",tr:"Gelemedik.",a:["pudimos"],ex:"poder → pud-: pudimos."}
]},

{id:"imperfecto",title:"Pretérito imperfecto",short:"hablaba",lvl:"A2",sub:B("Habits, descriptions, background","Alışkanlık, betimleme, arka plan"),analog:B("used to / would / was -ing","-ırdı / -ıyordu"),
intro:B("Used for past situations that were <b>habitual</b>, <b>ongoing</b> or that <b>describe the background</b>. When it started or ended doesn't matter. In English it usually maps to <b>used to / would</b> (habits) or <b>was/were + -ing</b> (ongoing actions).",
"Geçmişte <b>alışkanlık haline gelmiş</b>, <b>devam eden</b> ya da <b>arka planı betimleyen</b> durumlar için kullanılır. Ne zaman başlayıp bittiği önemli değildir. Türkçedeki <b>-ırdı / -ıyordu</b> ekine, İngilizcedeki <b>used to / was -ing</b> yapısına çok benzer."),
forms:[
 [B("Conjugation","Çekim"), endTable([["-AR · hablar","habl",["aba","abas","aba","ábamos","abais","aban"]],["-ER · comer","com",["ía","ías","ía","íamos","íais","ían"]],["-IR · vivir","viv",["ía","ías","ía","íamos","íais","ían"]]])],
 [B("Only 3 irregular verbs","Sadece 3 düzensiz fiil"), irr([["ser","era, eras, era, éramos, erais, eran"],["ir","iba, ibas, iba, íbamos, ibais, iban"],["ver","veía, veías, veía, veíamos, veíais, veían"]])]
],
uses:[
 {t:B("Past habits","Geçmişteki alışkanlıklar"),d:"siempre, todos los días, a menudo, antes, de niño…",ex:[["De niño, jugaba al fútbol todos los días.","As a kid, I used to play football every day.","Çocukken her gün futbol oynardım."],["Antes vivía en Ankara.","I used to live in Ankara.","Eskiden Ankara'da yaşardım."]]},
 {t:B("Descriptions","Betimleme"),d:B("People, places, weather, feelings.","İnsanlar, yerler, hava, duygular."),ex:[["La casa era grande y tenía un jardín.","The house was big and had a garden.","Ev büyüktü ve bahçesi vardı."],["Hacía frío y estaba cansado.","It was cold and I was tired.","Hava soğuktu ve yorgundum."]]},
 {t:B("Time and age","Saat ve yaş"),d:B("In the past, time and age always take the imperfecto.","Geçmişte saat ve yaş her zaman imperfecto ile söylenir."),ex:[["Eran las ocho.","It was eight o'clock.","Saat sekizdi."],["Cuando tenía diez años…","When I was ten…","On yaşındayken…"]]},
 {t:B("Ongoing action (background)","Devam eden eylem (arka plan)"),d:B("An action in progress while something else happens.","Başka bir şey olurken süren eylem."),ex:[["Mientras yo cocinaba, ella veía la tele.","While I was cooking, she was watching TV.","Ben yemek yaparken o televizyon izliyordu."]]},
 {t:B("Polite requests","Kibar rica"),d:B("Softer than quiero.","Quiero'dan daha yumuşak bir ifade."),ex:[["Quería un café, por favor.","I'd like a coffee, please.","Bir kahve rica edecektim."]]}
],
tips:[B("If English says <b>used to / would / was -ing</b>, it's usually imperfecto. If it's a finished one-off event in the <b>simple past</b>, it's usually indefinido.","Türkçede <b>-ırdı / -ıyordu</b> diyorsan genelde imperfecto, <b>-dı</b> diyorsan ve eylem tek bir bitmiş olaysa genelde indefinido gerekir."),
B("yo and él share the same form (hablaba), so say the subject when needed.","yo ve él aynı çekimi alır (hablaba), bu yüzden gerekirse özneyi söyle.")],
quiz:[
 {q:"De niño, ___ mucho chocolate.",h:"comer, yo",en:"As a kid I used to eat a lot of chocolate.",tr:"Çocukken çok çikolata yerdim.",a:["comía"],ex:B("A habit, so imperfecto: comía.","Alışkanlık, o yüzden imperfecto: comía.")},
 {q:"Cuando ___ en Ankara, trabajaba mucho.",h:"vivir, yo",en:"When I lived in Ankara, I worked a lot.",tr:"Ankara'da yaşarken çok çalışırdım.",a:["vivía"],ex:B("An ongoing situation in the past: vivía.","Geçmişteki süregelen durum: vivía.")},
 {q:"___ las diez de la noche.",h:"ser",en:"It was ten at night.",tr:"Saat gece onu.",opts:["Eran","Fueron","Son"],ex:B("Telling the time in the past uses the imperfecto: Eran.","Geçmişte saat söylerken imperfecto kullanılır: Eran.")},
 {q:"Nosotros ___ a la playa cada verano.",h:"ir",en:"We used to go to the beach every summer.",tr:"Her yaz plaja giderdik.",a:["íbamos"],ex:B("ir is irregular: íbamos.","ir düzensizdir: íbamos.")},
 {q:"Mi abuela ___ muy simpática.",h:"ser",en:"My grandmother was very nice.",tr:"Babaannem çok sevimliydi.",opts:["era","fue","es"],ex:B("Describing character, so imperfecto.","Karakter betimlemesi, o yüzden imperfecto.")},
 {q:"Antes no ___ la tele.",h:"ver, yo",en:"I didn't use to watch TV.",tr:"Eskiden televizyon izlemezdim.",a:["veía"],ex:B("ver is irregular: veía.","ver düzensizdir: veía.")},
 {q:"Mientras tú ___, yo limpiaba.",h:"dormir",en:"While you were sleeping, I was cleaning.",tr:"Sen uyurken ben temizlik yapıyordum.",opts:["dormías","dormiste","durmiste"],ex:B("“mientras” shows two actions going on at the same time, so both are imperfecto.","“mientras” aynı anda devam eden iki eylemi gösterir, o yüzden ikisi de imperfecto.")}
]},

{id:"contraste",title:B("Indefinido or imperfecto?","Indefinido mu, imperfecto mu?"),short:"dormía cuando sonó",lvl:"A2",sub:B("Scene and event","Sahne ve olay"),analog:B("was -ing ↔ simple past","-ıyordu ↔ -dı"),
intro:B("Think of a scene: the <b>imperfecto</b> is the <b>set and background</b> (what was going on, what it was like). The <b>indefinido</b> is the <b>event</b> that happened (what happened, what finished). The two often appear together in the same sentence.",
"Bir sahne gibi düşün: <b>imperfecto</b> sahnedeki <b>dekor ve arka plandır</b> (ne oluyordu, ortam nasıldı). <b>Indefinido</b> ise o arada <b>olan olaydır</b> (ne oldu, ne bitti). İki zaman çoğu zaman aynı cümlede birlikte kullanılır."),
forms:[
 [B("Comparison","Karşılaştırma"), B(
  cmpTable([["Role","Background, description, habit","Event, change, finished action"],["Question","What was it like? What was going on?","What happened?"],["Key words","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["English","used to / would / was -ing","simple past"]]),
  cmpTable([["Rol","Arka plan, betimleme, alışkanlık","Olay, değişim, bitmiş eylem"],["Soru","Nasıldı? Ne oluyordu?","Ne oldu?"],["Kelimeler","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["İngilizce","used to / would / was -ing","simple past"],["Türkçe","-ırdı / -ıyordu","-dı"]]),
  cmpTable([["Funktion","Hintergrund, Beschreibung, Gewohnheit","Ereignis, Veränderung, abgeschlossene Handlung"],["Frage","Wie war es? Was war gerade los?","Was ist passiert?"],["Signalwörter","siempre, antes, todos los días, mientras, de niño","ayer, anoche, una vez, de repente, en 2020"],["Englisch","used to / would / was -ing","simple past"]]))],
 [B("Verbs that change meaning","Anlam değiştiren fiiller"), irr([
  ["conocer",B("conocía a Ana = I knew Ana<br>conocí a Ana = I met Ana","conocía a Ana = Ana'yı tanıyordum<br>conocí a Ana = Ana'yla tanıştım")],
  ["saber",B("sabía = I knew<br>supe = I found out","sabía = biliyordum<br>supe = öğrendim, haberim oldu")],
  ["querer / poder",B("no quería = I didn't want to<br>no quise = I refused · no pude = I couldn't (I tried)","no quería = istemiyordum<br>no quise = reddettim · no pude = yapamadım (denedim)")]
 ])]
],
uses:[
 {t:B("Background + interrupting event","Arka plan + araya giren olay"),d:B("The ongoing action is imperfecto, the interrupting one is indefinido.","Devam eden şey imperfecto, araya giren şey indefinido."),ex:[["Dormía cuando sonó el teléfono.","I was sleeping when the phone rang.","Telefon çaldığında uyuyordum."],["Llovía mucho, así que decidimos quedarnos en casa.","It was raining a lot, so we decided to stay home.","Çok yağmur yağıyordu, evde kalmaya karar verdik."]]},
 {t:B("Habit vs. one time","Alışkanlık vs. tek sefer"),d:B("Same verb, different meaning.","Aynı fiil, farklı anlam."),ex:[["Antes iba al gimnasio.","I used to go to the gym.","Eskiden spora giderdim."],["Ayer fui al gimnasio.","Yesterday I went to the gym.","Dün spora gittim."]]}
],
tips:[B("English <b>“was”</b> on its own can match either tense (<i>the house was big</i> → era). Then ask: is it a description or an event?","İngilizce tek başına <b>“was”</b> iki zamana da karşılık gelebilir (<i>the house was big</i> → era). O zaman “bu bir betimleme mi, yoksa olay mı?” diye sor."),
B("If <b>“would”</b> describes a habit (<i>we would go to the beach</i>) it's imperfecto. If it's conditional (<i>I would like</i>) it's the condicional.","<b>“would”</b> alışkanlık anlatıyorsa (<i>we would go to the beach</i>) imperfecto olur. Koşul anlatıyorsa (<i>I would like</i>) condicional olur.")],
quiz:[
 {q:"De niño, ___ al parque todos los días.",h:"ir",en:"As a kid, I used to go to the park every day.",tr:"Çocukken her gün parka giderdim.",opts:["iba","fui"],ex:B("Habit → imperfecto.","Alışkanlık → imperfecto.")},
 {q:"Ayer ___ al gimnasio a las siete.",h:"ir, yo",en:"Yesterday I went to the gym at seven.",tr:"Dün saat yedide spora gittim.",opts:["fui","iba"],ex:B("One-off, finished event → indefinido.","Tek seferlik, bitmiş olay → indefinido.")},
 {q:"Yo ___ cuando sonó el teléfono.",h:"dormir",en:"I was sleeping when the phone rang.",tr:"Telefon çaldığında uyuyordum.",opts:["dormía","dormí"],ex:B("Background → imperfecto. The phone ringing is the event → indefinido.","Arka plan → imperfecto. Telefonun çalması olay → indefinido.")},
 {q:"La casa de mis abuelos ___ muy grande.",h:"ser",en:"My grandparents' house was very big.",tr:"Dedemlerin evi çok büyüktü.",opts:["era","fue"],ex:B("Description → imperfecto.","Betimleme → imperfecto.")},
 {q:"Cuando ___ diez años, me mudé a Ankara.",h:"tener",en:"When I was ten, I moved to Ankara.",tr:"On yaşındayken Ankara'ya taşındım.",opts:["tenía","tuve"],ex:B("Age → imperfecto. Moving is a single event → indefinido.","Yaş → imperfecto. Taşınma tek bir olay → indefinido.")},
 {q:"Mientras yo cocinaba, mi compañero ___ la tele.",h:"ver",en:"While I was cooking, my flatmate was watching TV.",tr:"Ben yemek yaparken ev arkadaşım televizyon izliyordu.",opts:["veía","vio"],ex:B("mientras → two ongoing actions.","mientras → iki devam eden eylem.")},
 {q:"Anoche ___ una película muy buena.",h:"ver, yo",en:"Last night I watched a really good film.",tr:"Dün gece çok güzel bir film izledim.",opts:["vi","veía"],ex:B("A finished single event → indefinido.","Bitmiş tek olay → indefinido.")},
 {q:"En la fiesta ___ a Laura. ¡Es muy maja!",h:"conocer, yo",en:"I met Laura at the party. She's really nice!",tr:"Partide Laura'yla tanıştım. Çok tatlı biri!",opts:["conocí","conocía"],ex:B("In the indefinido, conocer means “met”.","conocer indefinido'da “tanıştım” anlamına gelir.")},
 {q:"___ sol y la gente paseaba por el Retiro.",h:"hacer",en:"It was sunny and people were strolling in the Retiro.",tr:"Hava güneşliydi ve insanlar Retiro'da yürüyordu.",opts:["Hacía","Hizo"],ex:B("Describing the weather → imperfecto.","Hava durumu betimlemesi → imperfecto.")}
]},

{id:"futuro",title:"Futuro simple",short:"hablaré",lvl:"A2",sub:B("Future and guesses","Gelecek ve tahmin"),analog:B("will / going to","-acak / -ecek"),
intro:B("Used for things that will happen, predictions and promises. In everyday speech, near plans usually use <b>ir a + infinitive</b> (<i>voy a cenar</i>), like English “going to”. The futuro can also <b>guess about the present</b>: <i>Estará en casa</i> → “He's probably at home”.",
"Gelecekte olacak şeyler, tahminler ve sözler için kullanılır. Konuşma dilinde yakın planlar için çoğu zaman <b>ir a + infinitivo</b> tercih edilir (<i>voy a cenar</i>). Futuro ayrıca <b>şimdiki zamanla ilgili tahmin</b> de yapar: <i>Estará en casa</i> → “Herhalde evdedir”."),
forms:[
 [B("Conjugation: infinitive + ending","Çekim: infinitivo + ek"), endTable([["hablar","hablar",["é","ás","á","emos","éis","án"]],["comer","comer",["é","ás","á","emos","éis","án"]],["vivir","vivir",["é","ás","á","emos","éis","án"]]])],
 [B("Irregular stems (same endings)","Düzensiz kökler (ekler aynı)"), irr([
  [B("The e drops","e düşer"),"poder → <b>podr</b>- · querer → <b>querr</b>- · saber → <b>sabr</b>- · haber → <b>habr</b>-"],

const TENSES={pres:"Presente",perf:"Pretérito perfecto",indef:"Indefinido",imp:"Imperfecto",fut:"Futuro",cond:"Condicional",subj:"Subjuntivo presente"};
function conj(inf,tn){
  const d=V[inf]||{};const typ=inf.slice(-2);const st=inf.slice(0,-2);
  if(Array.isArray(d[tn]))return d[tn];
  const E={
    pres:{ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]},
    indef:{ar:["é","aste","ó","amos","asteis","aron"],er:["í","iste","ió","imos","isteis","ieron"],ir:["í","iste","ió","imos","isteis","ieron"]},
    imp:{ar:["aba","abas","aba","ábamos","abais","aban"],er:["ía","ías","ía","íamos","íais","ían"],ir:["ía","ías","ía","íamos","íais","ían"]}
  };
  if(tn==="pres"||tn==="imp")return E[tn][typ].map(e=>st+e);
  if(tn==="indef"){
    const r=E.indef[typ].map(e=>st+e);
    if(typ==="ar"){
      if(st.endsWith("c"))r[0]=st.slice(0,-1)+"qué";
      else if(st.endsWith("g"))r[0]=st+"ué";
      else if(st.endsWith("z"))r[0]=st.slice(0,-1)+"cé";
    }
    return r;
  }
  if(tn==="fut"){const s=d.fst||inf;return ["é","ás","á","emos","éis","án"].map(e=>s+e);}
  if(tn==="cond"){const s=d.fst||inf;return ["ía","ías","ía","íamos","íais","ían"].map(e=>s+e);}
  if(tn==="perf"){const p=d.part||(typ==="ar"?st+"ado":st+"ido");return ["he","has","ha","hemos","habéis","han"].map(h=>h+" "+p);}
  if(tn==="subj"){
    const yo=conj(inf,"pres")[0];let s=yo.slice(0,-1);
    if(typ==="ar"){
      if(s.endsWith("c"))s=s.slice(0,-1)+"qu";else if(s.endsWith("g"))s=s+"u";else if(s.endsWith("z"))s=s.slice(0,-1)+"c";
      return ["e","es","e","emos","éis","en"].map(e=>s+e);
    }
    return ["a","as","a","amos","áis","an"].map(e=>s+e);
  }
}

/* ================= Quiz engine ================= */
function startQuiz(L,qs){
  quiz={L,qs:shuffle(qs).map(q=>q.opts?Object.assign({},q,{shuffled:shuffle(q.opts),correct:q.opts[0]}):q),i:0,score:0,wrong:[],full:qs.length===L.quiz.length};
  renderQ();
}
const qText=q=>tx(q.q);
function fillSentence(q,ans){const s=qText(q);return s.includes("___")?s.replace("___",ans):ans;}
function renderQ(){
  const box=$("#quiz");if(!box)return;
  const q=quiz.qs[quiz.i];
  const p=Math.round(quiz.i/quiz.qs.length*100);
  const prompt=esc(qText(q)).replace("___",'<span class="blank">&nbsp;?&nbsp;</span>');
  const m=transLines(q);
  box.innerHTML=`<div class="qtop"><span>${t("qCount",quiz.i+1,quiz.qs.length)}</span><span>✔ ${quiz.score}</span></div>
  <div class="bar"><i style="width:${p}%;background:var(--accent)"></i></div>
  <div class="qprompt">${prompt} ${q.h?`<span class="qhint">(${esc(q.h)})</span>`:""}</div>
  ${m?`<div class="qtrans">${m}</div>`:'<div style="height:14px"></div>'}
  ${q.opts?`<div class="opts">${q.shuffled.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`
   :`<div class="inrow"><input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("typeAnswer")}"><button class="btn dark" id="chk">${t("check")}</button></div>
     <div class="keys">${["á","é","í","ó","ú","ñ","ü"].map(c=>`<button data-ch="${c}">${c}</button>`).join("")}</div>`}
  <div id="fb"></div><div class="qfoot" id="qfoot"></div>`;
  quiz.answered=false;
  if(q.opts){box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerMC(+b.dataset.k));}
  else{
    const inp=$("#tin");inp.focus();
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(quiz.answered)next();else answerType();}};
    $("#chk").onclick=answerType;
    bindKeys(box,inp);
  }
}
function bindKeys(box,inp){box.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,s)+b.dataset.ch+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1);});}
function checkAnswer(val,answers){
  const v=norm(val);if(!v)return null;
  if(answers.some(a=>norm(a)===v))return "ok";
  if(answers.some(a=>deacc(norm(a))===deacc(v)))return store.settings.strict?"accent-bad":"accent";
  return "bad";
}
function answerType(){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i];const inp=$("#tin");const r=checkAnswer(inp.value,q.a);
  if(r===null){inp.focus();return;}
  const ok=r==="ok"||r==="accent";
  inp.classList.add(ok?"right":"wrong");inp.readOnly=true;$("#chk").disabled=true;
  finishQ(ok,q,q.a[0],r==="accent"||r==="accent-bad",inp.value);
}
function answerMC(k){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i];const pick=q.shuffled[k];const ok=pick===q.correct;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.shuffled[j]===q.correct)b.classList.add("right");else if(j===k)b.classList.add("wrong");});

function finishQ(ok,q,correct,accentNote,given){
  quiz.answered=true;
  if(ok)quiz.score++;else quiz.wrong.push({q,given});
  if(quiz.L.onAnswer)try{quiz.L.onAnswer(q,ok);}catch(e){}
  const full=fillSentence(q,correct);
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok?(accentNote?t("okAccent"):"¡Correcto!"):t("rightAnswer")+esc(correct)}</div>

function next(){quiz.i++;if(quiz.i>=quiz.qs.length)showResult();else renderQ();}
function showResult(){

  <div class="btns" style="justify-content:center">${wrong.length?`<button class="btn" id="rw">${t("retryWrong")}</button>`:""}<button class="btn ghost" id="ra">${L.regen?t("newQs"):t("restart")}</button>${!L.noSave&&GENMAP[L.id]?`<button class="btn ghost" id="rg">${t("unlimited")}</button>`:""}<button class="btn ghost" id="rb">${L.backLabel?t(L.backLabel):t("backToTenses")}</button></div></div>`;
  if(wrong.length)$("#rw").onclick=()=>startQuiz(L,wrong.map(w=>L.quiz.find(x=>x.q===w.q.q)));
  $("#ra").onclick=()=>L.regen?L.regen():startQuiz(L,L.quiz);

function drawPTest(){
  const pool=phrState.cat==="all"?allPhr():allPhr().filter(p=>p.cat===phrState.cat);
  if(!phrState.pq){
    const every=allPhr();
    const qs=shuffle(pool).slice(0,10).map(p=>{const dir=Math.random()<.5?"es":"m";

      return {p,dir,opts:shuffle([p,...others])};});
    phrState.pq={qs,i:0,score:0};
  }

  if(Q.i>=Q.qs.length){
    const r=Q.score/Q.qs.length;const k=phrState.cat;const prev=store.phrases[k]||{best:0};store.phrases[k]={best:Math.max(prev.best,r)};save();

  <div class="qfoot" id="pf"></div></div>`;
  document.querySelectorAll("#pbody .opt").forEach(b=>b.onclick=()=>{

perf:[["Hoy","today","bugün"],["Esta mañana","this morning","bu sabah"],["Esta semana","this week","bu hafta"],["Este mes","this month","bu ay"]],
indef:[["Ayer","yesterday","dün"],["Anoche","last night","dün gece"],["La semana pasada","last week","geçen hafta"],["El año pasado","last year","geçen yıl"],["Hace dos días","two days ago","iki gün önce"]],
imp:[["Antes siempre","before, always","eskiden hep"],["En aquella época, a menudo","back then, often","o zamanlar sık sık"],["De pequeños, todos los veranos","as kids, every summer","çocukken her yaz"],["Por aquel entonces, cada día","at that time, every day","o dönem her gün"]],

subj:[["Espero que","I hope that","umarım"],["Quiero que","I want (someone) to","istiyorum ki"],["Ojalá","hopefully","keşke / inşallah"],["Es importante que","it's important that","önemli olan"]]
};
const WHY={
pres:B("Routine, now or a general fact → presente.","Rutin, şimdi ya da genel durum → presente."),
perf:B("A period that isn't over yet → pretérito perfecto (haber + participle).","Henüz bitmemiş zaman dilimi → pretérito perfecto (haber + participio)."),
indef:B("A finished, specific time → indefinido.","Bitmiş, belirli bir zaman → indefinido."),
imp:B("A past habit → imperfecto.","Geçmişteki alışkanlık → imperfecto."),

const CWHY={
indef:B("points to a specific, finished time, so indefinido","belirli ve bitmiş bir zamanı gösteriyor, o yüzden indefinido"),
imp:B("describes a past habit, so imperfecto","geçmişteki bir alışkanlığı anlatıyor, o yüzden imperfecto"),

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mo=m=>({es:m[0],en:m[1],tr:m[2]});
const perLang=f=>Object.fromEntries(Object.keys(LANGS).map(k=>[k,f(k)]));
const gloss=(m,v)=>perLang(k=>`${m[0]} = ${inLang(mo(m),k)} · ${v} = ${inLang(V[v],k)}`);
function genFill(tenses,n){
  const verbs=Object.keys(COMP).filter(v=>V[v]);const out=[];const seen=new Set();let guard=0;
  while(out.length<n&&guard++<n*20){
    const tn=rnd(tenses),v=rnd(verbs);if(tn==="perf"&&v==="estar"&&Math.random()<.5)continue;
    const p=tn==="subj"?1+Math.floor(Math.random()*5):Math.floor(Math.random()*6);
    const comp=rnd(COMP[v]),m=rnd(MARK[tn]),ans=conj(v,tn)[p];
    const q=`${m[0]} ${SUBJ[p]} ___ ${comp}.`;if(seen.has(q))continue;seen.add(q);
    const base=`<b>${v}</b> · ${TENSES[tn]} · ${PERS[p]} → <b>${ans}</b>`;
    out.push(Object.assign({q,h:`${v} · ${TENSES[tn]}`,a:[ans],
      ex:perLang(k=>`${base}${V[v].irr?" ("+((T[k]||T.en).irregularVerb)+")":""}. ${inLang(WHY[tn],k)}`)},gloss(m,v)));

  const [tA,tB]=kind==="ii"?["indef","imp"]:["perf","indef"];
  while(out.length<n&&guard++<n*20){
    const v=rnd(verbs),p=Math.floor(Math.random()*6),comp=rnd(COMP[v]);
    const fA=conj(v,tA)[p],fB=conj(v,tB)[p];if(fA===fB)continue;
    let q,correct,wrongF,ex,gl;
    const pat=kind==="ii"&&!NOBG.includes(v)&&Math.random()<.25?"bg":Math.random()<.5?"A":"B";
    if(pat==="bg"){
      q=`${cap(SUBJ[p])} ___ ${comp} cuando sonó el teléfono.`;correct=fB;wrongF=fA;
      ex=B("The action in progress when the phone rang is the background, so imperfecto. “sonó” is the interrupting event (indefinido).","Telefon çaldığı anda devam eden eylem arka plandır, o yüzden imperfecto. “sonó” ise araya giren olaydır (indefinido).");
      gl=gloss(["cuando sonó el teléfono","when the phone rang","telefon çaldığında"],v);
    }else{
      const tn=pat==="A"?tA:tB,m=rnd(MARK[tn]);
      q=`${m[0]} ${SUBJ[p]} ___ ${comp}.`;correct=pat==="A"?fA:fB;wrongF=pat==="A"?fB:fA;
      ex=perLang(k=>`“${m[0]}” ${inLang(CWHY[tn],k)}: <b>${correct}</b>.`);
      gl=gloss(m,v);
    }
    if(seen.has(q))continue;seen.add(q);
    out.push(Object.assign({q,h:v,opts:[correct,wrongF],ex},gl));
  }
  return out;
}

async function aiTest(c,fromRegen){
  const btn=$("#aiGo"),st=$("#aiS");
  const busy=on=>{if(btn)btn.disabled=on;if(st){st.className="status";st.innerHTML=on?`<span class="spin"></span>${t("aiBusyQ")}`:"";}};
  busy(true);
  if(fromRegen)$("#pzone").innerHTML=`<div class="card quiz"><p class="status"><span class="spin"></span>${t("aiBusyRegen")}</p></div>`;
  const lang=LANG,lname=LANGS[lang].ename;
  const topic=c.ti===FREE?c.extra:enOf(AITOPICS[c.ti])+(c.extra?` (extra wish: ${c.extra})`:"");
  const recent=(store.aiRecent||[]).slice(-25);
  const trKey=lang==="en"?"":`,"${lang}":"${lname} translation of the full sentence"`;
  const prompt=`You are an expert Spanish teacher. The learner lives in Madrid, CEFR level ${c.lvl}. The learner's helper language is ${lname}.
Write ${c.n} NEW, varied practice questions on this topic: ${topic}.
Rules:
- Peninsular Spanish (use vosotros; pretérito perfecto for today/this week as in Spain).
- Everyday situations; theme seed for variety: ${rnd(SEEDS)}, ${rnd(SEEDS)}.
- Each question is ONE Spanish sentence containing exactly one blank written as ___ .
- About half "mc" (exactly 3 options, the FIRST option is the correct one, distractors plausible but clearly wrong) and half "type" (the learner types the missing word or words).
- "h" is a short hint shown in parentheses, e.g. "ir, nosotros", or "" if not needed. Never put the answer in the hint.
- "en" = English translation of the full sentence.${lang==="en"?"":` "${lang}" = ${lname} translation of the full sentence.`}
- "ex" = 1–2 sentence explanation, written in ${lname}, of why the answer is correct.
- For "type", "a" lists every acceptable answer (with correct accents).
- Do not reuse these sentences: ${JSON.stringify(recent)}
Return ONLY JSON, no prose:
{"title":"short title in ${lname}","questions":[{"type":"mc","q":"...","h":"...","en":"..."${trKey},"opts":["correct","wrong","wrong"],"ex":"..."},{"type":"type","q":"...","h":"...","en":"..."${trKey},"a":["answer"],"ex":"..."}]}`;
  try{
    const r=await askClaude(prompt);
    const S=x=>typeof x==="string"?x:"";
    const qs=(r&&Array.isArray(r.questions)?r.questions:[]).map(q=>{
      const o={q:S(q.q),h:S(q.h),en:S(q.en),ex:esc(S(q.ex))};
      if(lang!=="en")o[lang]=S(q[lang]);
      if(Array.isArray(q.opts)&&q.opts.length>=2){o.opts=[...new Set(q.opts.map(S).filter(Boolean))];if(o.opts.length<2)return null;}
      else if(Array.isArray(q.a)&&q.a.length){o.a=q.a.map(S).filter(Boolean);if(!o.a.length)return null;}
      else return null;
      return o.q.includes("___")?o:null;
    }).filter(Boolean);
    if(!qs.length)throw {message:t("aiNoQs")};
    store.aiRecent=[...(store.aiRecent||[]),...qs.map(q=>q.q)].slice(-40);save();
    busy(false);
    const L={id:"ai",noSave:true,back:"#practice",backLabel:"practiceMenu",quiz:qs};
    L.regen=()=>aiTest(c,true);
    startGen(L);
  }catch(e){
    busy(false);const m=aiErr(e);
    if(st){st.className="status err";st.textContent=m;}
    if(fromRegen)$("#pzone").innerHTML=`<div class="card quiz"><p class="status err">${esc(m)}</p></div>`;
  }
}
async function aiPhrases(c){

Avoid these phrases the learner already has: ${JSON.stringify(have)}
Return ONLY JSON: {"title":"short title for the situation in ${lname}","items":[{${keys}}]}`;

/* ================= Reading ================= */
let tempStory=null;
const myStories=()=>store.myStories||[];
const allStories=()=>[...STORIES,...myStories()];
const findStory=id=>id==="tmp"?tempStory:allStories().find(s=>s.id===id);
const lessonTitle=id=>{const L=LESSONS.find(x=>x.id===id);return L?tx(L.title):"";};
let readingAloud=false;
function mkUtt(s){
  const u=new SpeechSynthesisUtterance(s);u.lang="es-ES";u.rate=.9;
  const v=voices.find(v=>v.lang==="es-ES")||voices.find(v=>v.lang&&v.lang.startsWith("es"));if(v)u.voice=v;return u;
}
function readAloud(texts,onDone){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();texts.forEach((x,i)=>{const u=mkUtt(x);if(i===texts.length-1)u.onend=onDone;speechSynthesis.speak(u);});}catch(e){}
}
function storyCard(s){
  const b=store.lessons["story-"+s.id];const pc=b?Math.round(b.best*100):null;
  return `<a class="tcard" href="#r-${s.id}">
    <div class="row"><span class="pill lvl">${esc(s.lvl||"")}</span>${pc!==null?`<span class="pill ${pc>=80?"ok":""}">${t("best",pct(pc))}</span>`:`<span class="pill">${t("isNew")}</span>`}</div>
    <h3>${esc(s.title)}</h3><div class="sub">${transInline(s.tt||{})}</div>
    <div class="ex">${s.focus?esc(lessonTitle(s.focus))+" · ":""}${t("paragraphs",s.paras.length)}</div>
    <div class="bar"><i style="width:${pc||0}%"></i></div></a>`;
}
function renderReading(){
  const mine=myStories();
  $("#app").innerHTML=`<section class="hero"><h1>${t("tabReading")}</h1><p>${t("readHero")}</p></section>
  ${CLASSICS.length?`<div class="sec"><h2>${t("classicsTitle")}</h2><p class="muted" style="margin:0 0 12px;max-width:680px">${t("classicsDesc")}</p><div class="grid">${CLASSICS.map(classicCard).join("")}</div></div>`:""}
  <div class="sec"><h2>${t("madridStories")}</h2><p class="muted" style="margin:0 0 12px;max-width:680px">${t("readDesc")}</p><div class="grid">${STORIES.map(storyCard).join("")}</div></div>
  ${mine.length?`<div class="sec"><h2>${t("myStories")}</h2><div class="grid">${mine.map(storyCard).join("")}</div></div>`:""}
  <div class="sec"><h2>${t("aiSec")}</h2><div id="aistory"></div></div>`;
  renderAIStory();
}
function readPair(s){
  let p=store.settings.rpair||"en";
  if(p==="cmp"&&!(s&&s.classic))p="en";
  if(p!=="en"&&p!=="es"&&p!=="cmp"&&!(SEC()&&p===LANG))p=SEC()?LANG:"en";
  return p;
}
function renderStory(s){
  closeSheet();const keys=savedKeySet();STOK=[];
  const pair=readPair(s);const L2=LANG.toUpperCase();
  const pairs=[["en","ES | EN"],...(SEC()?[[LANG,"ES | "+L2]]:[]),["es",t("pairEsOnly")],...(s.classic?[["cmp",t("levelCompare")]]:[])];
  let body;
  if(pair==="cmp"){

  document.querySelectorAll(".rpara.hide .tgl").forEach(b=>b.onclick=()=>b.closest(".rpara").classList.toggle("open"));

  };

/* ================= Claude: story generator ================= */
function storyCfg(){return store.aiStoryCfg||(store.aiStoryCfg={lvl:"A2",fi:"",theme:""});}
function renderAIStory(){
  const box=document.getElementById("aistory");if(!box)return;
  if(sampleFn===undefined){box.innerHTML=`<div class="card pcard"><p><span class="spin"></span>${t("aiChecking")}</p></div>`;return;}
  if(!sampleFn){box.innerHTML=`<div class="card pcard"><p>${t("aiOff")}</p></div>`;return;}
  const c=storyCfg();
  const lv=["A1","A2","B1","B2"].map(l=>`<option ${c.lvl===l?"selected":""}>${l}</option>`).join("");
  const foci=[["",t("anyTense")],...LESSONS.filter(L=>L.id!=="serestar").map(L=>[L.id,tx(L.title)])];
  box.innerHTML=`<div class="card pcard ai" style="max-width:640px"><h3>${t("aiStoryT")}</h3><p>${t("aiStoryD")}</p>
    <label class="field">${t("theme")}<input id="asT" value="${esc(c.theme)}" placeholder="${t("themePh")}"></label>
    <div class="frow"><label class="field">${t("level")}<select id="asL">${lv}</select></label>
    <label class="field">${t("tenseFocus")}<select id="asF">${foci.map(([k,l])=>`<option value="${k}" ${c.fi===k?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
    <button class="btn" id="asGo">${t("genStory")}</button><div class="status" id="asS"></div></div>`;
  $("#asGo").onclick=()=>{Object.assign(c,{theme:$("#asT").value.trim(),lvl:$("#asL").value,fi:$("#asF").value});save();aiStory({...c});};
}
async function aiStory(c){
  const btn=$("#asGo"),st=$("#asS");
  if(btn)btn.disabled=true;if(st){st.className="status";st.innerHTML=`<span class="spin"></span>${t("aiBusyS")}`;}
  const lang=LANG,lname=LANGS[lang].ename,two=lang!=="en";
  const L=LESSONS.find(x=>x.id===c.fi);
  const focus=L?`Use mainly the ${enOf(L.title)} tense so the learner practises it.`:"Use a natural mix of tenses for the level.";
  const titles=allStories().map(s=>s.title).slice(-30);
  const k=two?`,"${lang}":"${lname} translation"`:"";
  const prompt=`You are an expert Spanish teacher and a good short-story writer.
Write a NEW, original short story in Peninsular Spanish for a learner at CEFR level ${c.lvl} who lives in Madrid.
${c.theme?`Theme: ${c.theme}.`:`Theme seed for variety: ${rnd(SEEDS)}.`} ${focus}
- 2 or 3 paragraphs, 50–90 words each, natural and engaging, everyday life in Spain, with a small twist or a warm ending.
- Vocabulary and grammar must match level ${c.lvl}.
- Give an English translation of every paragraph${two?` and a ${lname} translation`:""}.
- 6 key words from the story with their meanings.
- 3 multiple-choice comprehension questions in Spanish: exactly 3 options each, the FIRST option is the correct one; give a translation of each question and a one-sentence explanation in ${lname} that quotes the text.
- Do not reuse these titles: ${JSON.stringify(titles)}
Return ONLY JSON, no prose:
{"title":"Spanish title","title_en":"English title"${two?`,"title_${lang}":"${lname} title"`:""},"paragraphs":[{"es":"...","en":"..."${k}}],"vocab":[{"es":"...","en":"..."${k}}],"questions":[{"q":"...","en":"..."${k},"opts":["correct","wrong","wrong"],"ex":"..."}]}`;
  try{
    const r=await askClaude(prompt);
    const S=x=>typeof x==="string"?x:"";
    const pick=o=>{const x={es:S(o.es),en:S(o.en)};if(two)x[lang]=S(o[lang]);return x;};
    const paras=(r&&Array.isArray(r.paragraphs)?r.paragraphs:[]).map(pick).filter(p=>p.es&&p.en);
    if(!paras.length)throw {message:t("aiNoS")};
    const vocab=(Array.isArray(r.vocab)?r.vocab:[]).map(pick).filter(v=>v.es);
    const quiz=(Array.isArray(r.questions)?r.questions:[]).map(q=>{
      const o={q:S(q.q),en:S(q.en),ex:esc(S(q.ex))};if(two)o[lang]=S(q[lang]);
      o.opts=Array.isArray(q.opts)?[...new Set(q.opts.map(S).filter(Boolean))]:[];
      return o.q&&o.opts.length>=2?o:null;}).filter(Boolean);
    const tt={en:S(r.title_en)};if(two)tt[lang]=S(r["title_"+lang]);
    tempStory={id:"tmp",title:S(r.title)||"Historia",tt,lvl:c.lvl,focus:L?L.id:null,paras,vocab,quiz,ai:true};
    if(btn)btn.disabled=false;if(st)st.textContent="";
    if(location.hash==="#r-tmp")route();else location.hash="#r-tmp";
  }catch(e){if(btn)btn.disabled=false;if(st){st.className="status err";st.textContent=aiErr(e);}}
}
