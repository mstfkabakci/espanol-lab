quiz:[
{q:"¿Por qué fue Hodja con la ropa sucia?",en:"Why did Hodja go in dirty clothes?",tr:"Hoca neden kirli kıyafetlerle gitti?",de:"Warum ging Hodscha in schmutzigen Kleidern?",opts:["Era tarde y fue directamente desde el huerto","No tenía otra ropa","Quería gastar una broma"],ex:"«Como ya era tarde, fue directamente, con la ropa sucia de trabajar.»"},
{q:"Según Hodja, ¿para quién era la invitación?",en:"According to Hodja, who was the invitation for?",tr:"Hoca'ya göre davet kime yapılmıştı?",de:"Wem galt die Einladung laut Hodscha?",opts:["Para el abrigo","Para su mujer","Para todo el pueblo"],ex:"«Está claro que la invitación era para el abrigo, no para mí.»"}]},
B1:{paras:[
{es:"Nasreddín Hodja, el famoso sabio de Anatolia, era conocido tanto por su humor como por su sencillez. Una tarde, mientras cavaba en su huerto, se acordó de que el vecino más rico del pueblo había invitado a todo el mundo a un gran banquete. Pensando que lo importante era llegar a tiempo, dejó la azada, se sacudió un poco el polvo y se presentó en la casa tal como estaba, con la ropa vieja y las botas llenas de barro.",
 en:"Nasreddin Hodja, the famous wise man of Anatolia, was known as much for his humour as for his simplicity. One afternoon, while he was digging in his vegetable garden, he remembered that the richest neighbour in the village had invited everyone to a great banquet. Thinking that the important thing was to arrive on time, he put down his hoe, brushed off a bit of the dust and turned up at the house just as he was, in his old clothes and with his boots covered in mud.",
 tr:"Anadolu'nun ünlü bilgesi Nasreddin Hoca, mizahı kadar sadeliğiyle de tanınırmış. Bir öğleden sonra bostanında toprağı bellerken köyün en zengin komşusunun herkesi büyük bir ziyafete davet ettiğini hatırlamış. Önemli olanın zamanında varmak olduğunu düşünerek çapayı bırakmış, üstündeki tozu biraz silkelemiş ve eski kıyafetleri, çamurlu çizmeleriyle olduğu gibi eve gitmiş.",
 de:"Nasreddin Hodscha, der berühmte Weise aus Anatolien, war ebenso für seinen Humor wie für seine Bescheidenheit bekannt. Eines Nachmittags, als er in seinem Gemüsegarten grub, fiel ihm ein, dass der reichste Nachbar des Dorfes alle zu einem großen Festmahl eingeladen hatte. Weil er dachte, das Wichtigste sei, pünktlich zu sein, legte er die Hacke weg, klopfte sich ein wenig den Staub ab und erschien so, wie er war, im Haus: in alten Kleidern und mit Stiefeln voller Schlamm."},
{es:"La casa estaba llena de gente elegante. Hodja saludó educadamente, pero el anfitrión fingió no verlo y los criados lo dejaron de pie junto a la puerta. Pasaban bandejas de arroz, carne y dulces por delante de él, y nadie le ofrecía nada. Al cabo de un rato, comprendió que no era bienvenido. Sin decir una palabra, salió de la casa, fue a la suya y se puso un abrigo de piel precioso que solo usaba en ocasiones especiales.",
 en:"The house was full of elegant people. Hodja greeted them politely, but the host pretended not to see him and the servants left him standing by the door. Trays of rice, meat and sweets went past him, and nobody offered him anything. After a while, he understood that he wasn't welcome. Without saying a word, he left the house, went to his own and put on a beautiful fur coat that he only wore on special occasions.",
 tr:"Ev şık giyimli insanlarla doluymuş. Hoca kibarca selam vermiş, ama ev sahibi onu görmezden gelmiş ve hizmetkârlar onu kapının yanında ayakta bırakmış. Önünden tepsi tepsi pilav, et ve tatlı geçiyormuş ama kimse ona bir şey ikram etmiyormuş. Bir süre sonra istenmediğini anlamış. Tek kelime etmeden evden çıkmış, kendi evine gitmiş ve yalnızca özel günlerde giydiği çok güzel bir kürkü sırtına geçirmiş.",
 de:"Das Haus war voller eleganter Leute. Hodscha grüßte höflich, aber der Gastgeber tat so, als sähe er ihn nicht, und die Diener ließen ihn an der Tür stehen. Tabletts mit Reis, Fleisch und Süßigkeiten wurden an ihm vorbeigetragen, und niemand bot ihm etwas an. Nach einer Weile begriff er, dass er nicht willkommen war. Ohne ein Wort verließ er das Haus, ging zu sich nach Hause und zog einen prächtigen Pelzmantel an, den er nur zu besonderen Anlässen trug."},
{es:"Cuando regresó, la actitud de todos cambió por completo. El anfitrión corrió a recibirlo, lo sentó a su lado en el lugar de honor y le sirvió el mejor plato de sopa. Entonces Hodja agarró la manga de su abrigo, la metió en la sopa y empezó a decir: «¡Come, abrigo mío, come!». El anfitrión, escandalizado, le preguntó qué estaba haciendo. «Hace un rato me ignorasteis y ahora me tratáis como a un rey», respondió Hodja, «así que está claro que el invitado es el abrigo».",
 en:"When he returned, everyone's attitude changed completely. The host rushed to welcome him, sat him next to him in the place of honour and served him the best bowl of soup. Then Hodja took hold of the sleeve of his coat, dipped it in the soup and began to say: “Eat, my coat, eat!” The host, scandalised, asked him what he was doing. “A while ago you ignored me and now you treat me like a king,” Hodja replied, “so it's clear that the guest is the coat.”",
 tr:"Geri döndüğünde herkesin tavrı tamamen değişmiş. Ev sahibi onu karşılamaya koşmuş, onu yanına, başköşeye oturtmuş ve ona en güzel çorbayı ikram etmiş. Bunun üzerine Hoca kürkünün yenini tutmuş, çorbaya batırmış ve «Ye kürküm ye!» demeye başlamış. Şaşkına dönen ev sahibi ona ne yaptığını sormuş. «Biraz önce beni yok saydınız, şimdi ise bana kral gibi davranıyorsunuz» diye cevap vermiş Hoca, «demek ki davetli olan kürk.»",
 de:"Als er zurückkam, änderte sich die Haltung aller vollkommen. Der Gastgeber eilte herbei, um ihn zu begrüßen, setzte ihn neben sich auf den Ehrenplatz und servierte ihm die beste Schale Suppe. Da packte Hodscha den Ärmel seines Mantels, tauchte ihn in die Suppe und begann zu sagen: „Iss, mein Mantel, iss!“ Der Gastgeber fragte empört, was er da mache. „Vorhin habt ihr mich nicht beachtet, und jetzt behandelt ihr mich wie einen König“, antwortete Hodscha, „also ist klar, dass der Gast der Mantel ist.“"}],

{q:"¿Cuándo usaba Hodja el abrigo de piel?",en:"When did Hodja wear the fur coat?",tr:"Hoca kürkü ne zaman giyerdi?",de:"Wann trug Hodscha den Pelzmantel?",opts:["Solo en ocasiones especiales","Todos los días","Solo en invierno"],ex:"«…un abrigo de piel precioso que solo usaba en ocasiones especiales.»"},
{q:"¿Qué hizo el anfitrión cuando Hodja volvió?",en:"What did the host do when Hodja came back?",tr:"Hoca geri döndüğünde ev sahibi ne yaptı?",de:"Was tat der Gastgeber, als Hodscha zurückkam?",opts:["Lo sentó a su lado en el lugar de honor","Lo echó de la casa","No lo reconoció"],ex:"«…lo sentó a su lado en el lugar de honor y le sirvió el mejor plato de sopa.»"}]},
B2:{paras:[
{es:"De todos los personajes del folclore turco, pocos resultan tan entrañables como Nasreddín Hodja, ese sabio de aspecto despistado cuyas ocurrencias encierran a menudo lecciones más profundas de lo que aparentan. Se cuenta que una tarde, mientras se afanaba en su huerto, cayó en la cuenta de que un acaudalado vecino celebraba aquel mismo día un banquete al que estaba invitado todo el pueblo. Convencido de que lo que importa es la persona y no el envoltorio, no se molestó en cambiarse y acudió tal cual: con la camisa remendada y las botas cubiertas de barro.",
 en:"Of all the characters in Turkish folklore, few are as endearing as Nasreddin Hodja, that absent-minded-looking sage whose witticisms often contain deeper lessons than they appear to. It is said that one afternoon, while he was toiling in his vegetable garden, he realised that a wealthy neighbour was holding a banquet that very day to which the whole village was invited. Convinced that what matters is the person and not the wrapping, he didn't bother to change and went just as he was: with his patched shirt and his boots covered in mud.",
 tr:"Türk folklorunun bütün karakterleri arasında, dalgın görünüşlü ama nükteleri çoğu zaman göründüğünden çok daha derin dersler barındıran bilge Nasreddin Hoca kadar sevimli olanı azdır. Anlatılır ki bir öğleden sonra bostanında didinirken, varlıklı bir komşusunun o gün bütün köyün davetli olduğu bir ziyafet verdiğini fark etmiş. Önemli olanın ambalaj değil insan olduğuna inandığından üstünü değiştirmeye zahmet etmemiş ve olduğu gibi gitmiş: yamalı gömleği ve çamura bulanmış çizmeleriyle.",
 de:"Von allen Figuren der türkischen Folklore sind nur wenige so liebenswert wie Nasreddin Hodscha, jener zerstreut wirkende Weise, dessen Einfälle oft tiefere Lehren enthalten, als es den Anschein hat. Man erzählt, dass er eines Nachmittags, als er sich in seinem Gemüsegarten abmühte, bemerkte, dass ein wohlhabender Nachbar genau an diesem Tag ein Festmahl gab, zu dem das ganze Dorf eingeladen war. Überzeugt, dass der Mensch zählt und nicht die Verpackung, machte er sich nicht die Mühe, sich umzuziehen, und ging, wie er war: mit geflicktem Hemd und schlammbedeckten Stiefeln."},
{es:"Nada más cruzar el umbral, advirtió que su presencia incomodaba. El anfitrión, enfrascado en agasajar a los invitados más distinguidos, ni siquiera le devolvió el saludo, y los criados, siguiendo su ejemplo, lo relegaron a un rincón junto a la puerta. Durante un buen rato vio desfilar ante sus narices bandejas humeantes de pilaf, cordero asado y baklava sin que nadie le ofreciera un solo bocado. Hodja, sin perder la compostura, se escabulló discretamente y se dirigió a su casa.",
 en:"As soon as he crossed the threshold, he noticed that his presence made people uncomfortable. The host, busy lavishing attention on the most distinguished guests, didn't even return his greeting, and the servants, following his example, relegated him to a corner by the door. For quite a while he watched steaming trays of pilaf, roast lamb and baklava parade right under his nose without anyone offering him a single bite. Hodja, without losing his composure, slipped away discreetly and headed home.",
 tr:"Eşikten geçer geçmez varlığının insanları rahatsız ettiğini fark etmiş. En seçkin konukları ağırlamaya dalmış olan ev sahibi selamını bile almamış, onu örnek alan hizmetkârlar da Hoca'yı kapının yanındaki bir köşeye itmiş. Uzun bir süre burnunun dibinden tepsi tepsi dumanı tüten pilav, kuzu kızartması ve baklava geçtiğini görmüş ama kimse ona tek bir lokma bile ikram etmemiş. Hoca soğukkanlılığını bozmadan usulca sıvışmış ve evinin yolunu tutmuş.",
 de:"Kaum hatte er die Schwelle überschritten, merkte er, dass seine Anwesenheit störte. Der Gastgeber, ganz damit beschäftigt, die vornehmsten Gäste zu bewirten, erwiderte nicht einmal seinen Gruß, und die Diener folgten seinem Beispiel und verbannten ihn in eine Ecke neben der Tür. Eine ganze Weile sah er dampfende Platten mit Pilaw, Lammbraten und Baklava direkt vor seiner Nase vorbeiziehen, ohne dass ihm jemand auch nur einen Bissen anbot. Hodscha verlor nicht die Fassung, schlich sich unauffällig davon und ging nach Hause."},
{es:"Allí se lavó, se peinó la barba con esmero y se puso un abrigo de pieles suntuoso que guardaba para las grandes ocasiones. Cuando volvió a presentarse en el banquete, el cambio fue inmediato: el anfitrión salió a su encuentro con los brazos abiertos, se deshizo en disculpas por no haberlo visto antes y lo acomodó en el lugar de honor, a su derecha. Enseguida le sirvieron un cuenco de sopa humeante, y todas las miradas se volvieron hacia él con respeto.",
 en:"There he washed, carefully combed his beard and put on a sumptuous fur coat that he kept for great occasions. When he turned up at the banquet again, the change was immediate: the host came out to meet him with open arms, apologised profusely for not having seen him earlier and settled him in the place of honour, on his right. At once they served him a bowl of steaming soup, and every eye turned towards him with respect.",
 tr:"Orada yıkanmış, sakalını özenle taramış ve büyük günler için sakladığı görkemli bir kürkü giymiş. Ziyafete yeniden geldiğinde değişim anında olmuş: ev sahibi onu kollarını açarak karşılamış, daha önce onu görmediği için özür üstüne özür dilemiş ve onu sağ yanına, başköşeye yerleştirmiş. Hemen önüne dumanı tüten bir kâse çorba konmuş ve bütün bakışlar saygıyla ona çevrilmiş.",
 de:"Dort wusch er sich, kämmte sorgfältig seinen Bart und zog einen prachtvollen Pelzmantel an, den er für große Anlässe aufbewahrte. Als er wieder beim Festmahl erschien, war der Wandel sofort zu spüren: Der Gastgeber kam ihm mit offenen Armen entgegen, entschuldigte sich überschwänglich, ihn nicht früher bemerkt zu haben, und setzte ihn auf den Ehrenplatz zu seiner Rechten. Sogleich servierte man ihm eine Schale dampfender Suppe, und alle Blicke richteten sich voller Respekt auf ihn."},
{es:"Fue entonces cuando Hodja tomó el extremo de la manga y lo sumergió en la sopa, murmurando: «¡Come, abrigo mío, come!». Se hizo un silencio sepulcral. El anfitrión, desconcertado, le preguntó si había perdido el juicio. «En absoluto», respondió Hodja. «Cuando vine con mi ropa de siempre, nadie reparó en mí; ahora que llevo este abrigo, me colmáis de atenciones. Es justo, pues, que sea él quien disfrute del banquete». Desde entonces, en Turquía se dice «Ye kürküm ye» cuando alguien es juzgado por su apariencia.",
 en:"It was then that Hodja took the end of his sleeve and dipped it into the soup, murmuring: “Eat, my coat, eat!” A deathly silence fell. The host, baffled, asked him whether he had lost his mind. “Not at all,” Hodja replied. “When I came in my everyday clothes, nobody noticed me; now that I'm wearing this coat, you shower me with attention. It's only fair, then, that it should be the one to enjoy the banquet.” Ever since, in Turkey people say “Ye kürküm ye” when someone is judged by their appearance.",
 tr:"İşte o zaman Hoca yeninin ucunu tutmuş ve çorbaya daldırarak «Ye kürküm ye!» diye mırıldanmış. Ortalığa ölüm sessizliği çökmüş. Şaşkına dönen ev sahibi ona aklını mı kaçırdığını sormuş. «Hiç de değil» diye cevap vermiş Hoca. «Her zamanki kıyafetlerimle geldiğimde kimse beni fark etmedi; şimdi bu kürkü giydim diye beni ilgiye boğuyorsunuz. Öyleyse ziyafetin tadını onun çıkarması gayet adil.» O günden beri Türkiye'de biri görünüşüne göre yargılandığında «Ye kürküm ye» denir.",
 de:"Da nahm Hodscha das Ende seines Ärmels und tauchte es in die Suppe, wobei er murmelte: „Iss, mein Mantel, iss!“ Es wurde totenstill. Der Gastgeber fragte verwirrt, ob er den Verstand verloren habe. „Keineswegs“, antwortete Hodscha. „Als ich in meinen gewöhnlichen Kleidern kam, beachtete mich niemand; jetzt, da ich diesen Mantel trage, überhäuft ihr mich mit Aufmerksamkeit. Es ist also nur gerecht, dass er das Festmahl genießt.“ Seitdem sagt man in der Türkei „Ye kürküm ye“, wenn jemand nach seinem Äußeren beurteilt wird."}],

{q:"¿Dónde lo relegaron los criados?",en:"Where did the servants relegate him?",tr:"Hizmetkârlar onu nereye itti?",de:"Wohin verbannten ihn die Diener?",opts:["A un rincón junto a la puerta","A la cocina","Al jardín"],ex:"«…lo relegaron a un rincón junto a la puerta.»"},

{id:"quijote",icon:"🐴",title:"Don Quijote y los molinos de viento",tt:B("Don Quixote and the Windmills","Don Kişot ve Yel Değirmenleri","Don Quijote und die Windmühlen"),src:"Miguel de Cervantes",lv:{
A1:{paras:[
{es:"Don Quijote es un señor mayor de La Mancha. Lee muchos libros de caballeros. Un día decide ser un caballero también. Tiene un caballo flaco, Rocinante, y un amigo, Sancho Panza. Un día ven unos molinos de viento. Don Quijote dice: «¡Son gigantes!». Sancho dice: «No, señor, son molinos». Pero Don Quijote ataca y el molino lo tira al suelo.",
 en:"Don Quixote is an older gentleman from La Mancha. He reads lots of books about knights. One day he decides to be a knight too. He has a thin horse, Rocinante, and a friend, Sancho Panza. One day they see some windmills. Don Quixote says: “They're giants!” Sancho says: “No, sir, they're windmills.” But Don Quixote attacks and the windmill knocks him to the ground.",
 tr:"Don Kişot La Mancha'lı yaşlıca bir beyefendi. Şövalyeler hakkında çok kitap okuyor. Bir gün o da şövalye olmaya karar veriyor. Rocinante adında cılız bir atı ve Sancho Panza adında bir arkadaşı var. Bir gün birkaç yel değirmeni görüyorlar. Don Kişot «Bunlar dev!» diyor. Sancho «Hayır efendim, bunlar değirmen» diyor. Ama Don Kişot saldırıyor ve değirmen onu yere seriyor.",
 de:"Don Quijote ist ein älterer Herr aus der Mancha. Er liest viele Bücher über Ritter. Eines Tages beschließt er, auch ein Ritter zu sein. Er hat ein mageres Pferd, Rocinante, und einen Freund, Sancho Panza. Eines Tages sehen sie ein paar Windmühlen. Don Quijote sagt: „Das sind Riesen!“ Sancho sagt: „Nein, Herr, das sind Mühlen.“ Aber Don Quijote greift an, und die Mühle wirft ihn zu Boden."}],
vocab:[["el caballero","knight","şövalye","der Ritter"],["el molino de viento","windmill","yel değirmeni","die Windmühle"],["flaco","thin, skinny","cılız, sıska","mager"],["atacar","to attack","saldırmak","angreifen"]],
quiz:[
{q:"¿Qué tipo de libros lee Don Quijote?",en:"What kind of books does Don Quixote read?",tr:"Don Kişot ne tür kitaplar okuyor?",de:"Welche Art von Büchern liest Don Quijote?",opts:["Libros de caballeros","Periódicos","Libros de cocina"],ex:"«Lee muchos libros de caballeros.»"},
{q:"¿Qué cree Don Quijote que son los molinos?",en:"What does Don Quixote think the windmills are?",tr:"Don Kişot değirmenleri ne sanıyor?",de:"Was hält Don Quijote die Mühlen?",opts:["Gigantes","Castillos","Caballos"],ex:"«Don Quijote dice: ¡Son gigantes!»"}]},
A2:{paras:[
{es:"En un pueblo de La Mancha vivía un hidalgo que pasaba los días y las noches leyendo libros de caballerías. Leyó tanto que perdió el juicio y decidió hacerse caballero andante para defender a los débiles. Se puso una armadura vieja, llamó a su caballo Rocinante y a sí mismo, Don Quijote de la Mancha. Como todo caballero necesita un escudero, convenció a un vecino, Sancho Panza, para que lo acompañara.",
 en:"In a village in La Mancha there lived a nobleman who spent his days and nights reading books of chivalry. He read so much that he lost his mind and decided to become a knight errant to defend the weak. He put on an old suit of armour, named his horse Rocinante and himself Don Quixote of La Mancha. As every knight needs a squire, he persuaded a neighbour, Sancho Panza, to go with him.",
 tr:"La Mancha'nın bir köyünde günlerini ve gecelerini şövalye romanları okuyarak geçiren bir soylu yaşarmış. O kadar çok okumuş ki aklını yitirmiş ve zayıfları korumak için gezgin şövalye olmaya karar vermiş. Eski bir zırh giymiş, atına Rocinante, kendisine de La Mancha'lı Don Kişot adını vermiş. Her şövalyenin bir silahtara ihtiyacı olduğu için komşusu Sancho Panza'yı da kendisine eşlik etmeye ikna etmiş.",
 de:"In einem Dorf in der Mancha lebte ein Edelmann, der Tag und Nacht Ritterromane las. Er las so viel, dass er den Verstand verlor und beschloss, ein fahrender Ritter zu werden, um die Schwachen zu verteidigen. Er zog eine alte Rüstung an, nannte sein Pferd Rocinante und sich selbst Don Quijote von der Mancha. Da jeder Ritter einen Knappen braucht, überredete er einen Nachbarn, Sancho Panza, ihn zu begleiten."},
{es:"Un día, en el campo, vieron treinta o cuarenta molinos de viento. «¡Mira, Sancho, allí hay unos gigantes enormes! Voy a luchar contra ellos», dijo Don Quijote. «Señor, no son gigantes, son molinos», le respondió Sancho. Pero Don Quijote no lo escuchó. Atacó con su lanza, el viento movió las aspas y caballo y caballero salieron volando por el campo. Aun así, Don Quijote dijo que un mago había convertido a los gigantes en molinos.",
 en:"One day, in the countryside, they saw thirty or forty windmills. “Look, Sancho, there are some enormous giants over there! I'm going to fight them,” said Don Quixote. “Sir, they aren't giants, they're windmills,” Sancho answered. But Don Quixote didn't listen to him. He attacked with his lance, the wind moved the sails and horse and knight went flying across the field. Even so, Don Quixote said that a wizard had turned the giants into windmills.",
 tr:"Bir gün kırda otuz kırk tane yel değirmeni görmüşler. «Bak Sancho, orada kocaman devler var! Onlarla savaşacağım» demiş Don Kişot. «Efendim, onlar dev değil, değirmen» diye cevap vermiş Sancho. Ama Don Kişot onu dinlememiş. Mızrağıyla saldırmış, rüzgâr kanatları döndürmüş ve at da şövalye de tarlaya savrulmuş. Yine de Don Kişot bir büyücünün devleri değirmene çevirdiğini söylemiş.",
 de:"Eines Tages sahen sie auf dem Feld dreißig oder vierzig Windmühlen. „Schau, Sancho, dort sind riesige Riesen! Ich werde gegen sie kämpfen“, sagte Don Quijote. „Herr, das sind keine Riesen, das sind Mühlen“, antwortete Sancho. Doch Don Quijote hörte nicht auf ihn. Er griff mit seiner Lanze an, der Wind bewegte die Flügel, und Pferd und Ritter flogen über das Feld. Trotzdem behauptete Don Quijote, ein Zauberer habe die Riesen in Mühlen verwandelt."}],

quiz:[
{q:"¿Por qué perdió el juicio el hidalgo?",en:"Why did the nobleman lose his mind?",tr:"Soylu adam neden aklını yitirdi?",de:"Warum verlor der Edelmann den Verstand?",opts:["Leyó demasiados libros de caballerías","Se cayó del caballo","Estaba enfermo"],ex:"«Leyó tanto que perdió el juicio…»"},
{q:"¿Cómo explicó Don Quijote lo que pasó?",en:"How did Don Quixote explain what happened?",tr:"Don Kişot olanları nasıl açıkladı?",de:"Wie erklärte Don Quijote, was passiert war?",opts:["Un mago había convertido a los gigantes en molinos","El viento era demasiado fuerte","Sancho lo había empujado"],ex:"«…Don Quijote dijo que un mago había convertido a los gigantes en molinos.»"}]},
B1:{paras:[
{es:"En un lugar de La Mancha vivía un hidalgo de unos cincuenta años, delgado y madrugador, que dedicaba sus ratos libres a leer libros de caballerías. Tanto se aficionó a ellos que llegó a vender tierras para comprar más, y de tanto leer y tan poco dormir, se le secó el cerebro. Así, convencido de que todo lo que contaban aquellos libros era verdad, decidió convertirse en caballero andante y recorrer el mundo deshaciendo injusticias.",
 en:"In a village in La Mancha there lived a nobleman of about fifty, thin and an early riser, who spent his free time reading books of chivalry. He grew so fond of them that he even sold land to buy more, and from reading so much and sleeping so little, his brain dried up. So, convinced that everything those books told was true, he decided to become a knight errant and travel the world righting wrongs.",
 tr:"La Mancha'nın bir köyünde elli yaşlarında, zayıf ve erkenci bir soylu yaşarmış; boş vakitlerini şövalye romanları okuyarak geçirirmiş. Bu kitaplara o kadar düşkünleşmiş ki daha fazlasını almak için toprak bile satmış ve çok okuyup az uyumaktan beyni kurumuş. Böylece o kitapların anlattığı her şeyin doğru olduğuna inanarak gezgin şövalye olmaya ve dünyayı dolaşıp haksızlıkları gidermeye karar vermiş.",
 de:"In einem Ort in der Mancha lebte ein Edelmann von etwa fünfzig Jahren, hager und ein Frühaufsteher, der seine freie Zeit mit dem Lesen von Ritterromanen verbrachte. Er wurde so süchtig danach, dass er sogar Land verkaufte, um mehr zu kaufen, und vom vielen Lesen und wenigen Schlafen trocknete ihm das Gehirn aus. So beschloss er, überzeugt davon, dass alles in diesen Büchern wahr sei, ein fahrender Ritter zu werden und durch die Welt zu ziehen, um Unrecht zu beseitigen."},
{es:"Limpió una armadura que había sido de sus bisabuelos, bautizó a su viejo caballo con el nombre de Rocinante y se llamó a sí mismo Don Quijote de la Mancha. Eligió como dama de sus pensamientos a una campesina a la que llamó Dulcinea del Toboso. Después convenció a Sancho Panza, un labrador sencillo y bonachón, para que fuera su escudero, prometiéndole que algún día le regalaría una isla para que la gobernara.",
 en:"He cleaned a suit of armour that had belonged to his great-grandparents, named his old horse Rocinante and called himself Don Quixote of La Mancha. As the lady of his thoughts he chose a peasant girl whom he called Dulcinea del Toboso. Then he persuaded Sancho Panza, a simple, good-natured farm labourer, to be his squire, promising him that one day he would give him an island to govern.",
 tr:"Büyük dedelerinden kalma bir zırhı temizlemiş, yaşlı atına Rocinante adını vermiş ve kendisine La Mancha'lı Don Kişot demiş. Gönlünün hanımı olarak Toboso'lu Dulcinea adını verdiği bir köylü kızı seçmiş. Sonra sade ve iyi yürekli bir çiftçi olan Sancho Panza'yı, bir gün ona yönetmesi için bir ada hediye edeceğine söz vererek silahtarı olmaya ikna etmiş.",
 de:"Er putzte eine Rüstung, die seinen Urgroßeltern gehört hatte, taufte sein altes Pferd auf den Namen Rocinante und nannte sich selbst Don Quijote von der Mancha. Als Dame seines Herzens wählte er eine Bäuerin, die er Dulcinea von Toboso nannte. Dann überredete er Sancho Panza, einen einfachen, gutmütigen Bauern, sein Knappe zu werden, und versprach ihm, ihm eines Tages eine Insel zum Regieren zu schenken."},
{es:"Cabalgaban por el campo cuando descubrieron treinta o cuarenta molinos de viento. Don Quijote, entusiasmado, exclamó que eran gigantes desaforados y que pensaba quitarles la vida a todos. Sancho le explicó que lo que parecían brazos eran las aspas, pero su amo ya había espoleado a Rocinante. Clavó la lanza en un aspa, el viento la hizo girar con tanta fuerza que la lanza se rompió, y caballo y caballero rodaron por el suelo, muy maltrechos.",
 en:"They were riding through the countryside when they caught sight of thirty or forty windmills. Don Quixote, excited, exclaimed that they were monstrous giants and that he intended to slay every one of them. Sancho explained that what looked like arms were the sails, but his master had already spurred Rocinante on. He thrust his lance into a sail, the wind turned it so violently that the lance broke, and horse and knight rolled across the ground, badly battered.",
 tr:"Kırda at sürerken otuz kırk tane yel değirmeni görmüşler. Heyecanlanan Don Kişot bunların azgın devler olduğunu ve hepsinin canını alacağını haykırmış. Sancho ona kol gibi görünen şeylerin değirmen kanatları olduğunu açıklamış ama efendisi Rocinante'yi çoktan mahmuzlamış. Mızrağını bir kanada saplamış, rüzgâr kanadı öyle hızla döndürmüş ki mızrak kırılmış ve at da şövalye de yerde yuvarlanıp perişan olmuş.",
 de:"Sie ritten über das Land, als sie dreißig oder vierzig Windmühlen entdeckten. Don Quijote rief begeistert, das seien ungeheure Riesen, und er gedenke, ihnen allen das Leben zu nehmen. Sancho erklärte ihm, dass das, was wie Arme aussehe, die Flügel seien, doch sein Herr hatte Rocinante schon die Sporen gegeben. Er stieß die Lanze in einen Flügel, der Wind drehte ihn so heftig, dass die Lanze zerbrach, und Pferd und Ritter rollten übel zugerichtet über den Boden."}],
vocab:[["aficionarse a","to become fond of","düşkünleşmek","Gefallen finden an"],["el bisabuelo","great-grandfather","büyük dede","der Urgroßvater"],["bonachón","good-natured","iyi yürekli","gutmütig"],["maltrecho","battered","perişan, hırpalanmış","übel zugerichtet"]],
quiz:[
{q:"¿Qué llegó a vender el hidalgo para comprar libros?",en:"What did the nobleman even sell to buy books?",tr:"Soylu adam kitap almak için neyi bile sattı?",de:"Was verkaufte der Edelmann sogar, um Bücher zu kaufen?",opts:["Tierras","Su caballo","Su armadura"],ex:"«…llegó a vender tierras para comprar más…»"},
{q:"¿Qué le prometió Don Quijote a Sancho?",en:"What did Don Quixote promise Sancho?",tr:"Don Kişot Sancho'ya ne vaat etti?",de:"Was versprach Don Quijote Sancho?",opts:["Una isla para gobernar","Un caballo nuevo","Mucho dinero"],ex:"«…prometiéndole que algún día le regalaría una isla para que la gobernara.»"},
{q:"¿Qué le pasó a la lanza?",en:"What happened to the lance?",tr:"Mızrağa ne oldu?",de:"Was geschah mit der Lanze?",opts:["Se rompió","Se quedó clavada en el molino","Se la llevó el viento"],ex:"«…el viento la hizo girar con tanta fuerza que la lanza se rompió…»"}]},
B2:{paras:[
{es:"En un lugar de La Mancha, cuyo nombre Cervantes prefirió no recordar, vivía un hidalgo de los de lanza en astillero y rocín flaco, que dedicaba sus ratos de ocio, que eran casi todos, a devorar libros de caballerías. Tanto se enfrascó en su lectura que pasaba las noches leyendo de claro en claro y los días de turbio en turbio, hasta que, del poco dormir y del mucho leer, se le secó el cerebro y perdió por completo el juicio.",
 en:"In a village in La Mancha, whose name Cervantes preferred not to remember, there lived a nobleman of the kind with a lance on the rack and a skinny nag, who devoted his leisure hours, which were almost all of them, to devouring books of chivalry. He became so absorbed in his reading that he spent his nights reading from dusk till dawn and his days from dawn till dusk, until, from too little sleep and too much reading, his brain dried up and he lost his mind completely.",
 tr:"La Mancha'nın, Cervantes'in adını hatırlamak istemediği bir köyünde, mızrağı askıda, beygiri cılız soylulardan biri yaşarmış; neredeyse bütün vaktini oluşturan boş zamanlarını şövalye romanlarını yutarak geçirirmiş. Okumaya öyle dalmış ki gecelerini sabaha kadar, günlerini de akşama kadar okuyarak geçirir olmuş; sonunda az uyumaktan ve çok okumaktan beyni kurumuş ve aklını tamamen yitirmiş.",
 de:"An einem Ort in der Mancha, an dessen Namen sich Cervantes nicht erinnern wollte, lebte ein Edelmann von jener Sorte mit Lanze im Ständer und magerem Klepper, der seine Mußestunden, und das waren fast alle, damit verbrachte, Ritterromane zu verschlingen. Er vertiefte sich so sehr in seine Lektüre, dass er die Nächte von der Dämmerung bis zum Morgen und die Tage vom Morgen bis zur Dämmerung las, bis ihm vom wenigen Schlafen und vielen Lesen das Gehirn austrocknete und er völlig den Verstand verlor."},
{es:"Convencido de que el mundo necesitaba con urgencia a alguien que enderezara entuertos y socorriera a doncellas, desempolvó una armadura oxidada, bautizó a su escuálido caballo como Rocinante y se rebautizó a sí mismo como Don Quijote de la Mancha. Como no hay caballero sin dama, consagró su corazón a una labradora de un pueblo vecino a la que nunca había dirigido la palabra, y a la que dio el sonoro nombre de Dulcinea del Toboso.",
 en:"Convinced that the world urgently needed someone to right wrongs and rescue damsels, he dusted off a rusty suit of armour, christened his scrawny horse Rocinante and renamed himself Don Quixote of La Mancha. Since there's no knight without a lady, he devoted his heart to a farm girl from a neighbouring village to whom he had never said a word, and to whom he gave the resounding name of Dulcinea del Toboso.",
 tr:"Dünyanın haksızlıkları düzeltecek ve genç kızların imdadına yetişecek birine acilen ihtiyacı olduğuna inanarak paslı bir zırhın tozunu almış, sıska atına Rocinante adını vermiş ve kendine de yeniden La Mancha'lı Don Kişot adını koymuş. Hanımefendisi olmayan şövalye olmayacağı için gönlünü komşu köyden, kendisiyle tek kelime bile konuşmadığı bir çiftçi kızına adamış ve ona Toboso'lu Dulcinea gibi gösterişli bir ad vermiş.",
 de:"Überzeugt davon, dass die Welt dringend jemanden brauchte, der Unrecht geraderückte und Jungfrauen zu Hilfe eilte, entstaubte er eine rostige Rüstung, taufte sein klapperdürres Pferd Rocinante und gab sich selbst den neuen Namen Don Quijote von der Mancha. Da es keinen Ritter ohne Dame gibt, weihte er sein Herz einer Bäuerin aus einem Nachbardorf, mit der er nie ein Wort gewechselt hatte, und gab ihr den klangvollen Namen Dulcinea von Toboso."},
{es:"Necesitaba, además, un escudero, y para ello persuadió a Sancho Panza, un vecino suyo tan bonachón como corto de entendederas, que acabó dejando mujer e hijos ante la promesa de gobernar algún día una ínsula. Así salieron los dos una madrugada, amo y escudero, uno sobre su rocín y el otro sobre su asno, en busca de aventuras que les dieran fama eterna. No tardarían mucho en encontrar la primera.",
 en:"He also needed a squire, and for that he persuaded Sancho Panza, a neighbour of his as good-natured as he was slow-witted, who ended up leaving his wife and children behind on the promise of one day governing an island. So the two of them set out one dawn, master and squire, one on his nag and the other on his donkey, in search of adventures that would bring them eternal fame. It wouldn't be long before they found the first one.",
 tr:"Ayrıca bir silahtara ihtiyacı varmış ve bunun için iyi yürekliliği kadar kalın kafalılığıyla da tanınan komşusu Sancho Panza'yı ikna etmiş; Sancho bir gün bir adayı yönetme vaadiyle karısını ve çocuklarını bırakıp gitmiş. Böylece efendi ve silahtar, biri beygirinin, öteki eşeğinin üstünde, kendilerine ölümsüz bir ün kazandıracak maceraların peşinde bir sabah erkenden yola çıkmışlar. İlkini bulmaları uzun sürmeyecekmiş.",
 de:"Außerdem brauchte er einen Knappen, und dafür überredete er Sancho Panza, einen Nachbarn, der ebenso gutmütig wie schwer von Begriff war und am Ende Frau und Kinder zurückließ, weil man ihm versprach, eines Tages eine Insel zu regieren. So zogen die beiden eines frühen Morgens los, Herr und Knappe, der eine auf seinem Klepper, der andere auf seinem Esel, auf der Suche nach Abenteuern, die ihnen ewigen Ruhm bringen sollten. Es sollte nicht lange dauern, bis sie das erste fanden."},
{es:"Al llegar a un llano, divisaron treinta o cuarenta molinos de viento. Don Quijote, transfigurado, aseguró a su escudero que aquellos eran gigantes descomunales con los que pensaba entablar batalla. «Mire vuestra merced», le advirtió Sancho, «que aquellos no son gigantes, sino molinos, y lo que en ellos parecen brazos son las aspas». Pero su amo, sin atender a razones, arremetió a galope tendido contra el primero. En ese instante se levantó un poco de viento, el aspa giró, hizo pedazos la lanza y arrastró consigo a caballo y caballero, que fueron rodando muy maltrechos por el campo.",
 en:"On reaching a plain, they spotted thirty or forty windmills. Don Quixote, transfigured, assured his squire that those were colossal giants with whom he intended to do battle. “Look, your worship,” Sancho warned him, “those aren't giants but windmills, and what look like arms on them are the sails.” But his master, deaf to reason, charged at full gallop at the first one. At that moment a little wind got up, the sail turned, smashed the lance to pieces and dragged horse and knight along with it, and they went rolling across the field, sorely battered.",
 tr:"Bir düzlüğe vardıklarında otuz kırk tane yel değirmeni görmüşler. Kendinden geçen Don Kişot silahtarına bunların savaşmayı düşündüğü devasa devler olduğunu söylemiş. «Bakın efendim» diye uyarmış Sancho, «onlar dev değil, değirmen; üstlerinde kol gibi görünen şeyler de kanatları.» Ama efendisi laf dinlemeden dörtnala ilkine saldırmış. Tam o anda biraz rüzgâr çıkmış, kanat dönmüş, mızrağı paramparça etmiş ve atla şövalyeyi de beraberinde sürükleyerek tarlada perişan bir halde yuvarlamış.",
 de:"Als sie eine Ebene erreichten, erblickten sie dreißig oder vierzig Windmühlen. Don Quijote, wie verwandelt, versicherte seinem Knappen, dies seien ungeheure Riesen, mit denen er in den Kampf zu ziehen gedenke. „Sehen Euer Gnaden doch“, warnte ihn Sancho, „das sind keine Riesen, sondern Windmühlen, und was an ihnen wie Arme aussieht, sind die Flügel.“ Doch sein Herr, taub für jede Vernunft, stürmte in gestrecktem Galopp auf die erste los. In diesem Augenblick kam ein wenig Wind auf, der Flügel drehte sich, zerschmetterte die Lanze und riss Pferd und Ritter mit sich, die übel zugerichtet über das Feld rollten."}],
vocab:[["enfrascarse en","to become absorbed in","dalmak, gömülmek","sich vertiefen in"],["enderezar entuertos","to right wrongs","haksızlıkları düzeltmek","Unrecht geraderücken"],["el asno","donkey","eşek","der Esel"],["arremeter contra","to charge at","saldırmak, hücum etmek","losstürmen auf"]],

{q:"¿Qué le pasó al hidalgo por leer tanto?",en:"What happened to the nobleman from reading so much?",tr:"Soylu adama çok okumaktan ne oldu?",de:"Was geschah mit dem Edelmann, weil er so viel las?",opts:["Se le secó el cerebro y perdió el juicio","Se quedó ciego","Se hizo famoso"],ex:"«…del poco dormir y del mucho leer, se le secó el cerebro y perdió por completo el juicio.»"},
{q:"¿Quién era Dulcinea del Toboso?",en:"Who was Dulcinea del Toboso?",tr:"Toboso'lu Dulcinea kimdi?",de:"Wer war Dulcinea von Toboso?",opts:["Una labradora con la que nunca había hablado","Su mujer","La hija de Sancho"],ex:"«…una labradora de un pueblo vecino a la que nunca había dirigido la palabra…»"},
{q:"¿Qué le prometieron a Sancho?",en:"What was Sancho promised?",tr:"Sancho'ya ne vaat edildi?",de:"Was wurde Sancho versprochen?",opts:["Gobernar algún día una ínsula","Un asno nuevo","Un castillo"],ex:"«…ante la promesa de gobernar algún día una ínsula.»"}]}

{id:"romeo",icon:"🌹",title:"Romeo y Julieta",tt:B("Romeo and Juliet","Romeo ve Juliet","Romeo und Julia"),src:"William Shakespeare",lv:{
A1:{paras:[
{es:"Romeo y Julieta viven en Verona. Sus familias se odian. Un día, Romeo va a una fiesta en casa de Julieta. Se ven y se enamoran. Se casan en secreto. Pero Romeo tiene que irse de la ciudad. Julieta toma una bebida para dormir. Romeo cree que está muerta y toma veneno. Julieta se despierta y también muere. Las familias, muy tristes, hacen las paces.",
 en:"Romeo and Juliet live in Verona. Their families hate each other. One day, Romeo goes to a party at Juliet's house. They see each other and fall in love. They get married in secret. But Romeo has to leave the city. Juliet takes a drink to make her sleep. Romeo thinks she is dead and takes poison. Juliet wakes up and dies too. The families, very sad, make peace.",
 tr:"Romeo ve Juliet Verona'da yaşıyor. Aileleri birbirinden nefret ediyor. Bir gün Romeo, Juliet'in evindeki bir partiye gidiyor. Birbirlerini görüyorlar ve âşık oluyorlar. Gizlice evleniyorlar. Ama Romeo şehirden gitmek zorunda kalıyor. Juliet uyumak için bir içecek içiyor. Romeo onun öldüğünü sanıyor ve zehir içiyor. Juliet uyanıyor ve o da ölüyor. Çok üzgün olan aileler barışıyor.",
 de:"Romeo und Julia leben in Verona. Ihre Familien hassen sich. Eines Tages geht Romeo zu einem Fest in Julias Haus. Sie sehen sich und verlieben sich. Sie heiraten heimlich. Aber Romeo muss die Stadt verlassen. Julia nimmt einen Trank, um zu schlafen. Romeo glaubt, dass sie tot ist, und nimmt Gift. Julia wacht auf und stirbt auch. Die Familien sind sehr traurig und schließen Frieden."}],
vocab:[["odiar","to hate","nefret etmek","hassen"],["enamorarse","to fall in love","âşık olmak","sich verlieben"],["casarse","to get married","evlenmek","heiraten"],["el veneno","poison","zehir","das Gift"]],
quiz:[
{q:"¿Dónde viven Romeo y Julieta?",en:"Where do Romeo and Juliet live?",tr:"Romeo ve Juliet nerede yaşıyor?",de:"Wo leben Romeo und Julia?",opts:["En Verona","En Madrid","En Roma"],ex:"«Romeo y Julieta viven en Verona.»"},
{q:"¿Qué hacen las familias al final?",en:"What do the families do at the end?",tr:"Aileler sonunda ne yapıyor?",de:"Was tun die Familien am Ende?",opts:["Hacen las paces","Se van de Verona","Siguen peleando"],ex:"«Las familias, muy tristes, hacen las paces.»"}]},
A2:{paras:[
{es:"En la ciudad de Verona había dos familias enemigas: los Montesco y los Capuleto. Una noche, los Capuleto dieron una gran fiesta, y Romeo, un joven Montesco, entró con una máscara. Allí vio a Julieta, la hija de los Capuleto, y se enamoró de ella al instante. Más tarde, Romeo entró en el jardín de Julieta y la oyó hablar de él desde el balcón. Esa misma noche se prometieron amor eterno.",
 en:"In the city of Verona there were two enemy families: the Montagues and the Capulets. One night, the Capulets gave a big party, and Romeo, a young Montague, went in wearing a mask. There he saw Juliet, the Capulets' daughter, and fell in love with her instantly. Later, Romeo went into Juliet's garden and heard her talking about him from the balcony. That same night they promised each other eternal love.",
 tr:"Verona şehrinde birbirine düşman iki aile varmış: Montague'lar ve Capulet'ler. Bir gece Capulet'ler büyük bir parti vermiş ve genç bir Montague olan Romeo maske takarak içeri girmiş. Orada Capulet'lerin kızı Juliet'i görmüş ve ona anında âşık olmuş. Daha sonra Romeo, Juliet'in bahçesine girmiş ve onu balkondan kendisinden söz ederken duymuş. Aynı gece birbirlerine sonsuz aşk sözü vermişler.",
 de:"In der Stadt Verona gab es zwei verfeindete Familien: die Montagues und die Capulets. Eines Nachts gaben die Capulets ein großes Fest, und Romeo, ein junger Montague, ging maskiert hinein. Dort sah er Julia, die Tochter der Capulets, und verliebte sich sofort in sie. Später schlich Romeo in Julias Garten und hörte, wie sie auf dem Balkon von ihm sprach. Noch in derselben Nacht versprachen sie sich ewige Liebe."},
{es:"Al día siguiente, un fraile los casó en secreto. Pero poco después, Romeo mató en una pelea a Teobaldo, el primo de Julieta, y tuvo que huir de Verona. Los padres de Julieta querían casarla con otro hombre, así que el fraile le dio una bebida para dormir y parecer muerta. Romeo no recibió la carta que lo explicaba todo. Al ver a Julieta «muerta», tomó veneno. Cuando ella despertó y lo vio, decidió morir con él. Sus familias, destrozadas, hicieron las paces.",
 en:"The next day, a friar married them in secret. But soon afterwards, Romeo killed Tybalt, Juliet's cousin, in a fight and had to flee Verona. Juliet's parents wanted to marry her to another man, so the friar gave her a drink to make her sleep and look dead. Romeo didn't receive the letter that explained everything. When he saw Juliet “dead”, he took poison. When she woke up and saw him, she decided to die with him. Their families, devastated, made peace.",
 tr:"Ertesi gün bir rahip onları gizlice evlendirmiş. Ama kısa süre sonra Romeo bir kavgada Juliet'in kuzeni Tybalt'ı öldürmüş ve Verona'dan kaçmak zorunda kalmış. Juliet'in anne babası onu başka bir adamla evlendirmek istiyormuş, bu yüzden rahip ona uyutup ölü gibi gösterecek bir içecek vermiş. Romeo her şeyi açıklayan mektubu alamamış. Juliet'i «ölü» görünce zehir içmiş. Juliet uyanıp onu görünce onunla birlikte ölmeye karar vermiş. Yıkılan aileleri barışmış.",
 de:"Am nächsten Tag traute sie ein Mönch heimlich. Doch kurz darauf tötete Romeo in einem Kampf Tybalt, Julias Cousin, und musste aus Verona fliehen. Julias Eltern wollten sie mit einem anderen Mann verheiraten, also gab ihr der Mönch einen Trank, der sie schlafen und tot erscheinen ließ. Romeo erhielt den Brief nicht, der alles erklärte. Als er Julia „tot“ sah, nahm er Gift. Als sie erwachte und ihn sah, beschloss sie, mit ihm zu sterben. Ihre Familien, am Boden zerstört, schlossen Frieden."}],

quiz:[
{q:"¿Cómo entró Romeo en la fiesta?",en:"How did Romeo get into the party?",tr:"Romeo partiye nasıl girdi?",de:"Wie kam Romeo auf das Fest?",opts:["Con una máscara","Por la ventana","Con su familia"],ex:"«…Romeo, un joven Montesco, entró con una máscara.»"},
{q:"¿Por qué tuvo que huir Romeo de Verona?",en:"Why did Romeo have to flee Verona?",tr:"Romeo neden Verona'dan kaçmak zorunda kaldı?",de:"Warum musste Romeo aus Verona fliehen?",opts:["Mató a Teobaldo en una pelea","Su padre se lo ordenó","Quería ver el mundo"],ex:"«…Romeo mató en una pelea a Teobaldo, el primo de Julieta, y tuvo que huir de Verona.»"}]},
B1:{paras:[
{es:"Desde hacía generaciones, dos poderosas familias de Verona, los Montesco y los Capuleto, se odiaban tanto que sus criados se peleaban en plena calle. Una noche, el joven Romeo Montesco se coló con sus amigos, todos con máscaras, en un baile que daban los Capuleto. Entre los invitados vio a una muchacha tan hermosa que se olvidó de todo. Cuando descubrió que era Julieta, la única hija de sus enemigos, ya era demasiado tarde: se había enamorado.",
 en:"For generations, two powerful families of Verona, the Montagues and the Capulets, had hated each other so much that their servants fought in the middle of the street. One night, young Romeo Montague sneaked with his friends, all wearing masks, into a ball the Capulets were giving. Among the guests he saw a girl so beautiful that he forgot everything. When he found out that she was Juliet, the only daughter of his enemies, it was already too late: he had fallen in love.",
 tr:"Kuşaklardır Verona'nın iki güçlü ailesi Montague'lar ve Capulet'ler birbirinden o kadar nefret ediyormuş ki hizmetkârları sokak ortasında kavga ediyormuş. Bir gece genç Romeo Montague, hepsi maskeli arkadaşlarıyla birlikte Capulet'lerin verdiği bir baloya gizlice girmiş. Davetliler arasında o kadar güzel bir kız görmüş ki her şeyi unutmuş. Onun düşmanlarının biricik kızı Juliet olduğunu öğrendiğinde artık çok geçmiş: âşık olmuş.",
 de:"Seit Generationen hassten sich zwei mächtige Familien Veronas, die Montagues und die Capulets, so sehr, dass sich ihre Diener mitten auf der Straße prügelten. Eines Nachts schlich sich der junge Romeo Montague mit seinen Freunden, alle maskiert, auf einen Ball, den die Capulets gaben. Unter den Gästen sah er ein Mädchen, so schön, dass er alles vergaß. Als er erfuhr, dass es Julia war, die einzige Tochter seiner Feinde, war es schon zu spät: Er hatte sich verliebt."},
{es:"Esa noche, Romeo saltó el muro del jardín de los Capuleto y escuchó a Julieta lamentarse desde su balcón: «¿Por qué tienes que ser un Montesco?». Él se declaró, y los dos decidieron casarse en secreto con la ayuda de Fray Lorenzo, que esperaba que aquella boda acabara con el odio entre las familias. Pero unas horas después de la ceremonia, Romeo se vio envuelto en una pelea, mató a Teobaldo, el primo de Julieta, y fue desterrado de la ciudad.",
 en:"That night, Romeo jumped over the wall of the Capulets' garden and heard Juliet lamenting from her balcony: “Why do you have to be a Montague?” He declared his love, and the two decided to marry in secret with the help of Friar Laurence, who hoped that the wedding would put an end to the hatred between the families. But a few hours after the ceremony, Romeo got caught up in a fight, killed Tybalt, Juliet's cousin, and was banished from the city.",
 tr:"O gece Romeo, Capulet'lerin bahçe duvarından atlamış ve Juliet'in balkonundan yakındığını duymuş: «Neden bir Montague olmak zorundasın?» Romeo ona aşkını itiraf etmiş ve ikisi, bu evliliğin aileler arasındaki nefrete son vereceğini uman Rahip Lorenzo'nun yardımıyla gizlice evlenmeye karar vermişler. Ama törenden birkaç saat sonra Romeo bir kavgaya karışmış, Juliet'in kuzeni Tybalt'ı öldürmüş ve şehirden sürülmüş.",
 de:"In dieser Nacht sprang Romeo über die Mauer des Capulet-Gartens und hörte Julia auf ihrem Balkon klagen: „Warum musst du ein Montague sein?“ Er gestand ihr seine Liebe, und die beiden beschlossen, mit Hilfe von Bruder Lorenzo heimlich zu heiraten, der hoffte, diese Hochzeit werde den Hass zwischen den Familien beenden. Doch wenige Stunden nach der Trauung geriet Romeo in einen Kampf, tötete Tybalt, Julias Cousin, und wurde aus der Stadt verbannt."},
{es:"Los padres de Julieta, que no sabían nada, decidieron casarla con el conde Paris. Desesperada, ella pidió ayuda al fraile, que le dio un líquido que la haría parecer muerta durante dos días. El plan era que Romeo la rescatara de la cripta, pero la carta que lo explicaba nunca le llegó. Al enterarse de la «muerte» de Julieta, Romeo volvió a Verona y bebió veneno junto a ella. Cuando Julieta despertó y lo vio sin vida, decidió no separarse de él jamás. Ante su tragedia, las dos familias se reconciliaron por fin.",
 en:"Juliet's parents, who knew nothing, decided to marry her to Count Paris. In despair, she asked the friar for help, and he gave her a liquid that would make her appear dead for two days. The plan was for Romeo to rescue her from the crypt, but the letter explaining it never reached him. On hearing of Juliet's “death”, Romeo returned to Verona and drank poison beside her. When Juliet woke and saw him lifeless, she decided never to be parted from him. Faced with their tragedy, the two families were finally reconciled.",
 tr:"Hiçbir şeyden haberi olmayan Juliet'in anne babası onu Kont Paris'le evlendirmeye karar vermiş. Çaresiz kalan Juliet rahipten yardım istemiş; rahip de ona iki gün boyunca ölü gibi görünmesini sağlayacak bir sıvı vermiş. Plana göre Romeo onu mezar odasından kurtaracakmış, ama bunu açıklayan mektup ona hiç ulaşmamış. Juliet'in «ölümünü» öğrenen Romeo Verona'ya dönmüş ve onun yanında zehir içmiş. Juliet uyanıp onu cansız görünce ondan asla ayrılmamaya karar vermiş. Bu trajedi karşısında iki aile sonunda barışmış.",
 de:"Julias Eltern, die von nichts wussten, beschlossen, sie mit Graf Paris zu verheiraten. Verzweifelt bat sie den Mönch um Hilfe, der ihr eine Flüssigkeit gab, die sie zwei Tage lang tot erscheinen lassen würde. Der Plan war, dass Romeo sie aus der Gruft holen sollte, doch der Brief, der alles erklärte, erreichte ihn nie. Als Romeo von Julias „Tod“ erfuhr, kehrte er nach Verona zurück und trank neben ihr Gift. Als Julia erwachte und ihn leblos sah, beschloss sie, sich nie von ihm zu trennen. Angesichts ihrer Tragödie versöhnten sich die beiden Familien endlich."}],

quiz:[
{q:"¿Por qué aceptó Fray Lorenzo casarlos?",en:"Why did Friar Laurence agree to marry them?",tr:"Rahip Lorenzo onları evlendirmeyi neden kabul etti?",de:"Warum war Bruder Lorenzo bereit, sie zu trauen?",opts:["Esperaba acabar con el odio entre las familias","Los padres se lo pidieron","Romeo le pagó"],ex:"«…Fray Lorenzo, que esperaba que aquella boda acabara con el odio entre las familias.»"},
{q:"¿Con quién querían casar a Julieta sus padres?",en:"Who did Juliet's parents want to marry her to?",tr:"Juliet'in anne babası onu kiminle evlendirmek istiyordu?",de:"Mit wem wollten Julias Eltern sie verheiraten?",opts:["Con el conde Paris","Con Teobaldo","Con un Montesco"],ex:"«…decidieron casarla con el conde Paris.»"},
{q:"¿Por qué Romeo no conocía el plan?",en:"Why didn't Romeo know about the plan?",tr:"Romeo neden plandan habersizdi?",de:"Warum kannte Romeo den Plan nicht?",opts:["La carta nunca le llegó","Julieta no quiso contárselo","Estaba enfermo"],ex:"«…la carta que lo explicaba nunca le llegó.»"}]},
B2:{paras:[
{es:"En la bella Verona, dos casas de igual nobleza, los Montesco y los Capuleto, arrastraban un rencor tan antiguo que nadie recordaba ya su origen. Bastaba un gesto o una mirada para que sus partidarios desenvainaran las espadas en plena plaza, hasta el punto de que el príncipe de la ciudad, harto de tanta sangre, había amenazado con la muerte a quien volviera a alterar la paz. En ese clima de tensión, el joven Romeo, heredero de los Montesco, suspiraba por un amor no correspondido.",
 en:"In fair Verona, two houses alike in dignity, the Montagues and the Capulets, carried a grudge so old that nobody remembered its origin any more. A gesture or a glance was enough for their followers to draw their swords in the middle of the square, so much so that the prince of the city, sick of so much bloodshed, had threatened with death anyone who disturbed the peace again. In this tense atmosphere, young Romeo, heir of the Montagues, was sighing over an unrequited love.",
 tr:"Güzel Verona'da eşit soyluluktaki iki hanedan, Montague'lar ve Capulet'ler, kökenini artık kimsenin hatırlamadığı kadar eski bir kini sürdürüyormuş. Taraftarlarının meydanın ortasında kılıç çekmesi için bir jest ya da bir bakış yetiyormuş; öyle ki bu kadar kandan bıkan şehrin prensi, huzuru bir kez daha bozan herkesi ölümle tehdit etmiş. Bu gergin ortamda Montague'ların varisi genç Romeo karşılıksız bir aşk için iç çekiyormuş.",
 de:"Im schönen Verona hegten zwei gleich edle Häuser, die Montagues und die Capulets, einen so alten Groll, dass sich niemand mehr an seinen Ursprung erinnerte. Eine Geste oder ein Blick genügte, damit ihre Anhänger mitten auf dem Platz die Schwerter zogen, so sehr, dass der Fürst der Stadt, des vielen Blutvergießens überdrüssig, jedem mit dem Tod gedroht hatte, der den Frieden noch einmal störte. In dieser angespannten Lage seufzte der junge Romeo, Erbe der Montagues, einer unerwiderten Liebe nach."},
{es:"Para distraerlo, sus amigos lo convencieron de colarse enmascarados en el baile que celebraban sus enemigos. Allí, entre música y antorchas, Romeo vio a Julieta y supo que nunca había amado de verdad hasta entonces. Intercambiaron unas pocas palabras y un beso furtivo antes de descubrir, horrorizados, la identidad del otro. Aquella misma noche, oculto bajo su balcón, Romeo la escuchó confesar a las estrellas que lo amaba a pesar de su apellido, y ya no hubo marcha atrás.",
 en:"To take his mind off it, his friends persuaded him to sneak, masked, into the ball their enemies were holding. There, amid music and torches, Romeo saw Juliet and knew that he had never truly loved until then. They exchanged a few words and a stolen kiss before discovering, horrified, each other's identity. That same night, hidden beneath her balcony, Romeo heard her confess to the stars that she loved him in spite of his name, and there was no turning back.",
 tr:"Aklını dağıtmak için arkadaşları onu düşmanlarının verdiği baloya maskeli olarak gizlice girmeye ikna etmiş. Orada, müzik ve meşaleler arasında Romeo, Juliet'i görmüş ve o zamana kadar hiç gerçekten sevmediğini anlamış. Birbirlerinin kim olduğunu dehşetle öğrenmeden önce birkaç söz ve kaçamak bir öpücük paylaşmışlar. Aynı gece balkonunun altına gizlenen Romeo, onun yıldızlara soyadına rağmen kendisini sevdiğini itiraf ettiğini duymuş ve artık geri dönüş kalmamış.",
 de:"Um ihn abzulenken, überredeten ihn seine Freunde, sich maskiert auf den Ball zu schleichen, den ihre Feinde gaben. Dort, zwischen Musik und Fackeln, sah Romeo Julia und wusste, dass er bis dahin nie wirklich geliebt hatte. Sie wechselten ein paar Worte und einen verstohlenen Kuss, bevor sie entsetzt erfuhren, wer der andere war. Noch in derselben Nacht hörte Romeo, unter ihrem Balkon versteckt, wie sie den Sternen gestand, dass sie ihn trotz seines Namens liebte, und es gab kein Zurück mehr."},
{es:"Con la complicidad de Fray Lorenzo, que soñaba con reconciliar a ambas familias, contrajeron matrimonio en secreto. Sin embargo, el destino se torció enseguida: Teobaldo, el impetuoso primo de Julieta, mató a Mercucio, el mejor amigo de Romeo, y este, cegado por la ira, lo atravesó con su espada. Desterrado a Mantua, Romeo tuvo que abandonar a su esposa tras una sola noche juntos, mientras el señor Capuleto, ajeno a todo, concertaba la boda de su hija con el conde Paris.",
 en:"With the complicity of Friar Laurence, who dreamed of reconciling the two families, they were married in secret. However, fate soon took a turn for the worse: Tybalt, Juliet's hot-headed cousin, killed Mercutio, Romeo's best friend, and Romeo, blinded by rage, ran him through with his sword. Banished to Mantua, Romeo had to leave his wife after just one night together, while Lord Capulet, unaware of everything, arranged his daughter's marriage to Count Paris.",
 tr:"İki aileyi barıştırmayı hayal eden Rahip Lorenzo'nun suç ortaklığıyla gizlice evlenmişler. Ancak kader çok geçmeden ters dönmüş: Juliet'in fevri kuzeni Tybalt, Romeo'nun en yakın arkadaşı Mercutio'yu öldürmüş, Romeo da öfkeden gözü dönmüş halde onu kılıcıyla delip geçmiş. Mantua'ya sürgün edilen Romeo yalnızca bir gece birlikte geçirdikten sonra karısını bırakmak zorunda kalmış; bu arada her şeyden habersiz Bay Capulet kızının Kont Paris'le düğününü ayarlıyormuş.",
 de:"Mit der Hilfe von Bruder Lorenzo, der davon träumte, beide Familien zu versöhnen, heirateten sie heimlich. Doch das Schicksal nahm bald eine Wendung: Tybalt, Julias hitzköpfiger Cousin, tötete Mercutio, Romeos besten Freund, und Romeo durchbohrte ihn, blind vor Zorn, mit seinem Schwert. Nach Mantua verbannt, musste Romeo seine Frau nach nur einer gemeinsamen Nacht verlassen, während Herr Capulet, ahnungslos, die Hochzeit seiner Tochter mit Graf Paris vereinbarte."},
{es:"Acorralada, Julieta aceptó el arriesgado plan del fraile: un brebaje que la sumiría en un sueño semejante a la muerte. Pero el mensajero que debía avisar a Romeo quedó retenido por una epidemia, y la noticia que le llegó a Mantua fue la de la muerte de su amada. Romeo compró un veneno, entró de noche en la cripta de los Capuleto y, tras besarla por última vez, lo bebió. Al despertar, Julieta lo encontró sin vida y empuñó su daga. Solo ante aquella tragedia comprendieron los dos patriarcas el precio de su odio, y se dieron la mano.",
 en:"Cornered, Juliet accepted the friar's risky plan: a potion that would plunge her into a sleep resembling death. But the messenger who was to warn Romeo was held up by an epidemic, and the news that reached Mantua was that of his beloved's death. Romeo bought poison, entered the Capulets' crypt at night and, after kissing her one last time, drank it. On waking, Juliet found him lifeless and took up his dagger. Only in the face of that tragedy did the two patriarchs understand the price of their hatred, and they shook hands.",
 tr:"Köşeye sıkışan Juliet rahibin riskli planını kabul etmiş: onu ölüme benzer bir uykuya daldıracak bir iksir. Ama Romeo'yu haberdar etmesi gereken ulak bir salgın yüzünden yolda kalmış ve Mantua'ya ulaşan haber sevgilisinin ölüm haberi olmuş. Romeo bir zehir satın almış, gece Capulet'lerin mezar odasına girmiş ve onu son bir kez öptükten sonra zehri içmiş. Uyanan Juliet onu cansız bulmuş ve hançerini eline almış. İki aile reisi ancak bu trajedi karşısında nefretlerinin bedelini anlamış ve el sıkışmış.",
 de:"In die Enge getrieben, nahm Julia den gewagten Plan des Mönchs an: einen Trank, der sie in einen todesähnlichen Schlaf versetzen würde. Doch der Bote, der Romeo benachrichtigen sollte, wurde wegen einer Seuche aufgehalten, und die Nachricht, die Mantua erreichte, war die vom Tod seiner Geliebten. Romeo kaufte Gift, betrat nachts die Gruft der Capulets und trank es, nachdem er sie ein letztes Mal geküsst hatte. Als Julia erwachte, fand sie ihn leblos und griff zu seinem Dolch. Erst angesichts dieser Tragödie begriffen die beiden Familienoberhäupter den Preis ihres Hasses und reichten sich die Hand."}],

{id:"robinson",icon:"🏝️",title:"Robinson Crusoe",tt:B("Robinson Crusoe","Robinson Crusoe","Robinson Crusoe"),src:"Daniel Defoe",lv:{
A1:{paras:[
{es:"Robinson Crusoe es un marinero inglés. Un día hay una gran tormenta y su barco se hunde. Robinson llega solo a una isla. No hay nadie. Hace una casa, caza animales y planta trigo. Vive solo muchos años. Un día encuentra a un hombre y lo llama Viernes. Son amigos. Después de veintiocho años, un barco los lleva a Inglaterra.",
 en:"Robinson Crusoe is an English sailor. One day there is a big storm and his ship sinks. Robinson arrives alone on an island. There's nobody there. He builds a house, hunts animals and plants wheat. He lives alone for many years. One day he finds a man and calls him Friday. They are friends. After twenty-eight years, a ship takes them to England.",
 tr:"Robinson Crusoe İngiliz bir denizci. Bir gün büyük bir fırtına çıkıyor ve gemisi batıyor. Robinson tek başına bir adaya varıyor. Adada kimse yok. Bir ev yapıyor, hayvan avlıyor ve buğday ekiyor. Uzun yıllar yalnız yaşıyor. Bir gün bir adam buluyor ve ona Cuma diyor. Arkadaş oluyorlar. Yirmi sekiz yıl sonra bir gemi onları İngiltere'ye götürüyor.",
 de:"Robinson Crusoe ist ein englischer Seemann. Eines Tages gibt es einen großen Sturm und sein Schiff sinkt. Robinson kommt allein auf eine Insel. Dort ist niemand. Er baut ein Haus, jagt Tiere und pflanzt Weizen. Er lebt viele Jahre allein. Eines Tages findet er einen Mann und nennt ihn Freitag. Sie sind Freunde. Nach achtundzwanzig Jahren bringt ein Schiff sie nach England."}],
vocab:[["el marinero","sailor","denizci","der Seemann"],["la tormenta","storm","fırtına","der Sturm"],["hundirse","to sink","batmak","sinken"],["la isla","island","ada","die Insel"]],
quiz:[
{q:"¿Por qué llega Robinson a la isla?",en:"Why does Robinson end up on the island?",tr:"Robinson neden adaya düşüyor?",de:"Warum kommt Robinson auf die Insel?",opts:["Su barco se hunde en una tormenta","Quiere vivir solo","Busca oro"],ex:"«Un día hay una gran tormenta y su barco se hunde.»"},
{q:"¿Cómo llama Robinson a su amigo?",en:"What does Robinson call his friend?",tr:"Robinson arkadaşına ne ad veriyor?",de:"Wie nennt Robinson seinen Freund?",opts:["Viernes","Domingo","Lunes"],ex:"«Un día encuentra a un hombre y lo llama Viernes.»"}]},
A2:{paras:[
{es:"Robinson Crusoe era un joven inglés que soñaba con viajar por el mar, aunque su padre no quería. Un día, su barco se hundió en una terrible tormenta y todos sus compañeros murieron. Robinson llegó nadando a una isla desierta. Al principio tenía mucho miedo, pero pronto empezó a trabajar: sacó del barco herramientas, comida y armas, construyó una cabaña y aprendió a cultivar trigo y a criar cabras.",
 en:"Robinson Crusoe was a young Englishman who dreamed of travelling by sea, although his father didn't want him to. One day, his ship sank in a terrible storm and all his companions died. Robinson swam to a desert island. At first he was very frightened, but soon he started working: he took tools, food and weapons from the ship, built a hut and learned to grow wheat and raise goats.",
 tr:"Robinson Crusoe, babası istemese de denizlerde yolculuk etmeyi hayal eden genç bir İngilizmiş. Bir gün gemisi korkunç bir fırtınada batmış ve bütün arkadaşları ölmüş. Robinson yüzerek ıssız bir adaya varmış. Başta çok korkuyormuş ama kısa sürede çalışmaya başlamış: gemiden alet, yiyecek ve silah çıkarmış, bir kulübe yapmış ve buğday yetiştirmeyi ve keçi beslemeyi öğrenmiş.",
 de:"Robinson Crusoe war ein junger Engländer, der davon träumte, zur See zu fahren, obwohl sein Vater das nicht wollte. Eines Tages sank sein Schiff in einem schrecklichen Sturm, und alle seine Gefährten starben. Robinson schwamm zu einer einsamen Insel. Anfangs hatte er große Angst, aber bald begann er zu arbeiten: Er holte Werkzeuge, Essen und Waffen aus dem Schiff, baute eine Hütte und lernte, Weizen anzubauen und Ziegen zu halten."},
{es:"Pasaron muchos años. Para no perder la noción del tiempo, Robinson hacía una marca en un palo cada día. Un día vio la huella de un pie en la arena y se asustó mucho. Más tarde descubrió que unos caníbales visitaban la isla. Salvó a uno de sus prisioneros, que se convirtió en su amigo y compañero. Como lo encontró un viernes, lo llamó Viernes. Después de veintiocho años en la isla, un barco inglés los rescató.",
 en:"Many years went by. So as not to lose track of time, Robinson made a mark on a stick every day. One day he saw a footprint in the sand and got very scared. Later he discovered that some cannibals visited the island. He saved one of their prisoners, who became his friend and companion. As he found him on a Friday, he called him Friday. After twenty-eight years on the island, an English ship rescued them.",
 tr:"Uzun yıllar geçmiş. Zamanı şaşırmamak için Robinson her gün bir sopaya bir çentik atıyormuş. Bir gün kumda bir ayak izi görmüş ve çok korkmuş. Daha sonra adaya bazı yamyamların geldiğini keşfetmiş. Onların esirlerinden birini kurtarmış; bu adam onun arkadaşı ve yol arkadaşı olmuş. Onu bir cuma günü bulduğu için ona Cuma adını vermiş. Adada geçen yirmi sekiz yılın ardından bir İngiliz gemisi onları kurtarmış.",
 de:"Viele Jahre vergingen. Um nicht das Zeitgefühl zu verlieren, machte Robinson jeden Tag eine Kerbe in einen Stock. Eines Tages sah er einen Fußabdruck im Sand und erschrak sehr. Später entdeckte er, dass Kannibalen die Insel besuchten. Er rettete einen ihrer Gefangenen, der sein Freund und Gefährte wurde. Weil er ihn an einem Freitag gefunden hatte, nannte er ihn Freitag. Nach achtundzwanzig Jahren auf der Insel rettete sie ein englisches Schiff."}],
vocab:[["desierto","deserted, uninhabited","ıssız","einsam, unbewohnt"],["la herramienta","tool","alet","das Werkzeug"],["la huella","footprint","iz, ayak izi","der Fußabdruck"],["rescatar","to rescue","kurtarmak","retten"]],
quiz:[
{q:"¿Qué hacía Robinson cada día para no perder la noción del tiempo?",en:"What did Robinson do every day so as not to lose track of time?",tr:"Robinson zamanı şaşırmamak için her gün ne yapıyordu?",de:"Was tat Robinson jeden Tag, um das Zeitgefühl nicht zu verlieren?",opts:["Una marca en un palo","Una carta","Un dibujo en la arena"],ex:"«…Robinson hacía una marca en un palo cada día.»"},
{q:"¿Por qué llamó Viernes a su amigo?",en:"Why did he call his friend Friday?",tr:"Arkadaşına neden Cuma adını verdi?",de:"Warum nannte er seinen Freund Freitag?",opts:["Lo encontró un viernes","Era su nombre real","Le gustaban los viernes"],ex:"«Como lo encontró un viernes, lo llamó Viernes.»"}]},
B1:{paras:[
{es:"Robinson Crusoe nació en York, en el seno de una familia acomodada. Su padre quería que estudiara leyes, pero él solo pensaba en el mar. Desobedeciendo a sus padres, se embarcó varias veces y vivió aventuras peligrosas, hasta que en 1659, durante un viaje a África, una tempestad destrozó su barco cerca de la costa de Sudamérica. Las olas lo arrastraron hasta una playa desconocida. Era el único superviviente.",
 en:"Robinson Crusoe was born in York into a well-off family. His father wanted him to study law, but he only thought about the sea. Disobeying his parents, he went to sea several times and had dangerous adventures, until in 1659, during a voyage to Africa, a tempest wrecked his ship near the coast of South America. The waves swept him onto an unknown beach. He was the only survivor.",
 tr:"Robinson Crusoe York'ta varlıklı bir ailede dünyaya gelmiş. Babası onun hukuk okumasını istiyormuş ama o yalnızca denizi düşünüyormuş. Anne babasının sözünü dinlemeyerek birkaç kez denize açılmış ve tehlikeli maceralar yaşamış; ta ki 1659'da Afrika'ya yaptığı bir yolculuk sırasında bir fırtına gemisini Güney Amerika kıyılarının yakınında parçalayana kadar. Dalgalar onu bilinmeyen bir kumsala sürüklemiş. Hayatta kalan tek kişi oymuş.",
 de:"Robinson Crusoe wurde in York in eine wohlhabende Familie hineingeboren. Sein Vater wollte, dass er Jura studierte, aber er dachte nur an das Meer. Gegen den Willen seiner Eltern fuhr er mehrmals zur See und erlebte gefährliche Abenteuer, bis 1659 auf einer Reise nach Afrika ein Unwetter sein Schiff nahe der Küste Südamerikas zerschmetterte. Die Wellen spülten ihn an einen unbekannten Strand. Er war der einzige Überlebende."},
{es:"En los días siguientes, Robinson hizo varios viajes al barco hundido en una balsa y rescató todo lo que pudo: herramientas, pólvora, ropa, galletas y hasta un perro y dos gatos. Construyó una vivienda protegida por una empalizada, fabricó muebles, aprendió a hacer vasijas de barro y a cultivar cebada y arroz. Para no perder la cuenta de los días, grababa en un poste una muesca por cada día, y escribía un diario.",
 en:"In the following days, Robinson made several trips to the wrecked ship on a raft and saved everything he could: tools, gunpowder, clothes, biscuits and even a dog and two cats. He built a dwelling protected by a stockade, made furniture, learned to make clay pots and to grow barley and rice. So as not to lose count of the days, he carved a notch in a post for each day, and he kept a diary.",
 tr:"Sonraki günlerde Robinson bir salla batık gemiye birkaç kez gidip gelmiş ve kurtarabildiği her şeyi kurtarmış: aletler, barut, giysiler, peksimet, hatta bir köpek ve iki kedi. Bir çitle korunan bir barınak yapmış, mobilya üretmiş, kilden kap yapmayı ve arpa ile pirinç yetiştirmeyi öğrenmiş. Günlerin sayısını şaşırmamak için her gün bir direğe bir çentik oyuyor ve bir günlük tutuyormuş.",
 de:"In den folgenden Tagen fuhr Robinson mehrmals mit einem Floß zum Wrack und rettete alles, was er konnte: Werkzeuge, Schießpulver, Kleidung, Zwieback und sogar einen Hund und zwei Katzen. Er baute eine Behausung, die von einem Palisadenzaun geschützt war, fertigte Möbel an, lernte, Tongefäße herzustellen und Gerste und Reis anzubauen. Um die Tage nicht aus den Augen zu verlieren, schnitzte er für jeden Tag eine Kerbe in einen Pfosten, und er führte ein Tagebuch."},
{es:"Tras quince años de soledad, descubrió en la arena una huella humana que lo llenó de terror. Con el tiempo supo que unos caníbales llegaban a la isla en canoas. Un día logró salvar a uno de sus prisioneros, un joven al que llamó Viernes por el día en que lo encontró. Robinson le enseñó inglés y Viernes se convirtió en su fiel compañero. Finalmente, después de veintiocho años, un barco inglés llegó a la isla y Robinson pudo volver a casa.",
 en:"After fifteen years of solitude, he discovered a human footprint in the sand that filled him with terror. In time he learned that some cannibals came to the island in canoes. One day he managed to save one of their prisoners, a young man he called Friday after the day he found him. Robinson taught him English, and Friday became his loyal companion. Finally, after twenty-eight years, an English ship arrived at the island and Robinson was able to go home.",
 tr:"On beş yıllık yalnızlığın ardından kumda onu dehşete düşüren bir insan ayak izi bulmuş. Zamanla bazı yamyamların adaya kanolarla geldiğini öğrenmiş. Bir gün onların esirlerinden birini, onu bulduğu güne atfen Cuma adını verdiği genç bir adamı kurtarmayı başarmış. Robinson ona İngilizce öğretmiş ve Cuma onun sadık yol arkadaşı olmuş. Sonunda yirmi sekiz yıl sonra adaya bir İngiliz gemisi gelmiş ve Robinson evine dönebilmiş.",
 de:"Nach fünfzehn Jahren Einsamkeit entdeckte er im Sand einen menschlichen Fußabdruck, der ihn mit Schrecken erfüllte. Mit der Zeit erfuhr er, dass Kannibalen in Kanus auf die Insel kamen. Eines Tages gelang es ihm, einen ihrer Gefangenen zu retten, einen jungen Mann, den er nach dem Tag, an dem er ihn fand, Freitag nannte. Robinson brachte ihm Englisch bei, und Freitag wurde sein treuer Gefährte. Nach achtundzwanzig Jahren kam endlich ein englisches Schiff zur Insel, und Robinson konnte nach Hause zurückkehren."}],
vocab:[["acomodado","well-off","varlıklı","wohlhabend"],["la tempestad","tempest, storm","fırtına","das Unwetter"],["la balsa","raft","sal","das Floß"],["la muesca","notch","çentik","die Kerbe"]],
quiz:[
{q:"¿Qué quería su padre que estudiara?",en:"What did his father want him to study?",tr:"Babası onun ne okumasını istiyordu?",de:"Was sollte er laut seinem Vater studieren?",opts:["Leyes","Medicina","Navegación"],ex:"«Su padre quería que estudiara leyes, pero él solo pensaba en el mar.»"},
{q:"¿Cómo llevaba Robinson la cuenta de los días?",en:"How did Robinson keep count of the days?",tr:"Robinson günleri nasıl sayıyordu?",de:"Wie zählte Robinson die Tage?",opts:["Grababa una muesca en un poste","Contaba las estrellas","Miraba un calendario"],ex:"«…grababa en un poste una muesca por cada día…»"},
{q:"¿Cuántos años llevaba solo cuando vio la huella?",en:"How many years had he been alone when he saw the footprint?",tr:"Ayak izini gördüğünde kaç yıldır yalnızdı?",de:"Wie viele Jahre war er allein, als er den Fußabdruck sah?",opts:["Quince","Veintiocho","Dos"],ex:"«Tras quince años de soledad, descubrió en la arena una huella humana…»"}]},
B2:{paras:[
{es:"Hijo menor de un próspero comerciante de York, Robinson Crusoe desoyó desde muy joven los consejos de su padre, que le auguraba una vida tranquila y acomodada si se mantenía alejado del mar. Incapaz de resistir la llamada de la aventura, se embarcó a escondidas, sobrevivió a naufragios, fue capturado por piratas y llegó a establecerse como plantador en Brasil. Sin embargo, su ambición lo llevó a emprender una arriesgada expedición comercial a África, y en septiembre de 1659 una tempestad furiosa hizo encallar el barco frente a una isla desconocida.",
 en:"The youngest son of a prosperous York merchant, Robinson Crusoe ignored from a very young age the advice of his father, who predicted a quiet, comfortable life for him if he stayed away from the sea. Unable to resist the call of adventure, he went to sea in secret, survived shipwrecks, was captured by pirates and even settled as a planter in Brazil. However, his ambition led him to undertake a risky trading expedition to Africa, and in September 1659 a furious storm ran the ship aground off an unknown island.",
 tr:"York'lu varlıklı bir tüccarın en küçük oğlu olan Robinson Crusoe, denizden uzak durursa ona huzurlu ve rahat bir hayat öngören babasının öğütlerine çok genç yaşta kulak tıkamış. Macera tutkusuna karşı koyamayarak gizlice gemiye binmiş, gemi kazalarından sağ kurtulmuş, korsanlara esir düşmüş ve hatta Brezilya'da plantasyon sahibi olarak yerleşmiş. Ne var ki hırsı onu Afrika'ya riskli bir ticaret seferine sürüklemiş ve 1659 Eylül'ünde azgın bir fırtına gemiyi bilinmeyen bir adanın açıklarında karaya oturtmuş.",
 de:"Als jüngster Sohn eines wohlhabenden Kaufmanns aus York schlug Robinson Crusoe schon sehr früh die Ratschläge seines Vaters in den Wind, der ihm ein ruhiges, behagliches Leben voraussagte, wenn er sich vom Meer fernhielte. Unfähig, dem Ruf des Abenteuers zu widerstehen, ging er heimlich an Bord, überlebte Schiffbrüche, geriet in die Gefangenschaft von Piraten und ließ sich sogar als Pflanzer in Brasilien nieder. Doch sein Ehrgeiz trieb ihn zu einer riskanten Handelsfahrt nach Afrika, und im September 1659 ließ ein wütender Sturm das Schiff vor einer unbekannten Insel auf Grund laufen."},
{es:"De toda la tripulación, solo él logró alcanzar la orilla con vida. Superado el primer momento de desesperación, comprendió que su supervivencia dependería de su ingenio. Construyó una balsa y, aprovechando la marea baja, rescató del barco todo lo que pudo antes de que el mar se lo tragara: herramientas, pólvora, mosquetes, víveres y algunos libros. Con paciencia infinita levantó una fortificación, domesticó cabras salvajes, aprendió a cocer pan y a fabricar cestas, y llevó un minucioso diario de su vida en la isla.",
 en:"Of the whole crew, only he managed to reach the shore alive. Once the first moment of despair had passed, he understood that his survival would depend on his ingenuity. He built a raft and, taking advantage of low tide, saved everything he could from the ship before the sea swallowed it: tools, gunpowder, muskets, provisions and a few books. With infinite patience he built a fortification, tamed wild goats, learned to bake bread and make baskets, and kept a meticulous diary of his life on the island.",
 tr:"Bütün mürettebat içinde yalnızca o kıyıya canlı ulaşabilmiş. İlk çaresizlik anını atlattıktan sonra hayatta kalmasının zekâsına bağlı olacağını anlamış. Bir sal yapmış ve deniz gemiyi yutmadan önce cezir vaktinden yararlanarak kurtarabildiği her şeyi kurtarmış: aletler, barut, tüfekler, erzak ve birkaç kitap. Sonsuz bir sabırla bir tahkimat kurmuş, yaban keçilerini evcilleştirmiş, ekmek pişirmeyi ve sepet örmeyi öğrenmiş ve adadaki hayatının ayrıntılı bir günlüğünü tutmuş.",
 de:"Von der ganzen Besatzung erreichte nur er lebend das Ufer. Als der erste Moment der Verzweiflung überwunden war, begriff er, dass sein Überleben von seinem Einfallsreichtum abhängen würde. Er baute ein Floß und rettete bei Ebbe alles, was er konnte, aus dem Schiff, bevor das Meer es verschluckte: Werkzeuge, Schießpulver, Musketen, Lebensmittel und einige Bücher. Mit unendlicher Geduld errichtete er eine Befestigung, zähmte wilde Ziegen, lernte Brot zu backen und Körbe zu flechten und führte ein genaues Tagebuch über sein Leben auf der Insel."},
{es:"Los años transcurrieron con una monotonía solo interrumpida por terremotos, fiebres y largas reflexiones sobre su destino. Hasta que una mañana, tras más de quince años de soledad absoluta, se topó con la huella de un pie descalzo impresa en la arena. Aquel hallazgo le quitó el sueño durante meses. Más tarde descubrió que grupos de caníbales desembarcaban de vez en cuando en la otra punta de la isla para celebrar sus macabros festines, y vivió desde entonces en un estado de alerta permanente.",
 en:"The years passed with a monotony broken only by earthquakes, fevers and long reflections on his fate. Until one morning, after more than fifteen years of absolute solitude, he came across the print of a bare foot in the sand. That discovery kept him awake for months. Later he found out that groups of cannibals occasionally landed at the other end of the island to hold their macabre feasts, and from then on he lived in a state of permanent alert.",
 tr:"Yıllar yalnızca depremler, ateşli hastalıklar ve kaderi üzerine uzun düşüncelerle bölünen bir tekdüzelik içinde geçmiş. Ta ki bir sabah on beş yılı aşkın mutlak bir yalnızlıktan sonra kumda çıplak bir ayak izine rastlayana kadar. Bu keşif aylarca uykusunu kaçırmış. Daha sonra yamyam gruplarının ürkütücü şölenlerini yapmak için ara sıra adanın öbür ucuna çıktığını keşfetmiş ve o günden sonra sürekli tetikte yaşamış.",
 de:"Die Jahre vergingen in einer Eintönigkeit, die nur von Erdbeben, Fiebern und langen Betrachtungen über sein Schicksal unterbrochen wurde. Bis er eines Morgens, nach mehr als fünfzehn Jahren völliger Einsamkeit, auf den Abdruck eines nackten Fußes im Sand stieß. Diese Entdeckung raubte ihm monatelang den Schlaf. Später fand er heraus, dass Gruppen von Kannibalen ab und zu am anderen Ende der Insel landeten, um ihre makabren Festmahle zu halten, und von da an lebte er in ständiger Alarmbereitschaft."},
{es:"Un día presenció cómo uno de los prisioneros lograba escapar y, arriesgando su propia vida, lo ayudó a ponerse a salvo. Lo bautizó Viernes, en recuerdo del día en que se conocieron, y con el tiempo aquel joven se convirtió en su compañero más leal, en su alumno y, en cierto modo, en su maestro. Tras veintiocho años, dos meses y diecinueve días en la isla, la llegada de un barco inglés amotinado le brindó por fin la oportunidad de regresar a Inglaterra, donde descubrió que el mundo había seguido girando sin él.",
 en:"One day he watched one of the prisoners manage to escape and, risking his own life, helped him to safety. He named him Friday, in memory of the day they met, and in time that young man became his most loyal companion, his pupil and, in a way, his teacher. After twenty-eight years, two months and nineteen days on the island, the arrival of a mutinous English ship finally gave him the chance to return to England, where he discovered that the world had kept turning without him.",
 tr:"Bir gün esirlerden birinin kaçmayı başardığına tanık olmuş ve kendi hayatını tehlikeye atarak onun kurtulmasına yardım etmiş. Tanıştıkları günün anısına ona Cuma adını vermiş ve zamanla bu genç adam onun en sadık yol arkadaşı, öğrencisi ve bir bakıma öğretmeni olmuş. Adada geçen yirmi sekiz yıl, iki ay ve on dokuz günün ardından isyan çıkmış bir İngiliz gemisinin gelişi ona sonunda İngiltere'ye dönme fırsatı vermiş; orada dünyanın onsuz dönmeye devam ettiğini görmüş.",
 de:"Eines Tages sah er, wie einem der Gefangenen die Flucht gelang, und half ihm unter Einsatz seines eigenen Lebens, sich in Sicherheit zu bringen. Er nannte ihn Freitag, zur Erinnerung an den Tag, an dem sie sich kennengelernt hatten, und mit der Zeit wurde dieser junge Mann sein treuester Gefährte, sein Schüler und in gewisser Weise sein Lehrer. Nach achtundzwanzig Jahren, zwei Monaten und neunzehn Tagen auf der Insel bot ihm die Ankunft eines meuternden englischen Schiffes endlich die Gelegenheit, nach England zurückzukehren, wo er feststellte, dass sich die Welt ohne ihn weitergedreht hatte."}],

{q:"¿Qué aprendió a hacer en la isla?",en:"What did he learn to do on the island?",tr:"Adada ne yapmayı öğrendi?",de:"Was lernte er auf der Insel?",opts:["Cocer pan y fabricar cestas","Construir barcos","Hablar con los animales"],ex:"«…aprendió a cocer pan y a fabricar cestas…»"},
