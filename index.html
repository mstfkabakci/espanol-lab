{id:"pastor",icon:"🐑",title:"El pastorcito mentiroso",tt:B("The Boy Who Cried Wolf","Yalancı Çoban","Der Hirtenjunge und der Wolf"),src:"Esopo",lv:{
A1:{paras:[
{es:"Pedro es un niño pastor. Cuida ovejas en el campo. Un día está aburrido y grita: «¡El lobo! ¡Viene el lobo!». La gente del pueblo corre a ayudar, pero no hay lobo. Pedro se ríe. Otro día hace lo mismo. Después, un lobo de verdad viene. Pedro grita, pero nadie lo ayuda. Nadie cree a un mentiroso.",
 en:"Pedro is a shepherd boy. He looks after sheep in the countryside. One day he's bored and shouts: “The wolf! The wolf is coming!” The people from the village run to help, but there's no wolf. Pedro laughs. Another day he does the same. Then a real wolf comes. Pedro shouts, but nobody helps him. Nobody believes a liar.",
 tr:"Pedro çoban bir çocuk. Kırda koyun güdüyor. Bir gün canı sıkılıyor ve bağırıyor: «Kurt! Kurt geliyor!» Köydeki insanlar yardıma koşuyor ama ortada kurt yok. Pedro gülüyor. Başka bir gün aynı şeyi yapıyor. Sonra gerçek bir kurt geliyor. Pedro bağırıyor ama kimse ona yardım etmiyor. Kimse bir yalancıya inanmaz.",
 de:"Pedro ist ein Hirtenjunge. Er hütet Schafe auf dem Land. Eines Tages ist ihm langweilig und er ruft: „Der Wolf! Der Wolf kommt!“ Die Leute aus dem Dorf laufen herbei, um zu helfen, aber es gibt keinen Wolf. Pedro lacht. An einem anderen Tag macht er dasselbe. Dann kommt ein echter Wolf. Pedro ruft, aber niemand hilft ihm. Niemand glaubt einem Lügner."}],
vocab:[["el pastor","shepherd","çoban","der Hirte"],["la oveja","sheep","koyun","das Schaf"],["gritar","to shout","bağırmak","rufen, schreien"],["el mentiroso","liar","yalancı","der Lügner"]],
quiz:[
{q:"¿Qué cuida Pedro?",en:"What does Pedro look after?",tr:"Pedro neye bakıyor?",de:"Was hütet Pedro?",opts:["Ovejas","Vacas","Caballos"],ex:"«Cuida ovejas en el campo.»"},
{q:"¿Por qué nadie ayuda a Pedro al final?",en:"Why does nobody help Pedro at the end?",tr:"Sonunda neden kimse Pedro'ya yardım etmiyor?",de:"Warum hilft Pedro am Ende niemand?",opts:["Porque nadie cree a un mentiroso","Porque están dormidos","Porque no oyen nada"],ex:"«Nadie cree a un mentiroso.»"}]},
A2:{paras:[
{es:"Había una vez un pastorcito que cuidaba las ovejas de su pueblo. Pasaba muchas horas solo en la colina y se aburría mucho. Un día pensó en una broma. Empezó a gritar: «¡Socorro! ¡Viene el lobo!». Los vecinos dejaron su trabajo y subieron corriendo con palos. Cuando llegaron, el niño se estaba riendo: no había ningún lobo.",
 en:"Once upon a time there was a little shepherd who looked after his village's sheep. He spent many hours alone on the hill and got very bored. One day he thought of a joke. He began to shout: “Help! The wolf is coming!” The neighbours left their work and ran up with sticks. When they arrived, the boy was laughing: there was no wolf at all.",
 tr:"Bir zamanlar köyünün koyunlarına bakan küçük bir çoban varmış. Tepede saatlerce yalnız kalır ve çok sıkılırmış. Bir gün aklına bir şaka gelmiş. «İmdat! Kurt geliyor!» diye bağırmaya başlamış. Komşular işlerini bırakıp ellerinde sopalarla koşarak tepeye çıkmışlar. Vardıklarında çocuk gülüyormuş: ortada hiç kurt yokmuş.",
 de:"Es war einmal ein kleiner Hirte, der die Schafe seines Dorfes hütete. Er verbrachte viele Stunden allein auf dem Hügel und langweilte sich sehr. Eines Tages dachte er sich einen Streich aus. Er begann zu rufen: „Hilfe! Der Wolf kommt!“ Die Nachbarn ließen ihre Arbeit liegen und rannten mit Stöcken den Hügel hinauf. Als sie ankamen, lachte der Junge: Es gab gar keinen Wolf."},
{es:"Unos días después, repitió la broma y los vecinos volvieron a subir. Esta vez se enfadaron mucho. Una tarde, apareció un lobo de verdad y empezó a atacar a las ovejas. El pastorcito gritó con todas sus fuerzas, pero en el pueblo nadie le hizo caso. «Otra mentira», pensaron. Aquel día el niño perdió muchas ovejas y aprendió una lección: al mentiroso nadie lo cree, aunque diga la verdad.",
 en:"A few days later, he played the joke again and the neighbours went up again. This time they got very angry. One afternoon, a real wolf appeared and started attacking the sheep. The little shepherd shouted with all his might, but nobody in the village paid any attention. “Another lie,” they thought. That day the boy lost many sheep and learned a lesson: nobody believes a liar, even when he tells the truth.",
 tr:"Birkaç gün sonra şakayı tekrarlamış ve komşular yine tepeye çıkmış. Bu sefer çok kızmışlar. Bir akşamüstü gerçek bir kurt çıkagelmiş ve koyunlara saldırmaya başlamış. Küçük çoban var gücüyle bağırmış ama köyde kimse ona aldırmamış. «Yine bir yalan» diye düşünmüşler. O gün çocuk birçok koyununu kaybetmiş ve bir ders almış: yalancıya, doğruyu söylese bile kimse inanmaz.",
 de:"Ein paar Tage später spielte er den Streich noch einmal, und die Nachbarn kamen wieder herauf. Diesmal wurden sie sehr wütend. Eines Nachmittags erschien ein echter Wolf und begann, die Schafe anzugreifen. Der kleine Hirte schrie aus Leibeskräften, aber im Dorf beachtete ihn niemand. „Wieder eine Lüge“, dachten sie. An diesem Tag verlor der Junge viele Schafe und lernte eine Lektion: Einem Lügner glaubt niemand, auch wenn er die Wahrheit sagt."}],
vocab:[["la colina","hill","tepe","der Hügel"],["la broma","joke, prank","şaka","der Streich"],["¡Socorro!","Help!","İmdat!","Hilfe!"],["hacer caso","to pay attention","aldırmak, dikkate almak","beachten"]],
quiz:[
{q:"¿Por qué gastó el pastorcito la broma?",en:"Why did the little shepherd play the joke?",tr:"Küçük çoban neden şaka yaptı?",de:"Warum spielte der kleine Hirte den Streich?",opts:["Porque se aburría mucho","Porque tenía miedo","Porque quería dinero"],ex:"«Pasaba muchas horas solo en la colina y se aburría mucho.»"},
{q:"¿Qué pensaron los vecinos la última vez?",en:"What did the neighbours think the last time?",tr:"Komşular son seferinde ne düşündü?",de:"Was dachten die Nachbarn beim letzten Mal?",opts:["Otra mentira","Hay que ayudarlo","Seguro que es un oso"],ex:"«Otra mentira», pensaron."}]},
B1:{paras:[
{es:"En un pequeño pueblo de montaña, los vecinos confiaban sus ovejas a un muchacho llamado Pedro. Cada mañana las llevaba a pastar a la colina y no regresaba hasta el atardecer. Al principio le gustaba aquel trabajo, pero con el tiempo empezó a parecerle muy aburrido: siempre el mismo prado, las mismas ovejas y el mismo silencio. Los vecinos le habían dicho que, si alguna vez veía un lobo, gritara y ellos acudirían enseguida.",
 en:"In a small mountain village, the neighbours entrusted their sheep to a boy called Pedro. Every morning he took them to graze on the hill and didn't return until dusk. At first he liked the job, but over time it began to seem very boring to him: always the same meadow, the same sheep and the same silence. The neighbours had told him that if he ever saw a wolf, he should shout and they would come straight away.",
 tr:"Küçük bir dağ köyünde komşular koyunlarını Pedro adında bir delikanlıya emanet ediyormuş. Her sabah onları otlatmak için tepeye götürür ve akşam karanlığına kadar dönmezmiş. Başta bu işi seviyormuş ama zamanla çok sıkıcı gelmeye başlamış: hep aynı çayır, aynı koyunlar ve aynı sessizlik. Komşular ona bir gün kurt görürse bağırmasını, kendilerinin de hemen geleceklerini söylemişler.",
 de:"In einem kleinen Bergdorf vertrauten die Nachbarn ihre Schafe einem Jungen namens Pedro an. Jeden Morgen brachte er sie zum Weiden auf den Hügel und kehrte erst in der Abenddämmerung zurück. Anfangs gefiel ihm die Arbeit, doch mit der Zeit kam sie ihm sehr langweilig vor: immer dieselbe Wiese, dieselben Schafe und dieselbe Stille. Die Nachbarn hatten ihm gesagt, er solle rufen, falls er je einen Wolf sehe, dann würden sie sofort kommen."},
{es:"Una tarde, para divertirse un poco, Pedro se puso a gritar: «¡El lobo! ¡El lobo!». Los campesinos dejaron las herramientas y subieron la cuesta a toda prisa, sin aliento. Al llegar, se encontraron al chico tumbado en la hierba, muerto de risa. Se marcharon de muy mal humor. A la semana siguiente, Pedro volvió a hacer lo mismo, y aunque algunos dudaron, todos acabaron subiendo otra vez. Esta vez le advirtieron que no habría una tercera.",
 en:"One afternoon, to have a bit of fun, Pedro began to shout: “The wolf! The wolf!” The farmers dropped their tools and rushed up the slope, out of breath. When they arrived, they found the boy lying on the grass, laughing his head off. They left in a very bad mood. The following week, Pedro did the same thing again, and although some hesitated, they all ended up going up again. This time they warned him there wouldn't be a third time.",
 tr:"Bir akşamüstü biraz eğlenmek için Pedro «Kurt! Kurt!» diye bağırmaya başlamış. Köylüler aletlerini bırakıp soluk soluğa yokuşu koşarak çıkmışlar. Vardıklarında çocuğu çimenlere uzanmış, gülmekten kırılırken bulmuşlar. Çok sinirli bir şekilde oradan ayrılmışlar. Ertesi hafta Pedro aynı şeyi tekrar yapmış ve bazıları tereddüt etse de sonunda hepsi yine yukarı çıkmış. Bu sefer ona üçüncüsünün olmayacağını söyleyerek uyarmışlar.",
 de:"Eines Nachmittags begann Pedro zum Spaß zu rufen: „Der Wolf! Der Wolf!“ Die Bauern ließen ihre Werkzeuge fallen und rannten atemlos den Hang hinauf. Oben fanden sie den Jungen im Gras liegend, der sich vor Lachen kaum halten konnte. Sie gingen sehr verärgert wieder. In der folgenden Woche tat Pedro dasselbe noch einmal, und obwohl einige zögerten, gingen am Ende alle wieder hinauf. Diesmal warnten sie ihn, dass es kein drittes Mal geben würde."},
{es:"Pocos días después, mientras el sol se ponía, un lobo enorme salió del bosque y se lanzó sobre el rebaño. Pedro, aterrorizado, gritó como nunca había gritado: «¡Socorro! ¡Esta vez es verdad!». Abajo, en el pueblo, los vecinos oyeron los gritos, pero ninguno se movió. «Ese chico no aprende», comentaban. Cuando Pedro bajó llorando, ya era tarde. Aquella noche comprendió que la confianza, una vez perdida, es muy difícil de recuperar.",
 en:"A few days later, as the sun was setting, an enormous wolf came out of the forest and threw itself on the flock. Pedro, terrified, shouted as he had never shouted before: “Help! This time it's true!” Down in the village, the neighbours heard the shouts, but none of them moved. “That boy never learns,” they said. When Pedro came down crying, it was already too late. That night he understood that trust, once lost, is very hard to win back.",
 tr:"Birkaç gün sonra güneş batarken ormandan kocaman bir kurt çıkmış ve sürüye saldırmış. Dehşete düşen Pedro hayatında hiç bağırmadığı kadar bağırmış: «İmdat! Bu sefer gerçek!» Aşağıda, köyde komşular bağırışları duymuş ama hiçbiri yerinden kıpırdamamış. «Bu çocuk hiç akıllanmıyor» demişler. Pedro ağlayarak aşağı indiğinde artık çok geçmiş. O gece güvenin bir kez kaybedilince geri kazanmanın çok zor olduğunu anlamış.",
 de:"Wenige Tage später, als die Sonne unterging, kam ein riesiger Wolf aus dem Wald und stürzte sich auf die Herde. Pedro schrie voller Entsetzen, wie er noch nie geschrien hatte: „Hilfe! Diesmal ist es wahr!“ Unten im Dorf hörten die Nachbarn die Schreie, aber keiner rührte sich. „Der Junge lernt es nie“, sagten sie. Als Pedro weinend herunterkam, war es schon zu spät. In jener Nacht verstand er, dass Vertrauen, wenn es einmal verloren ist, nur sehr schwer zurückzugewinnen ist."}],
vocab:[["confiar","to entrust, to trust","emanet etmek, güvenmek","anvertrauen"],["pastar","to graze","otlamak","weiden"],["la cuesta","slope","yokuş","der Hang"],["el rebaño","flock","sürü","die Herde"]],
quiz:[
{q:"¿Qué le habían dicho los vecinos a Pedro?",en:"What had the neighbours told Pedro?",tr:"Komşular Pedro'ya ne söylemişti?",de:"Was hatten die Nachbarn Pedro gesagt?",opts:["Que gritara si veía un lobo","Que no hablara con nadie","Que volviera antes de comer"],ex:"«…si alguna vez veía un lobo, gritara y ellos acudirían enseguida.»"},
{q:"¿Qué le advirtieron los vecinos la segunda vez?",en:"What did the neighbours warn him the second time?",tr:"Komşular ikinci seferde onu ne konuda uyardı?",de:"Wovor warnten ihn die Nachbarn beim zweiten Mal?",opts:["Que no habría una tercera","Que le quitarían las ovejas","Que se lo dirían a su madre"],ex:"«Esta vez le advirtieron que no habría una tercera.»"},
{q:"¿Qué comprendió Pedro al final?",en:"What did Pedro understand at the end?",tr:"Pedro sonunda neyi anladı?",de:"Was verstand Pedro am Ende?",opts:["Que la confianza perdida es difícil de recuperar","Que los lobos solo salen de noche","Que debía cambiar de trabajo"],ex:"«…la confianza, una vez perdida, es muy difícil de recuperar.»"}]},
B2:{paras:[
{es:"Cuenta una de las fábulas más antiguas de Esopo que, en una aldea rodeada de montes, había un muchacho al que le habían encomendado la tarea de vigilar el rebaño del pueblo. Era un trabajo de responsabilidad, pues de aquellas ovejas dependía el sustento de muchas familias, y los vecinos habían acordado una señal muy sencilla: si el lobo asomaba, bastaría con que el chico gritara para que todos acudieran a ayudarlo.",
 en:"One of Aesop's oldest fables tells that, in a village surrounded by mountains, there was a boy who had been entrusted with the task of watching over the village flock. It was a responsible job, since the livelihood of many families depended on those sheep, and the neighbours had agreed on a very simple signal: if the wolf showed up, the boy only had to shout for everyone to come and help him.",
 tr:"Ezop'un en eski fabllarından biri, dağlarla çevrili bir köyde köyün sürüsünü gözetme görevi verilmiş bir delikanlının olduğunu anlatır. Sorumluluk gerektiren bir işmiş, çünkü birçok ailenin geçimi o koyunlara bağlıymış ve komşular çok basit bir işaret üzerinde anlaşmışlar: kurt görünürse çocuğun bağırması herkesin yardımına koşması için yeterli olacakmış.",
 de:"Eine der ältesten Fabeln Äsops erzählt, dass es in einem von Bergen umgebenen Dorf einen Jungen gab, dem man die Aufgabe anvertraut hatte, die Herde des Dorfes zu hüten. Es war eine verantwortungsvolle Arbeit, denn von diesen Schafen hing der Lebensunterhalt vieler Familien ab, und die Nachbarn hatten ein ganz einfaches Zeichen vereinbart: Würde sich der Wolf zeigen, müsste der Junge nur rufen, und alle würden ihm zu Hilfe eilen."},
{es:"Sin embargo, la soledad de las cumbres y la monotonía de los días acabaron haciendo mella en el muchacho. Una tarde, harto de contar nubes, se le ocurrió poner a prueba la promesa de sus vecinos. Se subió a una roca y empezó a gritar desesperadamente que el lobo estaba atacando. En cuestión de minutos, media aldea apareció jadeando, armada con horcas y palos, solo para descubrir que no había peligro alguno y que el pastor se partía de risa a su costa.",
 en:"However, the loneliness of the peaks and the monotony of the days ended up taking their toll on the boy. One afternoon, fed up with counting clouds, he had the idea of putting his neighbours' promise to the test. He climbed onto a rock and began to shout desperately that the wolf was attacking. Within minutes, half the village appeared, panting, armed with pitchforks and sticks, only to discover that there was no danger at all and that the shepherd was splitting his sides laughing at their expense.",
 tr:"Ne var ki doruklardaki yalnızlık ve günlerin tekdüzeliği sonunda delikanlıyı etkilemiş. Bir akşamüstü bulut saymaktan bıkınca komşularının sözünü sınamak aklına gelmiş. Bir kayanın üstüne çıkmış ve kurdun saldırdığını çaresizce haykırmaya başlamış. Birkaç dakika içinde köyün yarısı ellerinde yabalar ve sopalarla soluk soluğa çıkagelmiş, sadece ortada hiçbir tehlike olmadığını ve çobanın onlarla katıla katıla güldüğünü görmek için.",
 de:"Doch die Einsamkeit der Gipfel und die Eintönigkeit der Tage zehrten mit der Zeit an dem Jungen. Eines Nachmittags, als er es leid war, Wolken zu zählen, kam ihm die Idee, das Versprechen seiner Nachbarn auf die Probe zu stellen. Er stieg auf einen Felsen und begann verzweifelt zu rufen, der Wolf greife an. Innerhalb weniger Minuten erschien das halbe Dorf keuchend, bewaffnet mit Heugabeln und Stöcken, nur um festzustellen, dass keinerlei Gefahr bestand und der Hirte sich auf ihre Kosten vor Lachen bog."},
{es:"Los aldeanos regresaron indignados, pero el chico, lejos de arrepentirse, repitió la farsa días después con idéntico resultado. Esta vez, el más anciano del pueblo le advirtió muy serio que con la confianza no se juega, y que quien engaña una vez puede ser perdonado, pero quien engaña dos veces deja de ser escuchado. El muchacho se encogió de hombros: le parecía una exageración propia de viejos.",
 en:"The villagers went back indignant, but the boy, far from regretting it, repeated the farce days later with the same result. This time, the oldest man in the village warned him very seriously that you don't play with trust, and that whoever deceives once can be forgiven, but whoever deceives twice is no longer listened to. The boy shrugged: it seemed to him the kind of exaggeration old people make.",
 tr:"Köylüler öfkeyle geri dönmüş ama çocuk pişman olmak bir yana, günler sonra bu oyunu aynı sonuçla tekrarlamış. Bu kez köyün en yaşlısı onu çok ciddi bir şekilde uyarmış: güvenle oynanmazmış; bir kez kandıran affedilebilirmiş ama iki kez kandıranın sözü artık dinlenmezmiş. Delikanlı omuz silkmiş: ona bu, yaşlılara özgü bir abartı gibi gelmiş.",
 de:"Die Dorfbewohner kehrten empört zurück, doch der Junge, statt es zu bereuen, wiederholte die Posse Tage später mit demselben Ergebnis. Diesmal warnte ihn der älteste Mann des Dorfes sehr ernst, dass man mit Vertrauen nicht spielt: Wer einmal täuscht, dem kann man verzeihen, doch wer zweimal täuscht, dem hört man nicht mehr zu. Der Junge zuckte mit den Schultern: Für ihn klang das nach einer typischen Übertreibung alter Leute."},
{es:"La lección llegó antes de lo que imaginaba. Una tarde de niebla, un lobo enorme y famélico surgió de entre los pinos y cayó sobre el rebaño. El pastor gritó hasta desgañitarse, suplicando que esta vez lo creyeran, pero en la aldea nadie movió un dedo: estaban convencidos de que se trataba de otra de sus bromas. Cuando por fin bajó, pálido y con lágrimas en los ojos, ya no quedaba nada que salvar. De ahí viene la idea de que, en boca del mentiroso, hasta la verdad se vuelve dudosa.",
 en:"The lesson came sooner than he imagined. One foggy afternoon, an enormous, starving wolf emerged from among the pines and fell upon the flock. The shepherd shouted until he was hoarse, begging them to believe him this time, but in the village nobody lifted a finger: they were convinced it was another of his jokes. When he finally came down, pale and with tears in his eyes, there was nothing left to save. That's where the idea comes from that, in the mouth of a liar, even the truth becomes doubtful.",
 tr:"Ders, sandığından daha erken gelmiş. Sisli bir akşamüstü çamların arasından kocaman ve açlıktan gözü dönmüş bir kurt çıkmış ve sürüye saldırmış. Çoban sesi kısılana kadar bağırmış, bu sefer kendisine inanmaları için yalvarmış ama köyde kimse parmağını bile kıpırdatmamış: bunun da şakalarından biri olduğuna inanıyorlarmış. Sonunda yüzü bembeyaz ve gözleri yaşlı aşağı indiğinde kurtarılacak hiçbir şey kalmamış. Yalancının ağzında doğrunun bile şüpheli hale geldiği fikri de buradan gelir.",
 de:"Die Lektion kam früher, als er gedacht hatte. An einem nebligen Nachmittag tauchte zwischen den Kiefern ein riesiger, ausgehungerter Wolf auf und fiel über die Herde her. Der Hirte schrie, bis er heiser war, und flehte, man möge ihm diesmal glauben, aber im Dorf rührte niemand einen Finger: Alle waren überzeugt, dass es wieder einer seiner Scherze war. Als er endlich herunterkam, bleich und mit Tränen in den Augen, war nichts mehr zu retten. Daher kommt der Gedanke, dass im Mund eines Lügners selbst die Wahrheit zweifelhaft wird."}],

/* ================= Progress ================= */
function renderProgress(){
  const d=store.drill;const done=LESSONS.filter(L=>store.lessons[L.id]).length;
  const avg=done?Math.round(LESSONS.reduce((s,L)=>s+(store.lessons[L.id]?.best||0),0)/LESSONS.length*100):0;
  const weak=Object.entries(d.verbErr||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const row=(n,pc,href)=>`<div class="row"><a class="nm" href="${href}">${n}</a><div class="bar"><i style="width:${pc||0}%"></i></div><span class="pc">${pct(pc)}</span></div>`;
  $("#app").innerHTML=`<section class="hero"><h1>${t("progTitle")}</h1><p>${t("progDesc")}</p></section>
  <div class="stats"><div class="card stat"><div class="n">${done}/${LESSONS.length}</div><div class="l">${t("topicsDone")}</div></div><div class="card stat"><div class="n">${pct(avg)}</div><div class="l">${t("avgTenses")}</div></div><div class="card stat"><div class="n">${d.total}</div><div class="l">${t("drillQs")}</div></div><div class="card stat"><div class="n">${d.best}</div><div class="l">${t("bestStreak")}</div></div><a class="card stat" href="#words" style="text-decoration:none;color:inherit"><div class="n">${wordsList().length}</div><div class="l">${t("statsWords")} · ${t("statsKnown",wordsList().filter(w=>w.st&&w.st.box>=3).length)}</div></a></div>
  <div class="sec"><h2>${t("tensesTitle")}</h2><div class="card prog">${LESSONS.map(L=>{const b=store.lessons[L.id];return row(tx(L.title),b?Math.round(b.best*100):null,"#l-"+L.id);}).join("")}</div></div>
  <div class="sec"><h2>${t("secReading")}</h2><div class="card prog">${CLASSICS.flatMap(c=>LV.filter(l=>store.lessons["story-c-"+c.id+"-"+l.toLowerCase()]).map(l=>{const b=store.lessons["story-c-"+c.id+"-"+l.toLowerCase()];return row(esc(c.title)+" · "+l,Math.round(b.best*100),"#c-"+c.id+"-"+l.toLowerCase());})).join("")}${allStories().map(S=>{const b=store.lessons["story-"+S.id];return row(esc(S.title),b?Math.round(b.best*100):null,"#r-"+S.id);}).join("")}</div></div>
  <div class="sec"><h2>${t("secPhrases")}</h2><div class="card prog">${["all",...Object.keys(PHR)].map(c=>{const b=store.phrases[c];return row(catName(c),b?Math.round(b.best*100):null,"#phrases");}).join("")}</div></div>
  <div class="sec"><h2>${t("weakVerbs")}</h2>${weak.length?`<div class="chips">${weak.map(([v,n])=>`<span class="chip">${t("nMistakes",v,n)}</span>`).join("")}</div><p class="muted">${t("weakNote")}</p>`:`<p class="muted">${t("noData")}</p>`}</div>
  <button class="btn ghost" id="reset">${t("reset")}</button>`;
  $("#reset").onclick=()=>{
    $("#modal").innerHTML=`<div class="modal"><div class="card"><h3>${t("sure")}</h3><p class="muted">${t("resetWarn")}</p><div class="btns"><button class="btn" id="yes">${t("yesReset")}</button><button class="btn ghost" id="no">${t("cancel")}</button></div></div></div>`;
    $("#no").onclick=()=>$("#modal").innerHTML="";
    $("#yes").onclick=()=>{store.lessons={};store.phrases={};store.drill={total:0,correct:0,streak:0,best:0,verbErr:{}};save();$("#modal").innerHTML="";renderProgress();};
  };
}

renderHeader();
route();

<div id="installHint" hidden></div>
<script>
/* ===== Installable app (PWA) ===== */
(function(){
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
  }
  const HINT={
    en:"Install on your iPhone: tap Share __S__ and then “Add to Home Screen”.",
    tr:"iPhone'una kur: Paylaş __S__ simgesine dokun, sonra “Ana Ekrana Ekle”yi seç.",
    de:"Auf dem iPhone installieren: Tippe auf Teilen __S__ und dann auf „Zum Home-Bildschirm“."
  };
  const SVG='<svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V1M4.5 4.5 8 1l3.5 3.5"/><path d="M5 7H2.5v9.5h11V7H11"/></svg>';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  let dismissed=false;try{dismissed=localStorage.getItem("el-install-hint")==="off";}catch(e){}
  const box=document.getElementById("installHint");
  document.querySelector("main").before(box);
  function render(){
    if(!isIOS||standalone||dismissed){box.hidden=true;return;}
    box.hidden=false;
    box.innerHTML='<div class="card"><span>📲</span><span>'+(HINT[LANG]||HINT.en).replace("__S__",SVG)+'</span><button class="x" aria-label="close">✕</button></div>';
    box.querySelector(".x").onclick=()=>{dismissed=true;try{localStorage.setItem("el-install-hint","off");}catch(e){}render();};
  }
  render();
  document.getElementById("langSel").addEventListener("change",()=>setTimeout(render,0));
})();
</script>
