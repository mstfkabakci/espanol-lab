{id:"vuelta",icon:"🌍",title:"La vuelta al mundo en 80 días",tt:B("Around the World in 80 Days","Seksen Günde Devr-i Âlem","In 80 Tagen um die Welt"),src:"Julio Verne",lv:{
A1:{paras:[
{es:"Phileas Fogg es un señor inglés muy puntual. Vive en Londres. Un día, en su club, hace una apuesta: «Puedo dar la vuelta al mundo en ochenta días». Viaja con su criado, Picaporte, en tren, en barco y hasta en elefante. Llegan a Londres cinco minutos tarde… ¡o eso creen! Por el cambio de hora, en realidad llegan un día antes. ¡Fogg gana la apuesta!",
 en:"Phileas Fogg is a very punctual English gentleman. He lives in London. One day, at his club, he makes a bet: “I can go around the world in eighty days.” He travels with his servant, Passepartout, by train, by ship and even by elephant. They arrive in London five minutes late… or so they think! Because of the time change, they actually arrive a day early. Fogg wins the bet!",
 tr:"Phileas Fogg çok dakik bir İngiliz beyefendisi. Londra'da yaşıyor. Bir gün kulübünde bir iddiaya giriyor: «Seksen günde dünyayı dolaşabilirim.» Uşağı Passepartout ile trenle, gemiyle, hatta filin sırtında yolculuk ediyor. Londra'ya beş dakika geç varıyorlar… ya da öyle sanıyorlar! Saat farkı yüzünden aslında bir gün erken varıyorlar. Fogg iddiayı kazanıyor!",
 de:"Phileas Fogg ist ein sehr pünktlicher englischer Herr. Er wohnt in London. Eines Tages schließt er in seinem Club eine Wette ab: „Ich kann in achtzig Tagen um die Welt reisen.“ Er reist mit seinem Diener Passepartout mit dem Zug, mit dem Schiff und sogar auf einem Elefanten. Sie kommen fünf Minuten zu spät in London an … oder das glauben sie! Wegen der Zeitverschiebung kommen sie in Wirklichkeit einen Tag früher an. Fogg gewinnt die Wette!"}],
vocab:[["puntual","punctual","dakik","pünktlich"],["la apuesta","bet","iddia, bahis","die Wette"],["dar la vuelta al mundo","to go around the world","dünyayı dolaşmak","um die Welt reisen"],["llegar tarde","to arrive late","geç kalmak","zu spät kommen"]],
quiz:[
{q:"¿Dónde vive Phileas Fogg?",en:"Where does Phileas Fogg live?",tr:"Phileas Fogg nerede yaşıyor?",de:"Wo wohnt Phileas Fogg?",opts:["En Londres","En París","En Nueva York"],ex:"«Vive en Londres.»"},
{q:"¿En qué animal viajan?",en:"What animal do they travel on?",tr:"Hangi hayvanın sırtında yolculuk ediyorlar?",de:"Auf welchem Tier reisen sie?",opts:["En elefante","En camello","En caballo"],ex:"«…en tren, en barco y hasta en elefante.»"}]},
A2:{paras:[
{es:"En 1872 vivía en Londres un caballero llamado Phileas Fogg. Era tan puntual que hacía lo mismo cada día a la misma hora. Una tarde, en su club, unos amigos leyeron en el periódico que ya era posible dar la vuelta al mundo en ochenta días. Fogg apostó veinte mil libras a que él podía hacerlo. Esa misma noche salió de Londres con su nuevo criado francés, Picaporte.",
 en:"In 1872 a gentleman called Phileas Fogg lived in London. He was so punctual that he did the same thing every day at the same time. One afternoon, at his club, some friends read in the newspaper that it was now possible to go around the world in eighty days. Fogg bet twenty thousand pounds that he could do it. That same night he left London with his new French servant, Passepartout.",
 tr:"1872'de Londra'da Phileas Fogg adında bir beyefendi yaşarmış. O kadar dakikmiş ki her gün aynı saatte aynı şeyi yaparmış. Bir öğleden sonra kulübünde birkaç arkadaşı gazetede artık seksen günde dünyayı dolaşmanın mümkün olduğunu okumuş. Fogg bunu yapabileceğine dair yirmi bin sterline iddiaya girmiş. Aynı gece yeni Fransız uşağı Passepartout ile Londra'dan yola çıkmış.",
 de:"Im Jahr 1872 lebte in London ein Gentleman namens Phileas Fogg. Er war so pünktlich, dass er jeden Tag zur selben Zeit dasselbe tat. Eines Nachmittags lasen einige Freunde in seinem Club in der Zeitung, dass man nun in achtzig Tagen um die Welt reisen könne. Fogg wettete zwanzigtausend Pfund, dass er es schaffen würde. Noch in derselben Nacht verließ er London mit seinem neuen französischen Diener Passepartout."},
{es:"Viajaron en tren y en barco por Egipto, la India, China, Japón y Estados Unidos. En la India, como no había tren, cruzaron la selva en elefante y salvaron a una joven llamada Aouda, que después se casó con Fogg. Además, un detective, Fix, los seguía porque pensaba que Fogg era un ladrón de bancos. Cuando llegaron a Londres, creyeron que habían perdido la apuesta por cinco minutos. Pero, al viajar hacia el este, habían ganado un día. ¡Llegaron a tiempo!",
 en:"They travelled by train and by ship through Egypt, India, China, Japan and the United States. In India, as there was no train, they crossed the jungle on an elephant and saved a young woman called Aouda, who later married Fogg. In addition, a detective, Fix, was following them because he thought Fogg was a bank robber. When they got to London, they thought they had lost the bet by five minutes. But, by travelling east, they had gained a day. They had arrived in time!",
 tr:"Trenle ve gemiyle Mısır, Hindistan, Çin, Japonya ve Amerika Birleşik Devletleri'nden geçmişler. Hindistan'da tren olmadığı için ormanı filin sırtında geçmişler ve sonradan Fogg'la evlenen Aouda adında genç bir kadını kurtarmışlar. Ayrıca Fix adında bir dedektif, Fogg'un bir banka soyguncusu olduğunu düşündüğü için onları takip ediyormuş. Londra'ya vardıklarında iddiayı beş dakikayla kaybettiklerini sanmışlar. Ama doğuya doğru yolculuk ettikleri için bir gün kazanmışlar. Zamanında varmışlar!",
 de:"Sie reisten mit Zug und Schiff durch Ägypten, Indien, China, Japan und die Vereinigten Staaten. In Indien durchquerten sie den Dschungel auf einem Elefanten, weil es keinen Zug gab, und retteten eine junge Frau namens Aouda, die später Fogg heiratete. Außerdem verfolgte sie ein Detektiv namens Fix, weil er glaubte, Fogg sei ein Bankräuber. Als sie in London ankamen, dachten sie, sie hätten die Wette um fünf Minuten verloren. Aber weil sie nach Osten gereist waren, hatten sie einen Tag gewonnen. Sie waren rechtzeitig angekommen!"}],

quiz:[
{q:"¿Cuánto dinero apostó Fogg?",en:"How much money did Fogg bet?",tr:"Fogg ne kadar paraya iddiaya girdi?",de:"Wie viel Geld wettete Fogg?",opts:["Veinte mil libras","Ochenta libras","Mil libras"],ex:"«Fogg apostó veinte mil libras a que él podía hacerlo.»"},
{q:"¿Por qué los seguía Fix?",en:"Why was Fix following them?",tr:"Fix onları neden takip ediyordu?",de:"Warum verfolgte Fix sie?",opts:["Pensaba que Fogg era un ladrón de bancos","Era amigo de Fogg","Quería ir a la India"],ex:"«…un detective, Fix, los seguía porque pensaba que Fogg era un ladrón de bancos.»"}]},
B1:{paras:[
{es:"Phileas Fogg era un caballero inglés rico, misterioso y extremadamente metódico. Vivía solo en Londres, comía siempre en el Reform Club y medía cada uno de sus pasos con una precisión matemática. El 2 de octubre de 1872, mientras jugaba a las cartas, sus compañeros comentaron un artículo según el cual ya se podía dar la vuelta al mundo en ochenta días. Fogg no solo dijo que era posible, sino que apostó la mitad de su fortuna a que lo conseguiría.",
 en:"Phileas Fogg was a rich, mysterious and extremely methodical English gentleman. He lived alone in London, always ate at the Reform Club and measured every one of his steps with mathematical precision. On 2 October 1872, while he was playing cards, his companions discussed an article according to which it was now possible to go around the world in eighty days. Fogg not only said it was possible, but bet half his fortune that he would manage it.",
 tr:"Phileas Fogg zengin, gizemli ve son derece düzenli bir İngiliz beyefendisiymiş. Londra'da yalnız yaşar, yemeklerini hep Reform Kulübü'nde yer ve her adımını matematiksel bir kesinlikle ölçermiş. 2 Ekim 1872'de kâğıt oynarken arkadaşları, artık seksen günde dünyayı dolaşmanın mümkün olduğunu söyleyen bir makaleyi tartışmışlar. Fogg bunun mümkün olduğunu söylemekle kalmamış, başaracağına dair servetinin yarısıyla iddiaya girmiş.",
 de:"Phileas Fogg war ein reicher, geheimnisvoller und äußerst methodischer englischer Gentleman. Er lebte allein in London, aß immer im Reform Club und bemaß jeden seiner Schritte mit mathematischer Genauigkeit. Am 2. Oktober 1872 sprachen seine Mitspieler beim Kartenspiel über einen Artikel, nach dem man nun in achtzig Tagen um die Welt reisen könne. Fogg sagte nicht nur, dass es möglich sei, sondern wettete die Hälfte seines Vermögens darauf, dass er es schaffen würde."},
{es:"Esa misma noche partió con Picaporte, su criado francés, y una bolsa llena de billetes. Lo que no sabían era que el detective Fix los seguía, convencido de que Fogg era el ladrón que acababa de robar el Banco de Inglaterra. En la India descubrieron que la vía del tren no estaba terminada, así que compraron un elefante para atravesar la selva. Por el camino rescataron a Aouda, una joven viuda a la que iban a sacrificar, y ella decidió continuar el viaje con ellos.",
 en:"That same night he set off with Passepartout, his French servant, and a bag full of banknotes. What they didn't know was that Detective Fix was following them, convinced that Fogg was the thief who had just robbed the Bank of England. In India they discovered that the railway line wasn't finished, so they bought an elephant to cross the jungle. On the way they rescued Aouda, a young widow who was about to be sacrificed, and she decided to continue the journey with them.",
 tr:"Aynı gece Fransız uşağı Passepartout ve banknot dolu bir çantayla yola çıkmış. Bilmedikleri şey, Fogg'un İngiltere Bankası'nı az önce soyan hırsız olduğuna inanan Dedektif Fix'in onları takip ettiğiymiş. Hindistan'da demiryolunun bitmediğini öğrenmişler, bu yüzden ormanı geçmek için bir fil satın almışlar. Yolda kurban edilmek üzere olan genç ve dul bir kadın olan Aouda'yı kurtarmışlar; o da yolculuğa onlarla devam etmeye karar vermiş.",
 de:"Noch in derselben Nacht brach er mit Passepartout, seinem französischen Diener, und einer Tasche voller Banknoten auf. Was sie nicht wussten: Detektiv Fix folgte ihnen, überzeugt, dass Fogg der Dieb war, der gerade die Bank von England ausgeraubt hatte. In Indien stellten sie fest, dass die Bahnlinie nicht fertig war, also kauften sie einen Elefanten, um den Dschungel zu durchqueren. Unterwegs retteten sie Aouda, eine junge Witwe, die geopfert werden sollte, und sie beschloss, die Reise mit ihnen fortzusetzen."},
{es:"Tras cruzar el Pacífico y Estados Unidos, y después de que Fix lo arrestara por error en Liverpool, Fogg llegó a Londres con cinco minutos de retraso. Creyéndose arruinado, se encerró en casa, y fue entonces cuando Aouda le confesó su amor. Al día siguiente, Picaporte descubrió que era sábado, no domingo: al viajar siempre hacia el este, habían ganado un día entero. Fogg corrió al club y entró justo cuando el reloj marcaba la hora límite. Había ganado la apuesta y, sobre todo, una esposa.",
 en:"After crossing the Pacific and the United States, and after Fix arrested him by mistake in Liverpool, Fogg arrived in London five minutes late. Believing himself ruined, he shut himself up at home, and it was then that Aouda confessed her love to him. The next day, Passepartout discovered that it was Saturday, not Sunday: by always travelling east, they had gained a whole day. Fogg rushed to the club and walked in just as the clock struck the deadline. He had won the bet and, above all, a wife.",
 tr:"Pasifik'i ve Amerika Birleşik Devletleri'ni geçtikten ve Fix onu Liverpool'da yanlışlıkla tutukladıktan sonra Fogg Londra'ya beş dakika gecikmeyle varmış. Mahvolduğunu düşünerek evine kapanmış ve işte o zaman Aouda ona aşkını itiraf etmiş. Ertesi gün Passepartout günlerden pazar değil cumartesi olduğunu fark etmiş: hep doğuya doğru yolculuk ettikleri için koca bir gün kazanmışlar. Fogg kulübe koşmuş ve saat tam son dakikayı gösterirken içeri girmiş. İddiayı ve her şeyden önemlisi bir eşi kazanmış.",
 de:"Nachdem er den Pazifik und die Vereinigten Staaten durchquert hatte und Fix ihn in Liverpool irrtümlich verhaftet hatte, kam Fogg mit fünf Minuten Verspätung in London an. Weil er sich für ruiniert hielt, schloss er sich zu Hause ein, und da gestand ihm Aouda ihre Liebe. Am nächsten Tag entdeckte Passepartout, dass Samstag war und nicht Sonntag: Weil sie immer nach Osten gereist waren, hatten sie einen ganzen Tag gewonnen. Fogg eilte in den Club und trat genau in dem Moment ein, als die Uhr die Frist anzeigte. Er hatte die Wette gewonnen und vor allem eine Ehefrau."}],

{q:"¿Qué descubrió Picaporte al día siguiente?",en:"What did Passepartout discover the next day?",tr:"Passepartout ertesi gün neyi fark etti?",de:"Was entdeckte Passepartout am nächsten Tag?",opts:["Que era sábado, no domingo","Que Fix era el ladrón","Que el club estaba cerrado"],ex:"«…Picaporte descubrió que era sábado, no domingo…»"}]},
B2:{paras:[
{es:"En 1872, el número 7 de Saville Row, en Londres, lo ocupaba Phileas Fogg, un caballero tan enigmático como acaudalado del que nadie conocía el origen de su fortuna. Su existencia transcurría con la regularidad de un cronómetro: se levantaba, desayunaba y llegaba al Reform Club siempre a la misma hora, y había despedido a su anterior criado por traerle el agua de afeitar dos grados más fría de lo debido. Su nuevo sirviente, un francés llamado Picaporte, celebró haber encontrado por fin un amo tranquilo. No sabía lo equivocado que estaba.",
 en:"In 1872, number 7 Savile Row, in London, was occupied by Phileas Fogg, a gentleman as enigmatic as he was wealthy, whose fortune nobody knew the origin of. His existence ran with the regularity of a chronometer: he got up, had breakfast and arrived at the Reform Club always at the same time, and he had dismissed his previous servant for bringing him his shaving water two degrees colder than it should have been. His new servant, a Frenchman called Passepartout, was delighted to have finally found a quiet master. He didn't know how wrong he was.",
 tr:"1872'de Londra'daki Savile Row 7 numarada, servetinin kaynağını kimsenin bilmediği, varlıklı olduğu kadar esrarengiz de bir beyefendi olan Phileas Fogg oturuyormuş. Hayatı bir kronometrenin düzenliliğiyle akıp gidiyormuş: her gün aynı saatte kalkar, kahvaltı eder ve Reform Kulübü'ne varırmış; önceki uşağını da tıraş suyunu olması gerekenden iki derece soğuk getirdiği için kovmuş. Passepartout adında bir Fransız olan yeni uşağı sonunda sakin bir efendi bulduğuna sevinmiş. Ne kadar yanıldığını bilmiyormuş.",
 de:"Im Jahr 1872 bewohnte Phileas Fogg das Haus Nummer 7 in der Savile Row in London, ein ebenso rätselhafter wie wohlhabender Gentleman, dessen Vermögen niemand zu erklären wusste. Sein Leben lief mit der Regelmäßigkeit eines Chronometers ab: Er stand auf, frühstückte und kam immer zur selben Zeit im Reform Club an, und seinen früheren Diener hatte er entlassen, weil dieser ihm das Rasierwasser zwei Grad kälter als vorgeschrieben gebracht hatte. Sein neuer Diener, ein Franzose namens Passepartout, freute sich, endlich einen ruhigen Herrn gefunden zu haben. Er ahnte nicht, wie sehr er sich irrte."},
{es:"Aquella misma tarde, en una partida de whist, la conversación giró en torno a un audaz robo al Banco de Inglaterra y a la posibilidad de que el ladrón escapara al extranjero, puesto que, según un periódico, ya podía darse la vuelta al mundo en ochenta días. Ante el escepticismo de sus compañeros, Fogg apostó veinte mil libras, la mitad de su patrimonio, a que él lo lograría, y fijó la hora de su regreso: las ocho y cuarenta y cinco del 21 de diciembre. A las ocho y cuarto de esa misma noche, ya estaba en el tren hacia Dover.",
 en:"That same afternoon, over a game of whist, the conversation turned to a daring robbery at the Bank of England and the possibility that the thief might escape abroad, since, according to a newspaper, it was now possible to go around the world in eighty days. In the face of his companions' scepticism, Fogg bet twenty thousand pounds, half his wealth, that he would do it, and set the time of his return: a quarter to nine on 21 December. At a quarter past eight that very evening, he was already on the train to Dover.",
 tr:"Aynı öğleden sonra bir whist oyunu sırasında sohbet İngiltere Bankası'na yapılan cüretkâr bir soyguna ve bir gazeteye göre artık seksen günde dünyayı dolaşmak mümkün olduğundan hırsızın yurt dışına kaçabileceğine gelmiş. Arkadaşlarının kuşkuculuğu karşısında Fogg, servetinin yarısı olan yirmi bin sterline bunu başaracağına dair iddiaya girmiş ve dönüş saatini belirlemiş: 21 Aralık, saat dokuza çeyrek var. Aynı akşam saat sekizi çeyrek geçe çoktan Dover trenindeymiş.",
 de:"Noch am selben Nachmittag drehte sich das Gespräch bei einer Partie Whist um einen dreisten Raub bei der Bank von England und die Möglichkeit, dass der Dieb ins Ausland entkommen könnte, denn laut einer Zeitung konnte man nun in achtzig Tagen um die Welt reisen. Angesichts der Skepsis seiner Mitspieler wettete Fogg zwanzigtausend Pfund, die Hälfte seines Vermögens, dass er es schaffen würde, und legte die Stunde seiner Rückkehr fest: Viertel vor neun am 21. Dezember. Um Viertel nach acht am selben Abend saß er bereits im Zug nach Dover."},
{es:"La travesía puso a prueba su legendaria flema. El inspector Fix, convencido de que aquel viajero excéntrico era el ladrón del banco, le pisó los talones de continente en continente a la espera de una orden de arresto. En la India, al descubrir que el ferrocarril se interrumpía en mitad de la selva, Fogg compró un elefante a precio de oro y, en el camino, rescató a la joven Aouda de una muerte segura. Después vinieron tifones, barcos perdidos, un ataque en las praderas de Norteamérica y una travesía del Atlántico en la que tuvo que quemar el propio barco como combustible.",
 en:"The journey put his legendary composure to the test. Inspector Fix, convinced that this eccentric traveller was the bank robber, followed hot on his heels from continent to continent, waiting for an arrest warrant. In India, on discovering that the railway stopped in the middle of the jungle, Fogg bought an elephant at an exorbitant price and, along the way, rescued young Aouda from certain death. Then came typhoons, missed ships, an attack on the North American prairies and an Atlantic crossing in which he had to burn the ship itself as fuel.",
 tr:"Yolculuk onun efsanevi soğukkanlılığını sınamış. Bu eksantrik yolcunun banka hırsızı olduğuna inanan Müfettiş Fix, bir tutuklama emri bekleyerek kıtadan kıtaya onun peşini bırakmamış. Hindistan'da demiryolunun ormanın ortasında kesildiğini öğrenen Fogg, altın değerinde bir fiyata bir fil satın almış ve yolda genç Aouda'yı kesin bir ölümden kurtarmış. Ardından tayfunlar, kaçırılan gemiler, Kuzey Amerika çayırlarında bir saldırı ve geminin kendisini yakıt olarak yakmak zorunda kaldığı bir Atlantik geçişi gelmiş.",
 de:"Die Reise stellte seinen legendären Gleichmut auf die Probe. Inspektor Fix, überzeugt, dass dieser exzentrische Reisende der Bankräuber sei, heftete sich von Kontinent zu Kontinent an seine Fersen und wartete auf einen Haftbefehl. Als Fogg in Indien entdeckte, dass die Eisenbahn mitten im Dschungel endete, kaufte er einen Elefanten für ein Vermögen und rettete unterwegs die junge Aouda vor dem sicheren Tod. Dann folgten Taifune, verpasste Schiffe, ein Überfall in der nordamerikanischen Prärie und eine Atlantiküberquerung, bei der er das Schiff selbst als Brennstoff verfeuern musste."},
{es:"Cuando por fin pisó suelo británico, Fix lo detuvo por error, y aquel contratiempo le hizo llegar a Londres con cinco minutos de retraso. Arruinado, se recluyó en su casa, donde Aouda le ofreció su mano. Al ir a avisar al reverendo para la boda, Picaporte descubrió, atónito, que era sábado y no domingo: viajando hacia el este, habían ganado cuatro minutos por cada grado de longitud, es decir, un día entero. Fogg irrumpió en el club justo cuando el reloj marcaba las ocho y cuarenta y cinco. Había ganado.",
 en:"When he finally set foot on British soil, Fix arrested him by mistake, and that setback made him arrive in London five minutes late. Ruined, he shut himself away at home, where Aouda offered him her hand. Going to tell the reverend about the wedding, Passepartout discovered, astonished, that it was Saturday and not Sunday: travelling east, they had gained four minutes for every degree of longitude, that is, a whole day. Fogg burst into the club just as the clock showed a quarter to nine. He had won.",
 tr:"Sonunda İngiliz topraklarına ayak bastığında Fix onu yanlışlıkla tutuklamış ve bu aksilik onun Londra'ya beş dakika gecikmeyle varmasına yol açmış. Mahvolmuş halde evine kapanmış; orada Aouda ona evlenme teklif etmiş. Düğün için papazı haberdar etmeye giden Passepartout, hayretle günlerden pazar değil cumartesi olduğunu fark etmiş: doğuya doğru yolculuk ederken her boylam derecesi için dört dakika, yani koca bir gün kazanmışlar. Fogg saat tam dokuza çeyrek kala kulübe dalmış. Kazanmış.",
 de:"Als er endlich britischen Boden betrat, verhaftete ihn Fix irrtümlich, und dieser Zwischenfall ließ ihn mit fünf Minuten Verspätung in London ankommen. Ruiniert zog er sich in sein Haus zurück, wo Aouda ihm ihre Hand anbot. Als Passepartout den Pfarrer wegen der Hochzeit benachrichtigen wollte, stellte er verblüfft fest, dass Samstag war und nicht Sonntag: Auf ihrer Reise nach Osten hatten sie pro Längengrad vier Minuten gewonnen, also einen ganzen Tag. Fogg stürmte genau in dem Moment in den Club, als die Uhr Viertel vor neun zeigte. Er hatte gewonnen."}],

  const list=esVoices().slice().sort((a,b)=>rankV(b)-rankV(a));
  if(!list.length&&!voices.length&&(tries||0)<6){box.innerHTML=`<p class="muted" style="margin:0">${t("voiceWait")}</p>`;setTimeout(()=>renderVoiceBox((tries||0)+1),500);return;}
  const cur=pickEs();
  box.innerHTML=list.length?`<div>${t("voiceCur")} <span class="vcur">${esc(cur.name)} · ${esc(vlang(cur))}</span></div>
   <label class="muted" style="display:block;margin-top:10px;font-size:13.5px">${t("voicePick")}</label>
   <select id="vsel"><option value="">${t("voiceAuto")}</option>${list.map(v=>`<option value="${esc(v.voiceURI||v.name)}" ${store.settings.voice&&(store.settings.voice===v.voiceURI||store.settings.voice===v.name)?"selected":""}>${esc(v.name)} · ${esc(vlang(v))}</option>`).join("")}</select>
   <button class="btn" id="vtest">${t("voiceTest")}</button>
   <div id="vstat" style="margin-top:10px;font-size:14px;min-height:1.2em"></div>
   ${isIOS()?`<p style="font-size:14px;margin:12px 0 0">${t("voiceSilentIOS")}</p>`:""}
   <p class="muted" style="font-size:13px;margin:12px 0 0">${platformHelp()}</p>`
  :`<p style="margin:0 0 8px">${t("voiceNone")}</p>${voices.length?`<p class="muted" style="font-size:13px;margin:0 0 8px">${t("voiceDiag",voices.length,esc(voices.slice(0,6).map(v=>v.name).join(", "))+(voices.length>6?"…":""))}</p>`:""}<p style="font-size:14.5px;margin:0">${platformHelp()}</p>`;
  const test=()=>speak(T.en.voiceSample,(state,v,info)=>{const el=$("#vstat");if(!el)return;el.textContent=state==="start"?t("vsStart")+(v?" ("+v.name+")":""):state==="end"?t("vsEnd"):state==="retry"?t("vsRetry",v?v.name:"?"):state==="fail"?t("vsFail"):t("vsErr",info||"?");});
  const sel=$("#vsel");if(sel)sel.onchange=()=>{store.settings.voice=sel.value||null;if(sel.value)badV.delete(sel.value);save();renderVoiceBox();test();};
  const tb=$("#vtest");if(tb)tb.onclick=test;
}

function deepBlock(b){

    case "pairs":return b.items.map(p=>`<div class="pair"><div class="pgrid"><div>${deepEx(p.a)}</div><div>${deepEx(p.b)}</div></div><div class="why">→ ${tx(p.why)}</div></div>`).join("");
    case "groups":return b.groups.map(g=>`<div class="dgroup"><div class="ghead"><span class="${g.cls||""}">${g.tag||""}</span> ${tx(g.h)}</div>${g.ex.map(deepEx).join("")}</div>`).join("");

    case "story":return `<div class="legend">${b.legend.map(([k,l])=>`<span class="${HI[k]}">${tx(l)}</span>`).join("")}</div>

  }

}

L_("contraste").deep=[
{k:"text",t:B("How it maps to English","Türkçeyle eşleştir","So entspricht es dem Deutschen"),body:B(
"<p>English uses one past tense where Spanish needs two. So don't look at the English form: ask <b>what the verb is doing in the story</b>.</p><table class='dt'><tr><th>English</th><th>Spanish</th><th>Example</th></tr><tr><td>was / were + -ing</td><td class='hi-i'>imperfecto</td><td>It was raining → <i>Llovía</i></td></tr><tr><td>used to / would (habit)</td><td class='hi-i'>imperfecto</td><td>I used to swim → <i>Nadaba</i></td></tr><tr><td>simple past: an event</td><td class='hi-d'>indefinido</td><td>She called yesterday → <i>Llamó ayer</i></td></tr><tr><td>simple past: a state or description</td><td class='hi-i'>imperfecto</td><td>I was tired → <i>Estaba cansado</i></td></tr><tr><td>simple past with a clear limit</td><td class='hi-d'>indefinido</td><td>I worked there for 3 years → <i>Trabajé allí tres años</i></td></tr></table>",
"<p>Türkçedeki <b>-dı</b> eki iki İspanyolca zamana da karşılık gelebilir. O yüzden ekin şekline değil, <b>fiilin hikâyedeki görevine</b> bak.</p><table class='dt'><tr><th>Türkçe</th><th>İspanyolca</th><th>Örnek</th></tr><tr><td>-ıyordu (o sırada sürüyordu)</td><td class='hi-i'>imperfecto</td><td>Yağmur yağıyordu → <i>Llovía</i></td></tr><tr><td>-ırdı (eskiden, alışkanlık)</td><td class='hi-i'>imperfecto</td><td>Eskiden yüzerdim → <i>Antes nadaba</i></td></tr><tr><td>-dı (bir olay oldu, bitti)</td><td class='hi-d'>indefinido</td><td>Dün aradı → <i>Ayer llamó</i></td></tr><tr><td>-dı (durum, betimleme)</td><td class='hi-i'>imperfecto</td><td>Yorgundum → <i>Estaba cansado</i></td></tr><tr><td>-dı (süresi belli, sınırlı)</td><td class='hi-d'>indefinido</td><td>Orada üç yıl çalıştım → <i>Trabajé allí tres años</i></td></tr></table><p>Yani <i>“Hava güzeldi”</i>, <i>“On yaşındaydım”</i>, <i>“Çok yorgundum”</i> gibi cümleler Türkçede -dı ile bitse de İspanyolcada <b>imperfecto</b> olur: bunlar olay değil, sahnenin dekoru.</p>",
"<p>Im Deutschen machen Präteritum und Perfekt diesen Unterschied nicht: <i>ich arbeitete</i> kann beides sein. Frag deshalb, <b>welche Rolle das Verb in der Geschichte spielt</b>.</p><table class='dt'><tr><th>Deutsch</th><th>Spanisch</th><th>Beispiel</th></tr><tr><td>war gerade dabei / lief gerade</td><td class='hi-i'>imperfecto</td><td>Es regnete (gerade) → <i>Llovía</i></td></tr><tr><td>früher immer (Gewohnheit)</td><td class='hi-i'>imperfecto</td><td>Früher schwamm ich oft → <i>Antes nadaba mucho</i></td></tr><tr><td>ein Ereignis</td><td class='hi-d'>indefinido</td><td>Sie rief gestern an → <i>Llamó ayer</i></td></tr><tr><td>Zustand, Beschreibung</td><td class='hi-i'>imperfecto</td><td>Ich war müde → <i>Estaba cansado</i></td></tr><tr><td>klar begrenzte Dauer</td><td class='hi-d'>indefinido</td><td>Ich arbeitete drei Jahre dort → <i>Trabajé allí tres años</i></td></tr></table>")},
{k:"text",t:B("Decide in 4 questions","4 soruda karar ver","In 4 Fragen entscheiden"),body:B(
"<ol class='steps'><li><b>Did something happen and finish?</b> A single event, an action that moves the story forward → <b>indefinido</b>.</li><li><b>Is it the background?</b> Time, age, weather, feelings, what people or places were like, what was going on → <b>imperfecto</b>.</li><li><b>Is it a past habit?</b> “used to”, every day, always → <b>imperfecto</b>. But if you <b>count</b> the times (three times, twice) → <b>indefinido</b>.</li><li><b>Does it have a clear limit?</b> two hours, all night, from 2021 to 2025 → <b>indefinido</b>, even if it lasted a long time.</li></ol>",
"<ol class='steps'><li><b>Bir şey oldu ve bitti mi?</b> Tek bir olay, hikâyeyi ilerleten bir eylem → <b>indefinido</b>.</li><li><b>Sahnenin arka planı mı?</b> Saat, yaş, hava, duygular, insanların ya da yerlerin nasıl olduğu, o sırada ne olduğu → <b>imperfecto</b>.</li><li><b>Geçmişte bir alışkanlık mı?</b> “Eskiden”, “her gün”, “hep” → <b>imperfecto</b>. Ama kaç kez olduğunu <b>sayıyorsan</b> (üç kez, iki defa) → <b>indefinido</b>.</li><li><b>Süresinin net bir sınırı var mı?</b> İki saat, bütün gece, 2021'den 2025'e kadar → uzun sürmüş olsa bile <b>indefinido</b>.</li></ol>",
"<ol class='steps'><li><b>Ist etwas passiert und abgeschlossen?</b> Ein einzelnes Ereignis, eine Handlung, die die Geschichte voranbringt → <b>indefinido</b>.</li><li><b>Ist es der Hintergrund?</b> Uhrzeit, Alter, Wetter, Gefühle, wie Menschen oder Orte waren, was gerade los war → <b>imperfecto</b>.</li><li><b>Ist es eine frühere Gewohnheit?</b> früher, jeden Tag, immer → <b>imperfecto</b>. Wenn du aber <b>zählst</b> (dreimal, zweimal) → <b>indefinido</b>.</li><li><b>Hat es eine klare Grenze?</b> zwei Stunden, die ganze Nacht, von 2021 bis 2025 → <b>indefinido</b>, auch wenn es lange gedauert hat.</li></ol>"),

/* ================= Perfecto vs indefinido ================= */
L_("perfecto").deep=[
{k:"text",t:B("The golden rule: is the time frame over?","Altın kural: zaman dilimi bitti mi?","Die goldene Regel: Ist der Zeitraum vorbei?"),body:B(
"<p>In Spain the choice doesn't depend on how long ago something happened, but on the <b>time frame you put it in</b>:</p><ul><li>Frame still open (today, this week, this year, in my life) → <b class='hi-p'>perfecto</b>: <i>Este año he viajado mucho.</i></li><li>Frame already closed (yesterday, last week, in 2020) → <b class='hi-d'>indefinido</b>: <i>El año pasado viajé mucho.</i></li></ul><p>Anything that happened <b>earlier today</b> counts as “today”, so in Spain you say <i>Hace un rato he hablado con él</i> (I spoke to him a little while ago). Two days ago is no longer today: <i>Hace dos días hablé con él.</i></p><p>English only helps partly: <i>I've finished</i> = <i>He terminado</i>, but <i>I had lunch at two</i> (today) is also <i>He comido a las dos</i> in Spain.</p>",
"<p>İspanya'da seçimi olayın ne kadar önce olduğu değil, onu <b>hangi zaman dilimine koyduğun</b> belirler:</p><ul><li>Zaman dilimi hâlâ açık (bugün, bu hafta, bu yıl, hayatım boyunca) → <b class='hi-p'>perfecto</b>: <i>Este año he viajado mucho.</i> (Bu yıl çok seyahat ettim.)</li><li>Zaman dilimi kapanmış (dün, geçen hafta, 2020'de) → <b class='hi-d'>indefinido</b>: <i>El año pasado viajé mucho.</i> (Geçen yıl çok seyahat ettim.)</li></ul><p>Türkçede ikisi de <b>-dı</b> ile söyleniyor, o yüzden kendine şunu sor: <b>“Bu olay bugünün / bu haftanın içinde mi?”</b> Bugün daha erken olan şeyler de “bugün” sayılır; bu yüzden İspanya'da <i>Hace un rato he hablado con él</i> (Az önce onunla konuştum) denir. İki gün önce artık bugün değildir: <i>Hace dos días hablé con él.</i></p><p>Türkçedeki <b>-mış</b> (duyulan geçmiş) için ayrı bir zaman yok; <i>dicen que…</i> ya da <i>parece que…</i> ile söylenir: <i>Dicen que ha llovido mucho en Ankara.</i> (Ankara'ya çok yağmur yağmış.)</p>",
"<p>In Spanien hängt die Wahl nicht davon ab, wie lange etwas her ist, sondern davon, <b>in welchen Zeitraum du es einordnest</b>:</p><ul><li>Zeitraum noch offen (heute, diese Woche, dieses Jahr, im Leben) → <b class='hi-p'>perfecto</b>: <i>Este año he viajado mucho.</i></li><li>Zeitraum abgeschlossen (gestern, letzte Woche, 2020) → <b class='hi-d'>indefinido</b>: <i>El año pasado viajé mucho.</i></li></ul><p>Das Deutsche hilft hier kaum: Man sagt <i>Ich bin gestern ins Kino gegangen</i> (Perfekt), auf Spanisch heißt es trotzdem <i>Ayer fui al cine</i>. Was <b>heute früher</b> passiert ist, zählt als „heute“, deshalb sagt man in Spanien <i>Hace un rato he hablado con él</i> (Ich habe vorhin mit ihm gesprochen).</p>")},

{k:"text",t:B("Spain vs. Latin America","İspanya ile Latin Amerika farkı","Spanien vs. Lateinamerika"),body:B(
"<p>This is one of the clearest differences between Spain and Latin America. Across most of Spain, people use the perfecto for anything that happened today. In most of Latin America (and also in the Canary Islands and parts of north-west Spain, such as Galicia and Asturias) the indefinido is used instead. Both are correct, so go with the one you hear around you. Don't be surprised if a Latin American friend asks <i>¿Qué hiciste hoy?</i></p>",
"<p>Bu, İspanya ile Latin Amerika arasındaki en belirgin farklardan biri. İspanya'nın çoğu yerinde bugün olan her şey için perfecto kullanılır. Latin Amerika'nın büyük kısmında (ayrıca Kanarya Adaları'nda ve Galiçya, Asturias gibi kuzeybatı İspanya bölgelerinde) bunun yerine indefinido kullanılır. İkisi de doğru; çevrende hangisini duyuyorsan onu kullan. Latin Amerikalı bir arkadaşın <i>¿Qué hiciste hoy?</i> derse şaşırma.</p>",
"<p>Das ist einer der deutlichsten Unterschiede zwischen Spanien und Lateinamerika. In den meisten Teilen Spaniens nimmt man für alles, was heute passiert ist, den perfecto. In den meisten Ländern Lateinamerikas (und auch auf den Kanaren und in Teilen Nordwestspaniens wie Galicien und Asturien) nimmt man stattdessen den indefinido. Beides ist richtig; nimm einfach das, was du um dich herum hörst. Wundere dich nicht, wenn dich ein Freund aus Lateinamerika fragt: <i>¿Qué hiciste hoy?</i></p>"),
ex:[["🇪🇸 ¿Qué <b>has hecho</b> hoy? — <b>He ido</b> al gimnasio y <b>he comido</b> con unos compañeros.","What did you do today? — I went to the gym and had lunch with some colleagues.","Bugün ne yaptın? — Spora gittim ve birkaç iş arkadaşımla yemek yedim.","Was hast du heute gemacht? — Ich war im Fitnessstudio und habe mit Kollegen gegessen."],

/* ================= Ser vs estar ================= */
L_("serestar").deep=[
{k:"text",t:B("A better rule than “permanent vs temporary”","“Kalıcı / geçici” kuralından daha iyisi","Eine bessere Regel als „dauerhaft vs. vorübergehend“"),body:B(
"<p>English has one verb “to be”. A popular shortcut says ser = permanent, estar = temporary, but it breaks quickly: <i>Está muerto</i> (dead, very permanent) uses estar, while <i>Es joven</i> (young, not forever) and <i>Son las tres</i> (the time, changes every minute) use ser.</p><p>A more reliable question: <b>are you saying WHAT or WHO something is (<span class='hi-s'>ser</span>), or HOW or WHERE it is (<span class='hi-e'>estar</span>)?</b></p><p>Memory aid: <b>DOCTOR</b> for ser (Description, Occupation, Characteristic, Time, Origin, Relationship) and <b>PLACE</b> for estar (Position, Location, Action, Condition, Emotion).</p>",
"<p>Türkçede bu ayrım yok: <i>Mühendisim</i>, <i>Yorgunum</i>, <i>Madrid'deyim</i> cümlelerinin hepsinde aynı ek var. İspanyolcada ise birincisi <b>ser</b>, diğer ikisi <b>estar</b>.</p><p>Sık duyulan “ser kalıcı, estar geçici” kuralı çabuk bozulur: <i>Está muerto</i> (ölmüş, gayet kalıcı) estar ile; <i>Es joven</i> (genç, sonsuza kadar değil) ve <i>Son las tres</i> (saat, her dakika değişiyor) ser ile söylenir.</p><p>Daha güvenilir soru şu: <b>Bir şeyin NE ya da KİM olduğunu mu söylüyorsun (<span class='hi-s'>ser</span>), yoksa NASIL ya da NEREDE olduğunu mu (<span class='hi-e'>estar</span>)?</b></p><p>Akılda tutmak için iki İngilizce kısaltma: ser için <b>DOCTOR</b> (Description, Occupation, Characteristic, Time, Origin, Relationship), estar için <b>PLACE</b> (Position, Location, Action, Condition, Emotion).</p>",
"<p>Im Deutschen gibt es nur „sein“. Die beliebte Faustregel ser = dauerhaft, estar = vorübergehend stimmt oft nicht: <i>Está muerto</i> (tot, sehr dauerhaft) steht mit estar, <i>Es joven</i> (jung, nicht für immer) und <i>Son las tres</i> (die Uhrzeit, ändert sich ständig) mit ser.</p><p>Zuverlässiger ist die Frage: <b>Sagst du, WAS oder WER etwas ist (<span class='hi-s'>ser</span>), oder WIE oder WO es ist (<span class='hi-e'>estar</span>)?</b></p><p>Eselsbrücke aus dem Englischen: <b>DOCTOR</b> für ser (Description, Occupation, Characteristic, Time, Origin, Relationship), <b>PLACE</b> für estar (Position, Location, Action, Condition, Emotion).</p>")},

{k:"text",t:B("Neither ser nor estar: hacer, tener, hay","Ne ser ne estar: hacer, tener, hay","Weder ser noch estar: hacer, tener, hay"),body:B(
"<p>Many sentences that use “to be” in English use a different verb in Spanish:</p><ul><li><b>Weather → hacer</b>: <i>Hace calor / frío / sol / viento.</i> (But: <i>Está nublado</i>, <i>Está lloviendo</i>.)</li><li><b>How your body feels → tener</b>: <i>Tengo calor, frío, hambre, sed, sueño, miedo, prisa.</i> (I'm hot, cold, hungry, thirsty, sleepy, scared, in a hurry.)</li><li><b>Age → tener</b>: <i>Tengo 32 años</i>, never “soy 32”.</li><li><b>There is / there are → hay</b>: <i>Hay un banco cerca.</i> But for a specific, known thing use estar: <i>El banco está cerca.</i></li></ul><p>And “hot”: <i>Tengo calor</i> (I'm hot), <i>Hace calor</i> (it's hot outside), <i>La sopa está caliente</i> (the soup is hot).</p>",
"<p>Türkçede ekle, İngilizcede “to be” ile söylenen pek çok cümle İspanyolcada başka bir fiille kurulur:</p><ul><li><b>Hava durumu → hacer</b>: <i>Hace calor / frío / sol / viento.</i> (Hava sıcak / soğuk / güneşli / rüzgârlı.) Ama: <i>Está nublado</i> (bulutlu), <i>Está lloviendo</i> (yağmur yağıyor).</li><li><b>Vücudunun hissettikleri → tener</b>: <i>Tengo calor</i> (sıcakladım), <i>frío</i> (üşüyorum), <i>hambre</i> (acıktım), <i>sed</i> (susadım), <i>sueño</i> (uykum var), <i>miedo</i> (korkuyorum), <i>prisa</i> (acelem var).</li><li><b>Yaş → tener</b>: <i>Tengo 32 años</i>; asla “soy 32” değil.</li><li><b>Var / yok → hay</b>: <i>Hay un banco cerca</i> (Yakında bir banka var). Ama bilinen, belirli bir şey için estar: <i>El banco está cerca</i> (Banka yakında).</li></ul><p>“Sıcak” için üçü bir arada: <i>Tengo calor</i> (sıcakladım), <i>Hace calor</i> (hava sıcak), <i>La sopa está caliente</i> (çorba sıcak).</p>",
"<p>Viele Sätze mit „sein“ bildet man auf Spanisch mit einem anderen Verb:</p><ul><li><b>Wetter → hacer</b>: <i>Hace calor / frío / sol / viento.</i> (Aber: <i>Está nublado</i>, <i>Está lloviendo</i>.)</li><li><b>Körpergefühl → tener</b>: <i>Tengo calor, frío, hambre, sed, sueño, miedo, prisa.</i> (Mir ist heiß, kalt; ich habe Hunger, Durst, bin müde, habe Angst, habe es eilig.)</li><li><b>Alter → tener</b>: <i>Tengo 32 años</i>, nie „soy 32“.</li><li><b>Es gibt → hay</b>: <i>Hay un banco cerca.</i> Für etwas Bestimmtes, Bekanntes aber estar: <i>El banco está cerca.</i></li></ul><p>Und „heiß“: <i>Tengo calor</i> (mir ist heiß), <i>Hace calor</i> (es ist heiß draußen), <i>La sopa está caliente</i> (die Suppe ist heiß).</p>")},

const statsSite=()=>/\.github\.io$/.test(location.hostname);
const statsOn=()=>statsSite()&&!(store.settings&&store.settings.noStats);
let gcQueue=[];
function gc(path,event){
  if(!statsOn())return;
  const d={path,title:path,event:!!event};
  const g=window.goatcounter;
  if(g&&typeof g.count==="function"){try{g.count(d);}catch(e){}}else gcQueue.push(d);
}
function loadGC(){
  if(!statsOn()||document.getElementById("gcjs"))return;
  window.goatcounter=Object.assign(window.goatcounter||{},{no_onload:true});
  const sc=document.createElement("script");sc.id="gcjs";sc.async=true;sc.src="https://gc.zgo.at/count.js";
  sc.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`;
  sc.onload=()=>{const q=gcQueue;gcQueue=[];q.forEach(d=>{try{window.goatcounter.count(d);}catch(e){}});};
  document.head.appendChild(sc);
}
/* page names only — never word text or personal story titles */
function routeName(h){
  if(!h)return "/tenses";
  if(h.startsWith("l-"))return "/lesson/"+h.slice(2);
  if(h.startsWith("c-"))return "/classic/"+h.slice(2).replace(/-(a1|a2|b1|b2)$/,"/$1");
  if(h.startsWith("r-"))return "/story/"+(STORIES.some(x=>x.id===h.slice(2))?h.slice(2):"mine");
  if(h.startsWith("w-"))return "/words/detail";
  if(h.startsWith("practice"))return "/practice"+(h.length>9?"/"+h.slice(9):"");
  if(h==="feedback")return "/feedback";
  return TABS.some(x=>x[0]===h)?"/"+h:"/other";
}
const localDay=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function statsDaily(){
  const st=store.stats||(store.stats={});const today=localDay();
  if(st.last===today)return;
  if(!st.first)st.first=today;
  st.days=(st.days||0)+1;st.last=today;save();
  const n=st.days,b=n<=7?String(n):n<=14?"8-14":n<=30?"15-30":"31+";
  const wk=Math.floor((Date.parse(today)-Date.parse(st.first))/864e5/7);
  const app=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  gc("active-day-"+b,true);
  gc("week-since-first-"+(wk<8?wk:"8+"),true);
  gc("open-"+(app?"installed-app":"browser"),true);
  gc("lang-"+LANG,true);
}
let lastGcPath="";
function statsView(){const pth=routeName((location.hash||"").slice(1));if(pth===lastGcPath)return;lastGcPath=pth;gc(pth,false);}
function renderStatsBox(){
  const el=$("#sbox");if(!el)return;
  el.innerHTML=`<p class="muted" style="margin:0 0 10px;font-size:14px">${t("statsDesc")}</p>
  <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="noStats" ${store.settings.noStats?"checked":""} style="width:20px;height:20px"> <span>${t("statsOff")}</span></label>
  ${statsSite()?"":`<p class="muted" style="margin:8px 0 0;font-size:13px">${t("statsLocal")}</p>`}`;
  $("#noStats").onchange=e=>{store.settings.noStats=e.target.checked;save();if(!e.target.checked){loadGC();}};
}
/* ================= Progress ================= */
function renderProgress(){
  const d=store.drill;const done=LESSONS.filter(L=>store.lessons[L.id]).length;
  const avg=done?Math.round(LESSONS.reduce((s,L)=>s+(store.lessons[L.id]?.best||0),0)/LESSONS.length*100):0;
  const weak=Object.entries(d.verbErr||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const row=(n,pc,href)=>`<div class="row"><a class="nm" href="${href}">${n}</a><div class="bar"><i style="width:${pc||0}%"></i></div><span class="pc">${pct(pc)}</span></div>`;
  $("#app").innerHTML=`<section class="hero"><h1>${t("progTitle")}</h1><p>${t("progDesc")}</p></section>
  <div class="stats"><div class="card stat"><div class="n">${done}/${LESSONS.length}</div><div class="l">${t("topicsDone")}</div></div><div class="card stat"><div class="n">${pct(avg)}</div><div class="l">${t("avgTenses")}</div></div><div class="card stat"><div class="n">${d.total}</div><div class="l">${t("drillQs")}</div></div><div class="card stat"><div class="n">${d.best}</div><div class="l">${t("bestStreak")}</div></div><a class="card stat" href="#words" style="text-decoration:none;color:inherit"><div class="n">${wordsList().length}</div><div class="l">${t("statsWords")} · ${t("statsKnown",wordsList().filter(w=>w.st&&w.st.box>=3).length)}</div></a></div>
  <div class="sec"><h2>${t("tensesTitle")}</h2><div class="card prog">${LESSONS.map(L=>{const b=store.lessons[L.id];return row(tx(L.title),b?Math.round(b.best*100):null,"#l-"+L.id);}).join("")}</div></div>
  <div class="sec"><h2>${t("secReading")}</h2><div class="card prog">${CLASSICS.flatMap(c=>LV.filter(l=>store.lessons["story-c-"+c.id+"-"+l.toLowerCase()]).map(l=>{const b=store.lessons["story-c-"+c.id+"-"+l.toLowerCase()];return row(esc(c.title)+" · "+l,Math.round(b.best*100),"#c-"+c.id+"-"+l.toLowerCase());})).join("")}${allStories().map(S=>{const b=store.lessons["story-"+S.id];return row(esc(S.title),b?Math.round(b.best*100):null,"#r-"+S.id);}).join("")}</div></div>
  <div class="sec"><h2>${t("secPhrases")}</h2><div class="card prog">${["all",...Object.keys(PHR)].map(c=>{const b=store.phrases[c];return row(catName(c),b?Math.round(b.best*100):null,"#phrases");}).join("")}</div></div>
  <div class="sec"><h2>${t("weakVerbs")}</h2>${weak.length?`<div class="chips">${weak.map(([v,n])=>`<span class="chip">${t("nMistakes",v,n)}</span>`).join("")}</div><p class="muted">${t("weakNote")}</p>`:`<p class="muted">${t("noData")}</p>`}</div>
  <div class="sec"><h2>${t("voiceTitle")}</h2><div class="card vbox" id="vbox"></div></div>
  <div class="sec"><h2>${t("statsTitle")}</h2><div class="card vbox" id="sbox"></div></div>
  ${fbReady()?`<div class="sec"><h2>${t("fbTitle")}</h2><div class="card vbox"><p class="muted" style="margin:0 0 12px;font-size:14px">${t("fbProgDesc")}</p><a class="btn" href="#feedback">${t("fbOpen")}</a></div></div>`:""}
  <button class="btn ghost" id="reset">${t("reset")}</button>`;
  renderVoiceBox();renderStatsBox();
  $("#reset").onclick=()=>{
    $("#modal").innerHTML=`<div class="modal"><div class="card"><h3>${t("sure")}</h3><p class="muted">${t("resetWarn")}</p><div class="btns"><button class="btn" id="yes">${t("yesReset")}</button><button class="btn ghost" id="no">${t("cancel")}</button></div></div></div>`;
    $("#no").onclick=()=>$("#modal").innerHTML="";
    $("#yes").onclick=()=>{store.lessons={};store.phrases={};store.drill={total:0,correct:0,streak:0,best:0,verbErr:{}};save();$("#modal").innerHTML="";renderProgress();};
  };
}

function fbInfo(){
  const ua=navigator.userAgent||"";
  const os=isIOS()?"iOS":/Android/i.test(ua)?"Android":/Mac/i.test(ua)?"Mac":/Win/i.test(ua)?"Windows":/Linux/i.test(ua)?"Linux":"?";
  const app=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  return {build:window.APP_BUILD||"dev",lang:LANG,os,app,page:fbFrom?"#"+fbFrom:"-"};
}
const fbInfoText=i=>`${i.build} · ${i.lang} · ${i.os} · ${t(i.app?"fbApp":"fbBrowser")}`+(i.page!=="-"?` · ${t("fbPage")}: ${i.page}`:"");
async function fbPost(m){
  const head=m.text.replace(/\s+/g," ").slice(0,60)+(m.text.length>60?"…":"");
  const body={access_key:FB_KEY,subject:`Español Lab · ${FB_TYPES[m.type]||m.type} · ${head}`,from_name:"Español Lab",botcheck:false,
    "Tür":FB_TYPES[m.type]||m.type,"Mesaj":m.text,"Yazıldığı zaman":m.at};
  if(m.info)Object.assign(body,{"Sürüm":m.info.build,"Arayüz dili":m.info.lang,"Cihaz":m.info.os+" · "+(m.info.app?"yüklü uygulama":"tarayıcı"),"Sayfa":m.info.page});
  const r=await fetch(FB_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok||!j.success){const e=new Error(j.message||("HTTP "+r.status));e.status=r.status;throw e;}
}
const fbRecent=()=>{const now=Date.now();store.fbSent=(store.fbSent||[]).filter(x=>now-x<3600e3);return store.fbSent;};
function fbQueue(m){(store.fbOutbox||(store.fbOutbox=[])).push(m);save();}
async function fbFlush(){
  if(fbBusy||!fbReady()||!navigator.onLine||!(store.fbOutbox||[]).length)return;
  fbBusy=true;
  try{
    while(store.fbOutbox.length){
      const m=store.fbOutbox[0];
      try{await fbPost(m);store.fbOutbox.shift();fbRecent().push(Date.now());save();}
      catch(e){
        m.tries=(m.tries||0)+1;
        if(e.status>=400&&e.status<500&&e.status!==429||m.tries>=8)store.fbOutbox.shift();   // rejected for good: drop it
        save();if(!(e.status>=400&&e.status<500&&e.status!==429))break;                       // network/server trouble: try later
      }
    }
  }finally{fbBusy=false;}
  if(location.hash==="#feedback")fbPendingNote();
}
function fbPendingNote(){const el=$("#fbPend");if(!el)return;const n=(store.fbOutbox||[]).length;el.textContent=n?t("fbPending",n):"";}
function renderFeedback(){
  const meta=!store.settings.fbNoMeta;
  $("#app").innerHTML=`<section class="hero"><h1>${t("fbTitle")}</h1><p>${t("fbDesc")}</p></section>
  <div class="card fbcard">
    ${fbReady()?"":`<p class="fbwarn">${t("fbNotSet")}</p>`}
    <div class="fblab">${t("fbType")}</div>
    <div class="chips fbtypes">${Object.keys(FB_TYPES).map(k=>`<button class="chip ${fbType===k?"on":""}" data-k="${k}" type="button">${t("fb_"+k)}</button>`).join("")}</div>
    <textarea id="fbText" class="note" maxlength="3000" placeholder="${esc(t("fbPh"))}">${esc(store.fbDraft||"")}</textarea>
    <label class="fbmeta"><input type="checkbox" id="fbMeta" ${meta?"checked":""}> <span>${t("fbMeta")}</span></label>
    <div class="muted fbinfo" id="fbInfo" ${meta?"":"hidden"}>${t("fbInfoLbl")} ${esc(fbInfoText(fbInfo()))}</div>
    <div class="btns"><button class="btn" id="fbSend" type="button" ${fbReady()?"":"disabled"}>${t("fbSend")}</button></div>
    <div id="fbRes" role="status" aria-live="polite"></div>
    <p class="muted fbpriv">${t("fbPrivacy")}</p>
    <p class="muted fbpriv" id="fbPend"></p>
  </div>`;
  fbPendingNote();
  document.querySelectorAll(".fbtypes .chip").forEach(b=>b.onclick=()=>{fbType=b.dataset.k;document.querySelectorAll(".fbtypes .chip").forEach(x=>x.classList.toggle("on",x===b));});
  const ta=$("#fbText");
  ta.oninput=()=>{store.fbDraft=ta.value;save();$("#fbRes").innerHTML="";};
  $("#fbMeta").onchange=e=>{store.settings.fbNoMeta=!e.target.checked;save();$("#fbInfo").hidden=!e.target.checked;};
  const res=(cls,msg,again)=>{$("#fbRes").innerHTML=`<div class="fbres ${cls}">${msg}${again?` <button class="btn ghost" id="fbAgain" type="button">${t("fbAnother")}</button>`:""}</div>`;
    if(again)$("#fbAgain").onclick=()=>{$("#fbRes").innerHTML="";ta.focus();};};
  const done=()=>{ta.value="";store.fbDraft="";save();};
  $("#fbSend").onclick=async()=>{
    const text=ta.value.trim();
    if(text.replace(/\s+/g,"").length<5){res("bad",t("fbTooShort"));ta.focus();return;}
    if(fbRecent().length>=5){res("bad",t("fbLimit"));return;}
    const m={type:fbType,text,info:$("#fbMeta").checked?fbInfo():null,at:new Date().toLocaleString("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",timeZoneName:"short"})};
    if(!navigator.onLine){fbQueue(m);done();res("wait",t("fbQueued"));fbPendingNote();return;}
    const btn=$("#fbSend");btn.disabled=true;btn.textContent=t("fbSending");
    try{await fbPost(m);fbRecent().push(Date.now());save();done();res("ok",t("fbThanks"),true);gc("/feedback/sent",true);}
    catch(e){
      if(e.status>=400&&e.status<500&&e.status!==429)res("bad",t("fbFail"));
      else{fbQueue(m);done();res("wait",t("fbErr"));}
    }
    finally{if($("#fbSend")){btn.disabled=false;btn.textContent=t("fbSend");}fbPendingNote();}
  };
}
window.addEventListener("online",()=>{fbFlush();});

<script>
/* ===== Installable app (PWA) ===== */
(function(){
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
  }
  const HINT={
    en:"Install on your iPhone: tap Share __S__ and then “Add to Home Screen”.",
    tr:"iPhone'una kur: Paylaş __S__ simgesine dokun, sonra “Ana Ekrana Ekle”yi seç.",
    de:"Auf dem iPhone installieren: Tippe auf Teilen __S__ und dann auf „Zum Home-Bildschirm“."
  };
  const SVG='<svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V1M4.5 4.5 8 1l3.5 3.5"/><path d="M5 7H2.5v9.5h11V7H11"/></svg>';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  let dismissed=false;try{dismissed=localStorage.getItem("el-install-hint")==="off";}catch(e){}
  const box=document.getElementById("installHint");
  document.querySelector("main").before(box);
  function render(){
    if(!isIOS||standalone||dismissed){box.hidden=true;return;}
    box.hidden=false;
    box.innerHTML='<div class="card"><span>📲</span><span>'+(HINT[LANG]||HINT.en).replace("__S__",SVG)+'</span><button class="x" aria-label="close">✕</button></div>';
    box.querySelector(".x").onclick=()=>{dismissed=true;try{localStorage.setItem("el-install-hint","off");}catch(e){}render();};
  }
  render();
  document.getElementById("langSel").addEventListener("change",()=>setTimeout(render,0));
})();
</script>
