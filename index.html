TRANSL.de={"Present: now and habits": "Gegenwart: jetzt und Gewohnheiten", "simple present / present continuous": "Präsens", "Describes what is happening now, habits and general truths. It covers the English <b>simple present<\/b> (I work) and often the <b>present continuous<\/b> (I'm working). It's also used for fixed plans in the near future.": "Beschreibt, was gerade passiert, Gewohnheiten und allgemeine Wahrheiten. Es entspricht dem deutschen <b>Präsens<\/b> (ich arbeite) und wird auch für die englische Verlaufsform verwendet (I'm working). Außerdem steht es für feste Pläne in naher Zukunft.", "Regular verbs": "Regelmäßige Verben", "Key irregularities": "Wichtige Unregelmäßigkeiten", "Only yo is irregular": "Nur yo ist unregelmäßig", "Stem change e → ie": "Stammwechsel e → ie", "querer → <b>quiero<\/b>, pensar → <b>pienso<\/b>, empezar → <b>empiezo<\/b>. nosotros and vosotros don't change: queremos, queréis.": "querer → <b>quiero<\/b>, pensar → <b>pienso<\/b>, empezar → <b>empiezo<\/b>. nosotros und vosotros ändern sich nicht: queremos, queréis.", "Stem change o → ue": "Stammwechsel o → ue", "Stem change e → i": "Stammwechsel e → i", "Completely irregular": "Völlig unregelmäßig", "Habits and routines": "Gewohnheiten und Routinen", "Things you do regularly.": "Dinge, die du regelmäßig tust.", "I work in an office downtown.": "Ich arbeite in einem Büro in der Innenstadt.", "On Tuesdays I go to Spanish class.": "Dienstags gehe ich zum Spanischkurs.", "Happening now": "Was gerade passiert", "Things happening as you speak. For emphasis use estar + gerund.": "Dinge, die im Moment des Sprechens passieren. Zur Betonung verwendet man estar + Gerundium.", "What are you doing? — I'm having dinner with friends.": "Was machst du? — Ich esse mit Freunden zu Abend.", "I'm working right now, I'll call you later.": "Ich arbeite gerade, ich rufe dich später an.", "Near future": "Nahe Zukunft", "For fixed plans.": "Für feste Pläne.", "Tomorrow I'm going to the doctor.": "Morgen gehe ich zum Arzt.", "General truths": "Allgemeine Wahrheiten", "Things that are always true.": "Dinge, die immer gelten.", "In Madrid it's very hot in summer.": "In Madrid ist es im Sommer sehr heiß.", "<b>Estar + gerundio<\/b> (estoy comiendo, estás leyendo) stresses “right now”. Gerund: -ar → <b>-ando<\/b>, -er/-ir → <b>-iendo<\/b>.": "<b>Estar + gerundio<\/b> (estoy comiendo, estás leyendo) betont „gerade jetzt“. Gerundium: -ar → <b>-ando<\/b>, -er/-ir → <b>-iendo<\/b>.", "The subject pronoun is usually dropped: <i>Vivo en Madrid<\/i> is enough; <i>Yo vivo…<\/i> adds emphasis.": "Das Subjektpronomen fällt meistens weg: <i>Vivo en Madrid<\/i> reicht; <i>Yo vivo…<\/i> betont die Person.", "I live in Madrid.": "Ich wohne in Madrid.", "-ir verb, yo → -o: vivo.": "Verb auf -ir, yo → -o: vivo.", "We study Spanish on Tuesdays.": "Wir lernen dienstags Spanisch.", "-ar verb, nosotros → -amos.": "Verb auf -ar, nosotros → -amos.", "Do you want a coffee?": "Möchtest du einen Kaffee?", "querer changes its stem: e → ie. tú → quieres.": "querer ändert seinen Stamm: e → ie. tú → quieres.", "I don't do anything on Sundays.": "Sonntags mache ich nichts.", "hacer is irregular only in yo: hago.": "hacer ist nur bei yo unregelmäßig: hago.", "They leave home at eight.": "Sie gehen um acht aus dem Haus.", "salir is irregular only in yo (salgo). ellos → salen.": "salir ist nur bei yo unregelmäßig (salgo). ellos → salen.", "Can you help me, please?": "Kannst du mir bitte helfen?", "poder: o → ue. tú → puedes.": "poder: o → ue. tú → puedes.", "I know a lot of people in Madrid.": "Ich kenne viele Leute in Madrid.", "Verbs ending in -cer take -zco in yo: conozco.": "Verben auf -cer bekommen bei yo -zco: conozco.", "I'm eating right now.": "Ich esse gerade.", "estar + gerund: estoy comiendo.": "estar + Gerundium: estoy comiendo.", "Today, this week, in my life": "Heute, diese Woche, in meinem Leben", "present perfect": "Perfekt (für heute / diese Woche)", "Used for events <b>within a time period that isn't over yet<\/b>: hoy, esta mañana, esta semana, este año. Also for life experience (<i>¿Has estado en…?<\/i>) and with <i>ya / todavía no<\/i>. It looks like the English present perfect but covers more ground: <i>Hoy he comido paella<\/i> = “I had paella today”. This is the standard usage in Spain; in most of Latin America the indefinido is preferred here instead (<i>Hoy comí paella<\/i>).": "Wird für Ereignisse <b>innerhalb eines noch nicht abgeschlossenen Zeitraums<\/b> verwendet: hoy, esta mañana, esta semana, este año. Außerdem für Lebenserfahrungen (<i>¿Has estado en…?<\/i>) und mit <i>ya / todavía no<\/i>. Es ähnelt dem deutschen Perfekt: <i>Hoy he comido paella<\/i> = „Ich habe heute Paella gegessen“. Das ist der Standardgebrauch in Spanien; in den meisten Ländern Lateinamerikas nimmt man hier stattdessen das indefinido (<i>Hoy comí paella<\/i>).", "Structure: haber + past participle": "Aufbau: haber + Partizip", "Past participle": "Partizip", "Regular": "Regelmäßig", "Irregular participles": "Unregelmäßige Partizipien", "With an accent": "Mit Akzent", "Today / this week / this year": "Heute / diese Woche / dieses Jahr", "The time period isn't over yet.": "Der Zeitraum ist noch nicht vorbei.", "I had paella today.": "Ich habe heute Paella gegessen.", "I've worked a lot this week.": "Ich habe diese Woche viel gearbeitet.", "Life experience": "Lebenserfahrung", "No specific time: “have you ever…?”": "Ohne bestimmten Zeitpunkt: „Warst du schon einmal …?“", "Have you ever been to Seville?": "Warst du schon einmal in Sevilla?", "Whether something has happened yet.": "Ob etwas schon passiert ist.", "I haven't paid the rent yet.": "Ich habe die Miete noch nicht bezahlt.", "Have you already talked to the landlord?": "Hast du schon mit dem Vermieter gesprochen?", "<b>ayer, anoche, el lunes pasado, en 2020<\/b> → indefinido. <b>hoy, esta mañana, este mes, nunca, ya<\/b> → perfecto (in Spain).": "<b>ayer, anoche, el lunes pasado, en 2020<\/b> → indefinido. <b>hoy, esta mañana, este mes, nunca, ya<\/b> → perfecto (in Spanien).", "Nothing goes between haber and the participle: <i>Lo he hecho<\/i> is correct, <i>He lo hecho<\/i> is wrong.": "Zwischen haber und Partizip steht nichts: <i>Lo he hecho<\/i> ist richtig, <i>He lo hecho<\/i> ist falsch.", "I've worked a lot today.": "Ich habe heute viel gearbeitet.", "Have you written the email yet?": "Hast du die E-Mail schon geschrieben?", "The participle of escribir is irregular: escrito.": "Das Partizip von escribir ist unregelmäßig: escrito.", "I went to the bank this morning.": "Ich bin heute Morgen zur Bank gegangen.", "“Esta mañana” is a period that isn't over yet, so in Spain you use the perfecto. (In Latin America “fui” is also common.)": "„Esta mañana“ ist ein noch nicht abgeschlossener Zeitraum, deshalb verwendet man in Spanien das perfecto. (In Lateinamerika ist auch „fui“ üblich.)", "Yesterday I went to the bank.": "Gestern bin ich zur Bank gegangen.", "“Ayer” is a finished time, so indefinido.": "„Ayer“ ist eine abgeschlossene Zeit, also indefinido.", "We haven't seen the film yet.": "Wir haben den Film noch nicht gesehen.", "ver → visto (irregular).": "ver → visto (unregelmäßig).", "Which is the past participle of hacer?": "Welches ist das Partizip von hacer?", "hacer → hecho. “haciendo” is the gerund.": "hacer → hecho. „haciendo“ ist das Gerundium.", "What has the boss said?": "Was hat der Chef gesagt?", "Finished, one-off events": "Abgeschlossene, einmalige Ereignisse", "simple past": "Präteritum / Perfekt (abgeschlossenes Ereignis)", "Used for events that <b>started and finished at a specific time<\/b> in the past. The “events” of a story, what happened and what was done, are told in this tense. It's the closest match to the English simple past.": "Wird für Ereignisse verwendet, die <b>zu einem bestimmten Zeitpunkt<\/b> in der Vergangenheit <b>begonnen und geendet haben<\/b>. Die „Ereignisse“ einer Geschichte, also was passiert ist und was getan wurde, erzählt man in dieser Zeit. Im Deutschen entspricht es meist dem Präteritum oder dem Perfekt.", "Irregularities": "Unregelmäßigkeiten", "Strong stems (no accents!)": "Starke Stämme (ohne Akzent!)", "tener → <b>tuv<\/b>- · estar → <b>estuv<\/b>- · poder → <b>pud<\/b>- · poner → <b>pus<\/b>- · saber → <b>sup<\/b>- · querer → <b>quis<\/b>- · venir → <b>vin<\/b>- · hacer → <b>hic<\/b>- (él: <b>hizo<\/b>)<br>Endings: -e, -iste, -o, -imos, -isteis, -ieron": "tener → <b>tuv<\/b>- · estar → <b>estuv<\/b>- · poder → <b>pud<\/b>- · poner → <b>pus<\/b>- · saber → <b>sup<\/b>- · querer → <b>quis<\/b>- · venir → <b>vin<\/b>- · hacer → <b>hic<\/b>- (él: <b>hizo<\/b>)<br>Endungen: -e, -iste, -o, -imos, -isteis, -ieron", "-j stems": "Stämme auf -j", "decir → <b>dije<\/b> · traer → <b>traje<\/b><br>ellos: dij<b>eron<\/b>, traj<b>eron<\/b> (no i)": "decir → <b>dije<\/b> · traer → <b>traje<\/b><br>ellos: dij<b>eron<\/b>, traj<b>eron<\/b> (ohne i)", "fui, fuiste, fue, fuimos, fuisteis, fueron. Context tells you which one it is.": "fui, fuiste, fue, fuimos, fuisteis, fueron. Welches Verb gemeint ist, ergibt sich aus dem Kontext.", "Stem change in the 3rd person (-ir)": "Stammwechsel in der 3. Person (-ir)", "Spelling change (yo)": "Schreibänderung (yo)", "A single event at a specific time": "Ein einzelnes Ereignis zu einem bestimmten Zeitpunkt", "The time is known and it's over.": "Der Zeitpunkt ist bekannt und es ist vorbei.", "Yesterday I bought a new phone.": "Gestern habe ich ein neues Handy gekauft.", "A sequence of events": "Eine Abfolge von Ereignissen", "The steps that move a story forward.": "Die Schritte, die eine Geschichte voranbringen.", "I got home, had dinner and went to bed.": "Ich bin nach Hause gekommen, habe zu Abend gegessen und bin ins Bett gegangen.", "A limited period": "Ein begrenzter Zeitraum", "A period with a clear start and end.": "Ein Zeitraum mit klarem Anfang und Ende.", "I lived in Ankara for three years.": "Ich habe drei Jahre in Ankara gewohnt.", "Key words: <b>ayer, anoche, anteayer, la semana pasada, el año pasado, en 2023, hace dos años, de repente<\/b>.": "Signalwörter: <b>ayer, anoche, anteayer, la semana pasada, el año pasado, en 2023, hace dos años, de repente<\/b>.", "The only difference between hablo (I speak) and habló (he spoke) is the accent. Getting the accent right changes the meaning here.": "Der einzige Unterschied zwischen hablo (ich spreche) und habló (er sprach) ist der Akzent. Hier verändert der Akzent die Bedeutung.", "Yesterday I talked to my mother.": "Gestern habe ich mit meiner Mutter gesprochen.", "Last night they ate pizza.": "Gestern Abend haben sie Pizza gegessen.", "Last year we went to Seville.": "Letztes Jahr sind wir nach Sevilla gefahren.", "A finished, one-off event, so indefinido: fuimos.": "Ein abgeschlossenes, einmaliges Ereignis, also indefinido: fuimos.", "What did you do at the weekend?": "Was hast du am Wochenende gemacht?", "She told me the truth.": "Sie hat mir die Wahrheit gesagt.", "Strong stems take no accent: dijo.": "Starke Stämme haben keinen Akzent: dijo.", "I arrived late to work.": "Ich bin zu spät zur Arbeit gekommen.", "-gar → -gué in yo: llegué.": "-gar → -gué bei yo: llegué.", "He slept ten hours.": "Er hat zehn Stunden geschlafen.", "-ir verbs change o → u in the 3rd person: durmió.": "Verben auf -ir ändern o → u in der 3. Person: durmió.", "We couldn't come.": "Wir konnten nicht kommen.", "Habits, descriptions, background": "Gewohnheiten, Beschreibungen, Hintergrund", "used to / would / was -ing": "„früher immer …“ / „war gerade dabei …“", "Used for past situations that were <b>habitual<\/b>, <b>ongoing<\/b> or that <b>describe the background<\/b>. When it started or ended doesn't matter. In English it usually maps to <b>used to / would<\/b> (habits) or <b>was/were + -ing<\/b> (ongoing actions).": "Wird für vergangene Situationen verwendet, die <b>gewohnheitsmäßig<\/b> waren, <b>andauerten<\/b> oder <b>den Hintergrund beschreiben<\/b>. Wann es anfing oder endete, spielt keine Rolle. Im Englischen entspricht es meist <b>used to / would<\/b> (Gewohnheiten) oder <b>was/were + -ing<\/b> (andauernde Handlungen), im Deutschen oft „früher immer …“ oder „war gerade dabei …“.", "Conjugation": "Konjugation", "Only 3 irregular verbs": "Nur 3 unregelmäßige Verben", "Past habits": "Gewohnheiten in der Vergangenheit", "As a kid, I used to play football every day.": "Als Kind habe ich jeden Tag Fußball gespielt.", "I used to live in Ankara.": "Früher habe ich in Ankara gewohnt.", "Descriptions": "Beschreibungen", "People, places, weather, feelings.": "Menschen, Orte, Wetter, Gefühle.", "The house was big and had a garden.": "Das Haus war groß und hatte einen Garten.", "It was cold and I was tired.": "Es war kalt und ich war müde.", "Time and age": "Uhrzeit und Alter", "In the past, the time of day and someone's age as background take the imperfecto. (A birthday is an event: <i>Ayer cumplí 30 años<\/i>.)": "In der Vergangenheit stehen Uhrzeit und Alter als Hintergrund im imperfecto. (Ein Geburtstag ist ein Ereignis: <i>Ayer cumplí 30 años<\/i>.)", "It was eight o'clock.": "Es war acht Uhr.", "When I was ten…": "Als ich zehn war…", "Ongoing action (background)": "Andauernde Handlung (Hintergrund)", "An action in progress while something else happens.": "Eine Handlung, die gerade läuft, während etwas anderes passiert.", "While I was cooking, she was watching TV.": "Während ich kochte, sah sie fern.", "Polite requests": "Höfliche Bitten", "Softer than quiero.": "Höflicher als quiero.", "I'd like a coffee, please.": "Ich hätte gern einen Kaffee, bitte.", "If English says <b>used to / would / was -ing<\/b>, it's usually imperfecto. If it's a finished one-off event in the <b>simple past<\/b>, it's usually indefinido.": "Wenn man im Englischen <b>used to / would / was -ing<\/b> sagt, ist es meist imperfecto. Ist es ein abgeschlossenes, einmaliges Ereignis im <b>simple past<\/b>, ist es meist indefinido.", "yo and él share the same form (hablaba), so say the subject when needed.": "yo und él haben dieselbe Form (hablaba), deshalb nenne das Subjekt, wenn nötig.", "As a kid I used to eat a lot of chocolate.": "Als Kind habe ich viel Schokolade gegessen.", "A habit, so imperfecto: comía.": "Eine Gewohnheit, also imperfecto: comía.", "When I lived in Ankara, I worked a lot.": "Als ich in Ankara wohnte, habe ich viel gearbeitet.", "An ongoing situation in the past: vivía.": "Eine andauernde Situation in der Vergangenheit: vivía.", "It was ten at night.": "Es war zehn Uhr abends.", "Telling the time in the past uses the imperfecto: Eran.": "Für die Uhrzeit in der Vergangenheit nimmt man das imperfecto: Eran.", "We used to go to the beach every summer.": "Jeden Sommer sind wir an den Strand gefahren.", "ir is irregular: íbamos.": "ir ist unregelmäßig: íbamos.", "My grandmother was very nice.": "Meine Großmutter war sehr nett.", "Describing character, so imperfecto.": "Charakterbeschreibung, also imperfecto.", "I didn't use to watch TV.": "Früher habe ich nicht ferngesehen.", "ver is irregular: veía.": "ver ist unregelmäßig: veía.", "While you were sleeping, I was cleaning.": "Während du geschlafen hast, habe ich geputzt.", "“mientras” shows two actions going on at the same time, so both are imperfecto.": "„mientras“ zeigt zwei Handlungen, die gleichzeitig ablaufen, deshalb stehen beide im imperfecto.", "Indefinido or imperfecto?": "Indefinido oder imperfecto?", "Scene and event": "Szene und Ereignis", "was -ing ↔ simple past": "„war gerade …“ ↔ abgeschlossenes Ereignis", "Think of a scene: the <b>imperfecto<\/b> is the <b>set and background<\/b> (what was going on, what it was like). The <b>indefinido<\/b> is the <b>event<\/b> that happened (what happened, what finished). The two often appear together in the same sentence.": "Stell dir eine Szene vor: Das <b>imperfecto<\/b> ist die <b>Kulisse und der Hintergrund<\/b> (was gerade los war, wie es war). Das <b>indefinido<\/b> ist das <b>Ereignis<\/b>, das passiert ist (was geschah, was abgeschlossen wurde). Beide stehen oft zusammen im selben Satz.", "Comparison": "Vergleich", "Verbs that change meaning": "Verben, die ihre Bedeutung ändern", "conocía a Ana = I knew Ana<br>conocí a Ana = I met Ana": "conocía a Ana = ich kannte Ana<br>conocí a Ana = ich habe Ana kennengelernt", "sabía = I knew<br>supe = I found out": "sabía = ich wusste<br>supe = ich habe es erfahren", "no quería = I didn't want to<br>no quise = I refused · no pude = I couldn't (I tried)": "no quería = ich wollte nicht<br>no quise = ich habe mich geweigert · no pude = ich konnte nicht (ich habe es versucht)", "Background + interrupting event": "Hintergrund + unterbrechendes Ereignis", "The ongoing action is imperfecto, the interrupting one is indefinido.": "Die andauernde Handlung steht im imperfecto, die unterbrechende im indefinido.", "I was sleeping when the phone rang.": "Ich schlief gerade, als das Telefon klingelte.", "It was raining a lot, so we decided to stay home.": "Es regnete stark, also haben wir beschlossen, zu Hause zu bleiben.", "Habit vs. one time": "Gewohnheit vs. einmal", "Same verb, different meaning.": "Gleiches Verb, andere Bedeutung.", "I used to go to the gym.": "Früher bin ich ins Fitnessstudio gegangen.", "Yesterday I went to the gym.": "Gestern bin ich ins Fitnessstudio gegangen.", "English <b>“was”<\/b> on its own can match either tense (<i>the house was big<\/i> → era). Then ask: is it a description or an event?": "Das englische <b>„was“<\/b> allein kann beiden Zeiten entsprechen (<i>the house was big<\/i> → era). Frag dich dann: Ist es eine Beschreibung oder ein Ereignis?", "If <b>“would”<\/b> describes a habit (<i>we would go to the beach<\/i>) it's imperfecto. If it's conditional (<i>I would like<\/i>) it's the condicional.": "Wenn <b>„would“<\/b> eine Gewohnheit beschreibt (<i>we would go to the beach<\/i>), ist es imperfecto. Ist es eine Bedingung (<i>I would like<\/i>), ist es das condicional.", "As a kid, I used to go to the park every day.": "Als Kind bin ich jeden Tag in den Park gegangen.", "Habit → imperfecto.": "Gewohnheit → imperfecto.", "Yesterday I went to the gym at seven.": "Gestern bin ich um sieben ins Fitnessstudio gegangen.", "One-off, finished event → indefinido.": "Einmaliges, abgeschlossenes Ereignis → indefinido.", "Background → imperfecto. The phone ringing is the event → indefinido.": "Hintergrund → imperfecto. Das Klingeln des Telefons ist das Ereignis → indefinido.", "My grandparents' house was very big.": "Das Haus meiner Großeltern war sehr groß.", "Description → imperfecto.": "Beschreibung → imperfecto.", "When I was ten, I moved to Ankara.": "Als ich zehn war, bin ich nach Ankara gezogen.", "Age → imperfecto. Moving is a single event → indefinido.": "Alter → imperfecto. Der Umzug ist ein einzelnes Ereignis → indefinido.", "While I was cooking, my flatmate was watching TV.": "Während ich kochte, sah mein Mitbewohner fern.", "mientras → two ongoing actions.": "mientras → zwei andauernde Handlungen.", "Last night I watched a really good film.": "Gestern Abend habe ich einen richtig guten Film gesehen.", "A finished single event → indefinido.": "Ein abgeschlossenes, einzelnes Ereignis → indefinido.", "I met Laura at the party. She's really nice!": "Ich habe Laura auf der Party kennengelernt. Sie ist echt nett!", "In the indefinido, conocer means “met”.": "Im indefinido bedeutet conocer „kennenlernen“.", "It was sunny and people were strolling in the Retiro.": "Es war sonnig und die Leute spazierten durch den Retiro.", "Describing the weather → imperfecto.": "Wetterbeschreibung → imperfecto.", "Future and guesses": "Zukunft und Vermutungen", "will / going to": "Futur I / werden", "Used for things that will happen, predictions and promises. In everyday speech, near plans usually use <b>ir a + infinitive<\/b> (<i>voy a cenar<\/i>), like English “going to”. The futuro can also <b>guess about the present<\/b>: <i>Estará en casa<\/i> → “He's probably at home”.": "Wird für Dinge verwendet, die passieren werden, für Vorhersagen und Versprechen. In der Alltagssprache verwendet man für nahe Pläne meist <b>ir a + Infinitiv<\/b> (<i>voy a cenar<\/i>), ähnlich wie das englische „going to“. Das futuro kann auch <b>Vermutungen über die Gegenwart<\/b> ausdrücken: <i>Estará en casa<\/i> → „Er ist wahrscheinlich zu Hause“.", "Conjugation: infinitive + ending": "Konjugation: Infinitiv + Endung", "Irregular stems (same endings)": "Unregelmäßige Stämme (gleiche Endungen)", "The e drops": "Das e fällt weg", "A d is added": "Ein d kommt hinzu", "Completely different": "Ganz anders", "Future and predictions": "Zukunft und Vorhersagen", "It will rain in Madrid tomorrow.": "Morgen wird es in Madrid regnen.", "Next year I'll speak better Spanish.": "Nächstes Jahr werde ich besser Spanisch sprechen.", "Plans (spoken Spanish)": "Pläne (gesprochenes Spanisch)", "This weekend we're going to go to Toledo.": "Dieses Wochenende fahren wir nach Toledo.", "Guessing about the present": "Vermutungen über die Gegenwart", "Means “probably…”.": "Bedeutet „wahrscheinlich …“.", "Where's Ana? — She's probably at work.": "Wo ist Ana? — Sie ist wahrscheinlich bei der Arbeit.", "All futuro endings have an accent except nosotros (-emos).": "Alle Endungen des futuro haben einen Akzent außer nosotros (-emos).", "Futuro and condicional share the same irregular stems. Learn one and you know both.": "Futuro und condicional haben dieselben unregelmäßigen Stämme. Wer einen kennt, kennt beide.", "It will rain tomorrow.": "Morgen wird es regnen.", "Next year I'll live in Barcelona.": "Nächstes Jahr werde ich in Barcelona wohnen.", "Will you have time tomorrow?": "Wirst du morgen Zeit haben?", "We'll make dinner.": "Wir machen das Abendessen.", "Which structure is most common for near plans in spoken Spanish?": "Welche Struktur ist für nahe Pläne im gesprochenen Spanisch am häufigsten?", "I don't know where Luis is. He's probably at work.": "Ich weiß nicht, wo Luis ist. Er ist wahrscheinlich bei der Arbeit.", "The futuro can also guess about the present.": "Das futuro kann auch Vermutungen über die Gegenwart ausdrücken.", "They won't be able to come.": "Sie werden nicht kommen können.", "Politeness, wishes, advice": "Höflichkeit, Wünsche, Ratschläge", "would": "würde / Konjunktiv II", "The equivalent of English <b>would<\/b>. Used in polite requests, wishes, advice and hypotheses. Easy to form: the futuro stem + the -er/-ir endings of the imperfecto.": "Entspricht dem englischen <b>would<\/b> und dem deutschen <b>würde<\/b> bzw. Konjunktiv II. Wird für höfliche Bitten, Wünsche, Ratschläge und Hypothesen verwendet. Leicht zu bilden: Stamm des futuro + die -er/-ir-Endungen des imperfecto.", "Irregular stems = same as futuro": "Unregelmäßige Stämme = wie beim futuro", "Could you help me, please?": "Könnten Sie mir bitte helfen?", "Wishes": "Wünsche", "I'd like to live in the centre.": "Ich würde gern im Zentrum wohnen.", "Advice": "Ratschläge", "If I were you, I'd talk to the landlord.": "An deiner Stelle würde ich mit dem Vermieter sprechen.", "Hypotheses": "Hypothesen", "With more money, I'd buy a flat.": "Mit mehr Geld würde ich eine Wohnung kaufen.", "In “Si tuviera dinero, compraría…”, <b>tuviera<\/b> is the imperfect subjunctive (B1+). For now, learning the condicional part is enough.": "In „Si tuviera dinero, compraría…“ ist <b>tuviera<\/b> der Konjunktiv Imperfekt (B1+). Für den Moment reicht es, das condicional zu lernen.", "I'd like a coffee with milk, please.": "Ich hätte gern einen Milchkaffee, bitte.", "Could you open the window?": "Könnten Sie das Fenster öffnen?", "If I were you, I wouldn't do it.": "An deiner Stelle würde ich es nicht machen.", "We'd travel more, but we don't have time.": "Wir würden mehr reisen, aber wir haben keine Zeit.", "Hypothesis → condicional.": "Hypothese → condicional.", "He would have to come tomorrow.": "Er müsste morgen kommen.", "What would you say in my place?": "Was würdest du an meiner Stelle sagen?", "Commands and instructions": "Befehle und Anweisungen", "imperative (speak! / don't speak!)": "Imperativ (sprich! / sprechen Sie!)", "Used for commands, instructions, advice and invitations. The affirmative <b>tú<\/b> form is the easiest. The <b>usted<\/b> form and all <b>negative<\/b> commands come from the subjunctive.": "Wird für Befehle, Anweisungen, Ratschläge und Einladungen verwendet. Die bejahte <b>tú<\/b>-Form ist die einfachste. Die <b>usted<\/b>-Form und alle <b>verneinten<\/b> Befehle kommen aus dem Subjuntivo.", "Affirmative commands": "Bejahte Befehle", "Rules": "Regeln", "tú affirmative": "tú bejaht", "= the él form of the presente: habla, come, cierra, vuelve": "= die él-Form des presente: habla, come, cierra, vuelve", "tú irregular (8 verbs)": "tú unregelmäßig (8 Verben)", "Negative = no + subjunctive": "Verneint = no + Subjuntivo", "Pronouns": "Pronomen", "Attached to the end in the affirmative: <b>dímelo<\/b>, <b>siéntate<\/b>. In front in the negative: <b>no me lo digas<\/b>.": "Im bejahten Befehl werden sie angehängt: <b>dímelo<\/b>, <b>siéntate<\/b>. Im verneinten stehen sie davor: <b>no me lo digas<\/b>.", "Instructions": "Anweisungen", "Go straight on and turn right.": "Gehen Sie geradeaus und biegen Sie rechts ab.", "Fill in this form, please.": "Füllen Sie bitte dieses Formular aus.", "Requests and advice": "Bitten und Ratschläge", "Speak more slowly, please.": "Sprich bitte langsamer.", "Don't worry.": "Mach dir keine Sorgen.", "Spaniards use the imperative a lot and it isn't rude. <i>Ponme una caña<\/i> (Give me a small beer) is completely normal in a bar.": "Spanier verwenden den Imperativ sehr oft und er ist nicht unhöflich. <i>Ponme una caña<\/i> (Gib mir ein kleines Bier) ist in einer Bar völlig normal.", "Speak more slowly, please!": "Sprich bitte langsamer!", "tú affirmative = presente él: habla.": "tú bejaht = presente él: habla.", "Close the door!": "Mach die Tür zu!", "cerrar: e → ie, él cierra, so the command is cierra.": "cerrar: e → ie, él cierra, also lautet der Befehl cierra.", "Come here!": "Komm her!", "venir → ven (irregular).": "venir → ven (unregelmäßig).", "Don't do that!": "Mach das nicht!", "Negative command = no + subjunctive: no hagas.": "Verneinter Befehl = no + Subjuntivo: no hagas.", "Sign here, please.": "Unterschreiben Sie bitte hier.", "The usted command comes from the subjunctive: firme.": "Der usted-Befehl kommt aus dem Subjuntivo: firme.", "Tell the truth!": "Sag die Wahrheit!", "Wishes, wants, feelings, doubt": "Wünsche, Wollen, Gefühle, Zweifel", "(I want you) to…, may…": "dass … (Wunsch, Gefühl, Zweifel)", "It doesn't express facts but <b>wishes, wants, feelings, doubt and things that haven't happened yet<\/b>. It usually comes after <b>que<\/b> when the main clause has a different subject: <i>Quiero <b>que vengas<\/b><\/i> → “I want you to come”.": "Er drückt keine Tatsachen aus, sondern <b>Wünsche, Willen, Gefühle, Zweifel und Dinge, die noch nicht passiert sind<\/b>. Er steht meist nach <b>que<\/b>, wenn der Hauptsatz ein anderes Subjekt hat: <i>Quiero <b>que vengas<\/b><\/i> → „Ich will, dass du kommst“.", "Formula: yo presente → drop -o → switch the vowel": "Formel: yo im presente → -o weg → Vokal tauschen", "Irregulars": "Unregelmäßige Formen", "6 fully irregular": "6 völlig unregelmäßige", "From the yo stem": "Vom yo-Stamm", "Spelling": "Schreibweise", "Wants (different subject)": "Wollen (anderes Subjekt)", "I want you to come to the party.": "Ich möchte, dass du zur Party kommst.", "Wishes and feelings": "Wünsche und Gefühle", "I hope you're well.": "Ich hoffe, es geht dir gut.", "Hopefully it'll be sunny tomorrow.": "Hoffentlich scheint morgen die Sonne.", "Cuando + future": "Cuando + Zukunft", "“When…” about the future": "„Wenn …“ in der Zukunft", "When you arrive, call me.": "Wenn du ankommst, ruf mich an.", "Evaluations": "Bewertungen", "It's important that we talk.": "Es ist wichtig, dass wir reden.", "Short reminder <b>WEIRDO<\/b>: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt, Ojalá.": "Kurze Eselsbrücke <b>WEIRDO<\/b>: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt, Ojalá.", "<b>Creo que<\/b> and <b>pienso que<\/b> take the indicative (Creo que <i>tienes<\/i> razón). <b>No creo que<\/b> takes the subjunctive (No creo que <i>tengas<\/i> razón).": "<b>Creo que<\/b> und <b>pienso que<\/b> stehen mit dem Indikativ (Creo que <i>tienes<\/i> razón). <b>No creo que<\/b> steht mit dem Subjuntivo (No creo que <i>tengas<\/i> razón).", "I want you to come with me.": "Ich will, dass du mit mir kommst.", "querer que + different subject → subjunctive.": "querer que + anderes Subjekt → Subjuntivo.", "When I get home, I'll call you.": "Wenn ich nach Hause komme, rufe ich dich an.", "cuando + future → subjunctive: llegue.": "cuando + Zukunft → Subjuntivo: llegue.", "I think you're right.": "Ich glaube, du hast recht.", "Affirmative creo que → indicative.": "Bejahtes creo que → Indikativ.", "It's important that we talk to him.": "Es ist wichtig, dass wir mit ihm reden.", "Ser or estar?": "Ser oder estar?", "The two verbs “to be”": "Die zwei Verben für „sein“", "to be": "sein", "Both mean “to be”. <b>Ser<\/b> says what or who something is (identity, job, origin, character, time); <b>estar<\/b> says how or where it is (states, feelings, location).": "Beide bedeuten „sein“. <b>Ser<\/b> sagt, was oder wer etwas ist (Identität, Beruf, Herkunft, Charakter, Uhrzeit); <b>estar<\/b> sagt, wie oder wo es ist (Zustände, Gefühle, Ort).", "Conjugation (presente)": "Konjugation (presente)", "Which one when?": "Wann welches?", "Identity, job, origin, character, physical traits, time and date, material, where an event takes place<br><i>Soy ingeniero. Es de Kayseri. Son las tres. La fiesta es en mi casa.<\/i>": "Identität, Beruf, Herkunft, Charakter, Aussehen, Uhrzeit und Datum, Material, Ort einer Veranstaltung<br><i>Soy ingeniero. Es de Kayseri. Son las tres. La fiesta es en mi casa.<\/i>", "Location, current state, feelings, health, resulting state, estar + gerund<br><i>Estoy en Madrid. Estoy cansado. La tienda está cerrada.<\/i>": "Ort, momentaner Zustand, Gefühle, Gesundheit, Ergebniszustand, estar + Gerundium<br><i>Estoy en Madrid. Estoy cansado. La tienda está cerrada.<\/i>", "Adjectives that change meaning": "Adjektive, die ihre Bedeutung ändern", "ser listo = clever · estar listo = ready<br>ser aburrido = boring · estar aburrido = bored<br>ser malo = bad · estar malo = ill": "ser listo = klug · estar listo = fertig, bereit<br>ser aburrido = langweilig · estar aburrido = gelangweilt<br>ser malo = schlecht · estar malo = krank", "Examples": "Beispiele", "I'm from Turkey, but I'm in Madrid.": "Ich komme aus der Türkei, aber ich bin in Madrid.", "My boss is very nice, but today he's angry.": "Mein Chef ist sehr nett, aber heute ist er verärgert.", "Location uses <b>estar<\/b> (<i>El banco está en la calle Alcalá<\/i>). But where an <b>event<\/b> takes place uses <b>ser<\/b> (<i>La reunión es en la sala 3<\/i>).": "Für den Ort nimmt man <b>estar<\/b> (<i>El banco está en la calle Alcalá<\/i>). Für den Ort einer <b>Veranstaltung<\/b> aber <b>ser<\/b> (<i>La reunión es en la sala 3<\/i>).", "I'm an engineer.": "Ich bin Ingenieur.", "Job → ser.": "Beruf → ser.", "Madrid is in the centre of Spain.": "Madrid liegt in der Mitte Spaniens.", "Location → estar.": "Ort → estar.", "I'm very tired today.": "Ich bin heute sehr müde.", "Temporary state → estar.": "Vorübergehender Zustand → estar.", "The meeting is in room 3.": "Die Besprechung ist in Raum 3.", "Where an event takes place → ser.": "Ort einer Veranstaltung → ser.", "This film is boring.": "Dieser Film ist langweilig.", "“Boring” (a trait) → ser. “Estoy aburrido” = I'm bored.": "„Langweilig“ (Eigenschaft) → ser. „Estoy aburrido“ = Mir ist langweilig.", "It's half past three.": "Es ist halb vier.", "Time → ser.": "Uhrzeit → ser.", "Are you ready? We're leaving.": "Bist du fertig? Wir gehen.", "estar listo = to be ready.": "estar listo = fertig / bereit sein.", "Everyday": "Alltag", "How's it going?": "Wie geht's?", "Can you repeat that, please?": "Kannst du das bitte wiederholen?", "Slower, please.": "Langsamer, bitte.", "How do you say … in Spanish?": "Wie sagt man … auf Spanisch?", "OK.": "Okay.", "Really?": "Echt?", "I don't mind.": "Ist mir egal.", "How nice!": "Wie schön!", "Excuse me, do you have a moment?": "Entschuldigung, hast du kurz Zeit?", "Sorry, I don't know.": "Tut mir leid, ich weiß es nicht.", "See you later.": "Bis später.", "Bars & restaurants": "Bars & Restaurants", "A table for two, please.": "Einen Tisch für zwei, bitte.", "What do you recommend?": "Was empfehlen Sie mir?", "For me, the set menu.": "Für mich das Tagesmenü.", "Can I get a small beer?": "Kann ich ein kleines Bier bekommen?", "The bill, please.": "Die Rechnung, bitte.", "Can I pay by card?": "Kann man mit Karte zahlen?", "Does it contain pork?": "Ist da Schweinefleisch drin?", "It's delicious.": "Es ist köstlich.", "For here or to take away?": "Zum Hieressen oder zum Mitnehmen?", "A white coffee, please.": "Einen Milchkaffee, bitte.", "Do you have an outdoor terrace?": "Haben Sie eine Terrasse?", "It's on me.": "Ich lade dich ein.", "Bank & paperwork": "Bank & Behörden", "I'd like to open an account.": "Ich würde gern ein Konto eröffnen.", "I want to set up a direct debit for the bill.": "Ich möchte die Rechnung per Lastschrift bezahlen.", "What documents do I need?": "Welche Unterlagen brauche ich?", "I need to book an appointment.": "Ich muss einen Termin vereinbaren.", "Where do I have to sign?": "Wo muss ich unterschreiben?", "They've charged me a fee.": "Man hat mir eine Gebühr berechnet.", "I want to close the account.": "Ich möchte das Konto kündigen.", "How long does the transfer take?": "Wie lange dauert die Überweisung?", "I have to register at the town hall.": "Ich muss mich beim Einwohneramt anmelden.", "Can you give me a proof / receipt?": "Können Sie mir eine Bescheinigung / Quittung geben?", "Fill in this form.": "Füllen Sie dieses Formular aus.", "Home & rent": "Wohnung & Miete", "Does the rent include bills?": "Sind die Nebenkosten in der Miete enthalten?", "Are the building fees included?": "Sind die Hausgebühren inklusive?", "When do I get my deposit back?": "Wann bekomme ich meine Kaution zurück?", "The heating has broken down.": "Die Heizung ist kaputt.", "There's a water leak.": "Es gibt ein Wasserleck.", "Can a technician come?": "Kann ein Techniker kommen?", "The contract ends in March.": "Der Vertrag läuft im März aus.", "How much is the rent going up this year?": "Um wie viel steigt die Miete dieses Jahr?", "I have to talk to the landlord.": "Ich muss mit dem Vermieter sprechen.", "The neighbours are very noisy.": "Die Nachbarn sind sehr laut.", "Are pets allowed?": "Sind Haustiere erlaubt?", "Work & office": "Arbeit & Büro", "I have a meeting at ten.": "Ich habe um zehn eine Besprechung.", "Can we speak in English?": "Können wir Englisch sprechen?", "I'll send it to you by email.": "Ich schicke es dir per E-Mail.", "I'm swamped.": "Ich habe viel um die Ohren.", "When's the deadline?": "Wann ist die Frist?", "I'll get on it.": "Ich kümmere mich darum.", "Shall we meet for lunch?": "Gehen wir zusammen Mittag essen?", "I'm working from home today.": "Heute arbeite ich im Homeoffice.", "I didn't quite get it, can you explain again?": "Ich habe es nicht ganz verstanden, kannst du es noch einmal erklären?", "We'll talk about it later.": "Wir sprechen später darüber.", "I'm on holiday next week.": "Nächste Woche bin ich im Urlaub.", "Good job!": "Gute Arbeit!", "Health": "Gesundheit", "I feel unwell.": "Ich fühle mich nicht gut.", "I have a headache.": "Ich habe Kopfschmerzen.", "I need to make a doctor's appointment.": "Ich muss einen Arzttermin vereinbaren.", "I have a fever.": "Ich habe Fieber.", "Do I need a prescription?": "Brauche ich ein Rezept?", "I'm allergic to penicillin.": "Ich bin allergisch gegen Penicillin.", "How often do I have to take it?": "Wie oft muss ich es nehmen?", "I have my health card.": "Ich habe meine Krankenversicherungskarte.", "I've twisted my ankle.": "Ich habe mir den Knöchel verstaucht.", "Where's the on-duty pharmacy?": "Wo ist die Notdienstapotheke?", "Getting around": "Unterwegs in der Stadt", "Which line goes to Sol?": "Welche Linie fährt nach Sol?", "Where do you top up the travel pass?": "Wo lädt man die Monatskarte auf?", "Will you let me know when we get there?": "Sagen Sie mir Bescheid, wenn wir ankommen?", "Is it far from here?": "Ist es weit von hier?", "A return ticket to Toledo.": "Eine Hin- und Rückfahrkarte nach Toledo.", "What time does the next train leave?": "Wann fährt der nächste Zug?", "I've missed the bus.": "Ich habe den Bus verpasst.", "What's the next stop?": "Was ist die nächste Haltestelle?", "There's a metro strike.": "Es gibt einen U-Bahn-Streik.", "Social & feelings": "Freizeit & Gefühle", "What are your plans for the weekend?": "Was hast du am Wochenende vor?", "Fancy a drink?": "Hast du Lust, etwas trinken zu gehen?", "I love it.": "Ich liebe es.", "That's a shame / it makes me sad.": "Wie schade / das macht mich traurig.", "I'm exhausted.": "Ich bin fix und fertig.", "How cool!": "Wie cool!", "I'm looking forward to seeing you.": "Ich freue mich darauf, dich zu sehen.", "I like him/her (as a person).": "Ich mag ihn/sie (als Person).", "No problem / It's fine.": "Kein Problem / Schon gut.", "What a drag!": "Wie öde!", "Let's meet at eight.": "Treffen wir uns um acht.", "to speak": "sprechen", "to work": "arbeiten", "to eat": "essen", "to live": "wohnen, leben", "to write": "schreiben", "to study": "lernen, studieren", "to buy": "kaufen", "to drink": "trinken", "to learn": "lernen", "to open": "öffnen", "to arrive": "ankommen", "to look for": "suchen", "to pay": "bezahlen", "to take / have": "nehmen / trinken", "to call": "anrufen", "to need": "brauchen", "to travel": "reisen", "to cook": "kochen", "to sell": "verkaufen", "to receive": "bekommen, erhalten", "to decide": "entscheiden", "to be (permanent)": "sein (dauerhaft)", "to be (state, place)": "sein (Zustand, Ort)", "to go": "gehen, fahren", "to have": "haben", "to do / make": "machen, tun", "can / to be able to": "können", "to want": "wollen", "to say / tell": "sagen", "to come": "kommen", "to put": "stellen, legen", "to know (facts)": "wissen", "to go out / leave": "ausgehen, hinausgehen", "to see / watch": "sehen / anschauen", "to give": "geben", "to sleep": "schlafen", "to ask for / order": "bitten um / bestellen", "to think": "denken", "to begin": "anfangen", "to return": "zurückkehren", "to play": "spielen", "to know (people/places)": "kennen (Personen/Orte)", "to read": "lesen", "to bring": "bringen", "usually": "normalerweise", "every day": "jeden Tag", "on Mondays": "montags", "often": "oft", "today": "heute", "this morning": "heute Morgen", "this week": "diese Woche", "this month": "diesen Monat", "yesterday": "gestern", "last night": "gestern Abend", "last week": "letzte Woche", "last year": "letztes Jahr", "two days ago": "vor zwei Tagen", "before, always": "früher immer", "back then, often": "damals oft", "as kids, every summer": "als Kinder jeden Sommer", "at that time, every day": "zu der Zeit jeden Tag", "tomorrow": "morgen", "next week": "nächste Woche", "next year": "nächstes Jahr", "in a few days": "in ein paar Tagen", "with more time": "mit mehr Zeit", "with more money": "mit mehr Geld", "in another situation": "in einer anderen Situation", "I hope that": "ich hoffe, dass", "I want (someone) to": "ich will, dass (jemand)", "hopefully": "hoffentlich", "it's important that": "es ist wichtig, dass", "when the phone rang": "als das Telefon klingelte", "Routine, now or a general fact → presente.": "Routine, jetzt oder eine allgemeine Tatsache → presente.", "A period that isn't over yet → pretérito perfecto (haber + participle).": "Ein noch nicht abgeschlossener Zeitraum → pretérito perfecto (haber + Partizip).", "A finished, specific time → indefinido.": "Eine abgeschlossene, bestimmte Zeit → indefinido.", "A past habit → imperfecto.": "Eine Gewohnheit in der Vergangenheit → imperfecto.", "Future → futuro.": "Zukunft → futuro.", "Hypothesis / “would” → condicional.": "Hypothese / „würde“ → condicional.", "Wish, want, evaluation → subjuntivo.": "Wunsch, Wille, Bewertung → subjuntivo.", "points to a specific, finished time, so indefinido": "zeigt einen bestimmten, abgeschlossenen Zeitpunkt, also indefinido", "describes a past habit, so imperfecto": "beschreibt eine Gewohnheit in der Vergangenheit, also imperfecto", "is a period that isn't over yet, so in Spain it's perfecto": "ist ein noch nicht abgeschlossener Zeitraum, also in Spanien perfecto", "Mixed: all tenses": "Gemischt: alle Zeiten", "Gustar and similar verbs (encantar, doler…)": "Gustar und ähnliche Verben (encantar, doler…)", "Object pronouns (lo, la, le, se lo)": "Objektpronomen (lo, la, le, se lo)", "Reflexive verbs (levantarse, ducharse…)": "Reflexive Verben (levantarse, ducharse…)", "None, only the topic I type below": "Keins, nur das Thema, das ich unten eingebe", "A Sunday at the Rastro": "Ein Sonntag auf dem Rastro", "It's Sunday morning and Daniel isn't working. He gets up at nine, has coffee and toast for breakfast and leaves the house. It's sunny and there are lots of people in the street. Daniel takes the metro to La Latina, because he wants to visit the Rastro, the most famous market in Madrid.": "Es ist Sonntagmorgen und Daniel arbeitet nicht. Er steht um neun auf, frühstückt Kaffee und Toast und verlässt das Haus. Die Sonne scheint und auf der Straße sind viele Leute. Daniel nimmt die U-Bahn bis La Latina, denn er möchte den Rastro besuchen, den berühmtesten Markt Madrids.", "At the Rastro there's a bit of everything: clothes, old books, records and furniture. Daniel looks at a Spanish cookbook. “How much is it?” he asks. “Eight euros,” says the seller. Daniel smiles and pays with a ten-euro note. Then he sits on a terrace with a friend and they have a couple of small beers and some tapas. For Daniel, this is the perfect Sunday.": "Auf dem Rastro gibt es alles Mögliche: Kleidung, alte Bücher, Schallplatten und Möbel. Daniel schaut sich ein spanisches Kochbuch an. „Was kostet das?“, fragt er. „Acht Euro“, sagt der Verkäufer. Daniel lächelt und bezahlt mit einem Zehneuroschein. Danach setzt er sich mit einem Freund auf eine Terrasse und sie trinken ein paar kleine Bier und essen Tapas. Für Daniel ist das der perfekte Sonntag.", "to get up": "aufstehen", "to have breakfast": "frühstücken", "to take the metro": "die U-Bahn nehmen", "the seller": "der Verkäufer", "a banknote": "ein Geldschein", "a small draught beer": "ein kleines Bier vom Fass", "What day is it?": "Welcher Tag ist heute?", "“Es domingo por la mañana”. The Rastro is held on Sundays.": "„Es domingo por la mañana“. Der Rastro findet sonntags statt.", "How much is the book?": "Wie viel kostet das Buch?", "The seller says “Ocho euros”. Daniel pays with a ten-euro note.": "Der Verkäufer sagt „Ocho euros“. Daniel bezahlt mit einem Zehneuroschein.", "How does Daniel get to La Latina?": "Wie kommt Daniel nach La Latina?", "My first day at the office": "Mein erster Tag im Büro", "Today was my first day at the new office. I got up very early because I was nervous, and I arrived at half past eight, half an hour earlier than I needed to. The receptionist gave me a card and showed me my desk.": "Heute war mein erster Tag im neuen Büro. Ich bin sehr früh aufgestanden, weil ich nervös war, und um halb neun angekommen, eine halbe Stunde früher als nötig. Die Empfangsdame hat mir eine Karte gegeben und mir meinen Schreibtisch gezeigt.", "In the morning I had three meetings. My colleagues have been very kind to me, although they speak very fast and I haven't understood everything. At two we had lunch together at a restaurant near the office. I ordered the set menu: lentils, roast chicken and flan.": "Am Vormittag hatte ich drei Besprechungen. Meine Kollegen waren sehr freundlich zu mir, auch wenn sie sehr schnell sprechen und ich nicht alles verstanden habe. Um zwei haben wir zusammen in einem Restaurant in der Nähe des Büros gegessen. Ich habe das Tagesmenü bestellt: Linsen, Brathähnchen und Flan.", "This afternoon I came home tired but happy. I haven't learned everyone's names yet, but I've already made a friend: Javier, who's an engineer too. More tomorrow.": "Heute Nachmittag bin ich müde, aber zufrieden nach Hause gekommen. Ich habe mir noch nicht alle Namen gemerkt, aber ich habe schon einen Freund gefunden: Javier, der auch Ingenieur ist. Morgen mehr.", "early": "früh", "nervous": "nervös", "to show": "zeigen", "colleagues": "Kollegen", "although": "obwohl, auch wenn", "not yet": "noch nicht", "What time did he arrive at the office?": "Um wie viel Uhr ist er im Büro angekommen?", "Why hasn't he understood everything?": "Warum hat er nicht alles verstanden?", "Who is Javier?": "Wer ist Javier?", "Summers in the village": "Sommer im Dorf", "When I was little, I used to spend every summer in my grandparents' village. The village was very small: it had a square, a church, a bakery and not much else. There was no internet there, but I never got bored.": "Als ich klein war, verbrachte ich jeden Sommer im Dorf meiner Großeltern. Das Dorf war sehr klein: Es hatte einen Platz, eine Kirche, eine Bäckerei und nicht viel mehr. Dort gab es kein Internet, aber mir war nie langweilig.", "In the mornings, my grandfather and I would go to the vegetable garden to pick tomatoes. My grandmother cooked while she listened to the radio, and the house always smelled of freshly baked bread. In the afternoons it was very hot, so we all had a nap.": "Morgens gingen mein Großvater und ich in den Gemüsegarten, um Tomaten zu pflücken. Meine Großmutter kochte, während sie Radio hörte, und das Haus roch immer nach frisch gebackenem Brot. Nachmittags war es sehr heiß, also hielten wir alle Siesta.", "At night, the neighbours would bring their chairs out into the street and talk until very late. We children played in the square. Now I live in Madrid and have a lot of work, but sometimes I close my eyes and I can still smell my grandmother's bread.": "Abends stellten die Nachbarn ihre Stühle auf die Straße und unterhielten sich bis spät in die Nacht. Wir Kinder spielten auf dem Platz. Jetzt wohne ich in Madrid und habe viel Arbeit, aber manchmal schließe ich die Augen und kann das Brot meiner Großmutter immer noch riechen.", "village": "das Dorf", "to get bored": "sich langweilen", "vegetable garden": "der Gemüsegarten", "to pick": "pflücken, ernten", "to smell of": "riechen nach", "afternoon nap": "der Mittagsschlaf", "Where did she spend her summers?": "Wo verbrachte sie ihre Sommer?", "What did the grandmother do while she cooked?": "Was machte die Großmutter, während sie kochte?", "Why did they have a nap?": "Warum hielten sie Siesta?", "The lost key": "Der verlorene Schlüssel", "It was Friday night and it was raining hard. Lucía was coming home after having dinner with her friends. When she got to the door of her building, she looked for her keys in her bag, but they weren't there.": "Es war Freitagabend und es regnete stark. Lucía war auf dem Heimweg, nachdem sie mit ihren Freundinnen zu Abend gegessen hatte. Als sie an der Tür ihres Hauses ankam, suchte sie die Schlüssel in ihrer Handtasche, aber sie waren nicht da.", "First she called her flatmate, but she didn't answer: she was away on a trip in Valencia. Then she called the restaurant. A waiter looked under the table and found the keys. “What luck!” Lucía thought, and she went back to the restaurant by taxi.": "Zuerst rief sie ihre Mitbewohnerin an, aber die ging nicht ran: Sie war gerade in Valencia unterwegs. Dann rief sie im Restaurant an. Ein Kellner schaute unter den Tisch und fand die Schlüssel. „Was für ein Glück!“, dachte Lucía und fuhr mit dem Taxi zurück zum Restaurant.", "When she finally got home, it was one in the morning and she was soaked. She had a hot shower, put on her pyjamas and fell asleep straight away. Since that day, she always carries a copy of the key in her wallet.": "Als sie endlich zu Hause war, war es ein Uhr nachts und sie war klatschnass. Sie duschte heiß, zog ihren Schlafanzug an und schlief sofort ein. Seit diesem Tag trägt sie immer einen Ersatzschlüssel im Portemonnaie.", "handbag": "die Handtasche", "flatmate": "die Mitbewohnerin", "to answer": "antworten, rangehen", "to find": "finden", "soaked": "klatschnass", "the early hours": "die frühen Morgenstunden", "What was the weather like?": "Wie war das Wetter?", "“Era viernes por la noche y llovía mucho.” Describing the weather → imperfecto.": "„Era viernes por la noche y llovía mucho.“ Wetterbeschreibung → imperfecto.", "Where were the keys?": "Wo waren die Schlüssel?", "Why didn't the flatmate answer?": "Warum ging die Mitbewohnerin nicht ran?", "Flat hunting": "Wohnungssuche", "Marta and Tomás have been looking for a flat in Madrid for two months. They've seen more than fifteen flats, but they still haven't found the right one. Some are too expensive, others are very far from the centre, and one didn't even have a window in the bedroom.": "Marta und Tomás suchen seit zwei Monaten eine Wohnung in Madrid. Sie haben mehr als fünfzehn Wohnungen besichtigt, aber die richtige haben sie immer noch nicht gefunden. Manche sind zu teuer, andere liegen weit vom Zentrum entfernt, und eine hatte nicht einmal ein Fenster im Schlafzimmer.", "This morning they visited a flat in Chamberí. It has two bedrooms, lots of light and a new kitchen. The rent is a bit high, but the building fees are included. The landlady is very nice and has told them they can have a cat.": "Heute Morgen haben sie eine Wohnung in Chamberí besichtigt. Sie hat zwei Schlafzimmer, viel Licht und eine neue Küche. Die Miete ist etwas hoch, aber die Hausgebühren sind inklusive. Die Vermieterin ist sehr nett und hat ihnen gesagt, dass sie eine Katze haben dürfen.", "Now they're in a café doing the maths. “If we stop eating out at weekends, we can afford it,” says Tomás. Marta smiles and picks up her phone: “OK, I'll call her right now, before someone else rents it.”": "Jetzt sitzen sie in einem Café und rechnen. „Wenn wir am Wochenende nicht mehr auswärts essen, können wir es uns leisten“, sagt Tomás. Marta lächelt und nimmt ihr Handy: „Okay, ich rufe sie sofort an, bevor jemand anderes sie mietet.“", "to look for a flat": "eine Wohnung suchen", "for (a period of time)": "seit (Zeitraum)", "the rent": "die Miete", "building fees": "die Hausgebühren", "the landlady": "die Vermieterin", "to do the maths": "rechnen", "How many flats have they seen?": "Wie viele Wohnungen haben sie besichtigt?", "What is included in the rent of the Chamberí flat?": "Was ist in der Miete der Wohnung in Chamberí enthalten?", "What is Marta going to do at the end?": "Was wird Marta am Ende tun?", "Plans for the long weekend": "Pläne für das lange Wochenende", "Next Thursday is a public holiday, so Ana and her friends are going to have a four-day long weekend. This year they're not going to the beach: they're going to do a trip around Toledo and Segovia. They'll leave early on Thursday by car and come back on Sunday night.": "Nächsten Donnerstag ist Feiertag, also haben Ana und ihre Freunde ein langes Wochenende von vier Tagen. Dieses Jahr fahren sie nicht an den Strand: Sie machen eine Tour durch Toledo und Segovia. Sie fahren am Donnerstag früh mit dem Auto los und kommen am Sonntagabend zurück.", "In Toledo they'll stay in a small hotel in the old town. Ana wants to see the cathedral and buy marzipan for her mother. In Segovia they'll eat roast suckling pig, although Pablo, who's a vegetarian, will order something else. According to the forecast, it'll be cold but it won't rain.": "In Toledo übernachten sie in einem kleinen Hotel in der Altstadt. Ana möchte die Kathedrale sehen und Marzipan für ihre Mutter kaufen.  gut es mir geht.", "In the evening we'd watch the sunset from the Temple of Debod and end the day with a simple dinner at home. I wouldn't need anything else. Maybe it isn't a very original plan, but for me it would be perfect.": "Am Abend würden wir den Sonnenuntergang vom Templo de Debod aus ansehen und den Tag mit einem einfachen Abendessen zu Hause beenden. Mehr bräuchte ich nicht. Vielleicht ist das kein sehr origineller Plan, aber für mich wäre er perfekt.", "alarm clock": "der Wecker", "to go for a walk": "spazieren gehen", "to rent": "mieten", "without rushing": "ohne Eile", "sunset": "der Sonnenuntergang", "simple": "einfach", "Where would they have breakfast?": "Wo würden sie frühstücken?", "What would they buy in the afternoon?": "Was würde die Person am Nachmittag kaufen?", "Where would they watch the sunset from?": "Von wo aus würden sie den Sonnenuntergang ansehen?", "Dinner with the neighbours": "Ein Abendessen mit den Nachbarn", "On Saturday, Elena and Kerem are inviting their new neighbours to dinner for the first time. Elena is a bit nervous: she wants everything to go well and hopes the neighbours will like Turkish food. Kerem tells her not to worry.": "Am Samstag laden Elena und Kerem ihre neuen Nachbarn zum ersten Mal zum Abendessen ein. Elena ist etwas nervös: Sie möchte, dass alles gut läuft, und hofft, dass den Nachbarn das türkische Essen schmeckt. Kerem sagt ihr, sie solle sich keine Sorgen machen.", "In the morning they go to the market together. Kerem wants them to buy aubergines to make karnıyarık, and Elena would rather they also make a simple salad, in case someone doesn't eat meat. “It's important that there are options for everyone,” she says.": "Am Morgen gehen sie zusammen auf den Markt. Kerem möchte, dass sie Auberginen kaufen, um Karnıyarık zu machen, und Elena möchte lieber, dass sie auch einen einfachen Salat zubereiten, falls jemand kein Fleisch isst. „Es ist wichtig, dass es für alle etwas gibt“, sagt sie.", "At nine the doorbell rings. The neighbours bring a bottle of wine and a homemade dessert. Over dinner they talk about their countries, about Madrid and about their jobs. At the end, the neighbour says: “I hope we do this again soon. Next time, when you come to our place, we'll make you a paella.”": "Um neun klingelt es an der Tür. Die Nachbarn bringen eine Flasche Wein und einen selbst gemachten Nachtisch mit. Beim Essen sprechen sie über ihre Länder, über Madrid und über ihre Arbeit. Am Ende sagt die Nachbarin: „Hoffentlich wiederholen wir das bald. Wenn ihr nächstes Mal zu uns kommt, machen wir euch eine Paella.“", "to go well": "gut laufen, gelingen", "to worry": "sich Sorgen machen", "aubergine": "die Aubergine", "in case": "falls, für den Fall, dass", "doorbell": "die Türklingel", "homemade": "selbst gemacht", "What does Elena want?": "Was möchte Elena?", "“Quiere que todo salga bien”: querer que + subjunctive.": "„Quiere que todo salga bien“: querer que + Subjuntivo.", "Why do they also make a salad?": "Warum machen sie auch einen Salat?", "What do the neighbours bring?": "Was bringen die Nachbarn mit?"};

async function fetchJSON(url,ms=9000){
  const c=new AbortController();const tm=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}return await r.json();}
  finally{clearTimeout(tm);}
}
const htmlText=h=>{try{const d=new DOMParser().parseFromString(String(h),"text/html");return (d.body.textContent||"").replace(/\s+/g," ").trim();}catch(e){return String(h).replace(/<[^>]+>/g,"").trim();}};
async function mm(text,from,to){
  if(!text||from===to)return "";

    const r=await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,450))}&langpair=${from}|${to}`);
    const s=r&&r.responseData&&r.responseData.translatedText;
    if(r&&Number(r.responseStatus)===200&&s&&!/MYMEMORY WARNING|QUERY LENGTH|INVALID/i.test(s))return htmlText(s);
  }catch(e){}

}
async function wikt(term){

      if(/\b(form|inflection|plural|participle|gerund|singular|person|conjugation|imperative|feminine|masculine|indicative|subjunctive|preterite|imperfect|infinitive|diminutive|superlative)\b[^.;]*\bof\b/i.test(txt)&&/<a[^>]*>/.test(raw)){
        const links=[...String(raw).matchAll(/<a[^>]*>([^<]+)<\/a>/g)].map(m=>m[1]);
        if(links.length&&!out.formOf){out.formOf=links[links.length-1];out.formText=txt;}
        continue;
      }
      if(out.defs.length<3&&!out.defs.includes(txt))out.defs.push(txt);

      pes.forEach(pe=>{const es=htmlText(pe.example||"");if(out.ex.length<3&&es&&es.length<220)out.ex.push({es,en:htmlText(pe.translation||"")});});
      if(!pes.length)(d.examples||[]).forEach(x=>{const es=htmlText(x);if(out.ex.length<3&&es&&es.length<220)out.ex.push({es,en:""});});

  for(const k of Object.keys(LANGS)){
    if(k==="en"&&w.m.en)continue;
    const s=await mm(lemma,"es",k);
    if(s&&wkey(s)!==wkey(lemma))w.m[k]=[s];
  }
  if(!Object.keys(w.m).length)return null;
  w.ex=(p?p.ex:[]).slice(0,3);
  for(const x of w.ex){
    if(!x.en)x.en=await mm(x.es,"es","en");
    if(SEC())x[LANG]=await mm(x.es,"es",LANG);
  }

}
async function lookupWord(word){

  catch(e){return {w:null,status:navigator.onLine===false?"offline":"notfound"};}
}
async function createWord(raw,extra={}){

  const dup=wordsList().find(w=>wkey(w.es)===wkey(word)||wkey(w.typed||"")===wkey(word));
  if(dup)return {w:dup,dup:true};
  const {w,status}=await lookupWord(word);
  if(w){const d2=wordsList().find(x=>wkey(x.es)===wkey(w.es));if(d2)return {w:d2,dup:true};}
  const nw=w?Object.assign({id:"w"+Date.now().toString(36),added:Date.now(),note:"",st:newStats()},w)
    :{id:"w"+Date.now().toString(36),es:word,typed:word,pos:"",gender:"",m:{},usage:{},forms:"",ex:[],src:"manual",pending:true,added:Date.now(),note:"",st:newStats()};
  if(extra.note)nw.note=extra.note;
  if(extra.example&&extra.example.es&&!(nw.ex||[]).some(x=>x.es===extra.example.es))nw.ex=[...(nw.ex||[]),extra.example];
  store.words=[nw,...wordsList()];save();

}

function wordStem(w){
  let s=bare(w.es).toLowerCase().split(/\s+/)[0];
  if(/verb/i.test(w.pos||"")||/(ar|er|ir)(se)?$/.test(s)){s=s.replace(/se$/,"");if(/(ar|er|ir)$/.test(s)&&s.length>4)s=s.slice(0,-2);}
  else if(s.length>4)s=s.slice(0,-1);
  return s;
}
function wordQuestions(){
  const all=wordsList().filter(w=>wPrim(w));
  return shuffle(pickWords(10)).map(w=>{
    const types=["type"];if(all.length>=4)types.push("mc","mc");
    const stem=wordStem(w);
    const re=new RegExp("(^|[^\\p{L}])("+escRe(stem)+"\\p{L}*)","iu");
    const cl=(w.ex||[]).map(x=>{const m=x.es.match(re);return m?{x,form:m[2]}:null;}).filter(Boolean);
    if(cl.length)types.push("cloze","cloze");
    const tp=rnd(types);
    const exHtml=`<b>${esc(w.es)}</b> = ${esc(wPrim(w))}${w.ex&&w.ex[0]?`<br><i>${esc(w.ex[0].es)}</i>`:""}`;
    if(tp==="mc"){
      const others=[...new Set(shuffle(all.filter(o=>o!==w).map(wPrim)).filter(m=>m!==wPrim(w)))].slice(0,3);
      if(others.length>=2)return {wid:w.id,q:`${w.es} = ___`,h:posLabel(w.pos),opts:[wPrim(w),...others],ex:exHtml};
    }
    if(tp==="cloze"){
      const c=rnd(cl);const o={wid:w.id,q:c.x.es.replace(c.form,"___"),h:bare(w.es),a:[c.form],ex:exHtml};
      Object.keys(LANGS).forEach(k=>{if(c.x[k])o[k]=c.x[k];});return o;
    }
    return {wid:w.id,q:`${wPrim(w)} → ___`,h:t("inSpanish"),a:[w.es,bare(w.es)],ex:exHtml};
  });
}

let STOK=[],storySel=null;const PREV=new Map();
function tokenize(text){
  const out=[];const re=/\p{L}+(?:['’]\p{L}+)?/gu;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:text.slice(last,m.index),w:false,s:last,e:m.index});
    out.push({t:m[0],w:true,s:m.index,e:m.index+m[0].length});last=re.lastIndex;
  }
  if(last<text.length)out.push({t:text.slice(last),w:false,s:last,e:text.length});
  return out;
}

    <div class="sprev" id="sPrev">${have?esc(wPrim(have)):""}</div>

    <div class="btns"><button class="btn ghost sm" id="sL">${t("extL")}</button><button class="btn ghost sm" id="sR">${t("extR")}</button></div>
    <div class="btns" id="sAct">${have?`<span class="pill ok">${t("inList")}</span><a class="btn ghost sm" href="#w-${have.id}">${t("openWord")}</a>`:`<button class="btn" id="sAdd">${t("addToWords")}</button>`}</div>
    <div class="status" id="sS"></div></div>`;
  highlightSel();
  $("#sX").onclick=closeSheet;
  $("#sL").onclick=()=>{const toks=STOK[storySel.p];for(let x=storySel.i-1;x>=0;x--)if(toks[x].w){if(selWordCount()<6)storySel.i=x;break;}renderSheet();};
  $("#sR").onclick=()=>{const toks=STOK[storySel.p];for(let x=storySel.j+1;x<toks.length;x++)if(toks[x].w){if(selWordCount()<6)storySel.j=x;break;}renderSheet();};
  const add=$("#sAdd");
  if(add)add.onclick=async()=>{
    const ph=phrase,sent=selSentence(),title=storySel.s.title+(storySel.s.classic?" ("+storySel.s.lvl+")":"");
    add.disabled=true;const st=$("#sS");st.className="status";st.innerHTML=`<span class="spin"></span>${t("looking")}`;
    const r=await createWord(ph,{note:`📖 ${title}: «${sent}»`,example:{es:sent}});
    const st2=$("#sS");if(!st2||!storySel||selText()!==ph)return refreshSavedMarks();
    const a=$("#sAct");if(a)a.innerHTML="";
    st2.className="status";
    const link=r.w?` · <a href="#w-${r.w.id}">${t("openWord")}</a>`:"";
    st2.innerHTML=(r.dup?t("inList"):r.status==="ok"?esc(t("addedWord",r.w.es+" — "+wPrim(r.w))):esc(t("addedNoMeaning")))+link;
    if(r.w&&wPrim(r.w))$("#sPrev").textContent=wPrim(r.w);
    refreshSavedMarks();
  };
  if(!have)quickPreview(phrase);
}
async function quickPreview(phrase){
  const box=$("#sPrev");
  if(PREV.has(phrase)){if(box)box.textContent=PREV.get(phrase);return;}
  if(sampleFn||navigator.onLine===false)return;
  if(box)box.innerHTML=`<span class="spin"></span>`;
  let txt="";
  try{const r=await wikt(phrase.toLowerCase());if(r){const p=parseWikt(r);txt=p.defs.length?"🇬🇧 "+p.defs.slice(0,2).join("; "):p.formText?"🇬🇧 "+p.formText:"";}}catch(e){}
  PREV.set(phrase,txt);
  if(storySel&&selText()===phrase){const b=$("#sPrev");if(b)b.textContent=txt;}
}

A2:{paras:[
{es:"Había una vez una niña que siempre llevaba una capa roja, por eso todos la llamaban Caperucita Roja. Un día, su madre le dijo: «Tu abuela está enferma. Llévale esta cesta con pan y miel, pero no hables con nadie en el bosque». Caperucita salió de casa muy contenta.",
 en:"Once upon a time there was a girl who always wore a red cape, so everyone called her Little Red Riding Hood. One day, her mother said to her: “Your grandmother is ill. Take her this basket with bread and honey, but don't talk to anyone in the forest.” Little Red Riding Hood left home very happy.",
 tr:"Bir zamanlar her zaman kırmızı bir pelerin giyen bir kız varmış, bu yüzden herkes ona Kırmızı Başlıklı Kız dermiş. Bir gün annesi ona şöyle demiş: «Büyükannen hasta. Ona bu ekmek ve bal dolu sepeti götür, ama ormanda kimseyle konuşma.» Kırmızı Başlıklı Kız evden çok mutlu çıkmış.",
 de:"Es war einmal ein Mädchen, das immer einen roten Umhang trug, deshalb nannten es alle Rotkäppchen. Eines Tages sagte seine Mutter: „Deine Großmutter ist krank. Bring ihr diesen Korb mit Brot und Honig, aber sprich im Wald mit niemandem.“ Rotkäppchen ging sehr fröhlich aus dem Haus."},
{es:"En el bosque, un lobo le preguntó adónde iba, y ella se lo contó todo. El lobo corrió a casa de la abuela, se la comió y se puso su ropa. Cuando llegó Caperucita, le dijo: «¡Abuela, qué dientes tan grandes tienes!». «¡Son para comerte mejor!», gritó el lobo. Por suerte, un cazador oyó los gritos y las salvó a las dos.",
 en:"In the forest, a wolf asked her where she was going, and she told him everything. The wolf ran to the grandmother's house, ate her up and put on her clothes. When Little Red Riding Hood arrived, she said: “Grandmother, what big teeth you have!” “All the better to eat you with!” shouted the wolf. Luckily, a hunter heard the shouts and saved them both.",
 tr:"Ormanda bir kurt ona nereye gittiğini sormuş, o da her şeyi anlatmış. Kurt büyükannenin evine koşmuş, onu yutmuş ve kıyafetlerini giymiş. Kırmızı Başlıklı Kız gelince, «Büyükanne, dişlerin ne kadar büyük!» demiş. «Seni daha iyi yemek için!» diye bağırmış kurt. Neyse ki bir avcı bağırışları duymuş ve ikisini de kurtarmış.",

B1:{paras:[
{es:"Había una vez, en un pueblo junto a un gran bosque, una niña a la que su abuela le había regalado una capa roja con capucha. Le quedaba tan bien que nunca se la quitaba, y por eso todo el mundo empezó a llamarla Caperucita Roja. Una mañana, su madre preparó una cesta con pan recién hecho, miel y una botella de leche, y le pidió que se la llevara a la abuela, que estaba enferma.",
 en:"Once upon a time, in a village next to a great forest, there was a girl whose grandmother had given her a red cape with a hood. It suited her so well that she never took it off, and that's why everyone began to call her Little Red Riding Hood. One morning, her mother prepared a basket with freshly baked bread, honey and a bottle of milk, and asked her to take it to her grandmother, who was ill.",
 tr:"Bir zamanlar, büyük bir ormanın yanındaki bir köyde, büyükannesinin ona kapüşonlu kırmızı bir pelerin hediye ettiği bir kız varmış. Pelerin ona o kadar yakışıyormuş ki hiç çıkarmıyormuş, bu yüzden herkes ona Kırmızı Başlıklı Kız demeye başlamış. Bir sabah annesi taze ekmek, bal ve bir şişe sütle bir sepet hazırlamış ve hasta olan büyükannesine götürmesini istemiş.",
 de:"Es war einmal in einem Dorf an einem großen Wald ein Mädchen, dem seine Großmutter einen roten Umhang mit Kapuze geschenkt hatte. Er stand ihm so gut, dass es ihn nie auszog, und deshalb nannten es bald alle Rotkäppchen. Eines Morgens packte seine Mutter einen Korb mit frisch gebackenem Brot, Honig und einer Flasche Milch und bat es, ihn der Großmutter zu bringen, die krank war."},
{es:"«Ve directamente a casa de la abuela y no te salgas del camino», le advirtió su madre. Pero en el bosque había tantas flores que Caperucita se detuvo a recoger algunas. Entonces apareció un lobo muy educado que le preguntó adónde iba. Ella, que no sabía lo peligroso que era, le explicó dónde vivía su abuela. El lobo le propuso una carrera: él iría por un camino y ella por otro.",
 en:"“Go straight to your grandmother's house and don't leave the path,” her mother warned her. But there were so many flowers in the forest that Little Red Riding Hood stopped to pick some. Then a very polite wolf appeared and asked her where she was going. Not knowing how dangerous he was, she explained where her grandmother lived. The wolf suggested a race: he would take one path and she would take another.",
 tr:"«Doğruca büyükannenin evine git ve yoldan ayrılma» diye uyarmış annesi. Ama ormanda o kadar çok çiçek varmış ki Kırmızı Başlıklı Kız birkaç tane toplamak için durmuş. O sırada çok kibar bir kurt ortaya çıkmış ve ona nereye gittiğini sormuş. Kurdun ne kadar tehlikeli olduğunu bilmeyen kız, büyükannesinin nerede oturduğunu anlatmış. Kurt ona bir yarış önermiş: kendisi bir yoldan, kız başka bir yoldan gidecekmiş.",
 de:"„Geh direkt zum Haus der Großmutter und komm nicht vom Weg ab“, warnte es seine Mutter. Doch im Wald gab es so viele Blumen, dass Rotkäppchen stehen blieb, um einige zu pflücken. Da erschien ein sehr höflicher Wolf und fragte, wohin es gehe. Weil es nicht wusste, wie gefährlich er war, erklärte es ihm, wo seine Großmutter wohnte. Der Wolf schlug ein Wettrennen vor: Er würde den einen Weg nehmen und es den anderen."},
{es:"Por supuesto, el lobo eligió el camino más corto. Llegó primero, se comió a la abuela y se metió en su cama. Cuando entró Caperucita, notó que algo no iba bien: «Abuela, ¡qué ojos tan grandes tienes!». «Son para verte mejor». «¡Y qué dientes tan grandes!». «¡Son para comerte mejor!». Por suerte, un cazador que pasaba por allí oyó el ruido, entró en la casa y rescató a la niña y a su abuela.",
 en:"Of course, the wolf chose the shortest path. He arrived first, ate the grandmother and got into her bed. When Little Red Riding Hood came in, she noticed that something wasn't right: “Grandmother, what big eyes you have!” “All the better to see you with.” “And what big teeth!” “All the better to eat you with!” Luckily, a hunter who was passing by heard the noise, went into the house and rescued the girl and her grandmother.",
 tr:"Elbette kurt en kısa yolu seçmiş. Önce o varmış, büyükanneyi yutmuş ve onun yatağına girmiş. Kırmızı Başlıklı Kız içeri girince bir şeylerin yolunda gitmediğini fark etmiş: «Büyükanne, gözlerin ne kadar büyük!» «Seni daha iyi görmek için.» «Dişlerin de ne kadar büyük!» «Seni daha iyi yemek için!» Neyse ki oradan geçen bir avcı gürültüyü duymuş, eve girmiş ve kızla büyükannesini kurtarmış.",
 de:"Natürlich wählte der Wolf den kürzesten Weg. Er kam als Erster an, fraß die Großmutter und legte sich in ihr Bett. Als Rotkäppchen hereinkam, merkte es, dass etwas nicht stimmte: „Großmutter, was hast du für große Augen!“ „Damit ich dich besser sehen kann.“ „Und was für große Zähne!“ „Damit ich dich besser fressen kann!“ Zum Glück hörte ein Jäger, der vorbeikam, den Lärm, ging ins Haus und rettete das Mädchen und seine Großmutter."}],

B2:{paras:[
{es:"Érase una vez una niña tan querida en su aldea que bastaba verla pasar para que los vecinos sonrieran. Su abuela, que la adoraba, le había cosido una caperuza de terciopelo rojo, y la pequeña se encariñó tanto con ella que acabó convirtiéndose en su nombre. Una mañana de otoño, su madre llenó una cesta con pan, mantequilla y un tarro de miel, y le encargó que se la llevara a la abuela, que llevaba varios días en cama, sin entretenerse por el camino.",
 en:"Once upon a time there was a girl so loved in her village that the neighbours only had to see her pass by to smile. Her grandmother, who adored her, had sewn her a red velvet hood, and the little girl grew so fond of it that it ended up becoming her name. One autumn morning, her mother filled a basket with bread, butter and a jar of honey, and asked her to take it to her grandmother, who had been in bed for several days, without dawdling on the way.",
 tr:"Bir varmış bir yokmuş, köyünde öyle sevilen bir kız varmış ki komşuların gülümsemesi için onu geçerken görmeleri yetermiş. Onu çok seven büyükannesi ona kırmızı kadifeden bir başlık dikmiş, küçük kız da bu başlığa öyle bağlanmış ki başlık sonunda adı olup çıkmış. Bir sonbahar sabahı annesi bir sepete ekmek, tereyağı ve bir kavanoz bal koymuş ve birkaç gündür yatakta olan büyükannesine, yolda oyalanmadan götürmesini tembihlemiş.",
 de:"Es war einmal ein Mädchen, das in seinem Dorf so beliebt war, dass die Nachbarn es nur vorbeigehen sehen mussten, um zu lächeln. Seine Großmutter, die es über alles liebte, hatte ihm eine Kappe aus rotem Samt genäht, und die Kleine hing so sehr daran, dass sie schließlich zu seinem Namen wurde. An einem Herbstmorgen füllte die Mutter einen Korb mit Brot, Butter und einem Glas Honig und trug ihm auf, ihn der Großmutter zu bringen, die seit mehreren Tagen im Bett lag – ohne unterwegs zu trödeln."},
{es:"Sin embargo, el bosque estaba precioso aquella mañana, y Caperucita no pudo resistirse a las flores que crecían junto al sendero. Fue entonces cuando se le acercó un lobo de modales impecables, que la saludó como si fueran viejos conocidos. La niña, que nunca había oído hablar de lo astutos que pueden ser los lobos, le contó sin desconfiar adónde iba y le describió con todo detalle la casa de su abuela, bajo los tres grandes robles.",
 en:"However, the forest was beautiful that morning, and Little Red Riding Hood couldn't resist the flowers growing beside the path. It was then that a wolf with impeccable manners approached her and greeted her as if they were old acquaintances. The girl, who had never heard how cunning wolves can be, told him without suspicion where she was going and described her grandmother's house in great detail, under the three big oak trees.",
 tr:"Ne var ki orman o sabah çok güzelmiş ve Kırmızı Başlıklı Kız patikanın kenarında açan çiçeklere karşı koyamamış. İşte tam o sırada kusursuz tavırlı bir kurt yanına gelmiş ve onu sanki eski tanıdıklarmış gibi selamlamış. Kurtların ne kadar kurnaz olabileceğini hiç duymamış olan kız, hiç şüphelenmeden nereye gittiğini anlatmış ve büyükannesinin üç büyük meşenin altındaki evini en ince ayrıntısına kadar tarif etmiş.",
 de:"Doch der Wald war an diesem Morgen wunderschön, und Rotkäppchen konnte den Blumen am Wegesrand nicht widerstehen. Genau da näherte sich ihm ein Wolf mit tadellosen Manieren und begrüßte es, als wären sie alte Bekannte. Das Mädchen, das noch nie gehört hatte, wie listig Wölfe sein können, erzählte ihm ohne Misstrauen, wohin es ging, und beschrieb ihm das Haus der Großmutter unter den drei großen Eichen bis ins kleinste Detail."},
{es:"Mientras la niña se entretenía haciendo un ramo, el lobo se adelantó, llamó a la puerta imitando su voz y, en cuanto la anciana le abrió, se la tragó de un bocado. Después se puso su gorro de dormir y se metió en la cama. Cuando por fin llegó Caperucita, le extrañó encontrar la puerta abierta. «Abuela, ¡qué orejas tan grandes tienes!», dijo, cada vez más inquieta. «Son para oírte mejor», respondió una voz ronca desde la penumbra.",
 en:"While the girl was busy making a bouquet, the wolf went ahead, knocked on the door imitating her voice and, as soon as the old woman opened it, swallowed her in one bite. Then he put on her nightcap and got into bed. When Little Red Riding Hood finally arrived, she was surprised to find the door open. “Grandmother, what big ears you have!” she said, more and more uneasy. “All the better to hear you with,” answered a hoarse voice from the half-darkness.",
 tr:"Kız buket yapmakla oyalanırken kurt öne geçmiş, kızın sesini taklit ederek kapıyı çalmış ve yaşlı kadın kapıyı açar açmaz onu tek lokmada yutmuş. Sonra onun gece başlığını takıp yatağa girmiş. Kırmızı Başlıklı Kız sonunda vardığında kapıyı açık bulunca şaşırmış. Gittikçe huzursuzlanarak «Büyükanne, kulakların ne kadar büyük!» demiş. Loşluğun içinden boğuk bir ses «Seni daha iyi duymak için» diye cevap vermiş.",
 de:"Während das Mädchen damit beschäftigt war, einen Strauß zu binden, lief der Wolf voraus, klopfte mit verstellter Stimme an die Tür und verschlang die alte Frau, sobald sie öffnete, mit einem Bissen. Dann setzte er ihre Nachtmütze auf und legte sich ins Bett. Als Rotkäppchen endlich ankam, wunderte es sich, dass die Tür offen stand. „Großmutter, was hast du für große Ohren!“, sagte es, immer unruhiger. „Damit ich dich besser hören kann“, antwortete eine heisere Stimme aus dem Halbdunkel."},
{es:"«¿Y por qué tienes unos dientes tan grandes?». Antes de que la niña pudiera reaccionar, el lobo saltó de la cama y se la tragó también. Satisfecho, se quedó dormido y empezó a roncar tan fuerte que un cazador que pasaba cerca sospechó que algo raro ocurría. Al ver al lobo con la barriga hinchada, comprendió lo que había pasado, y con unas tijeras sacó sanas y salvas a la niña y a su abuela. Desde aquel día, Caperucita nunca volvió a salirse del camino.",
 en:"“And why do you have such big teeth?” Before the girl could react, the wolf jumped out of bed and swallowed her too. Satisfied, he fell asleep and began to snore so loudly that a hunter passing nearby suspected that something strange was going on. When he saw the wolf with its swollen belly, he understood what had happened, and with a pair of scissors he got the girl and her grandmother out safe and sound. From that day on, Little Red Riding Hood never strayed from the path again.",
 tr:"«Peki dişlerin neden bu kadar büyük?» Kız tepki veremeden kurt yataktan fırlamış ve onu da yutmuş. Karnı doymuş halde uykuya dalmış ve öyle yüksek sesle horlamaya başlamış ki yakından geçen bir avcı tuhaf bir şeyler olduğundan şüphelenmiş. Kurdu şişmiş karnıyla görünce olanları anlamış ve bir makasla kızı ve büyükannesini sapasağlam çıkarmış. O günden sonra Kırmızı Başlıklı Kız bir daha asla yoldan ayrılmamış.",
 de:"„Und warum hast du so große Zähne?“ Bevor das Mädchen reagieren konnte, sprang der Wolf aus dem Bett und verschlang es ebenfalls. Satt schlief er ein und schnarchte so laut, dass ein Jäger, der in der Nähe vorbeikam, vermutete, dass etwas Seltsames vor sich ging. Als er den Wolf mit dem dicken Bauch sah, verstand er, was geschehen war, und holte das Mädchen und seine Großmutter mit einer Schere gesund und munter heraus. Von diesem Tag an kam Rotkäppchen nie wieder vom Weg ab."}],

{q:"¿Cómo consiguió el lobo entrar en casa de la abuela?",en:"How did the wolf manage to get into the grandmother's house?",tr:"Kurt büyükannenin evine nasıl girmeyi başardı?",de:"Wie gelang es dem Wolf, ins Haus der Großmutter zu kommen?",opts:["Imitó la voz de la niña","Rompió la ventana","Encontró la llave debajo de la puerta"],ex:"«…llamó a la puerta imitando su voz.»"},
