{q:"¿Por qué decidieron vender la vaca?",en:"Why did they decide to sell the cow?",tr:"İneği neden satmaya karar verdiler?",de:"Warum beschlossen sie, die Kuh zu verkaufen?",opts:["Dejó de dar leche","Estaba enferma","Necesitaban espacio"],ex:"«…cuando esta dejó de dar leche, decidieron venderla.»"},
{q:"¿Dónde se escondió Juan?",en:"Where did Juan hide?",tr:"Juan nereye saklandı?",de:"Wo versteckte sich Juan?",opts:["En el horno","Debajo de la cama","En un armario"],ex:"«…Juan apenas tuvo tiempo de esconderse en el horno.»"},
{q:"¿Qué hacía la gallina cuando el gigante decía «¡Pon!»?",en:"What did the hen do when the giant said “Lay!”?",tr:"Dev «Yumurtla!» deyince tavuk ne yapıyordu?",de:"Was tat das Huhn, wenn der Riese „Leg!“ sagte?",opts:["Ponía un huevo de oro","Cantaba una canción","Se escondía"],ex:"«Y la gallina puso un huevo de oro.»"}]},
B2:{paras:[
{es:"Érase una vez una viuda que vivía con su único hijo, Juan, en una cabaña destartalada. Su único sustento era la leche de una vaca, y el día en que el animal dejó de darla, a la mujer no le quedó más remedio que mandar a Juan a venderla al mercado. No había recorrido ni la mitad del camino cuando le salió al paso un hombrecillo de aspecto extraño que, tras adular su inteligencia, le propuso cambiar la vaca por cinco habichuelas que, según él, tenían poderes extraordinarios.",
 en:"Once upon a time there was a widow who lived with her only son, Juan, in a ramshackle cottage. Their only means of support was the milk from a cow, and the day the animal stopped giving it, the woman had no choice but to send Juan to sell it at the market. He hadn't covered even half the way when a strange-looking little man stepped into his path and, after flattering his intelligence, proposed exchanging the cow for five beans which, according to him, had extraordinary powers.",
 tr:"Bir varmış bir yokmuş, tek oğlu Juan'la birlikte yıkık dökük bir kulübede yaşayan dul bir kadın varmış. Tek geçim kaynakları bir ineğin sütüymüş ve hayvan süt vermeyi bıraktığı gün kadının Juan'ı ineği pazarda satmaya göndermekten başka çaresi kalmamış. Juan daha yolun yarısını bile gitmemişken garip görünüşlü ufak tefek bir adam karşısına çıkmış ve zekâsını pohpohladıktan sonra ineği, söylediğine göre olağanüstü güçleri olan beş fasulyeyle değiştirmeyi önermiş.",
 de:"Es war einmal eine Witwe, die mit ihrem einzigen Sohn Juan in einer baufälligen Hütte lebte. Ihr einziger Lebensunterhalt war die Milch einer Kuh, und als das Tier keine mehr gab, blieb der Frau nichts anderes übrig, als Juan zum Verkaufen auf den Markt zu schicken. Er hatte noch nicht einmal die Hälfte des Weges zurückgelegt, als ihm ein seltsam aussehendes Männlein in den Weg trat, das ihm, nachdem es seine Klugheit gelobt hatte, vorschlug, die Kuh gegen fünf Bohnen zu tauschen, die angeblich außergewöhnliche Kräfte besaßen."},
{es:"Juan, que siempre había sido más soñador que práctico, cerró el trato convencido de haber hecho el negocio de su vida. Su madre, en cambio, no lo vio del mismo modo: tiró las habichuelas por la ventana y lo mandó a la cama sin cenar. Sin embargo, al despertar, el muchacho se encontró con que la habitación estaba en penumbra: junto a la ventana se alzaba una mata colosal, cuyos tallos se entrelazaban formando una especie de escalera que se perdía entre las nubes.",
 en:"Juan, who had always been more of a dreamer than a practical person, closed the deal convinced he had made the bargain of his life. His mother, on the other hand, didn't see it the same way: she threw the beans out of the window and sent him to bed without supper. However, when he woke up, the boy found that the room was in semi-darkness: next to the window rose a colossal plant whose stalks intertwined to form a kind of ladder that vanished among the clouds.",
 tr:"Her zaman pratik olmaktan çok hayalperest olan Juan, hayatının alışverişini yaptığına inanarak anlaşmayı kapatmış. Annesi ise aynı şekilde düşünmemiş: fasulyeleri pencereden atmış ve onu akşam yemeği yedirmeden yatağa göndermiş. Ancak oğlan uyandığında odanın loş olduğunu görmüş: pencerenin yanında, sapları birbirine dolanarak bulutların arasında kaybolan bir tür merdiven oluşturan devasa bir bitki yükseliyormuş.",
 de:"Juan, der schon immer mehr Träumer als Praktiker gewesen war, schlug ein, überzeugt, das Geschäft seines Lebens gemacht zu haben. Seine Mutter sah das jedoch anders: Sie warf die Bohnen aus dem Fenster und schickte ihn ohne Abendessen ins Bett. Als der Junge aber aufwachte, lag das Zimmer im Halbdunkel: Vor dem Fenster erhob sich eine gewaltige Pflanze, deren Stängel sich zu einer Art Leiter verflochten, die sich in den Wolken verlor."},
{es:"Trepó sin dudarlo y, al llegar a la cima, siguió un largo camino hasta un castillo descomunal. Una mujer gigantesca, apiadándose de él, le dio algo de comer, aunque le advirtió que su marido tenía debilidad por los niños asados. Al poco retumbaron unos pasos atronadores, y Juan se metió en el horno justo a tiempo. «¡Huelo a carne humana!», bramó el ogro al entrar. Su esposa le aseguró que eran imaginaciones suyas, y él, tras devorar la cena, se puso a contar sus monedas hasta quedarse dormido.",
 en:"He climbed without hesitation and, on reaching the top, followed a long road to an enormous castle. A gigantic woman, taking pity on him, gave him something to eat, although she warned him that her husband had a weakness for roast children. Soon thundering footsteps rang out, and Juan got into the oven just in time. “I smell human flesh!” roared the ogre as he came in. His wife assured him he was imagining things, and he, after devouring his supper, began counting his coins until he fell asleep.",
 tr:"Hiç tereddüt etmeden tırmanmış ve tepeye varınca dev gibi bir şatoya giden uzun bir yolu izlemiş. Ona acıyan devasa bir kadın ona yiyecek bir şeyler vermiş, ama kocasının kızarmış çocuklara bayıldığı konusunda onu uyarmış. Çok geçmeden gök gürültüsü gibi ayak sesleri yankılanmış ve Juan tam zamanında fırına girmiş. Dev içeri girerken «İnsan eti kokusu alıyorum!» diye kükremiş. Karısı ona bunun hayal ürünü olduğunu söylemiş, o da akşam yemeğini silip süpürdükten sonra uyuyakalana kadar paralarını saymaya koyulmuş.",
 de:"Er kletterte ohne zu zögern hinauf und folgte oben einem langen Weg bis zu einem gewaltigen Schloss. Eine riesenhafte Frau hatte Mitleid mit ihm und gab ihm etwas zu essen, warnte ihn aber, dass ihr Mann eine Schwäche für gebratene Kinder habe. Bald darauf dröhnten donnernde Schritte, und Juan schlüpfte gerade noch rechtzeitig in den Ofen. „Ich rieche Menschenfleisch!“, brüllte der Unhold beim Hereinkommen. Seine Frau versicherte ihm, er bilde sich das nur ein, und nachdem er sein Abendessen verschlungen hatte, begann er, seine Münzen zu zählen, bis er einschlief."},
{es:"Juan volvió varias veces al castillo. En una se llevó un saco de monedas; en otra, una gallina que ponía huevos de oro; y en la última, un arpa que tocaba sola. Pero el arpa, al sentirse robada, gritó: «¡Amo, amo!», y el gigante salió tras él. Juan bajó por el tallo a toda velocidad, pidió a su madre un hacha y, de unos cuantos golpes, lo derribó. El gigante se precipitó al vacío y nunca más se supo de él. Gracias al arpa y a la gallina, Juan y su madre no volvieron a pasar necesidad.",
 en:"Juan went back to the castle several times. On one occasion he took a bag of coins; on another, a hen that laid golden eggs; and on the last, a harp that played by itself. But the harp, realising it was being stolen, cried out: “Master, master!”, and the giant went after him. Juan climbed down the stalk at full speed, asked his mother for an axe and, with a few blows, brought it down. The giant plunged into the void and was never heard of again. Thanks to the harp and the hen, Juan and his mother never went short again.",
 tr:"Juan şatoya birkaç kez geri dönmüş. Birinde bir torba para almış; bir başkasında altın yumurtlayan bir tavuk; sonuncusunda da kendi kendine çalan bir arp. Ama arp çalındığını anlayınca «Efendim, efendim!» diye bağırmış ve dev onun peşine düşmüş. Juan sap boyunca son hızla inmiş, annesinden bir balta istemiş ve birkaç darbede sapı devirmiş. Dev boşluğa yuvarlanmış ve ondan bir daha haber alınamamış. Arp ve tavuk sayesinde Juan ile annesi bir daha hiç sıkıntı çekmemiş.",
 de:"Juan kehrte mehrmals ins Schloss zurück. Einmal nahm er einen Sack Münzen mit, ein anderes Mal ein Huhn, das goldene Eier legte, und beim letzten Mal eine Harfe, die von selbst spielte. Doch als die Harfe merkte, dass sie gestohlen wurde, rief sie: „Herr, Herr!“, und der Riese jagte ihm nach. Juan rutschte in Windeseile den Stängel hinunter, bat seine Mutter um eine Axt und fällte ihn mit ein paar Hieben. Der Riese stürzte in die Tiefe, und man hörte nie wieder von ihm. Dank der Harfe und des Huhns litten Juan und seine Mutter nie wieder Not."}],

{q:"¿Qué hizo el gigante después de cenar?",en:"What did the giant do after supper?",tr:"Dev akşam yemeğinden sonra ne yaptı?",de:"Was machte der Riese nach dem Abendessen?",opts:["Contar sus monedas hasta dormirse","Salir a cazar","Buscar a Juan por el castillo"],ex:"«…se puso a contar sus monedas hasta quedarse dormido.»"},

{id:"hamelin",icon:"🐀",title:"El flautista de Hamelín",tt:B("The Pied Piper of Hamelin","Hamelin'in Fareli Köyün Kavalcısı","Der Rattenfänger von Hameln"),src:"Leyenda alemana / Hermanos Grimm",lv:{
A1:{paras:[
{es:"Hamelín es una ciudad con muchas ratas. Las ratas están en las casas, en las calles y en la comida. Un día llega un hombre con una flauta. Dice: «Yo me llevo las ratas, pero tenéis que pagarme». El hombre toca la flauta y todas las ratas lo siguen al río. Pero el alcalde no le paga. Entonces el flautista toca otra vez, y los niños de la ciudad se van con él.",
 en:"Hamelin is a town with lots of rats. The rats are in the houses, in the streets and in the food. One day a man with a flute arrives. He says: “I'll take the rats away, but you have to pay me.” The man plays the flute and all the rats follow him to the river. But the mayor doesn't pay him. Then the piper plays again, and the children of the town go away with him.",
 tr:"Hamelin çok faresi olan bir şehir. Fareler evlerde, sokaklarda ve yemeklerin içinde. Bir gün kavallı bir adam geliyor. Diyor ki: «Fareleri ben götürürüm, ama bana para ödemeniz gerek.» Adam kavalını çalıyor ve bütün fareler onu nehre kadar takip ediyor. Ama belediye başkanı ona para ödemiyor. Bunun üzerine kavalcı tekrar çalıyor ve şehrin çocukları onunla gidiyor.",
 de:"Hameln ist eine Stadt mit vielen Ratten. Die Ratten sind in den Häusern, auf den Straßen und im Essen. Eines Tages kommt ein Mann mit einer Flöte. Er sagt: „Ich nehme die Ratten mit, aber ihr müsst mich bezahlen.“ Der Mann spielt Flöte und alle Ratten folgen ihm zum Fluss. Aber der Bürgermeister bezahlt ihn nicht. Da spielt der Pfeifer noch einmal, und die Kinder der Stadt gehen mit ihm fort."}],
vocab:[["la rata","rat","fare, sıçan","die Ratte"],["la flauta","flute, pipe","kaval, flüt","die Flöte"],["el alcalde","mayor","belediye başkanı","der Bürgermeister"],["pagar","to pay","ödemek","bezahlen"]],
quiz:[
{q:"¿Qué problema tiene Hamelín?",en:"What problem does Hamelin have?",tr:"Hamelin'in sorunu ne?",de:"Welches Problem hat Hameln?",opts:["Muchas ratas","Mucha nieve","No hay agua"],ex:"«Hamelín es una ciudad con muchas ratas.»"},
{q:"¿Por qué toca el flautista otra vez?",en:"Why does the piper play again?",tr:"Kavalcı neden tekrar çalıyor?",de:"Warum spielt der Pfeifer noch einmal?",opts:["El alcalde no le paga","Quiere bailar","Los niños se lo piden"],ex:"«Pero el alcalde no le paga. Entonces el flautista toca otra vez…»"}]},
A2:{paras:[
{es:"Hace muchos años, la ciudad de Hamelín, en Alemania, tenía un problema terrible: estaba llena de ratas. Se comían el pan, mordían a los perros y hacían nidos en los sombreros. Nadie sabía qué hacer. Un día apareció un hombre muy extraño, vestido con ropa de muchos colores y con una flauta. Le dijo al alcalde que podía llevarse todas las ratas a cambio de mil monedas de oro, y el alcalde aceptó.",
 en:"Many years ago, the town of Hamelin, in Germany, had a terrible problem: it was full of rats. They ate the bread, bit the dogs and made nests in the hats. Nobody knew what to do. One day a very strange man appeared, dressed in clothes of many colours and carrying a flute. He told the mayor he could take all the rats away in exchange for a thousand gold coins, and the mayor agreed.",
 tr:"Uzun yıllar önce Almanya'daki Hamelin şehrinin korkunç bir sorunu varmış: şehir farelerle doluymuş. Fareler ekmekleri yiyor, köpekleri ısırıyor ve şapkaların içine yuva yapıyormuş. Kimse ne yapacağını bilmiyormuş. Bir gün rengârenk giysiler giymiş, elinde kaval olan çok tuhaf bir adam ortaya çıkmış. Belediye başkanına bin altın karşılığında bütün fareleri götürebileceğini söylemiş, başkan da kabul etmiş.",
 de:"Vor vielen Jahren hatte die Stadt Hameln in Deutschland ein schreckliches Problem: Sie war voller Ratten. Sie fraßen das Brot, bissen die Hunde und bauten Nester in den Hüten. Niemand wusste, was zu tun war. Eines Tages erschien ein sehr seltsamer Mann in bunter Kleidung und mit einer Flöte. Er sagte dem Bürgermeister, er könne alle Ratten für tausend Goldmünzen wegbringen, und der Bürgermeister war einverstanden."},
{es:"El flautista empezó a tocar por las calles y, de todas las casas, salieron miles de ratas que lo siguieron hasta el río, donde se ahogaron. Pero cuando fue a cobrar, el alcalde se rió de él y solo le ofreció cincuenta monedas. El flautista no dijo nada. Salió a la calle y tocó una melodía nueva. Esta vez, fueron los niños de la ciudad quienes lo siguieron, bailando y cantando, hasta una montaña. Se abrió una puerta en la roca, entraron todos y nunca más volvieron.",
 en:"The piper began to play in the streets and, from every house, thousands of rats came out and followed him to the river, where they drowned. But when he went to collect his money, the mayor laughed at him and only offered him fifty coins. The piper said nothing. He went out into the street and played a new tune. This time it was the town's children who followed him, dancing and singing, to a mountain. A door opened in the rock, they all went in and never came back.",
 tr:"Kavalcı sokaklarda çalmaya başlamış ve bütün evlerden binlerce fare çıkıp onu nehre kadar takip etmiş; orada da boğulmuşlar. Ama parasını almaya gittiğinde belediye başkanı ona gülmüş ve yalnızca elli altın önermiş. Kavalcı hiçbir şey söylememiş. Sokağa çıkmış ve yeni bir ezgi çalmış. Bu sefer onu dans edip şarkı söyleyerek bir dağa kadar takip edenler şehrin çocukları olmuş. Kayada bir kapı açılmış, hepsi içeri girmiş ve bir daha asla geri dönmemişler.",
 de:"Der Pfeifer begann, in den Straßen zu spielen, und aus allen Häusern kamen Tausende Ratten, die ihm bis zum Fluss folgten, wo sie ertranken. Doch als er sein Geld abholen wollte, lachte ihn der Bürgermeister aus und bot ihm nur fünfzig Münzen an. Der Pfeifer sagte nichts. Er ging auf die Straße und spielte eine neue Melodie. Diesmal waren es die Kinder der Stadt, die ihm tanzend und singend bis zu einem Berg folgten. Im Felsen öffnete sich eine Tür, alle gingen hinein und kamen nie wieder zurück."}],
vocab:[["el nido","nest","yuva","das Nest"],["ahogarse","to drown","boğulmak","ertrinken"],["cobrar","to get paid, to collect","parasını almak","kassieren"],["la melodía","tune, melody","ezgi","die Melodie"]],

{q:"¿Cuánto dinero pidió el flautista?",en:"How much money did the piper ask for?",tr:"Kavalcı ne kadar para istedi?",de:"Wie viel Geld verlangte der Pfeifer?",opts:["Mil monedas de oro","Cincuenta monedas","Nada"],ex:"«…podía llevarse todas las ratas a cambio de mil monedas de oro…»"},
{q:"¿Adónde llevó el flautista a las ratas?",en:"Where did the piper lead the rats?",tr:"Kavalcı fareleri nereye götürdü?",de:"Wohin führte der Pfeifer die Ratten?",opts:["Al río","A la montaña","Al bosque"],ex:"«…salieron miles de ratas que lo siguieron hasta el río, donde se ahogaron.»"}]},
B1:{paras:[
{es:"En la ciudad de Hamelín, a orillas del río Weser, las ratas se habían convertido en una auténtica plaga. Había tantas que los gatos huían de ellas, y los vecinos ya no podían dormir por el ruido. Indignados, los ciudadanos se reunieron delante del ayuntamiento y amenazaron al alcalde: si no encontraba una solución, lo echarían. El alcalde, que no tenía ni idea de qué hacer, prometió una gran recompensa a quien librara a la ciudad de las ratas.",
 en:"In the town of Hamelin, on the banks of the river Weser, the rats had become a real plague. There were so many that the cats ran away from them, and the neighbours could no longer sleep because of the noise. Outraged, the citizens gathered in front of the town hall and threatened the mayor: if he didn't find a solution, they would throw him out. The mayor, who had no idea what to do, promised a big reward to whoever rid the town of the rats.",
 tr:"Weser nehrinin kıyısındaki Hamelin şehrinde fareler gerçek bir belaya dönüşmüş. O kadar çoklarmış ki kediler onlardan kaçıyormuş ve komşular gürültüden artık uyuyamıyormuş. Öfkelenen şehir halkı belediye binasının önünde toplanmış ve başkanı tehdit etmiş: bir çözüm bulamazsa onu görevden atacaklarmış. Ne yapacağı hakkında hiçbir fikri olmayan başkan, şehri farelerden kurtaracak kişiye büyük bir ödül vaat etmiş.",
 de:"In der Stadt Hameln am Ufer der Weser waren die Ratten zu einer echten Plage geworden. Es gab so viele, dass die Katzen vor ihnen flohen und die Nachbarn vor lauter Lärm nicht mehr schlafen konnten. Empört versammelten sich die Bürger vor dem Rathaus und drohten dem Bürgermeister: Wenn er keine Lösung finde, würden sie ihn absetzen. Der Bürgermeister, der keine Ahnung hatte, was er tun sollte, versprach demjenigen eine große Belohnung, der die Stadt von den Ratten befreite."},
{es:"Al día siguiente se presentó un forastero alto y delgado, con un traje de colores vivos y una flauta colgada del cuello. Aseguró que podía hacer desaparecer las ratas, y el alcalde le prometió mil florines. El flautista salió a la calle y tocó una melodía suave. Enseguida, ratas grandes y pequeñas salieron de sótanos y tejados y lo siguieron hasta el río, donde se lanzaron al agua y desaparecieron para siempre.",
 en:"The next day a tall, thin stranger turned up, wearing a brightly coloured suit and with a flute hanging around his neck. He claimed he could make the rats disappear, and the mayor promised him a thousand florins. The piper went out into the street and played a soft tune. Straight away, rats big and small came out of cellars and roofs and followed him to the river, where they threw themselves into the water and disappeared for ever.",
 tr:"Ertesi gün canlı renklerde giysiler giymiş, boynunda bir kaval asılı, uzun boylu ve zayıf bir yabancı gelmiş. Fareleri yok edebileceğini söylemiş ve başkan ona bin florin vaat etmiş. Kavalcı sokağa çıkmış ve yumuşak bir ezgi çalmış. Hemen büyük küçük bütün fareler bodrumlardan ve çatılardan çıkıp onu nehre kadar takip etmiş; orada suya atlayıp sonsuza dek yok olmuşlar.",
 de:"Am nächsten Tag erschien ein großer, hagerer Fremder in einem bunten Gewand, mit einer Flöte um den Hals. Er versicherte, er könne die Ratten verschwinden lassen, und der Bürgermeister versprach ihm tausend Gulden. Der Pfeifer ging auf die Straße und spielte eine sanfte Melodie. Sofort kamen große und kleine Ratten aus Kellern und Dächern und folgten ihm bis zum Fluss, wo sie sich ins Wasser stürzten und für immer verschwanden."},
{es:"Sin embargo, cuando el flautista fue a cobrar, el alcalde y sus consejeros se burlaron de él: «Las ratas ya están muertas, no pueden volver. Toma cincuenta florines y vete». El flautista les advirtió que se arrepentirían. Volvió a tocar, pero esta vez una música alegre, y todos los niños de Hamelín salieron corriendo de sus casas detrás de él. Los padres, inmóviles como estatuas, vieron cómo los niños desaparecían dentro de una montaña. Solo uno, que era cojo y no pudo seguir el ritmo, regresó para contarlo.",
 en:"However, when the piper went to collect his money, the mayor and his councillors mocked him: “The rats are already dead, they can't come back. Take fifty florins and go.” The piper warned them that they would regret it. He played again, but this time a cheerful tune, and all the children of Hamelin came running out of their houses after him. The parents, motionless as statues, watched the children disappear inside a mountain. Only one, who was lame and couldn't keep up, came back to tell the tale.",
 tr:"Ancak kavalcı parasını almaya gittiğinde başkan ve danışmanları onunla alay etmiş: «Fareler zaten öldü, geri gelemezler. Al şu elli florini ve git.» Kavalcı onları pişman olacakları konusunda uyarmış. Yeniden çalmış, ama bu kez neşeli bir müzik; Hamelin'in bütün çocukları evlerinden koşarak onun peşine düşmüş. Heykel gibi kıpırdayamayan anne babalar, çocukların bir dağın içinde kayboluşunu izlemiş. Yalnızca topal olduğu için ritme yetişemeyen bir çocuk olanları anlatmak için geri dönmüş.",
 de:"Als der Pfeifer jedoch sein Geld abholen wollte, verspotteten ihn der Bürgermeister und seine Ratsherren: „Die Ratten sind schon tot, sie können nicht zurückkommen. Nimm fünfzig Gulden und geh.“ Der Pfeifer warnte sie, dass sie es bereuen würden. Er spielte noch einmal, doch diesmal eine fröhliche Musik, und alle Kinder Hamelns rannten aus ihren Häusern hinter ihm her. Die Eltern sahen reglos wie Statuen zu, wie die Kinder in einem Berg verschwanden. Nur eines, das lahm war und nicht Schritt halten konnte, kehrte zurück, um es zu erzählen."}],

quiz:[
{q:"¿Con qué amenazaron los ciudadanos al alcalde?",en:"What did the citizens threaten the mayor with?",tr:"Şehir halkı başkanı neyle tehdit etti?",de:"Womit drohten die Bürger dem Bürgermeister?",opts:["Con echarlo","Con irse de la ciudad","Con no pagar impuestos"],ex:"«…si no encontraba una solución, lo echarían.»"},
{q:"¿Cuánto le ofrecieron al final al flautista?",en:"How much did they offer the piper in the end?",tr:"Sonunda kavalcıya ne kadar önerdiler?",de:"Wie viel boten sie dem Pfeifer am Ende an?",opts:["Cincuenta florines","Mil florines","Nada"],ex:"«Toma cincuenta florines y vete.»"},
{q:"¿Por qué regresó un niño?",en:"Why did one child come back?",tr:"Bir çocuk neden geri döndü?",de:"Warum kehrte ein Kind zurück?",opts:["Era cojo y no pudo seguir el ritmo","Se perdió en la montaña","Su madre lo llamó"],ex:"«Solo uno, que era cojo y no pudo seguir el ritmo, regresó para contarlo.»"}]},
B2:{paras:[
{es:"Corría el siglo XIII cuando la próspera ciudad de Hamelín, en la Baja Sajonia, sufrió una invasión de ratas sin precedentes. Los roedores asaltaban las despensas, destrozaban los graneros y se atrevían incluso a morder a los recién nacidos en sus cunas. Los vecinos, desesperados, culpaban de todo a la pasividad del alcalde y de sus concejales, más preocupados por sus banquetes que por la salud de la población. Finalmente, ante la amenaza de una revuelta, el alcalde anunció que pagaría lo que fuera a quien acabara con la plaga.",
 en:"It was the 13th century when the prosperous town of Hamelin, in Lower Saxony, suffered an unprecedented invasion of rats. The rodents raided the larders, wrecked the granaries and even dared to bite newborn babies in their cradles. The desperate townspeople blamed everything on the passivity of the mayor and his councillors, who cared more about their banquets than about the health of the population. Finally, faced with the threat of a revolt, the mayor announced that he would pay whatever it took to whoever put an end to the plague.",
 tr:"13. yüzyılda Aşağı Saksonya'daki müreffeh Hamelin şehri benzeri görülmemiş bir fare istilasına uğramış. Kemirgenler kilerlere saldırıyor, ambarları darmadağın ediyor, hatta beşiklerindeki yeni doğmuş bebekleri ısırmaya bile cüret ediyormuş. Çaresiz kalan şehir halkı her şeyin suçunu, halkın sağlığından çok ziyafetlerini dert eden başkanın ve meclis üyelerinin kayıtsızlığında buluyormuş. Sonunda bir isyan tehdidi karşısında başkan, bu belayı bitirecek kişiye ne isterse ödeyeceğini duyurmuş.",
 de:"Man schrieb das 13. Jahrhundert, als die wohlhabende Stadt Hameln in Niedersachsen von einer beispiellosen Rattenplage heimgesucht wurde. Die Nager plünderten die Vorratskammern, verwüsteten die Kornspeicher und wagten es sogar, Neugeborene in ihren Wiegen zu beißen. Die verzweifelten Bewohner gaben an allem der Untätigkeit des Bürgermeisters und seiner Ratsherren die Schuld, die sich mehr um ihre Festmähler als um die Gesundheit der Bevölkerung kümmerten. Schließlich verkündete der Bürgermeister angesichts eines drohenden Aufstands, er werde jedem, der die Plage beende, jeden Preis bezahlen."},
{es:"Poco después se presentó en el ayuntamiento un personaje enigmático, alto y enjuto, envuelto en una capa de mil colores, que se ofreció a liberar la ciudad a cambio de mil florines. El alcalde, convencido de que se trataba de un charlatán, no dudó en prometérselos. Entonces el forastero salió a la calle, se llevó la flauta a los labios y entonó una melodía tan hipnótica que, de cada rincón, empezaron a brotar ratas a millares. Lo siguieron, como en trance, hasta el Weser, donde se precipitaron a la corriente y perecieron ahogadas.",
 en:"Shortly afterwards an enigmatic figure turned up at the town hall, tall and gaunt, wrapped in a cloak of a thousand colours, offering to free the town in exchange for a thousand florins. The mayor, convinced he was dealing with a charlatan, didn't hesitate to promise them to him. Then the stranger went out into the street, raised his pipe to his lips and struck up a tune so hypnotic that rats began to pour out of every corner by the thousand. They followed him, as if in a trance, to the Weser, where they plunged into the current and drowned.",
 tr:"Kısa süre sonra belediye binasına uzun boylu ve sıska, bin bir renkli bir pelerine bürünmüş esrarengiz bir kişi gelmiş ve bin florin karşılığında şehri kurtarmayı teklif etmiş. Karşısındakinin bir şarlatan olduğuna inanan başkan, parayı vaat etmekte hiç tereddüt etmemiş. Bunun üzerine yabancı sokağa çıkmış, kavalını dudaklarına götürmüş ve öyle büyüleyici bir ezgi çalmış ki her köşeden binlerce fare fışkırmaya başlamış. Fareler sanki transa geçmiş gibi onu Weser'e kadar takip etmiş, orada akıntıya atılıp boğulmuşlar.",
 de:"Kurz darauf erschien im Rathaus eine rätselhafte Gestalt, groß und hager, in einen Mantel aus tausend Farben gehüllt, und bot an, die Stadt für tausend Gulden zu befreien. Der Bürgermeister, überzeugt, es mit einem Scharlatan zu tun zu haben, versprach sie ihm ohne zu zögern. Da trat der Fremde auf die Straße, setzte die Flöte an die Lippen und stimmte eine so hypnotische Melodie an, dass aus jedem Winkel Ratten zu Tausenden hervorquollen. Sie folgten ihm wie in Trance bis zur Weser, wo sie sich in die Strömung stürzten und ertranken."},
{es:"Con las calles limpias por primera vez en años, el alcalde se olvidó de su promesa. Alegando que una simple cancioncilla no podía valer una fortuna, le ofreció al flautista cincuenta florines y lo invitó a marcharse. El músico, con una calma inquietante, le advirtió que quien no cumple su palabra acaba pagando un precio mucho más alto. Los concejales se echaron a reír, convencidos de que aquel vagabundo no era más que un fanfarrón, y lo despidieron sin más.",
 en:"With the streets clean for the first time in years, the mayor forgot his promise. Claiming that a simple little tune couldn't be worth a fortune, he offered the piper fifty florins and invited him to leave. The musician, with an unsettling calm, warned him that whoever doesn't keep his word ends up paying a much higher price. The councillors burst out laughing, convinced that the vagabond was nothing but a braggart, and sent him off without further ado.",
 tr:"Sokaklar yıllar sonra ilk kez temizlenince başkan sözünü unutmuş. Basit bir şarkıcığın bir servet etmeyeceğini öne sürerek kavalcıya elli florin önermiş ve gitmesini rica etmiş. Müzisyen tedirgin edici bir sakinlikle, sözünü tutmayanın sonunda çok daha ağır bir bedel ödediğini söyleyerek onu uyarmış. Meclis üyeleri, o serserinin bir palavracıdan başka bir şey olmadığına inanarak kahkahalarla gülmüş ve onu hiç oyalanmadan kapı dışarı etmişler.",
 de:"Als die Straßen zum ersten Mal seit Jahren sauber waren, vergaß der Bürgermeister sein Versprechen. Mit der Behauptung, ein einfaches Liedchen könne kein Vermögen wert sein, bot er dem Pfeifer fünfzig Gulden an und forderte ihn auf zu gehen. Der Musiker warnte ihn mit beunruhigender Ruhe, dass derjenige, der sein Wort nicht hält, am Ende einen viel höheren Preis bezahlt. Die Ratsherren brachen in Gelächter aus, überzeugt, dass dieser Landstreicher nichts als ein Angeber sei, und schickten ihn kurzerhand fort."},
{es:"A la mañana siguiente, mientras los adultos estaban en misa, volvió a sonar la flauta, esta vez con una melodía alegre y juguetona. De todas las casas salieron niños que, embelesados, siguieron al flautista entre risas y saltos. Los padres, paralizados por un extraño hechizo, solo pudieron contemplar cómo sus hijos se alejaban hacia el monte Koppen, que se abrió para dejarlos pasar y se cerró tras ellos. Únicamente un niño cojo, que se había quedado rezagado, volvió para contar lo sucedido. Desde entonces, en Hamelín nadie olvida que las promesas deben cumplirse.",
 en:"The next morning, while the adults were at Mass, the pipe sounded again, this time with a cheerful, playful tune. Out of every house came children who, spellbound, followed the piper laughing and skipping. The parents, paralysed by a strange spell, could only watch as their children went off towards the Koppen hill, which opened to let them through and closed behind them. Only a lame boy, who had fallen behind, came back to tell what had happened. Ever since, nobody in Hamelin forgets that promises must be kept.",
 tr:"Ertesi sabah yetişkinler ayindeyken kaval yeniden çalmaya başlamış, bu kez neşeli ve oyunbaz bir ezgiyle. Bütün evlerden çıkan çocuklar büyülenmiş halde gülüp zıplayarak kavalcıyı takip etmiş. Garip bir büyüyle felç olmuş gibi kalan anne babalar, ancak çocuklarının Koppen dağına doğru uzaklaşmasını seyredebilmiş; dağ onlar geçsin diye açılmış ve arkalarından kapanmış. Yalnızca geride kalmış topal bir çocuk olanları anlatmak için geri dönmüş. O günden beri Hamelin'de kimse verilen sözlerin tutulması gerektiğini unutmaz.",
 de:"Am nächsten Morgen, während die Erwachsenen in der Messe waren, erklang die Flöte erneut, diesmal mit einer fröhlichen, verspielten Melodie. Aus allen Häusern kamen Kinder, die dem Pfeifer verzaubert, lachend und hüpfend folgten. Die Eltern, wie von einem seltsamen Bann gelähmt, konnten nur zusehen, wie ihre Kinder zum Koppenberg zogen, der sich öffnete, um sie durchzulassen, und sich hinter ihnen wieder schloss. Nur ein lahmer Junge, der zurückgeblieben war, kehrte zurück, um zu erzählen, was geschehen war. Seitdem vergisst in Hameln niemand, dass Versprechen gehalten werden müssen."}],

{id:"pinocho",icon:"🤥",title:"Pinocho",tt:B("Pinocchio","Pinokyo","Pinocchio"),src:"Carlo Collodi",lv:{
A1:{paras:[
{es:"Geppetto es un carpintero. Hace un muñeco de madera y lo llama Pinocho. ¡Pinocho habla y camina! Pero no es un niño bueno. No va a la escuela y dice mentiras. Cuando dice una mentira, su nariz crece. Un día, Geppetto se pierde en el mar. Pinocho lo busca y lo encuentra dentro de un tiburón enorme. Pinocho salva a su padre. Al final, es un niño de verdad.",
 en:"Geppetto is a carpenter. He makes a wooden puppet and calls him Pinocchio. Pinocchio talks and walks! But he isn't a good boy. He doesn't go to school and he tells lies. When he tells a lie, his nose grows. One day, Geppetto gets lost at sea. Pinocchio looks for him and finds him inside an enormous shark. Pinocchio saves his father. In the end, he is a real boy.",
 tr:"Geppetto bir marangoz. Tahtadan bir kukla yapıyor ve ona Pinokyo adını veriyor. Pinokyo konuşuyor ve yürüyor! Ama uslu bir çocuk değil. Okula gitmiyor ve yalan söylüyor. Yalan söyleyince burnu uzuyor. Bir gün Geppetto denizde kayboluyor. Pinokyo onu arıyor ve kocaman bir köpekbalığının içinde buluyor. Pinokyo babasını kurtarıyor. Sonunda gerçek bir çocuk oluyor.",
 de:"Geppetto ist ein Schreiner. Er macht eine Holzpuppe und nennt sie Pinocchio. Pinocchio spricht und läuft! Aber er ist kein braver Junge. Er geht nicht zur Schule und lügt. Wenn er lügt, wächst seine Nase. Eines Tages geht Geppetto auf dem Meer verloren. Pinocchio sucht ihn und findet ihn im Bauch eines riesigen Haifischs. Pinocchio rettet seinen Vater. Am Ende ist er ein echter Junge."}],
vocab:[["el carpintero","carpenter","marangoz","der Schreiner"],["el muñeco","puppet, doll","kukla","die Puppe"],["la mentira","lie","yalan","die Lüge"],["la nariz","nose","burun","die Nase"]],
quiz:[
{q:"¿Qué pasa cuando Pinocho dice una mentira?",en:"What happens when Pinocchio tells a lie?",tr:"Pinokyo yalan söyleyince ne oluyor?",de:"Was passiert, wenn Pinocchio lügt?",opts:["Su nariz crece","Se pone rojo","Se duerme"],ex:"«Cuando dice una mentira, su nariz crece.»"},
{q:"¿Dónde encuentra Pinocho a Geppetto?",en:"Where does Pinocchio find Geppetto?",tr:"Pinokyo Geppetto'yu nerede buluyor?",de:"Wo findet Pinocchio Geppetto?",opts:["Dentro de un tiburón","En la escuela","En el bosque"],ex:"«…lo encuentra dentro de un tiburón enorme.»"}]},
A2:{paras:[
{es:"Había una vez un carpintero pobre llamado Geppetto que hizo un muñeco con un trozo de madera. Lo llamó Pinocho. Para su sorpresa, el muñeco empezó a hablar, a reír y a correr. Geppetto lo quería como a un hijo y vendió su chaqueta para comprarle un libro para la escuela. Pero Pinocho, en lugar de ir a clase, vendió el libro para ver un espectáculo de marionetas.",
 en:"Once upon a time there was a poor carpenter called Geppetto who made a puppet from a piece of wood. He called him Pinocchio. To his surprise, the puppet began to talk, laugh and run. Geppetto loved him like a son and sold his jacket to buy him a book for school. But Pinocchio, instead of going to class, sold the book to see a puppet show.",
 tr:"Bir zamanlar bir tahta parçasından kukla yapan Geppetto adında fakir bir marangoz varmış. Ona Pinokyo adını vermiş. Şaşırtıcı bir şekilde kukla konuşmaya, gülmeye ve koşmaya başlamış. Geppetto onu bir oğul gibi sevmiş ve ona okul için kitap almak üzere ceketini satmış. Ama Pinokyo derse gideceğine kitabı satıp bir kukla gösterisine gitmiş.",
 de:"Es war einmal ein armer Schreiner namens Geppetto, der aus einem Stück Holz eine Puppe machte. Er nannte sie Pinocchio. Zu seiner Überraschung begann die Puppe zu sprechen, zu lachen und zu rennen. Geppetto liebte ihn wie einen Sohn und verkaufte seine Jacke, um ihm ein Schulbuch zu kaufen. Aber statt zum Unterricht zu gehen, verkaufte Pinocchio das Buch, um ein Marionettentheater zu sehen."},
{es:"Pinocho vivió muchas aventuras porque nunca hacía caso a nadie. Un zorro y un gato le robaron sus monedas, y un hada de pelo azul lo ayudó; pero cada vez que mentía, le crecía la nariz. En el País de los Juguetes se convirtió en burro. Mientras tanto, Geppetto, que lo buscaba en el mar, fue tragado por un tiburón gigante. Al final, Pinocho lo encontró dentro del tiburón, lo salvó y, como premio, se convirtió en un niño de verdad.",
 en:"Pinocchio had many adventures because he never listened to anyone. A fox and a cat stole his coins, and a fairy with blue hair helped him; but every time he lied, his nose grew. In the Land of Toys he turned into a donkey. Meanwhile, Geppetto, who was looking for him at sea, was swallowed by a giant shark. In the end, Pinocchio found him inside the shark, saved him and, as a reward, became a real boy.",
 tr:"Pinokyo kimseyi dinlemediği için pek çok macera yaşamış. Bir tilki ile bir kedi paralarını çalmış, mavi saçlı bir peri de ona yardım etmiş; ama her yalan söylediğinde burnu uzuyormuş. Oyuncaklar Ülkesi'nde eşeğe dönüşmüş. Bu arada onu denizde arayan Geppetto dev bir köpekbalığı tarafından yutulmuş. Sonunda Pinokyo onu köpekbalığının içinde bulmuş, kurtarmış ve ödül olarak gerçek bir çocuğa dönüşmüş.",
 de:"Pinocchio erlebte viele Abenteuer, weil er nie auf jemanden hörte. Ein Fuchs und ein Kater stahlen ihm seine Münzen, und eine Fee mit blauen Haaren half ihm; aber jedes Mal, wenn er log, wuchs seine Nase. Im Spielzeugland verwandelte er sich in einen Esel. Unterdessen wurde Geppetto, der ihn auf dem Meer suchte, von einem riesigen Haifisch verschluckt. Am Ende fand Pinocchio ihn im Bauch des Haifischs, rettete ihn und wurde zur Belohnung ein echter Junge."}],

{q:"¿En qué se convirtió Pinocho en el País de los Juguetes?",en:"What did Pinocchio turn into in the Land of Toys?",tr:"Pinokyo Oyuncaklar Ülkesi'nde neye dönüştü?",de:"Worin verwandelte sich Pinocchio im Spielzeugland?",opts:["En burro","En niño","En gato"],ex:"«En el País de los Juguetes se convirtió en burro.»"}]},
B1:{paras:[
{es:"Maese Cereza, un viejo carpintero, encontró un día un trozo de madera que lloraba y reía como una persona. Asustado, se lo regaló a su amigo Geppetto, que quería fabricar un muñeco capaz de bailar y hacer acrobacias. En cuanto Geppetto le talló la cara, el muñeco le sacó la lengua, y en cuanto le hizo las piernas, salió corriendo a la calle. Geppetto lo llamó Pinocho y, aunque era muy pobre, decidió criarlo como a un hijo.",
 en:"Master Cherry, an old carpenter, one day found a piece of wood that cried and laughed like a person. Frightened, he gave it to his friend Geppetto, who wanted to make a puppet that could dance and do acrobatics. As soon as Geppetto carved its face, the puppet stuck its tongue out at him, and as soon as he made its legs, it ran out into the street. Geppetto called him Pinocchio and, although he was very poor, decided to bring him up like a son.",
 tr:"Yaşlı bir marangoz olan Kiraz Usta bir gün insan gibi ağlayıp gülen bir tahta parçası bulmuş. Korkarak onu, dans edip akrobasi yapabilen bir kukla yapmak isteyen arkadaşı Geppetto'ya hediye etmiş. Geppetto kuklanın yüzünü oyar oymaz kukla ona dil çıkarmış, bacaklarını yapar yapmaz da sokağa kaçmış. Geppetto ona Pinokyo adını vermiş ve çok fakir olmasına rağmen onu bir oğul gibi büyütmeye karar vermiş.",
 de:"Meister Kirsche, ein alter Schreiner, fand eines Tages ein Stück Holz, das wie ein Mensch weinte und lachte. Erschrocken schenkte er es seinem Freund Geppetto, der eine Puppe bauen wollte, die tanzen und Kunststücke machen konnte. Kaum hatte Geppetto ihr Gesicht geschnitzt, streckte die Puppe ihm die Zunge heraus, und kaum hatte er ihr die Beine gemacht, rannte sie auf die Straße. Geppetto nannte ihn Pinocchio und beschloss, ihn wie einen Sohn großzuziehen, obwohl er sehr arm war."},
{es:"Pinocho tenía buen corazón, pero era desobediente y caprichoso. El Grillo Parlante intentó darle consejos, pero él no quiso escucharlo. Vendió el abecedario que Geppetto le había comprado con su única chaqueta, se dejó engañar por un zorro y un gato que le prometieron hacer crecer sus monedas, y cada vez que mentía al Hada de los cabellos azules, su nariz se alargaba tanto que no podía moverse por la habitación.",
 en:"Pinocchio had a good heart, but he was disobedient and wilful. The Talking Cricket tried to give him advice, but he wouldn't listen. He sold the spelling book that Geppetto had bought him with his only jacket, let himself be tricked by a fox and a cat who promised to make his coins multiply, and every time he lied to the Fairy with the blue hair, his nose grew so long that he couldn't move around the room.",
 tr:"Pinokyo'nun iyi bir kalbi varmış ama söz dinlemez ve kaprisliymiş. Konuşan Cırcır Böceği ona öğüt vermeye çalışmış ama o dinlemek istememiş. Geppetto'nun tek ceketini satarak aldığı alfabe kitabını satmış, paralarını çoğaltmayı vaat eden bir tilki ile bir kediye kanmış ve Mavi Saçlı Peri'ye her yalan söylediğinde burnu o kadar uzamış ki odada hareket edemez olmuş.",
 de:"Pinocchio hatte ein gutes Herz, aber er war ungehorsam und launisch. Die Sprechende Grille versuchte, ihm Ratschläge zu geben, aber er wollte nicht auf sie hören. Er verkaufte die Fibel, die Geppetto ihm mit seiner einzigen Jacke gekauft hatte, ließ sich von einem Fuchs und einem Kater täuschen, die ihm versprachen, seine Münzen zu vermehren, und jedes Mal, wenn er die Fee mit den blauen Haaren anlog, wurde seine Nase so lang, dass er sich im Zimmer nicht mehr bewegen konnte."},
{es:"Tras escaparse al País de los Juguetes, donde los niños no estudiaban nunca, Pinocho se convirtió en burro y acabó en el mar. Allí se lo tragó un tiburón enorme y, en su vientre, encontró a Geppetto, que llevaba dos años atrapado mientras lo buscaba. Pinocho se cargó a su padre a la espalda y nadó hasta la orilla. Desde entonces trabajó y estudió para cuidarlo, y una mañana despertó convertido en un niño de verdad.",
 en:"After running away to the Land of Toys, where children never studied, Pinocchio turned into a donkey and ended up in the sea. There an enormous shark swallowed him and, in its belly, he found Geppetto, who had been trapped for two years while looking for him. Pinocchio carried his father on his back and swam to the shore. From then on he worked and studied to look after him, and one morning he woke up as a real boy.",
 tr:"Çocukların hiç ders çalışmadığı Oyuncaklar Ülkesi'ne kaçtıktan sonra Pinokyo eşeğe dönüşmüş ve denizde son bulmuş. Orada kocaman bir köpekbalığı onu yutmuş ve köpekbalığının karnında, onu ararken iki yıldır orada mahsur kalmış olan Geppetto'yu bulmuş. Pinokyo babasını sırtına almış ve kıyıya kadar yüzmüş. O günden sonra ona bakmak için çalışıp okumuş ve bir sabah gerçek bir çocuğa dönüşmüş olarak uyanmış.",
 de:"Nachdem er ins Spielzeugland geflohen war, wo die Kinder nie lernten, verwandelte sich Pinocchio in einen Esel und landete im Meer. Dort verschluckte ihn ein riesiger Haifisch, und in dessen Bauch fand er Geppetto, der seit zwei Jahren dort gefangen war, weil er ihn gesucht hatte. Pinocchio nahm seinen Vater auf den Rücken und schwamm ans Ufer. Von da an arbeitete und lernte er, um für ihn zu sorgen, und eines Morgens wachte er als echter Junge auf."}],
vocab:[["tallar","to carve","oymak","schnitzen"],["desobediente","disobedient","söz dinlemez","ungehorsam"],["el abecedario","spelling book, alphabet","alfabe (kitabı)","die Fibel"],["alargarse","to get longer","uzamak","länger werden"]],
quiz:[
{q:"¿Qué hizo el muñeco en cuanto tuvo piernas?",en:"What did the puppet do as soon as it had legs?",tr:"Kukla bacakları olur olmaz ne yaptı?",de:"Was tat die Puppe, sobald sie Beine hatte?",opts:["Salió corriendo a la calle","Se puso a bailar","Abrazó a Geppetto"],ex:"«…en cuanto le hizo las piernas, salió corriendo a la calle.»"},
{q:"¿Qué le prometieron el zorro y el gato?",en:"What did the fox and the cat promise him?",tr:"Tilki ile kedi ona ne vaat etti?",de:"Was versprachen ihm der Fuchs und der Kater?",opts:["Hacer crecer sus monedas","Llevarlo a casa","Enseñarle a leer"],ex:"«…un zorro y un gato que le prometieron hacer crecer sus monedas…»"},
{q:"¿Cuánto tiempo llevaba Geppetto dentro del tiburón?",en:"How long had Geppetto been inside the shark?",tr:"Geppetto ne zamandır köpekbalığının içindeydi?",de:"Wie lange war Geppetto schon im Haifisch?",opts:["Dos años","Dos días","Dos semanas"],ex:"«…Geppetto, que llevaba dos años atrapado mientras lo buscaba.»"}]},
B2:{paras:[
{es:"Todo empezó con un simple leño. Maese Cereza, un carpintero aficionado al vino, se disponía a convertirlo en la pata de una mesa cuando una vocecita le suplicó que no le diera tan fuerte. Aterrorizado, se lo regaló a su vecino Geppetto, un anciano pobre y gruñón que soñaba con fabricar un muñeco prodigioso para recorrer el mundo ganándose el pan. Apenas terminó de tallarle la nariz, esta empezó a crecer; y en cuanto le hizo los pies, el muñeco le dio una patada y se escapó.",
 en:"It all began with a simple log. Master Cherry, a carpenter fond of wine, was about to turn it into a table leg when a little voice begged him not to hit it so hard. Terrified, he gave it to his neighbour Geppetto, a poor, grumpy old man who dreamed of making a marvellous puppet so he could travel the world earning his living. No sooner had he finished carving its nose than it began to grow; and as soon as he made its feet, the puppet kicked him and ran away.",
 tr:"Her şey basit bir kütükle başlamış. Şarabı seven bir marangoz olan Kiraz Usta onu bir masa ayağına çevirmeye hazırlanırken incecik bir ses ona o kadar sert vurmaması için yalvarmış. Dehşete kapılan usta, kütüğü, dünyayı dolaşıp ekmeğini kazanmak için harikulade bir kukla yapmayı hayal eden fakir ve huysuz komşusu yaşlı Geppetto'ya hediye etmiş. Kuklanın burnunu oymayı bitirir bitirmez burun uzamaya başlamış; ayaklarını yapar yapmaz da kukla ona bir tekme atıp kaçmış.",
 de:"Alles begann mit einem einfachen Holzscheit. Meister Kirsche, ein Schreiner mit einer Vorliebe für Wein, wollte daraus gerade ein Tischbein machen, als ein Stimmchen ihn anflehte, nicht so fest zuzuschlagen. Entsetzt schenkte er es seinem Nachbarn Geppetto, einem armen, mürrischen Alten, der davon träumte, eine wundersame Puppe zu bauen, um damit durch die Welt zu ziehen und sein Brot zu verdienen. Kaum hatte er die Nase fertig geschnitzt, begann sie zu wachsen; und sobald er die Füße gemacht hatte, gab ihm die Puppe einen Tritt und lief davon."},
{es:"Geppetto lo bautizó Pinocho y lo quiso como a un hijo, aunque el muñeco no se lo puso fácil. Despreció los consejos del Grillo Parlante, cambió el abecedario que su padre había comprado vendiendo su único abrigo por una entrada para el teatro de marionetas, y se dejó embaucar por el Zorro y el Gato, que lo convencieron de enterrar sus monedas en el Campo de los Milagros para que brotara un árbol de oro. Huelga decir que, cuando volvió, las monedas habían desaparecido.",
 en:"Geppetto named him Pinocchio and loved him like a son, although the puppet didn't make it easy for him. He scorned the Talking Cricket's advice, swapped the spelling book his father had bought by selling his only coat for a ticket to the puppet theatre, and let himself be fooled by the Fox and the Cat, who convinced him to bury his coins in the Field of Miracles so that a golden tree would sprout. Needless to say, when he came back, the coins had disappeared.",
 tr:"Geppetto ona Pinokyo adını vermiş ve onu bir oğul gibi sevmiş, ama kukla onun işini hiç kolaylaştırmamış. Konuşan Cırcır Böceği'nin öğütlerini hiçe saymış, babasının tek paltosunu satarak aldığı alfabe kitabını kukla tiyatrosuna bir biletle değiştirmiş ve bir altın ağacı filizlensin diye paralarını Mucizeler Tarlası'na gömmeye onu ikna eden Tilki ile Kedi'ye kanmış. Söylemeye gerek yok, geri döndüğünde paralar yok olmuş.",
 de:"Geppetto taufte ihn Pinocchio und liebte ihn wie einen Sohn, obwohl die Puppe es ihm nicht leicht machte. Er verschmähte die Ratschläge der Sprechenden Grille, tauschte die Fibel, die sein Vater durch den Verkauf seines einzigen Mantels gekauft hatte, gegen eine Eintrittskarte fürs Marionettentheater und ließ sich vom Fuchs und vom Kater übertölpeln, die ihn überredeten, seine Münzen auf dem Wunderfeld zu vergraben, damit ein Goldbaum daraus wachse. Natürlich waren die Münzen verschwunden, als er zurückkam."},
{es:"Solo el Hada de los cabellos azules parecía tener paciencia con él. Lo cuidó cuando estuvo enfermo y, cada vez que él le mentía, se limitaba a sonreír mientras su nariz crecía hasta chocar contra la pared. Pinocho le prometió una y otra vez que se enmendaría, pero bastó que su amigo Mecha le hablara del País de los Juguetes, donde no había escuela ni maestros, para que volviera a las andadas. Tras meses de diversión sin freno, una mañana se despertó con orejas de burro y, poco después, con cola.",
 en:"Only the Fairy with the blue hair seemed to have patience with him. She looked after him when he was ill and, every time he lied to her, she simply smiled while his nose grew until it hit the wall. Pinocchio promised her again and again that he would mend his ways, but all it took was for his friend Candlewick to tell him about the Land of Toys, where there was no school and no teachers, for him to slip back into his old habits. After months of unbridled fun, one morning he woke up with donkey's ears and, shortly afterwards, with a tail.",
 tr:"Ona karşı sabırlı görünen tek kişi Mavi Saçlı Peri'ymiş. Hastalandığında ona bakmış ve ona her yalan söylediğinde, burnu duvara çarpana kadar uzarken yalnızca gülümsemekle yetinmiş. Pinokyo ona defalarca kendini düzelteceğine söz vermiş, ama arkadaşı Fitil'in ona okulun da öğretmenin de olmadığı Oyuncaklar Ülkesi'nden bahsetmesi eski alışkanlıklarına dönmesine yetmiş. Aylarca sınırsız eğlencenin ardından bir sabah eşek kulaklarıyla, kısa süre sonra da kuyrukla uyanmış.",
 de:"Nur die Fee mit den blauen Haaren schien Geduld mit ihm zu haben. Sie pflegte ihn, als er krank war, und jedes Mal, wenn er sie anlog, lächelte sie nur, während seine Nase wuchs, bis sie gegen die Wand stieß. Pinocchio versprach ihr immer wieder, sich zu bessern, doch es genügte, dass sein Freund Docht ihm vom Spielzeugland erzählte, wo es weder Schule noch Lehrer gab, und er fiel in alte Gewohnheiten zurück. Nach Monaten zügellosen Vergnügens wachte er eines Morgens mit Eselsohren auf und kurz darauf mit einem Schwanz."},
{es:"Vendido a un circo y luego arrojado al mar, recuperó su forma de muñeco justo antes de que lo engullera el Terrible Tiburón. En la oscuridad de su vientre vio una lucecita: era Geppetto, que había salido a buscarlo en una barca y llevaba dos años allí atrapado. Aprovechando que el monstruo dormía con la boca abierta, Pinocho se cargó a su padre a hombros y nadó hasta la orilla. Desde entonces trabajó sin descanso para mantenerlo, hasta que una mañana, al mirarse al espejo, descubrió que ya no era de madera.",
 en:"Sold to a circus and then thrown into the sea, he regained his puppet form just before the Terrible Shark gulped him down. In the darkness of its belly he saw a tiny light: it was Geppetto, who had set out in a boat to look for him and had been trapped there for two years. Taking advantage of the monster sleeping with its mouth open, Pinocchio hoisted his father onto his shoulders and swam to the shore. From then on he worked tirelessly to support him, until one morning, looking in the mirror, he discovered that he was no longer made of wood.",
 tr:"Bir sirke satılıp ardından denize atılan Pinokyo, Korkunç Köpekbalığı onu yutmadan hemen önce yeniden kukla haline dönmüş. Köpekbalığının karnının karanlığında küçük bir ışık görmüş: bu, onu aramak için bir sandalla yola çıkmış ve iki yıldır orada mahsur kalmış olan Geppetto'ymuş. Canavarın ağzı açık uyumasından yararlanan Pinokyo babasını omuzlarına almış ve kıyıya kadar yüzmüş. O günden sonra ona bakmak için durmadan çalışmış, ta ki bir sabah aynaya baktığında artık tahtadan olmadığını keşfedene kadar.",
 de:"An einen Zirkus verkauft und dann ins Meer geworfen, erhielt er seine Puppengestalt zurück, kurz bevor ihn der Schreckliche Haifisch verschlang. In der Dunkelheit seines Bauches sah er ein Lichtlein: Es war Geppetto, der mit einem Boot aufgebrochen war, um ihn zu suchen, und seit zwei Jahren dort gefangen war. Pinocchio nutzte aus, dass das Ungeheuer mit offenem Maul schlief, nahm seinen Vater auf die Schultern und schwamm ans Ufer. Von da an arbeitete er unermüdlich, um für ihn zu sorgen, bis er eines Morgens beim Blick in den Spiegel entdeckte, dass er nicht mehr aus Holz war."}],

{id:"alibaba",icon:"💰",title:"Alí Babá y los cuarenta ladrones",tt:B("Ali Baba and the Forty Thieves","Ali Baba ve Kırk Haramiler","Ali Baba und die vierzig Räuber"),src:"Las mil y una noches",lv:{
A1:{paras:[
{es:"Alí Babá es un hombre pobre. Un día, en el bosque, ve a cuarenta ladrones. El jefe dice: «¡Ábrete, Sésamo!», y una roca se abre. Es una cueva llena de oro. Cuando los ladrones se van, Alí Babá dice las palabras mágicas y entra. Coge un poco de oro y vuelve a casa. Su criada, Morgiana, es muy lista y lo ayuda a escapar de los ladrones.",
 en:"Ali Baba is a poor man. One day, in the forest, he sees forty thieves. The leader says: “Open, Sesame!”, and a rock opens. It's a cave full of gold. When the thieves leave, Ali Baba says the magic words and goes in. He takes a little gold and goes back home. His servant, Morgiana, is very clever and helps him escape from the thieves.",
 tr:"Ali Baba fakir bir adam. Bir gün ormanda kırk harami görüyor. Reisleri «Açıl susam açıl!» diyor ve bir kaya açılıyor. Burası altın dolu bir mağara. Haramiler gidince Ali Baba sihirli sözleri söylüyor ve içeri giriyor. Biraz altın alıp eve dönüyor. Hizmetçisi Morgiana çok akıllı ve haramilerden kurtulması için ona yardım ediyor.",
 de:"Ali Baba ist ein armer Mann. Eines Tages sieht er im Wald vierzig Räuber. Der Anführer sagt: „Sesam, öffne dich!“, und ein Felsen öffnet sich. Es ist eine Höhle voller Gold. Als die Räuber weg sind, sagt Ali Baba die Zauberworte und geht hinein. Er nimmt ein bisschen Gold und geht nach Hause. Seine Dienerin Morgiana ist sehr klug und hilft ihm, den Räubern zu entkommen."}],
vocab:[["el ladrón","thief","hırsız, harami","der Räuber"],["la cueva","cave","mağara","die Höhle"],["la criada","maid, servant","hizmetçi","die Dienerin"],["abrirse","to open","açılmak","sich öffnen"]],
quiz:[
{q:"¿Qué dice el jefe para abrir la roca?",en:"What does the leader say to open the rock?",tr:"Reis kayayı açmak için ne diyor?",de:"Was sagt der Anführer, um den Felsen zu öffnen?",opts:["¡Ábrete, Sésamo!","¡Ciérrate!","¡Hola, roca!"],ex:"«El jefe dice: ¡Ábrete, Sésamo!, y una roca se abre.»"},
{q:"¿Qué hay en la cueva?",en:"What is in the cave?",tr:"Mağarada ne var?",de:"Was ist in der Höhle?",opts:["Mucho oro","Comida","Animales"],ex:"«Es una cueva llena de oro.»"}]},
A2:{paras:[
{es:"Hace mucho tiempo, en Persia, vivía un leñador pobre llamado Alí Babá. Un día, mientras cortaba leña, vio llegar a cuarenta ladrones a caballo. Se escondió en un árbol y oyó al jefe gritar delante de una roca: «¡Ábrete, Sésamo!». La roca se abrió y los ladrones entraron con sacos llenos de tesoros. Cuando se marcharon, Alí Babá repitió las palabras, entró en la cueva y se llevó unas bolsas de oro.",
 en:"A long time ago, in Persia, there lived a poor woodcutter called Ali Baba. One day, while he was cutting wood, he saw forty thieves arrive on horseback. He hid in a tree and heard the leader shout in front of a rock: “Open, Sesame!” The rock opened and the thieves went in with sacks full of treasure. When they left, Ali Baba repeated the words, went into the cave and took a few bags of gold.",
 tr:"Uzun zaman önce İran'da Ali Baba adında fakir bir oduncu yaşarmış. Bir gün odun keserken kırk haraminin atlarıyla geldiğini görmüş. Bir ağaca saklanmış ve reisin bir kayanın önünde «Açıl susam açıl!» diye bağırdığını duymuş. Kaya açılmış ve haramiler hazine dolu çuvallarla içeri girmiş. Onlar gidince Ali Baba sözleri tekrarlamış, mağaraya girmiş ve birkaç kese altın almış.",
 de:"Vor langer Zeit lebte in Persien ein armer Holzfäller namens Ali Baba. Eines Tages, als er Holz hackte, sah er vierzig Räuber heranreiten. Er versteckte sich in einem Baum und hörte, wie der Anführer vor einem Felsen rief: „Sesam, öffne dich!“ Der Felsen öffnete sich, und die Räuber gingen mit Säcken voller Schätze hinein. Als sie fort waren, wiederholte Ali Baba die Worte, ging in die Höhle und nahm ein paar Beutel Gold mit."},
{es:"Su hermano Casim, que era rico y muy avaricioso, descubrió el secreto y fue a la cueva. Pero dentro se puso tan nervioso que olvidó la palabra mágica para salir, y los ladrones lo encontraron. Después, los ladrones buscaron a Alí Babá para vengarse. El jefe se presentó en su casa como vendedor de aceite, con unas tinajas enormes donde se escondían sus hombres. Pero Morgiana, la criada de Alí Babá, descubrió el engaño y salvó a toda la familia.",
 en:"His brother Cassim, who was rich and very greedy, discovered the secret and went to the cave. But inside he got so nervous that he forgot the magic word to get out, and the thieves found him. After that, the thieves looked for Ali Baba to take revenge. The leader turned up at his house as an oil merchant, with some huge jars in which his men were hiding. But Morgiana, Ali Baba's servant, discovered the trick and saved the whole family.",
 tr:"Zengin ve çok açgözlü olan kardeşi Kasım sırrı öğrenmiş ve mağaraya gitmiş. Ama içeride o kadar heyecanlanmış ki çıkmak için gereken sihirli sözü unutmuş ve haramiler onu bulmuş. Ardından haramiler intikam almak için Ali Baba'yı aramış. Reis, içinde adamlarının saklandığı kocaman küplerle, yağ satıcısı kılığında onun evine gelmiş. Ama Ali Baba'nın hizmetçisi Morgiana hileyi fark etmiş ve bütün aileyi kurtarmış.",
 de:"Sein Bruder Kassim, der reich und sehr habgierig war, entdeckte das Geheimnis und ging zur Höhle. Doch drinnen wurde er so nervös, dass er das Zauberwort zum Hinausgehen vergaß, und die Räuber fanden ihn. Danach suchten die Räuber Ali Baba, um sich zu rächen. Der Anführer erschien als Ölhändler bei seinem Haus, mit riesigen Krügen, in denen sich seine Männer versteckten. Aber Morgiana, Ali Babas Dienerin, durchschaute den Schwindel und rettete die ganze Familie."}],
vocab:[["avaricioso","greedy","açgözlü","habgierig"],["vengarse","to take revenge","intikam almak","sich rächen"],["la tinaja","large earthenware jar","küp","der große Tonkrug"],["el engaño","trick, deception","hile","der Schwindel"]],
quiz:[
{q:"¿Dónde se escondió Alí Babá?",en:"Where did Ali Baba hide?",tr:"Ali Baba nereye saklandı?",de:"Wo versteckte sich Ali Baba?",opts:["En un árbol","En la cueva","Detrás de una roca"],ex:"«Se escondió en un árbol y oyó al jefe gritar delante de una roca…»"},
{q:"¿Por qué Casim no pudo salir de la cueva?",en:"Why couldn't Cassim get out of the cave?",tr:"Kasım neden mağaradan çıkamadı?",de:"Warum konnte Kassim nicht aus der Höhle?",opts:["Olvidó la palabra mágica","La puerta estaba rota","Se quedó dormido"],ex:"«…se puso tan nervioso que olvidó la palabra mágica para salir…»"}]},
B1:{paras:[
{es:"En una ciudad de Persia vivían dos hermanos: Casim, que se había casado con una mujer rica, y Alí Babá, que se ganaba la vida cortando leña. Un día, Alí Babá vio acercarse una nube de polvo y, por precaución, se subió a un árbol. Eran cuarenta jinetes armados. Su capitán se detuvo frente a una gran roca y pronunció: «¡Ábrete, Sésamo!». Para asombro de Alí Babá, la roca se abrió como una puerta.",
 en:"In a city in Persia lived two brothers: Cassim, who had married a rich woman, and Ali Baba, who earned his living cutting wood. One day, Ali Baba saw a cloud of dust approaching and, as a precaution, climbed a tree. They were forty armed horsemen. Their captain stopped in front of a big rock and said: “Open, Sesame!” To Ali Baba's amazement, the rock opened like a door.",
 tr:"İran'ın bir şehrinde iki kardeş yaşarmış: zengin bir kadınla evlenmiş olan Kasım ve geçimini odun keserek sağlayan Ali Baba. Bir gün Ali Baba yaklaşan bir toz bulutu görmüş ve tedbir olarak bir ağaca tırmanmış. Gelenler kırk silahlı atlıymış. Reisleri büyük bir kayanın önünde durmuş ve «Açıl susam açıl!» demiş. Ali Baba'yı hayrete düşürerek kaya bir kapı gibi açılmış.",
 de:"In einer Stadt in Persien lebten zwei Brüder: Kassim, der eine reiche Frau geheiratet hatte, und Ali Baba, der sich seinen Lebensunterhalt mit Holzhacken verdiente. Eines Tages sah Ali Baba eine Staubwolke näherkommen und kletterte vorsichtshalber auf einen Baum. Es waren vierzig bewaffnete Reiter. Ihr Hauptmann hielt vor einem großen Felsen an und sprach: „Sesam, öffne dich!“ Zu Ali Babas Erstaunen öffnete sich der Felsen wie eine Tür."},
{es:"Cuando los ladrones se fueron, Alí Babá entró en la cueva y descubrió montañas de seda, alfombras y monedas de oro. Se llevó solo lo que podía cargar su burro. Pero su cuñada se enteró del secreto y se lo contó a Casim, que corrió a la cueva con diez mulas. Dentro, cegado por la codicia, olvidó la contraseña: probó con «¡Ábrete, Cebada!» y «¡Ábrete, Trigo!», pero la roca no se movió. Cuando los ladrones volvieron, lo encontraron allí, y ese fue su final.",
 en:"When the thieves had gone, Ali Baba went into the cave and discovered mountains of silk, carpets and gold coins. He took only what his donkey could carry. But his sister-in-law found out the secret and told Cassim, who rushed to the cave with ten mules. Inside, blinded by greed, he forgot the password: he tried “Open, Barley!” and “Open, Wheat!”, but the rock didn't move. When the thieves came back, they found him there, and that was his end.",
 tr:"Haramiler gidince Ali Baba mağaraya girmiş ve yığınla ipek, halı ve altın para bulmuş. Yalnızca eşeğinin taşıyabileceği kadarını almış. Ama yengesi sırrı öğrenmiş ve Kasım'a anlatmış; Kasım da on katırla mağaraya koşmuş. İçeride açgözlülükten gözü dönen Kasım parolayı unutmuş: «Açıl arpa açıl!» ve «Açıl buğday açıl!» diye denemiş ama kaya kıpırdamamış. Haramiler geri döndüğünde onu orada bulmuşlar ve bu onun sonu olmuş.",
 de:"Als die Räuber fort waren, ging Ali Baba in die Höhle und entdeckte Berge von Seide, Teppichen und Goldmünzen. Er nahm nur so viel mit, wie sein Esel tragen konnte. Doch seine Schwägerin erfuhr das Geheimnis und erzählte es Kassim, der mit zehn Maultieren zur Höhle eilte. Drinnen vergaß er, von Gier geblendet, das Losungswort: Er versuchte es mit „Gerste, öffne dich!“ und „Weizen, öffne dich!“, doch der Felsen rührte sich nicht. Als die Räuber zurückkamen, fanden sie ihn dort, und das war sein Ende."},
{es:"Desde entonces, el capitán de los ladrones buscó sin descanso a quien conocía su secreto. Finalmente llegó a casa de Alí Babá disfrazado de mercader de aceite, con sus hombres escondidos en grandes tinajas. Pero Morgiana, la astuta criada de la casa, fue a buscar aceite para su lámpara y descubrió a los ladrones. Sin hacer ruido, acabó con ellos con aceite hirviendo y, más tarde, desenmascaró al capitán. Agradecido, Alí Babá le dio la libertad y la casó con su hijo.",
 en:"From then on, the captain of the thieves searched tirelessly for whoever knew his secret. Finally he arrived at Ali Baba's house disguised as an oil merchant, with his men hidden in large jars. But Morgiana, the clever servant of the house, went to fetch oil for her lamp and discovered the thieves. Without making a sound, she did away with them with boiling oil and, later, unmasked the captain. Grateful, Ali Baba gave her her freedom and married her to his son.",
 tr:"O günden sonra haramilerin reisi sırrını bilen kişiyi durmadan aramış. Sonunda adamlarını büyük küplere saklayarak yağ tüccarı kılığında Ali Baba'nın evine gelmiş. Ama evin zeki hizmetçisi Morgiana lambası için yağ almaya gitmiş ve haramileri fark etmiş. Hiç ses çıkarmadan onların işini kaynar yağla bitirmiş ve daha sonra reisin maskesini düşürmüş. Minnettar kalan Ali Baba ona özgürlüğünü vermiş ve onu oğluyla evlendirmiş.",
 de:"Von da an suchte der Hauptmann der Räuber unermüdlich nach dem, der sein Geheimnis kannte. Schließlich kam er als Ölhändler verkleidet zu Ali Babas Haus, seine Männer in großen Krügen versteckt. Doch Morgiana, die kluge Dienerin des Hauses, wollte Öl für ihre Lampe holen und entdeckte die Räuber. Ohne ein Geräusch machte sie ihnen mit siedendem Öl den Garaus und entlarvte später den Hauptmann. Dankbar schenkte Ali Baba ihr die Freiheit und verheiratete sie mit seinem Sohn."}],

quiz:[
{q:"¿Por qué se subió Alí Babá a un árbol?",en:"Why did Ali Baba climb a tree?",tr:"Ali Baba neden bir ağaca tırmandı?",de:"Warum kletterte Ali Baba auf einen Baum?",opts:["Por precaución, al ver una nube de polvo","Para coger fruta","Para cortar leña"],ex:"«…vio acercarse una nube de polvo y, por precaución, se subió a un árbol.»"},
{q:"¿Qué contraseñas probó Casim?",en:"Which passwords did Cassim try?",tr:"Kasım hangi parolaları denedi?",de:"Welche Losungsworte probierte Kassim?",opts:["«¡Ábrete, Cebada!» y «¡Ábrete, Trigo!»","«¡Ábrete, Sésamo!»","«¡Ciérrate, Puerta!»"],ex:"«…probó con ¡Ábrete, Cebada! y ¡Ábrete, Trigo!, pero la roca no se movió.»"},
{q:"¿Cómo descubrió Morgiana a los ladrones?",en:"How did Morgiana discover the thieves?",tr:"Morgiana haramileri nasıl fark etti?",de:"Wie entdeckte Morgiana die Räuber?",opts:["Fue a buscar aceite para su lámpara","Los oyó hablar en la calle","El capitán se lo contó"],ex:"«…fue a buscar aceite para su lámpara y descubrió a los ladrones.»"}]},
B2:{paras:[
{es:"Cuentan Las mil y una noches que en una ciudad de Persia vivían dos hermanos de destinos muy distintos. Casim, gracias a un matrimonio ventajoso, se había convertido en un próspero comerciante, mientras que Alí Babá se ganaba a duras penas el sustento cortando leña en el bosque y vendiéndola en el mercado. Un día en que estaba faenando, divisó a lo lejos una polvareda que se aproximaba al galope y, temiendo lo peor, trepó a un árbol frondoso desde donde podía observar sin ser visto.",
 en:"The Thousand and One Nights tells that in a city in Persia there lived two brothers with very different destinies. Cassim, thanks to an advantageous marriage, had become a prosperous merchant, while Ali Baba barely scraped a living cutting wood in the forest and selling it at the market. One day while he was at work, he spotted in the distance a cloud of dust approaching at a gallop and, fearing the worst, climbed a leafy tree from where he could watch without being seen.",
 tr:"Binbir Gece Masalları'nın anlattığına göre İran'ın bir şehrinde kaderleri birbirinden çok farklı iki kardeş yaşarmış. Kasım işine gelen bir evlilik sayesinde varlıklı bir tüccar olmuş; Ali Baba ise ormanda odun kesip pazarda satarak geçimini güç bela sağlıyormuş. Bir gün çalışırken uzakta dörtnala yaklaşan bir toz bulutu görmüş ve en kötüsünden korkarak görünmeden izleyebileceği yapraklı bir ağaca tırmanmış.",
 de:"In Tausendundeiner Nacht wird erzählt, dass in einer Stadt in Persien zwei Brüder mit sehr unterschiedlichen Schicksalen lebten. Kassim war dank einer vorteilhaften Heirat ein wohlhabender Kaufmann geworden, während Ali Baba sich mühsam seinen Lebensunterhalt verdiente, indem er im Wald Holz hackte und es auf dem Markt verkaufte. Eines Tages, als er bei der Arbeit war, erblickte er in der Ferne eine Staubwolke, die im Galopp näherkam, und kletterte, das Schlimmste befürchtend, auf einen dicht belaubten Baum, von dem aus er beobachten konnte, ohne gesehen zu werden."},
{es:"Los jinetes resultaron ser cuarenta bandidos de aspecto feroz. Su capitán se plantó ante una pared de roca y exclamó: «¡Ábrete, Sésamo!», y la piedra se apartó dócilmente. Cuando la banda se marchó, Alí Babá, con el corazón en un puño, repitió la fórmula y penetró en una caverna repleta de riquezas acumuladas durante generaciones. Prudente por naturaleza, cargó en sus burros apenas unos sacos de monedas y borró cualquier rastro de su visita. Sin embargo, no pudo evitar que su cuñada acabara averiguando de dónde procedía su repentina fortuna.",
 en:"The horsemen turned out to be forty fierce-looking bandits. Their captain planted himself in front of a rock face and exclaimed: “Open, Sesame!”, and the stone obediently moved aside. When the gang had left, Ali Baba, his heart in his mouth, repeated the formula and entered a cavern packed with riches amassed over generations. Cautious by nature, he loaded onto his donkeys just a few sacks of coins and erased every trace of his visit. Even so, he couldn't stop his sister-in-law from eventually finding out where his sudden fortune came from.",
 tr:"Atlıların vahşi görünüşlü kırk haydut olduğu ortaya çıkmış. Reisleri bir kaya duvarının önüne dikilmiş ve «Açıl susam açıl!» diye haykırmış; taş da uysalca kenara çekilmiş. Çete gidince yüreği ağzında Ali Baba sözleri tekrarlamış ve kuşaklar boyunca biriktirilmiş servetlerle dolu bir mağaraya girmiş. Doğası gereği tedbirli olduğundan eşeklerine yalnızca birkaç çuval para yüklemiş ve ziyaretinin bütün izlerini silmiş. Yine de yengesinin ani servetinin nereden geldiğini sonunda öğrenmesine engel olamamış.",
 de:"Die Reiter erwiesen sich als vierzig wild aussehende Banditen. Ihr Hauptmann baute sich vor einer Felswand auf und rief: „Sesam, öffne dich!“, und der Stein wich gehorsam zur Seite. Als die Bande fort war, wiederholte Ali Baba mit klopfendem Herzen die Formel und betrat eine Höhle voller Reichtümer, die über Generationen angehäuft worden waren. Von Natur aus vorsichtig, lud er nur ein paar Säcke Münzen auf seine Esel und verwischte jede Spur seines Besuchs. Dennoch konnte er nicht verhindern, dass seine Schwägerin schließlich herausfand, woher sein plötzlicher Reichtum stammte."},
{es:"Casim, corroído por la envidia, le arrancó el secreto a su hermano y partió hacia la cueva con una recua de mulas. Una vez dentro, deslumbrado por el oro, se olvidó por completo de la contraseña y fue incapaz de salir; ni «cebada» ni «trigo» ni ningún otro grano surtieron efecto. Los bandidos lo sorprendieron allí y acabaron con él. Al descubrir que alguien más conocía el escondite, el capitán juró no descansar hasta dar con él, y tras varias pesquisas consiguió localizar la casa de Alí Babá.",
 en:"Cassim, eaten up with envy, wrung the secret out of his brother and set off for the cave with a string of mules. Once inside, dazzled by the gold, he completely forgot the password and was unable to get out; neither “barley” nor “wheat” nor any other grain had any effect. The bandits caught him there and finished him off. On discovering that someone else knew the hiding place, the captain swore not to rest until he found him, and after several inquiries he managed to locate Ali Baba's house.",
 tr:"Kıskançlıktan içi içini yiyen Kasım sırrı kardeşinden zorla öğrenmiş ve bir katır kervanıyla mağaraya doğru yola çıkmış. İçeri girdiğinde altınlardan gözü kamaşmış, parolayı tamamen unutmuş ve dışarı çıkamamış; ne «arpa» ne «buğday» ne de başka bir tahıl işe yaramış. Haydutlar onu orada yakalamış ve işini bitirmişler. Saklanma yerini başka birinin de bildiğini anlayan reis onu bulana kadar rahat etmeyeceğine yemin etmiş ve birkaç soruşturmanın ardından Ali Baba'nın evini bulmayı başarmış.",
 de:"Kassim, von Neid zerfressen, entriss seinem Bruder das Geheimnis und machte sich mit einer Reihe von Maultieren auf den Weg zur Höhle. Drinnen vergaß er, vom Gold geblendet, das Losungswort völlig und konnte nicht mehr hinaus; weder „Gerste“ noch „Weizen“ noch irgendein anderes Korn half. Die Banditen überraschten ihn dort und brachten ihn um. Als der Hauptmann entdeckte, dass noch jemand das Versteck kannte, schwor er, nicht zu ruhen, bis er ihn gefunden hätte, und nach einigen Nachforschungen gelang es ihm, Ali Babas Haus ausfindig zu machen."},
{es:"Una tarde se presentó a la puerta haciéndose pasar por mercader de aceite y pidió alojamiento para pasar la noche. Traía consigo treinta y ocho tinajas, todas ellas ocupadas por sus hombres salvo una, que sí contenía aceite. Fue Morgiana, la esclava de la casa, mujer de ingenio excepcional, quien desbarató el plan: al ir a por aceite para el candil, oyó una voz susurrar dentro de una tinaja y comprendió la trampa. En plena noche, sin despertar a nadie, se deshizo de los bandidos uno a uno. En recompensa, Alí Babá le concedió la libertad y la casó con su hijo.",
 en:"One evening he appeared at the door posing as an oil merchant and asked for lodging for the night. He had brought thirty-eight jars with him, all of them occupied by his men except one, which really did contain oil. It was Morgiana, the slave of the house, a woman of exceptional wit, who foiled the plan: going to fetch oil for the lamp, she heard a voice whispering inside a jar and understood the trap. In the middle of the night, without waking anyone, she got rid of the bandits one by one. As a reward, Ali Baba granted her her freedom and married her to his son.",
 tr:"Bir akşam yağ tüccarı kılığında kapıya gelmiş ve geceyi geçirmek için kalacak yer istemiş. Yanında otuz sekiz küp getirmiş; biri hariç hepsinin içinde adamları varmış, yalnızca birinde gerçekten yağ varmış. Planı bozan, evin olağanüstü zekâya sahip kölesi Morgiana olmuş: kandil için yağ almaya gittiğinde bir küpün içinden fısıldayan bir ses duymuş ve tuzağı anlamış. Gecenin ortasında kimseyi uyandırmadan haydutların işini birer birer bitirmiş. Ödül olarak Ali Baba ona özgürlüğünü bağışlamış ve onu oğluyla evlendirmiş.",
 de:"Eines Abends erschien er als Ölhändler verkleidet an der Tür und bat um ein Nachtquartier. Er hatte achtunddreißig Krüge dabei, alle von seinen Männern besetzt bis auf einen, der wirklich Öl enthielt. Es war Morgiana, die Sklavin des Hauses, eine Frau von außergewöhnlichem Scharfsinn, die den Plan vereitelte: Als sie Öl für die Lampe holen wollte, hörte sie eine Stimme in einem Krug flüstern und durchschaute die Falle. Mitten in der Nacht, ohne jemanden zu wecken, schaffte sie die Banditen einen nach dem anderen aus dem Weg. Zum Lohn schenkte Ali Baba ihr die Freiheit und verheiratete sie mit seinem Sohn."}],

CLASSICS.push(
{id:"hodja",icon:"🧥",title:"¡Come, abrigo, come!",tt:B("Eat, My Coat, Eat!","Ye Kürküm Ye","Iss, mein Mantel, iss!"),src:"Nasreddín Hodja (tradición turca)",lv:{
A1:{paras:[
{es:"Nasreddín Hodja es un hombre muy sabio y divertido. Un día va a una fiesta con ropa vieja. Nadie habla con él y nadie le da comida. Hodja vuelve a casa y se pone un abrigo de piel muy bonito. Vuelve a la fiesta. Ahora todos le sonríen y le dan la mejor sopa. Hodja mete la manga del abrigo en la sopa y dice: «¡Come, abrigo, come!».",
 en:"Nasreddin Hodja is a very wise and funny man. One day he goes to a party in old clothes. Nobody talks to him and nobody gives him food. Hodja goes back home and puts on a very nice fur coat. He goes back to the party. Now everyone smiles at him and gives him the best soup. Hodja dips the sleeve of the coat in the soup and says: “Eat, coat, eat!”",
 tr:"Nasreddin Hoca çok bilge ve eğlenceli bir adam. Bir gün eski kıyafetlerle bir ziyafete gidiyor. Kimse onunla konuşmuyor ve kimse ona yemek vermiyor. Hoca eve dönüyor ve çok güzel bir kürk giyiyor. Ziyafete geri dönüyor. Şimdi herkes ona gülümsüyor ve ona en iyi çorbayı veriyor. Hoca kürkün yenini çorbaya batırıyor ve «Ye kürküm ye!» diyor.",
 de:"Nasreddin Hodscha ist ein sehr weiser und lustiger Mann. Eines Tages geht er in alten Kleidern zu einem Fest. Niemand spricht mit ihm und niemand gibt ihm etwas zu essen. Hodscha geht nach Hause und zieht einen sehr schönen Pelzmantel an. Er geht zurück zum Fest. Jetzt lächeln ihn alle an und geben ihm die beste Suppe. Hodscha taucht den Ärmel des Mantels in die Suppe und sagt: „Iss, Mantel, iss!“"}],
vocab:[["sabio","wise","bilge","weise"],["el abrigo de piel","fur coat","kürk","der Pelzmantel"],["la manga","sleeve","yen, kol","der Ärmel"],["meter","to put in, to dip","sokmak, batırmak","hineinstecken, tauchen"]],
quiz:[
{q:"¿Cómo va Hodja a la fiesta la primera vez?",en:"How does Hodja go to the party the first time?",tr:"Hoca ziyafete ilk seferinde nasıl gidiyor?",de:"Wie geht Hodscha beim ersten Mal zum Fest?",opts:["Con ropa vieja","Con un abrigo de piel","Con su burro"],ex:"«Un día va a una fiesta con ropa vieja.»"},
{q:"¿Dónde mete Hodja la manga del abrigo?",en:"Where does Hodja put the sleeve of the coat?",tr:"Hoca kürkün yenini nereye batırıyor?",de:"Wohin taucht Hodscha den Ärmel des Mantels?",opts:["En la sopa","En el agua","En el bolsillo"],ex:"«Hodja mete la manga del abrigo en la sopa…»"}]},
A2:{paras:[
{es:"Un día, Nasreddín Hodja estaba trabajando en su huerto cuando recordó que un hombre rico del pueblo daba un banquete. Como ya era tarde, fue directamente, con la ropa sucia de trabajar. Cuando llegó, nadie le hizo caso. Los criados no le ofrecieron asiento y los invitados le dieron la espalda. Hodja esperó un rato, pero nadie le sirvió ni un vaso de agua, así que se marchó en silencio.",
 en:"One day, Nasreddin Hodja was working in his vegetable garden when he remembered that a rich man in the village was giving a banquet. As it was already late, he went straight there, in his dirty work clothes. When he arrived, nobody paid any attention to him. The servants didn't offer him a seat and the guests turned their backs on him. Hodja waited for a while, but nobody served him even a glass of water, so he left in silence.",
 tr:"Bir gün Nasreddin Hoca bostanında çalışırken köydeki zengin bir adamın ziyafet verdiğini hatırlamış. Vakit geç olduğu için iş kıyafetleri kirli kirli doğruca gitmiş. Vardığında kimse ona aldırmamış. Hizmetkârlar ona yer göstermemiş, davetliler de ona sırtlarını dönmüş. Hoca bir süre beklemiş ama kimse ona bir bardak su bile vermemiş; bunun üzerine sessizce oradan ayrılmış.",
 de:"Eines Tages arbeitete Nasreddin Hodscha in seinem Gemüsegarten, als ihm einfiel, dass ein reicher Mann im Dorf ein Festmahl gab. Weil es schon spät war, ging er direkt hin, in seinen schmutzigen Arbeitskleidern. Als er ankam, beachtete ihn niemand. Die Diener boten ihm keinen Platz an, und die Gäste kehrten ihm den Rücken zu. Hodscha wartete eine Weile, aber niemand brachte ihm auch nur ein Glas Wasser, also ging er schweigend."},
{es:"Fue a su casa, se lavó y se puso su mejor abrigo de piel. Cuando volvió al banquete, todo cambió: el anfitrión lo saludó con una sonrisa, lo sentó en el mejor sitio y le sirvió una sopa deliciosa. Entonces Hodja metió la manga del abrigo en la sopa y dijo: «¡Come, abrigo, come!». Todos lo miraron sorprendidos. «Está claro que la invitación era para el abrigo, no para mí», explicó Hodja.",
 en:"He went home, washed and put on his best fur coat. When he went back to the banquet, everything changed: the host greeted him with a smile, sat him in the best place and served him a delicious soup. Then Hodja dipped the sleeve of his coat in the soup and said: “Eat, coat, eat!” Everyone looked at him in surprise. “It's clear the invitation was for the coat, not for me,” Hodja explained.",
 tr:"Evine gitmiş, yıkanmış ve en güzel kürkünü giymiş. Ziyafete geri döndüğünde her şey değişmiş: ev sahibi onu gülümseyerek karşılamış, en iyi yere oturtmuş ve ona nefis bir çorba ikram etmiş. Bunun üzerine Hoca kürkünün yenini çorbaya batırmış ve «Ye kürküm ye!» demiş. Herkes ona şaşkınlıkla bakmış. «Belli ki davet bana değil, kürke yapılmış» diye açıklamış Hoca.",
 de:"Er ging nach Hause, wusch sich und zog seinen besten Pelzmantel an. Als er zum Festmahl zurückkam, war alles anders: Der Gastgeber begrüßte ihn mit einem Lächeln, setzte ihn auf den besten Platz und servierte ihm eine köstliche Suppe. Da tauchte Hodscha den Ärmel seines Mantels in die Suppe und sagte: „Iss, Mantel, iss!“ Alle sahen ihn überrascht an. „Offensichtlich galt die Einladung dem Mantel und nicht mir“, erklärte Hodscha."}],
